<title>기획 문서 상황판</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  color-scheme: light;
  --ground:#FFFFFF; --surface:#FFFFFF; --raise:#F6F8FA; --ink:#1A2530; --muted:#5F6F7E; --faint:#8A99A6;
  --line:#DCE3E9; --line-soft:#EBF0F4;
  --accent:#2A5D8F; --accent-soft:#E4EEF7; --accent-ink:#1E4568;
  --good:#1F7A4D; --good-bg:#E3F2E9; --warn:#9A6A12; --warn-bg:#FBF0D6;
  --crit:#B1362E; --crit-bg:#F9E3E1; --neutral:#5F6F7E; --neutral-bg:#ECEFF2;
  --track:#E5EAEF;
  --font:"IBM Plex Sans KR","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono","Consolas","D2Coding",monospace;
  --pad:28px; --shadow:none;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.55; }
svg.lucide { width:1em; height:1em; flex:none; }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
a { color:var(--accent-ink); }

.wrap { max-width:1180px; margin:0 auto; padding:0 var(--pad); }
header { background:var(--surface); border-bottom:1px solid var(--line); }
.head { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 28px; padding:26px 0 18px; }
.eyebrow { color:var(--faint); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
.head h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-0.01em; line-height:1.3; }
.head .sub { color:var(--muted); font-size:13.5px; margin-top:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.head .sub .bar { color:var(--line); }
.head .built { color:var(--muted); font-size:12.5px; display:flex; align-items:center; gap:6px; }
nav { display:flex; gap:2px; border-top:1px solid var(--line-soft); flex-wrap:wrap; }
nav button { appearance:none; background:none; border:0; border-bottom:2px solid transparent; padding:13px 14px; font:inherit; font-size:14px; color:var(--muted); cursor:pointer; margin-bottom:-1px; display:flex; align-items:center; gap:7px; white-space:nowrap; }
nav button:hover { color:var(--ink); }
nav button[aria-selected="true"] { color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:500; }
nav button:focus-visible { outline:2px solid var(--accent); outline-offset:-3px; border-radius:4px; }
main { padding:32px 0 80px; }
section { display:flex; flex-direction:column; gap:16px; padding:20px 0 28px; }
.secbar { display:flex; align-items:baseline; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; }
h2.sec { font-size:15px; font-weight:600; margin:0; display:flex; align-items:baseline; gap:10px; }
h2.sec .count { color:var(--muted); font-weight:400; font-size:13px; }
.secbar .note { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.secbar .note b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

.gauge { height:8px; background:var(--track); border-radius:99px; overflow:hidden; }
.gauge > i { display:block; height:100%; background:var(--accent); border-radius:99px; }
.gauge.g-good > i { background:var(--good); }
.gauge.g-idle > i { background:var(--neutral); opacity:.45; }

.list { display:flex; flex-direction:column; gap:10px; }
.item { width:100%; text-align:left; font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px 20px 17px; display:grid; grid-template-columns:26px 1fr; column-gap:12px; row-gap:11px; box-shadow:var(--shadow); cursor:pointer; }
.item:hover { border-color:var(--accent); }
.item:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.item.idle { background:var(--raise); }
.item .no { color:var(--faint); font-size:13px; font-family:var(--mono); padding-top:2px; }
.item .row1 { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.item .stat-i { color:var(--muted); font-size:16px; display:inline-flex; }
.item.on .stat-i { color:var(--accent); }
.item.done .stat-i { color:var(--good); }
.item .cat { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 7px; line-height:19px; }
.item .name { font-size:15px; font-weight:500; }
.item .spacer { flex:1 1 auto; }
.item .open { color:var(--faint); font-size:12.5px; display:inline-flex; align-items:center; gap:4px; }
.item:hover .open { color:var(--accent-ink); }
.item .bar { grid-column:2; }
.item .foot { grid-column:2; display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:-3px; }
.item .foot .sep { color:var(--line); }
.item .foot b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
.item .foot .late { color:var(--crit); font-weight:600; }
.item .foot .none { color:var(--faint); }

.pill { display:inline-block; padding:1px 9px; border-radius:11px; font-size:12px; font-weight:500; line-height:19px; white-space:nowrap; }
.pill.good { background:var(--good-bg); color:var(--good); }
.pill.warn { background:var(--warn-bg); color:var(--warn); }
.pill.crit { background:var(--crit-bg); color:var(--crit); }
.pill.neutral { background:var(--neutral-bg); color:var(--neutral); }
.pill.accent { background:var(--accent-soft); color:var(--accent-ink); }

.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.search { position:relative; flex:0 1 280px; min-width:200px; }
.search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); width:15px; height:15px; pointer-events:none; }
.search input { width:100%; font:inherit; font-size:13.5px; padding:8px 12px 8px 33px; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--ink); }
.search input::placeholder { color:var(--faint); }
.search input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.sel { position:relative; }
.sel-btn { display:flex; align-items:center; gap:7px; font:inherit; font-size:13.5px; padding:8px 11px; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap; }
.sel-btn:hover { border-color:var(--faint); }
.sel-btn .chev { color:var(--faint); font-size:15px; transition:transform .12s ease; }
.sel[data-open="true"] .sel-btn { border-color:var(--accent); }
.sel[data-open="true"] .chev { transform:rotate(180deg); }
.sel-btn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.sel-btn .val { color:var(--muted); }
.sel-btn.set .val { color:var(--accent-ink); font-weight:500; }
.sel-menu { position:absolute; z-index:20; top:calc(100% + 5px); left:0; min-width:100%; background:var(--surface); border:1px solid var(--line); border-radius:5px; box-shadow:0 6px 18px rgba(28,39,51,.13); padding:4px; margin:0; list-style:none; }
.sel-menu li { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:4px; font-size:13.5px; cursor:pointer; white-space:nowrap; color:var(--ink); }
.sel-menu li:hover, .sel-menu li.cursor { background:var(--accent-soft); }
.sel-menu li svg { color:var(--accent); font-size:15px; opacity:0; }
.sel-menu li[aria-selected="true"] svg { opacity:1; }

.tbl { background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow-x:auto; box-shadow:var(--shadow); }
table { border-collapse:collapse; width:100%; min-width:760px; }
th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top; font-variant-numeric:tabular-nums; }
th { font-size:12.5px; color:var(--muted); font-weight:500; white-space:nowrap; }
tr:last-child td { border-bottom:0; }
td.nowrap, th.nowrap { white-space:nowrap; }
td .type { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
td .type svg { color:var(--faint); font-size:15px; }
.empty { color:var(--muted); padding:18px 14px; }
.detail { color:var(--muted); font-size:13px; }

/* 문서 페이지 */
#page-doc { gap:18px; }
#page-doc .backlink { margin-bottom:2px; }
.backlink { appearance:none; background:none; border:0; font:inherit; font-size:13px; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:5px; padding:0; }
.backlink:hover { color:var(--ink); }
.backlink:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
.dochead { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:20px 24px; box-shadow:var(--shadow); }
.dochead h2 { margin:0; font-size:19px; font-weight:600; }
.dochead .dmeta { color:var(--muted); font-size:13px; margin-top:9px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.dochead .dmeta .sep { color:var(--line); }
.dochead .dpath { font-family:var(--mono); font-size:12px; color:var(--faint); }
.dochead .gauge { margin-top:14px; }
.docbody { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:30px 34px 44px; box-shadow:var(--shadow); }

.md { font-size:14px; line-height:1.7; }
.md > p, .md > ul, .md > ol, .md > h1, .md > h2, .md > h3, .md > h4, .md > blockquote { max-width:78ch; }
.md h1 { font-size:19px; font-weight:600; margin:0 0 18px; padding-bottom:12px; border-bottom:1px solid var(--line); }
.md h2 { font-size:16px; font-weight:600; margin:34px 0 10px; }
.md h3 { font-size:14.5px; font-weight:600; margin:24px 0 8px; }
.md h4 { font-size:14px; font-weight:600; margin:18px 0 6px; color:var(--muted); }
.md p { margin:0 0 12px; }
.md ul, .md ol { margin:0 0 12px; padding-left:20px; }
.md li { margin:3px 0; }
.md strong { font-weight:600; }
.md code { font-family:var(--mono); font-size:12.5px; background:var(--neutral-bg); padding:1px 5px; border-radius:3px; }
.md pre { background:var(--raise); border:1px solid var(--line); border-radius:5px; padding:14px 16px; overflow-x:auto; margin:0 0 14px; }
.md pre code { background:none; padding:0; font-size:12.5px; line-height:1.65; white-space:pre; }
.md blockquote { margin:0 0 12px; padding:2px 0 2px 14px; border-left:3px solid var(--line); color:var(--muted); }
.md table { border-collapse:collapse; width:100%; min-width:0; margin:0; border:0; font-size:13.5px; }
.md th, .md td { border:0; border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px 11px; vertical-align:top; }
.md th:last-child, .md td:last-child { border-right:0; }
.md tbody tr:last-child td { border-bottom:0; }
.md th { background:var(--raise); font-weight:500; color:var(--muted); }
.md hr { border:0; border-top:1px solid var(--line); margin:26px 0; }
.md .tablewrap { overflow-x:auto; max-width:100%; margin:0 0 16px; border:1px solid var(--line); border-radius:6px; }
.diagram { display:block; }
.dhead { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 18px; background:var(--surface); border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; }
.dtitle { color:var(--faint); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; }
.dscroll { overflow-x:auto; padding:0 0 1px; background:#FFFFFF; border-radius:0 0 6px 6px; }
.fmodal .mscale .diagram { border:0; margin:0; }
.fmodal .mscale .dhead { display:none; }
.fmodal .mscale .dscroll { overflow:visible; }
.md .tablewrap.wide table { min-width:1240px; }
.md .tablewrap.wide td:nth-child(4), .md .tablewrap.wide td:nth-child(6) { white-space:nowrap; }
.md pre.wf { background:#FFFFFF; border:1px solid var(--line); border-radius:4px; padding:18px 20px; }
.md pre.wf code { font-family:var(--mono); font-size:12px; line-height:1.5; color:var(--ink); }

/* Flow 도형 — 캔버스 */
.flow { background:var(--surface); border:1px solid var(--line); border-radius:6px; margin:0 0 18px; }
.fscroll { overflow-x:auto; padding:0 0 1px; background:#FFFFFF; border-radius:0 0 6px 6px; }
.fcanvas { display:block; }
.fhead { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 18px; background:var(--surface); border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; }
.ftitle { color:var(--faint); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; }
.fview { appearance:none; font:inherit; font-size:12.5px; padding:4px 11px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:5px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.fview:hover { border-color:var(--accent); color:var(--accent-ink); }
.fview:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.fmark { color:var(--muted); font-size:12.5px; padding:10px 18px 14px; background:#FFFFFF; }
.fref { font-family:var(--mono); font-size:12px; background:var(--neutral-bg); color:var(--ink); padding:0 6px; border-radius:3px; line-height:19px; }
.fref.go { cursor:pointer; color:var(--accent-ink); background:var(--accent-soft); }
.fref.go:hover { text-decoration:underline; }
.fref.go:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.md h3.flow-target { scroll-margin-top:16px; }
.diagram { background:var(--surface); border:1px solid var(--line); border-radius:6px; margin:0 0 18px; }
.diagram canvas { display:block; }
.diagram canvas.wfcanvas { cursor:pointer; }
.ftabs { display:flex; flex-wrap:nowrap; overflow-x:auto; gap:6px; margin:2px 0 0; padding:14px 0 12px; border-top:1px solid var(--line-soft); scrollbar-width:none; -ms-overflow-style:none; }
.ftabs::-webkit-scrollbar { width:0; height:0; display:none; }
.ftabs button { appearance:none; flex:none; font:inherit; font-size:12.5px; line-height:1; padding:7px 12px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:5px; cursor:pointer; white-space:nowrap; }
.fnav { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 0 10px; margin:0 0 16px; border-bottom:1px solid var(--line-soft); }
.fnav .fnav-title { min-width:0; }
.fnav .fnav-title h3 { margin:0; }
.fnav .fnav-btns { display:inline-flex; gap:4px; flex:none; }
.fnav .fnav-btns button { appearance:none; width:34px; height:30px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:5px; cursor:pointer; font:inherit; font-size:14px; line-height:1; }
.fnav .fnav-btns button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent-ink); }
.fnav .fnav-btns button:disabled { opacity:.35; cursor:default; }
.ftabs button:hover { border-color:var(--accent); color:var(--accent-ink); }
.ftabs button[aria-current="true"] { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.ftabs button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.md h3.hit { background:var(--accent-soft); border-radius:4px; padding:2px 8px; margin-left:-8px; }
.md h4.hit { background:var(--accent-soft); border-radius:4px; padding:2px 8px; margin-left:-8px; }

/* 범례 */
.flegend { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; background:#FFFFFF; border:1px solid var(--line); border-radius:6px; padding:11px 16px; margin:0 0 16px; font-size:12.5px; color:#5F6F7E; }
.flegend span { display:inline-flex; align-items:center; gap:7px; }
.flegend i { display:inline-block; width:26px; height:15px; background:#FFFFFF; border:1px solid #6B7A88; flex:none; }
.flegend i.l-term { border-radius:999px; }
.flegend i.l-proc { border-radius:2px; }
.flegend i.l-io { transform:skewX(-14deg); }
.flegend i.l-dec { border:0; background:#2A5D8F; width:18px; height:18px; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
.flegend i.l-ref { border-radius:2px;
  background:
    linear-gradient(#6B7A88,#6B7A88) 4px 0/1px 100% no-repeat,
    linear-gradient(#6B7A88,#6B7A88) calc(100% - 4px) 0/1px 100% no-repeat,
    #FFFFFF; }
.flegend i.l-br { border-radius:999px; width:22px; height:13px; border-color:#C9D2DA; }
.flegend .lgnote { color:var(--faint); font-size:11.5px; margin-left:auto; }


/* 화면 이름표 */
.wfhost { position:relative; }
.wfmark { position:absolute; transform-origin:0 0; transform:scale(var(--iz,1));
  display:inline-flex; align-items:baseline; gap:7px; white-space:nowrap; pointer-events:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:4px 9px;
  box-shadow:0 1px 3px rgba(20,32,45,.10); cursor:pointer; }
.wfmark b { font-size:12.5px; font-weight:600; color:var(--ink); }
.wfmark span { font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.wfmark:hover { border-color:var(--accent); }

/* 화면 보드 */
.board { position:fixed; inset:0; z-index:210; display:flex; flex-direction:column; background:#EEF1F4; }
.board .bhead { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--surface); flex:none; }
.board .btitle { font-weight:600; font-size:14px; color:var(--ink); margin-right:auto; }
.board .bcount { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.board .bview { flex:1; overflow:hidden; position:relative; cursor:grab; touch-action:none; }
.board .bview.drag { cursor:grabbing; }
.board .bstage { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
.board .bwrap { display:flex; flex-wrap:wrap; align-items:flex-start; gap:36px 40px; padding:40px; }
.board figure { margin:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0 0 4px; box-shadow:0 2px 10px rgba(20,32,45,.07); }
.board figcaption { cursor:pointer; display:flex; align-items:baseline; gap:8px; padding:11px 14px 9px; border-bottom:1px solid var(--line-soft); }
.board figcaption b { font-size:13px; font-weight:600; color:var(--ink); }
.board figcaption span { font-family:var(--mono); font-size:11px; color:var(--muted); }
.board figure canvas { display:block; margin:8px; }
.board figure.plain { background:none; border:0; box-shadow:none; padding:0; }
.board figure.plain canvas { margin:0; }
.board .bhint { position:absolute; right:16px; bottom:14px; background:rgba(30,40,52,.82); color:#FFFFFF; font-size:11.5px; padding:7px 12px; border-radius:5px; }

/* 크게 보기 */
.fmodal { position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; background:#FFFFFF; }
.fmodal .mhead { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--surface); flex:none; }
.fmodal .mtitle { font-weight:600; font-size:14px; color:var(--ink); margin-right:auto; }
.fmodal .zoom, .board .zoom { display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
.fmodal .zoom button, .board .zoom button { appearance:none; border:0; background:var(--surface); color:var(--muted); font:inherit; line-height:1; width:32px; height:28px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.fmodal .zoom button svg, .board .zoom button svg { width:15px; height:15px; }
.fview svg { width:14px; height:14px; }
.fmodal .zoom button:hover, .board .zoom button:hover { background:var(--raise); color:var(--accent-ink); }
.fmodal .zval, .board .zval { font-family:var(--mono); font-size:12px; color:var(--muted); min-width:46px; text-align:center; }
.fmodal .mclose, .board .mclose { appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:5px; width:32px; height:28px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.fmodal .mclose svg, .board .mclose svg { width:15px; height:15px; }
.fmodal .mclose:hover, .board .mclose:hover { border-color:var(--accent); color:var(--accent-ink); }
.fmodal .mbody { flex:1; overflow:auto; padding:18px 24px 28px; background:#FFFFFF; }
.fmodal .mscale { display:inline-block; min-width:100%; }
.fmodal .mscale .flow { border:0; margin:0; }
.fmodal .mscale .fhead { display:none; }
.fmodal .mscale .fscroll { overflow:visible; }

/* 정보계층도 */
.ia-chart { background:var(--surface); border:1px solid var(--line); border-radius:6px; margin:0 0 18px; }
.ia-scroll { overflow-x:auto; padding:26px 20px 30px; }
.ia-tree, .ia-tree ul { display:flex; justify-content:center; list-style:none; margin:0; padding:0; min-width:min-content; }
.ia-tree ul { position:relative; padding-top:28px; }

// ── Flow 도형 렌더러

    .replace(/\b(FL-\d{3})\b/g, '<span class="fref go" role="link" tabindex="0">$1</span>')

  `<span><i class="l-proc"></i>처리</span>` +
  `<span><i class="l-dec"></i>판단</span>` +

function renderFlow(src) {
  const items = [];
  for (const raw of src.split(String.fromCharCode(10))) {
    if (!raw.trim()) { items.push({ k: "gap" }); continue; }
    const m = raw.match(/^([ \u2502]*)((?:\u251c\u2500|\u2514\u2500))?\s?(.*)$/);
    const pad = (m[1] || "").length;
    const marker = m[2];
    let body = (m[3] || "").trim();
    if (!body) continue;
    const lv = Math.min(3, Math.floor(pad / 4) + (marker ? 1 : 0));
    if (body === "\u2193" || body === "\u2502") { items.push({ k: "arrow", lv }); continue; }
    if (/^\u203b/.test(body)) { items.push({ k: "mark", text: body }); continue; }

    let actor = "", lane = "";

    lane.cols.push(col);

  for (const it of items) {
    if (it.k === "lane") { lane = { title: it.text, cols: [], marks: [] }; lanes.push(lane); col = null; continue; }

function segKind(label) {

}
function mkNode(ctx, label) {
  const kind = segKind(label);

  return { c, kind, nm: nodeMetrics(ctx, c, kind) };
}
function branchLayout(ctx, s, parentDec) {
  const segs = (s.tail || "").split("→").map(x => x.trim()).filter(Boolean);
  let label = "", parts;
  if (parentDec && segs.length) { label = s.head; parts = segs; }
  else parts = [s.head].concat(segs).filter(Boolean);

  // 마지막 단계가 복귀면 도형으로 그리지 않고 선으로 되돌린다
  let loop = null;
  if (parts.length) {

    if (m) { loop = m[1].trim(); parts = parts.slice(0, -1); }
  }
  const nodes = parts.map(p => mkNode(ctx, p));
  ctx.font = FC.fontSm;

  const nw = note.length ? Math.max(...note.map(l => ctx.measureText(l).width)) + 12 : 0;

  const h = nodes.length ? Math.max(...nodes.map(n => n.nm.h)) : 30;

function layoutFlow(ctx, lanes) {

  for (const lane of lanes) {
    const rows = [];
    let halfMax = 60, branchMax = 0;
    for (let i = 0; i < lane.cols.length; i++) {
      const c = lane.cols[i];
      const kind = nodeKind(c, i, lane.cols.length);
      const nm = nodeMetrics(ctx, c, kind);
      const dec = kind === "n-dec";
      let down = null;
      const subs = [];
      for (const s of c.subs) {
        const t = (s.tail || "").trim();
        if (dec && !s.step && (t === "" || t === "다음") && !down) { down = s.head; continue; }
        subs.push(branchLayout(ctx, s, dec));

      const bh = subs.reduce((a, b) => a + b.h + BRGAP, 0) - (subs.length ? BRGAP : 0);
      const bw = subs.length ? Math.max(...subs.map(b => b.w + (b.lv - 1) * 20)) : 0;

    const cx = LEFT + halfMax;

    const w = cx + halfMax + (branchMax ? RAIL + branchMax + (hasLoop ? 96 : 24) : 24);
    let y = 24;
    for (const r of rows) { r.top = y; r.cy = y + r.h / 2; y += r.h + GAP; }
    const h = y - GAP + 28 + (lane.title ? 30 : 0);

function roundRect(ctx, x, y, w, h, r) {

  ctx.arcTo(x + w, y + h, x, y + h, r);

function shape(ctx, kind, x, y, w, h, cx, cy, skin) {
  ctx.lineWidth = 1.2;
  ctx.fillStyle = FC.bg;
  ctx.strokeStyle = kind === "n-dec" ? FC.dec : (skin ? skin.line : FC.line);
  if (kind === "n-dec") {
    ctx.beginPath();
    ctx.moveTo(cx, y); ctx.lineTo(x + w, cy); ctx.lineTo(cx, y + h); ctx.lineTo(x, cy);
    ctx.closePath(); ctx.fill(); ctx.stroke();

function nodeText(ctx, kind, nm, cx, cy) {

function drawNode(ctx, r, cx) {

  if (r.nm.bar) {
    ctx.save();
    ctx.beginPath();
    roundRect(ctx, x, y, r.nm.w, r.nm.h, r.kind === "n-term" ? r.nm.h / 2 : 2);
    ctx.clip();

    ctx.font = FC.fontXs; ctx.fillStyle = skin ? skin.ink : FC.muted;

function drawFlowCanvas(canvas, lanes, scale) {
  ACTOR_MAP = new Map();

function drawFlowCanvases(root, scale) {
  const r = root || document;
  r.querySelectorAll("canvas.iacanvas").forEach(cv => {
    const m = IA_MODELS.get(cv.dataset.ia);
    if (m) { try { drawIACanvas(cv, m, scale); } catch (e) { console.error("계층도 작도 실패", e); } }
  });
  r.querySelectorAll("canvas.mapcanvas").forEach(cv => {
    const m = MAP_MODELS.get(cv.dataset.mp);
    if (m) { try { drawMapCanvas(cv, m, scale); } catch (e) { console.error("사이트맵 작도 실패", e); } }
  });
  r.querySelectorAll("canvas.wfcanvas").forEach(cv => {
    const m = WF_MODELS.get(cv.dataset.wf);
    if (m) {
      try { drawWFCanvas(cv, m, scale); wfMarks(cv); }
      catch (e) { console.error("와이어프레임 작도 실패", e); }
    }
  });
  r.querySelectorAll("canvas.uicanvas").forEach(cv => {
    const m = UI_MODELS.get(cv.dataset.ui);
    if (m) { try { drawUICanvas(cv, m, scale); } catch (e) { console.error("화면 흐름 작도 실패", e); } }
  });
  r.querySelectorAll("canvas.acanvas").forEach(cv => {
    const m = ARCH_MODELS.get(cv.dataset.ac);
    if (m) { try { drawArchCanvas(cv, m, scale); } catch (e) { console.error("구조도 작도 실패", e); } }
  });
  r.querySelectorAll("canvas.fcanvas").forEach(cv => {
    const model = FLOW_MODELS.get(cv.dataset.fc);
    if (!model) return;
    try { drawFlowCanvas(cv, model, scale); }
    catch (err) {
      console.error("Flow 작도 실패", cv.dataset.fc, err);
      const ctx = cv.getContext("2d");
      cv.width = 600; cv.height = 60; cv.style.width = "600px"; cv.style.height = "60px";
      ctx.fillStyle = FC.bg; ctx.fillRect(0, 0, 600, 60);
      ctx.font = FC.fontSm; ctx.fillStyle = FC.bad; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("작도 실패 " + cv.dataset.fc + " : " + err.message, 12, 30);
    }
  });
}
function flowHit(cv, e) {
  const r = cv.getBoundingClientRect();
  const s = cv._scale || 1;
  const x = (e.clientX - r.left) / s, y = (e.clientY - r.top) / s;
  return cv._hits.find(h => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
}
document.addEventListener("mousemove", (e) => {
  const cv = e.target.closest("canvas.fcanvas");
  if (!cv || !cv._hits) return;
  cv.style.cursor = flowHit(cv, e) ? "pointer" : "default";
});
document.addEventListener("click", (e) => {
  const cv = e.target.closest("canvas.fcanvas");
  if (!cv || !cv._hits) return;
  const hit = flowHit(cv, e);
  if (!hit) return;
  if (cv.closest(".fmodal")) closeFlowModal();
  if (window.goToFlow) window.goToFlow(hit.id);
});


// ── 화면 흐름 캔버스
const UI_MODELS = new Map();
let UI_SEQ = 1;
const UW = 246, UHEAD = 32, UBLK = 26, UBGAP = 7, UPAD = 13, UGX = 78, UGY = 74, UPADD = 22;
const UCOLS = 3;

function renderUIMap(src) {
  const lines = src.split(String.fromCharCode(10));
  const screens = [];
  const edges = [];
  let cur = null;
  lines.forEach(raw => {
    const l = raw.trim();
    if (!l) return;
    if (l.charAt(0) === "@") {
      const body = l.slice(1).trim();
      const sp = body.indexOf(" ");
      cur = {
        id: sp === -1 ? body : body.slice(0, sp),
        name: sp === -1 ? "" : body.slice(sp + 1).trim(),
        blocks: [],
      };
      screens.push(cur);
      return;
    }
    if (l.charAt(0) === ">") {
      const m = l.slice(1).split("->");
      if (m.length < 2) return;
      const right = m[1].split(":");
      edges.push({ a: m[0].trim(), b: right[0].trim(), label: (right[1] || "").trim() });
      return;
    }
    if (l.charAt(0) === "-" && cur) cur.blocks.push(l.slice(1).trim());
  });
  const id = "ui" + (UI_SEQ++);
  UI_MODELS.set(id, { screens: screens, edges: edges });
  return diagramBox("화면 흐름", `<canvas class="uicanvas" data-ui="${id}"></canvas>`);
}

function uiCardH(s) {
  const n = Math.max(1, s.blocks.length);
  return UHEAD + UPAD + n * UBLK + (n - 1) * UBGAP + UPAD;
}

function drawUICanvas(canvas, model, scale) {
  const ctx = canvas.getContext("2d");
  const S = model.screens;
  if (!S.length) return;
  ctx.font = FC.fontSm;

  const cols = Math.min(UCOLS, S.length);
  S.forEach((s, i) => {
    s.col = i % cols;
    s.row = Math.floor(i / cols);
    s.h = uiCardH(s);
  });
  const rows = Math.floor((S.length - 1) / cols) + 1;
  const rowH = [], rowY = [];
  for (let r = 0; r < rows; r++) {
    rowH[r] = Math.max.apply(null, S.filter(s => s.row === r).map(s => s.h));
  }
  let y = UPADD;
  for (let r = 0; r < rows; r++) { rowY[r] = y; y += rowH[r] + UGY; }
  const h = y - UGY + UPADD;
  const w = UPADD * 2 + cols * UW + (cols - 1) * UGX;
  S.forEach(s => { s.x = UPADD + s.col * (UW + UGX); s.y = rowY[s.row]; });

  const dpr = (window.devicePixelRatio || 1) * (scale || 1);
  canvas.width = Math.ceil(w * dpr); canvas.height = Math.ceil(h * dpr);
  canvas.style.width = Math.ceil(w * (scale || 1)) + "px";
  canvas.style.height = Math.ceil(h * (scale || 1)) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = FC.bg; ctx.fillRect(0, 0, w, h);

  const byId = new Map();
  S.forEach(s => byId.set(s.id, s));

  // 이동 경로를 먼저 깔고 카드를 위에 올린다
  const marks = [];
  let far = 0;
  model.edges.forEach(e => {
    const a = byId.get(e.a), b = byId.get(e.b);
    if (!a || !b) return;
    ctx.strokeStyle = "#8FA3B5"; ctx.lineWidth = 1.3; ctx.setLineDash([]);
    ctx.fillStyle = "#8FA3B5";
    if (a.row === b.row && b.col === a.col + 1) {
      const y1 = a.y + a.h / 2;
      ctx.beginPath();
      ctx.moveTo(a.x + UW, y1); ctx.lineTo(b.x - 8, y1); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(b.x - 9, y1 - 4.5); ctx.lineTo(b.x - 9, y1 + 4.5); ctx.lineTo(b.x - 1, y1);
      ctx.closePath(); ctx.fill();
      if (e.label) marks.push({ t: e.label, x: (a.x + UW + b.x) / 2, y: y1 - 9 });
      return;
    }
    const corr = rowY[a.row] + rowH[a.row] + 16 + (far % 3) * 11;
    far++;
    const ax = a.x + UW / 2, bx = b.x + UW / 2;
    const down = b.row > a.row;
    const ey = down ? b.y : b.y + b.h;
    ctx.beginPath();
    ctx.moveTo(ax, a.y + a.h); ctx.lineTo(ax, corr);
    ctx.lineTo(bx, corr); ctx.lineTo(bx, down ? ey - 8 : ey + 8);
    ctx.stroke();
    const d = down ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(bx - 4.5, ey - d * 9); ctx.lineTo(bx + 4.5, ey - d * 9); ctx.lineTo(bx, ey - d * 1);
    ctx.closePath(); ctx.fill();
    if (e.label) marks.push({ t: e.label, x: (ax + bx) / 2, y: corr - 8 });
  });

  S.forEach(s => {
    // 카드
    ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#C9D3DC"; ctx.lineWidth = 1;
    roundRect(ctx, s.x, s.y, UW, s.h, 6); ctx.fill(); ctx.stroke();
    // 머리 띠
    ctx.save();
    roundRect(ctx, s.x, s.y, UW, s.h, 6); ctx.clip();
    ctx.fillStyle = "#2B3442";
    ctx.fillRect(s.x, s.y, UW, UHEAD);
    ctx.restore();
    ctx.fillStyle = "#FFFFFF";
    ctx.font = FC.fontB; ctx.textAlign = "left"; ctx.textBaseline = "middle";

      const cx = wide && c.kind === "top" ? (useCol ? colX : SX) : lay.pos[i];
      if (c.kind === "menu" || c.kind === "cal") { over.push([c, cx, y, cw]); return; }
      drawWFCell(ctx, c, cx, y, cw, rh);
    });
    y += rh + WFGAP;
  });
  // 펼친 목록과 달력은 아래 내용을 밀지 않고 겹쳐 그린다
  over.forEach(o => {
    const oh = o[0].kind === "menu" ? o[0].text.split("/").length * 32 + 10 : 272;
    ctx.save();
    ctx.shadowColor = "rgba(29,37,47,0.18)";
    ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
    drawWFCell(ctx, o[0], o[1], o[2] - 4, o[3], oh);
    ctx.restore();
  });
  // 토스트는 화면 아래 가운데에 그린다
  const tc = [];
  sc.items.forEach(row => row.forEach(c => { if (c.kind === "toast") tc.push(c.text); }));
  if (tc.length) {
    const TF = '12px "IBM Plex Sans KR","Malgun Gothic",sans-serif';
    ctx.font = TF;
    const keep = tc[0].charAt(0) === "!";
    if (keep) tc[0] = tc[0].slice(1).trim();
    const tw = Math.min(sc.w - 80, ctx.measureText(tc[0]).width + 44 + (keep ? 34 : 0));
    const tx = FX + (sc.w - tw) / 2, ty = FY + sc.fh - 76;
    ctx.fillStyle = "rgba(29,37,47,0.92)";
    roundRect(ctx, tx, ty, tw, 42, 6); ctx.fill();
    wfText(ctx, tc[0], tx + tw / 2 - (keep ? 16 : 0), ty + 21, tw - 24 - (keep ? 34 : 0),
           TF, "#FFFFFF", "center");
    if (keep) {
      ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 1.3;
      const kx = tx + tw - 22, ky = ty + 21;
      ctx.beginPath();
      ctx.moveTo(kx - 5, ky - 5); ctx.lineTo(kx + 5, ky + 5);
      ctx.moveTo(kx + 5, ky - 5); ctx.lineTo(kx - 5, ky + 5);
      ctx.stroke();
    }
  }
}

function wfText(ctx, s, x, y, max, font, color, align) {
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align || "left"; ctx.textBaseline = "middle";
  ctx.fillText(clipText(ctx, s, max), x, y);
  ctx.textAlign = "left";
}

// 상태가 붙은 칸: [테두리 상태, 아이콘]
const KST = {
  selx: ["fx", "sel"], sele: ["fe", "sel"], selo: ["fo", "sel"],
  fsx: ["fx", "fs"], fse: ["fe", "fs"], fso: ["fo", "fs"],
  fdx: ["fx", "fd"], fde: ["fe", "fd"], fdo: ["fo", "fd"],
};
function drawWFCell(ctx, c, x, y, w, h) {
  const s = c.text;
  const k = KST[c.kind] ? KST[c.kind][0] : c.kind;
  const ki = KST[c.kind] ? KST[c.kind][1] : c.kind;
  const F = '12px "IBM Plex Sans KR","Malgun Gothic",sans-serif';
  const FB = '600 13px "IBM Plex Sans KR","Malgun Gothic",sans-serif';
  const FS = '11px "IBM Plex Sans KR","Malgun Gothic",sans-serif';

  if (k === "top") {
    ctx.fillStyle = WFC.bar; ctx.fillRect(x, y, w, h);
    const parts = s.split("~").map(v => v.trim());
    wfText(ctx, parts[0] || "", x + 16, y + h / 2, w / 3, FB, "#FFFFFF");
    if (parts[1]) wfText(ctx, parts[1], x + w / 2, y + h / 2, w / 2.2, F, "#D7DDE4", "center");
    if (parts[2]) wfText(ctx, parts[2], x + w - 16, y + h / 2, w / 4, FS, "#C7CFD8", "right");
    return;
  }
  if (k === "h") {
    const hl = s.split("//").map(v => v.trim());
    const parts = (hl[0] || "").split("~").map(v => v.trim());
    const desc = hl[1] || "";
    const ty = desc ? y + h / 2 - 9 : y + h / 2;
    wfText(ctx, parts[0] || "", x, ty, w * 0.6, '600 16px "IBM Plex Sans KR","Malgun Gothic",sans-serif', WFC.ink);
    if (desc) wfText(ctx, desc, x, y + h / 2 + 11, w * 0.7, FS, WFC.mut);
    if (parts[1]) {
      ctx.font = FS;
      const bw = Math.min(130, ctx.measureText(parts[1]).width + 26);
      ctx.fillStyle = WFC.pri; ctx.strokeStyle = WFC.pri; ctx.lineWidth = 1;
      roundRect(ctx, x + w - bw, y + (h - 28) / 2, bw, 28, 4); ctx.fill();
      wfText(ctx, parts[1], x + w - bw / 2, y + h / 2, bw - 14, FS, "#FFFFFF", "center");
    }
    ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y + h - 1); ctx.lineTo(x + w, y + h - 1); ctx.stroke();
    return;
  }
  if (k === "sub") {
    wfText(ctx, s, x, y + h / 2 - 3, w, '600 12.5px "IBM Plex Sans KR","Malgun Gothic",sans-serif', WFC.ink);
    ctx.strokeStyle = "#E3E8ED"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y + h - 4); ctx.lineTo(x + w, y + h - 4); ctx.stroke();
    return;
  }
  if (k === "fx") {
    const pp = s.split("~").map(v => v.trim());
    ctx.fillStyle = WFC.bg; ctx.strokeStyle = WFC.pri; ctx.lineWidth = 1.4;
    roundRect(ctx, x, y, w, h, 4); ctx.fill(); ctx.stroke();
    wfText(ctx, pp[0] || "", x + 11, y + h / 2, w - (pp[1] ? 90 : 24), F, WFC.ink);
    if (pp[1]) wfText(ctx, pp[1], x + w - 11, y + h / 2, 80, FS, WFC.mut, "right");
    return;
  }
  if (k === "fo") {
    ctx.fillStyle = WFC.fill; ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 4); ctx.fill(); ctx.stroke();
    const pp = s.split("~").map(v => v.trim());
    wfText(ctx, pp[0] || "", x + 11, y + h / 2, w - (pp[1] ? 90 : 24), F, WFC.soft);
    if (pp[1]) wfText(ctx, pp[1], x + w - 11, y + h / 2, 80, FS, WFC.soft, "right");
    return;
  }
  if (k === "fe") {
    const pe = s.split("~").map(v => v.trim());
    ctx.fillStyle = WFC.bg; ctx.strokeStyle = WFC.bad; ctx.lineWidth = 1.4;
    roundRect(ctx, x, y, w, h, 4); ctx.fill(); ctx.stroke();
    wfText(ctx, pe[0] || "", x + 11, y + h / 2, w - (pe[1] ? 90 : 24), F, WFC.ink);
    if (pe[1]) wfText(ctx, pe[1], x + w - 11, y + h / 2, 80, FS, WFC.ink, "right");
    return;
  }
  if (k === "bd") {
    ctx.fillStyle = WFC.fill; ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    roundRect(ctx, x, y + 1, w, h - 2, 4); ctx.fill(); ctx.stroke();
    wfText(ctx, s, x + w / 2, y + h / 2, w - 16, FS, WFC.soft, "center");
    return;
  }
  if (k === "err") {
    wfText(ctx, "! " + s, x + 1, y + h / 2 - 4, w - 4, FS, WFC.bad);
    return;
  }
  if (["f", "sel", "fd", "fq", "fs", "fx", "fe", "fo"].indexOf(k) >= 0 && s.indexOf("//") >= 0) {
    const lp = s.split("//").map(v => v.trim());
    let head = lp[0] || "";
    if (c.req) head += " *";
    wfText(ctx, head, x, y + 11, w, '600 12px "IBM Plex Sans KR","Malgun Gothic",sans-serif', WFC.ink);
    const fy = y + 24, fh = h - 24;
    const on = (k === "fx" || k === "fe");
    ctx.fillStyle = k === "fo" ? WFC.fill : WFC.bg;
    ctx.strokeStyle = k === "fe" ? WFC.bad : (on ? WFC.pri : WFC.soft);
    ctx.lineWidth = k === "fe" ? 1.4 : (on ? 1.4 : 1);
    roundRect(ctx, x, fy, w, fh, 4); ctx.fill(); ctx.stroke();
    const lead = k === "fq" ? 32 : 11;
    wfText(ctx, lp[1] || "", x + lead, fy + fh / 2, w - lead - 30, F, on ? WFC.ink : WFC.hint);
    ctx.strokeStyle = WFC.mut; ctx.lineWidth = 1.3;
    if (ki === "sel") {
      ctx.beginPath();
      ctx.moveTo(x + w - 22, fy + fh / 2 - 3); ctx.lineTo(x + w - 16, fy + fh / 2 + 3);
      ctx.lineTo(x + w - 10, fy + fh / 2 - 3); ctx.stroke();
    } else if (ki === "fd") {
      const bx = x + w - 26, by = fy + fh / 2 - 8;
      ctx.strokeRect(bx, by + 2, 15, 14);
      ctx.beginPath();
      ctx.moveTo(bx, by + 6); ctx.lineTo(bx + 15, by + 6);
      ctx.moveTo(bx + 4, by); ctx.lineTo(bx + 4, by + 4);
      ctx.moveTo(bx + 11, by); ctx.lineTo(bx + 11, by + 4);
      ctx.stroke();
    } else if (k === "fq") {
      ctx.beginPath();
      ctx.arc(x + 17, fy + fh / 2 - 1, 5, 0, Math.PI * 2);
      ctx.moveTo(x + 21, fy + fh / 2 + 3); ctx.lineTo(x + 25, fy + fh / 2 + 7);
      ctx.stroke();
    } else if (ki === "fs") {
      ctx.beginPath();
      ctx.arc(x + w - 21, fy + fh / 2 - 2, 5, 0, Math.PI * 2);
      ctx.moveTo(x + w - 17, fy + fh / 2 + 2); ctx.lineTo(x + w - 13, fy + fh / 2 + 6);
      ctx.stroke();
    }
    return;
  }
  if (k === "f" || k === "sel" || k === "fd" || k === "fq" || k === "fs") {
    const pf = s.split("~").map(v => v.trim());
    ctx.fillStyle = WFC.bg; ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 4); ctx.fill(); ctx.stroke();
    let lbl = pf[0] || "";
    if (c.req) lbl += " *";
    const cy = y + h / 2;
    const lead = k === "fq" ? 32 : 11;
    wfText(ctx, lbl, x + lead, cy, w - lead - (pf[1] ? 80 : 30), F, WFC.mut);
    const gap = (ki === "sel" || ki === "fd") ? 30 : 11;
    if (pf[1]) wfText(ctx, pf[1], x + w - gap, cy, 80, FS, WFC.ink, "right");
    ctx.strokeStyle = WFC.mut; ctx.fillStyle = WFC.mut; ctx.lineWidth = 1.3;
    if (ki === "sel") {
      ctx.beginPath();
      ctx.moveTo(x + w - 22, cy - 3); ctx.lineTo(x + w - 16, cy + 3); ctx.lineTo(x + w - 10, cy - 3);
      ctx.stroke();
    } else if (ki === "fd") {
      const bx = x + w - 26, by = cy - 8;
      ctx.strokeRect(bx, by + 2, 15, 14);
      ctx.beginPath();
      ctx.moveTo(bx, by + 6); ctx.lineTo(bx + 15, by + 6);
      ctx.moveTo(bx + 4, by); ctx.lineTo(bx + 4, by + 4);
      ctx.moveTo(bx + 11, by); ctx.lineTo(bx + 11, by + 4);
      ctx.stroke();
    } else if (k === "fq") {
      ctx.beginPath();
      ctx.arc(x + 17, cy - 1, 5, 0, Math.PI * 2);
      ctx.moveTo(x + 21, cy + 3); ctx.lineTo(x + 25, cy + 7);
      ctx.stroke();
    } else if (ki === "fs") {
      ctx.beginPath();
      ctx.arc(x + w - 21, cy - 2, 5, 0, Math.PI * 2);
      ctx.moveTo(x + w - 17, cy + 2); ctx.lineTo(x + w - 13, cy + 6);
      ctx.stroke();
    }
    return;
  }
  if (k === "b" || k === "b2") {
    const prim = k === "b";
    ctx.fillStyle = prim ? WFC.pri : WFC.bg;
    ctx.strokeStyle = prim ? WFC.pri : WFC.line; ctx.lineWidth = 1;
    roundRect(ctx, x, y + 1, w, h - 2, 4); ctx.fill(); ctx.stroke();
    wfText(ctx, s, x + w / 2, y + h / 2, w - 16, FS, prim ? "#FFFFFF" : WFC.ink, "center");
    return;
  }
  if (k === "chk" || k === "rad") {
    const box = 14, cy = y + h / 2;
    ctx.strokeStyle = WFC.line; ctx.lineWidth = 1; ctx.fillStyle = WFC.bg;
    if (k === "chk") { roundRect(ctx, x, cy - box / 2, box, box, 2); ctx.fill(); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(x + box / 2, cy, box / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    wfText(ctx, s, x + box + 8, cy, w - box - 12, F, WFC.ink);
    return;
  }
  if (k === "empty") {
    const ep = s.split("//").map(v => v.trim());
    const ex = x + w / 2, ey = y + h / 2 - 26;
    ctx.strokeStyle = WFC.soft; ctx.lineWidth = 2; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(ex - 5, ey - 5, 19, 0, Math.PI * 2);
    ctx.moveTo(ex + 8, ey + 8); ctx.lineTo(ex + 21, ey + 21);
    ctx.stroke();
    ctx.lineCap = "butt"; ctx.lineWidth = 1;
    wfText(ctx, ep[0] || "", ex, y + h / 2 + 34, w - 40,
           '600 13px "IBM Plex Sans KR","Malgun Gothic",sans-serif', WFC.mut, "center");
    if (ep[1]) wfText(ctx, ep[1], ex, y + h / 2 + 58, w - 40, FS, WFC.soft, "center");
    return;
  }
  if (k === "menu") {
    const its = s.split("/").map(v => v.trim());
    ctx.fillStyle = WFC.bg; ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 4); ctx.fill(); ctx.stroke();
    its.forEach((it0, i) => {
      const on = it0.charAt(0) === "*";
      const it = on ? it0.slice(1) : it0;
      const ry = y + 5 + i * 32;
      if (on) { ctx.fillStyle = "#EAF1F8"; roundRect(ctx, x + 4, ry, w - 8, 32, 3); ctx.fill(); }
      wfText(ctx, it, x + 13, ry + 16, w - 26, F, on ? WFC.pri : WFC.ink);
    });
    return;
  }
  if (k === "cal") {
    const pc = s.split("~").map(v => v.trim());
    const sel = parseInt(pc[1], 10) || 0;
    ctx.fillStyle = WFC.bg; ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 4); ctx.fill(); ctx.stroke();
    wfText(ctx, "<", x + 16, y + 24, 12, F, WFC.mut);
    wfText(ctx, pc[0] || "", x + w / 2, y + 24, w - 70, FB, WFC.ink, "center");
    wfText(ctx, ">", x + w - 18, y + 24, 12, F, WFC.mut, "right");
    const cw = (w - 24) / 7, top = y + 46;
    ["일", "월", "화", "수", "목", "금", "토"].forEach((d, i) => {
      wfText(ctx, d, x + 12 + cw * i + cw / 2, top, cw, FS, WFC.mut, "center");
    });
    for (let i = 0; i < 35; i++) {
      const day = i - 1;
      if (day < 1 || day > 30) continue;
      const cx = x + 12 + cw * (i % 7) + cw / 2;
      const cy = top + 26 + Math.floor(i / 7) * 30;
      if (day === sel) {
        ctx.fillStyle = WFC.pri;
        ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2); ctx.fill();
      }
      wfText(ctx, String(day), cx, cy, cw, FS, day === sel ? "#FFFFFF" : WFC.ink, "center");
    }
    return;
  }
  if (k === "pick") {
    const pp = s.split("~").map(v => v.trim());
    ctx.fillStyle = "#EEF4FA"; ctx.strokeStyle = "#C6D6E6"; ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h - 4, 4); ctx.fill(); ctx.stroke();
    wfText(ctx, pp[0] || "", x + 14, y + (h - 4) / 2, w / 2, FB, WFC.pri);
    if (pp[1]) {
      const bs = pp[1].split("/").map(v => v.trim());
      let bx = x + w - 12;
      ctx.font = FS;
      bs.slice().reverse().forEach(b => {
        const bw = ctx.measureText(b).width + 26;
        bx -= bw;
        ctx.fillStyle = WFC.bg; ctx.strokeStyle = WFC.line; ctx.lineWidth = 1;
        roundRect(ctx, bx, y + 5, bw, h - 14, 4); ctx.fill(); ctx.stroke();
        wfText(ctx, b, bx + bw / 2, y + (h - 4) / 2, bw - 12, FS, WFC.ink, "center");
        bx -= 6;
      });
    }
    return;
  }
  if (k === "tx") { wfText(ctx, s, x, y + h / 2, w, F, WFC.mut); return; }
  if (k === "cnt") { wfText(ctx, s, x + w, y + h / 2, w, F, WFC.mut, "right"); return; }
  if (k === "note") {
    ctx.fillStyle = WFC.fill; ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 4); ctx.fill(); ctx.stroke();
    wfText(ctx, "(!) " + s, x + 10, y + h / 2, w - 20, FS, WFC.mut);
    return;
  }
  if (k === "lines") {
    const n = parseInt(s, 10) || 4;
    ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
    for (let i = 0; i < n; i++) {
      const ly = y + 6 + i * 13;
      ctx.beginPath(); ctx.moveTo(x, ly); ctx.lineTo(x + (i === n - 1 ? w * 0.6 : w), ly); ctx.stroke();
    }
    ctx.setLineDash([]);
    return;
  }
  if (k === "img" || k === "box") {
    const bm = s.match(/^(\d+)\s*(.*)$/);
    let lb = bm ? bm[2] : s;
    let bx = x, bw = w, by = y, bh = h;
    if (lb.indexOf("//") >= 0) {
      const bp = lb.split("//").map(v => v.trim());
      let head = bp[0] || "";
      if (c.req) head += " *";
      wfText(ctx, head, x, y + 11, w, '600 12px "IBM Plex Sans KR","Malgun Gothic",sans-serif', WFC.ink);
      by = y + 24; bh = h - 24; lb = bp[1] || "";
    }
    const inp = k === "box" && by > y;
    ctx.fillStyle = inp || k === "img" ? WFC.bg : WFC.fill;
    ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    roundRect(ctx, bx, by, bw, bh, 2); ctx.fill(); ctx.stroke();
    if (inp) wfText(ctx, lb, bx + 11, by + 20, bw - 24, F, WFC.mut);
    else wfText(ctx, lb || (k === "img" ? "Image" : ""), bx + bw / 2, by + bh / 2,
                bw - 24, F, WFC.mut, "center");
    return;
  }
  if (k === "stat") {
    ctx.fillStyle = WFC.bg; ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    roundRect(ctx, x, y, w, h, 3); ctx.fill(); ctx.stroke();
    const parts = s.split("~").map(v => v.trim());
    wfText(ctx, parts[0] || "", x + 12, y + 20, w - 24, FS, WFC.mut);
    wfText(ctx, parts[1] || "", x + 12, y + h - 22, w - 24, '600 16px "IBM Plex Sans KR","Malgun Gothic",sans-serif', WFC.ink);
    return;
  }
  if (k === "t" || k === "td") {
    const cols = s.split(",").map(v => v.trim());
    if (k === "t") { ctx.fillStyle = WFC.deep; ctx.fillRect(x, y, w, h); }
    ctx.strokeStyle = WFC.soft; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.stroke();
    const tb = c.tbl;
    const wide = tb ? tb.wide : cols.map(cc => (cc === "[]" || cc === "#") ? 0.4 : 1);
    const align = tb ? tb.align : cols.map(() => "left");
    const sum2 = wide.reduce((a, b) => a + b, 0);
    const font = k === "t" ? '600 11.5px "IBM Plex Sans KR","Malgun Gothic",sans-serif' : FS;
    const ink = k === "t" ? WFC.ink : WFC.mut;
    let cx2 = x;
    cols.forEach((cc, i) => {
      const ww = (i < wide.length ? wide[i] : 1);
      const cw = w * (ww / sum2);
      if (cc === "[]") {
        ctx.strokeStyle = WFC.line; ctx.fillStyle = WFC.bg; ctx.lineWidth = 1;
        roundRect(ctx, cx2 + 12, y + h / 2 - 7, 14, 14, 2); ctx.fill(); ctx.stroke();
      } else {
        const ali = (i < align.length ? align[i] : "left");
        if (ali === "right") wfText(ctx, cc, cx2 + cw - 12, y + h / 2, cw - 20, font, ink, "right");
        else wfText(ctx, cc, cx2 + 12, y + h / 2, cw - 20, font, ink);
      }
      cx2 += cw;
    });
    return;
  }
  if (k === "tab") {
    const items = s.split("/").map(v => v.trim());
    const marked = items.some(v => v.charAt(0) === "*");
    let tx = x;
    ctx.font = FS;
    items.forEach((it0, i) => {
      const on = it0.charAt(0) === "*" || (!marked && i === 0);
      const bad = it0.indexOf("!") >= 0;
      const off = it0.charAt(0) === "-";
      const it = it0.replace(/^[*\-]/, "").replace(/!/g, "");
      const tw2 = ctx.measureText(it).width + 30 + (bad ? 12 : 0);
      wfText(ctx, it, tx + tw2 / 2 - (bad ? 6 : 0), y + h / 2 - 2, tw2 - 10, FS,
             off ? WFC.soft : (on ? WFC.pri : (bad ? WFC.bad : WFC.mut)), "center");
      ctx.strokeStyle = "#E3E8ED"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(tx, y + h - 3); ctx.lineTo(tx + tw2, y + h - 3); ctx.stroke();
      if (on) {
        ctx.strokeStyle = bad ? WFC.bad : WFC.pri; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(tx, y + h - 3); ctx.lineTo(tx + tw2, y + h - 3); ctx.stroke();
      }
      if (bad) {
        ctx.fillStyle = WFC.bad;
        ctx.beginPath(); ctx.arc(tx + tw2 - 13, y + h / 2 - 1, 3.5, 0, Math.PI * 2); ctx.fill();
      }
      tx += tw2;
    });
    return;
  }
  if (k === "p") {
    wfText(ctx, "< 1 2 3 >", x + w / 2, y + h / 2, w, F, WFC.mut, "center");
    return;
  }
  if (k === "key") {
    const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "지움", "0", "확인"];
    const kw = Math.min(70, (w - 16) / 3), kh = 42;
    const ox = x + (w - (kw * 3 + 16)) / 2;
    keys.forEach((kk, i) => {
      const r = Math.floor(i / 3), cc = i % 3;
      const bx = ox + cc * (kw + 8), by = y + r * (kh + 6);
      ctx.fillStyle = WFC.bg; ctx.strokeStyle = WFC.line; ctx.lineWidth = 1;
      roundRect(ctx, bx, by, kw, kh, 3); ctx.fill(); ctx.stroke();

  const count = new Map();
  const tally = (m, z) => { m.set(z, (m.get(z) || 0) + 1); };
  cross.forEach(list => list.forEach(e => { tally(count, e.a); tally(count, e.b); }));
  inband.forEach(list => list.forEach(e => { tally(count, e.a); tally(count, e.b); }));

  const marks = [];
  const drawOne = (e, y, ax, bx, down) => {
    ctx.strokeStyle = e.dashed ? "#9AAAB8" : "#5F6F7E";
    ctx.lineWidth = e.dashed ? 1.1 : 1.4;
    ctx.setLineDash(e.dashed ? [4, 3] : []);
    const y1 = down ? e.a.py + e.a.h : e.a.py;
    const y2 = down ? e.b.py : e.b.py + e.b.h;
    ctx.beginPath();
    ctx.moveTo(ax, y1); ctx.lineTo(ax, y);
    ctx.lineTo(bx, y); ctx.lineTo(bx, down ? y2 - 8 : y2 + 8);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.beginPath();
    if (down) { ctx.moveTo(bx - 4.5, y2 - 9); ctx.lineTo(bx + 4.5, y2 - 9); ctx.lineTo(bx, y2 - 1); }
    else { ctx.moveTo(bx - 4.5, y2 + 9); ctx.lineTo(bx + 4.5, y2 + 9); ctx.lineTo(bx, y2 + 1); }
    ctx.closePath(); ctx.fill();
    if (e.label) marks.push({ text: e.label, x: ax + (bx - ax) * 0.62, y: y });
  };

  let skipIdx = 0;
  cross.forEach((list, gi) => {
    const band = bands[gi];
    const top = band.top + band.h + band.below;
    const near = list.filter(e => Math.abs(e.a.bi - e.b.bi) === 1);
    const far = list.filter(e => Math.abs(e.a.bi - e.b.bi) > 1);
    const step = band.gap / (near.length + 1);
    const laid = near.map(e => {
      const down = e.b.bi > e.a.bi;
      return {
        e: e, down: down,
        ax: portX(e.a, "b", bump(out, e.a), count.get(e.a)),
        bx: portX(e.b, down ? "t" : "b", bump(inn, e.b), count.get(e.b))
      };
    });
    laid.sort((p, q) => Math.abs(q.bx - q.ax) - Math.abs(p.bx - p.ax));
    laid.forEach((p, i) => drawOne(p.e, top + step * (i + 1), p.ax, p.bx, p.down));
    far.forEach(e => {
      const lx = laneX + 12 + (skipIdx++) * 14;
      const down = e.b.bi > e.a.bi;
      const ax = portX(e.a, "b", bump(out, e.a), count.get(e.a));
      const bx = portX(e.b, down ? "t" : "b", bump(inn, e.b), count.get(e.b));
      const y1 = down ? e.a.py + e.a.h : e.a.py;
      const turn = down ? y1 + 14 : y1 - 14;
      const cy = down ? e.b.py - 20 : e.b.py + e.b.h + 20;
      const ey = down ? e.b.py : e.b.py + e.b.h;
      const d = down ? 1 : -1;
      ctx.strokeStyle = e.dashed ? "#9AAAB8" : "#5F6F7E";
      ctx.lineWidth = e.dashed ? 1.1 : 1.4;
      ctx.setLineDash(e.dashed ? [4, 3] : []);
      ctx.beginPath();
      ctx.moveTo(ax, y1); ctx.lineTo(ax, turn);
      ctx.lineTo(lx, turn); ctx.lineTo(lx, cy);
      ctx.lineTo(bx, cy); ctx.lineTo(bx, ey - d * 8);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(bx - 4.5, ey - d * 9); ctx.lineTo(bx + 4.5, ey - d * 9); ctx.lineTo(bx, ey - d * 1);
      ctx.closePath(); ctx.fill();
      if (e.label) marks.push({ text: e.label, x: lx, y: (turn + cy) / 2, turn: true });
    });
  });

  inband.forEach((list, bi) => {
    const band = bands[bi];
    list.forEach((e, i) => {
      const y = band.top + band.h + 10 + i * 13;
      const ax = portX(e.a, "b", bump(out, e.a), count.get(e.a));
      const bx = portX(e.b, "b", bump(inn, e.b), count.get(e.b));
      ctx.strokeStyle = e.dashed ? "#9AAAB8" : "#5F6F7E";
      ctx.lineWidth = e.dashed ? 1.1 : 1.4;
      ctx.setLineDash(e.dashed ? [4, 3] : []);
      ctx.beginPath();
      ctx.moveTo(ax, e.a.py + e.a.h); ctx.lineTo(ax, y);
      ctx.lineTo(bx, y); ctx.lineTo(bx, e.b.py + e.b.h + 8);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(bx - 4.5, e.b.py + e.b.h + 9); ctx.lineTo(bx + 4.5, e.b.py + e.b.h + 9);
      ctx.lineTo(bx, e.b.py + e.b.h + 1); ctx.closePath(); ctx.fill();
      if (e.label) marks.push({ text: e.label, x: (ax + bx) / 2, y: y });
    });
  });

  // 라벨은 마지막에 올린다. 선이 글자를 덮지 않게 한다
  ctx.font = FC.fontXs;
  ctx.textBaseline = "middle";
  const placed = [];
  marks.forEach(m => {
    const tw = ctx.measureText(m.text).width;
    if (m.turn) {
      ctx.save();
      ctx.translate(m.x - 6, m.y);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = FC.bg;
      ctx.fillRect(-tw / 2 - 4, -7, tw + 8, 13);
      ctx.fillStyle = FC.muted;
      ctx.textAlign = "center";
      ctx.fillText(m.text, 0, 0);
      ctx.restore();
      ctx.textAlign = "left";
      return;
    }
    // 같은 통로에서 글자끼리 겹치면 옆으로 민다
    let x = m.x;
    for (let k = 0; k < 24; k++) {
      const hit = placed.some(q => Math.abs(q.y - m.y) < 12 && Math.abs(q.x - x) < (q.w + tw) / 2 + 8);
      if (!hit) break;
      x += (tw + 14) * (k % 2 ? -1 : 1) * Math.ceil((k + 1) / 2);
    }
    placed.push({ x: x, y: m.y, w: tw });
    ctx.fillStyle = FC.bg;
    ctx.fillRect(x - tw / 2 - 4, m.y - 8, tw + 8, 13);
    ctx.fillStyle = FC.muted;
    ctx.textAlign = "center";
    ctx.fillText(m.text, x, m.y - 1.5);
    ctx.textAlign = "left";
  });
}
function drawArchBand(ctx, bd, left, top, bi) {
  let x = left;
  const cy = top + bd.h / 2;
  const zones = bd.zones;
  zones.forEach((z, zi) => {
    const y = cy - z.h / 2;
    z.px = x; z.py = y; z.bi = bi;
    ctx.fillStyle = "#FAFCFD"; ctx.strokeStyle = "#C3CDD6"; ctx.lineWidth = 1.2;
    roundRect(ctx, x, y, z.w, z.h, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#EDF3F9";
    ctx.beginPath();
    ctx.moveTo(x, y + 7); ctx.arcTo(x, y, x + 7, y, 7);
    ctx.lineTo(x + z.w - 7, y); ctx.arcTo(x + z.w, y, x + z.w, y + 7, 7);
    ctx.lineTo(x + z.w, y + z.headH); ctx.lineTo(x, y + z.headH);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#D6E0EA";
    ctx.beginPath(); ctx.moveTo(x, y + z.headH); ctx.lineTo(x + z.w, y + z.headH); ctx.stroke();

    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = FC.fontB; ctx.fillStyle = "#173B5C";
    ctx.fillText(z.title, x + AZPAD, y + (z.sub ? 19 : z.headH / 2));
    if (z.sub) {
      ctx.font = FC.fontSm; ctx.fillStyle = FC.muted;
      ctx.fillText(z.sub, x + AZPAD, y + 35);
    }

    let gy = y + z.headH + AZPAD;
    z.groups.forEach(g => {
      ctx.font = FC.fontXs; ctx.fillStyle = FC.faint;
      ctx.fillText(g.label, x + AZPAD, gy + 7);
      gy += 18;
      g.nodes.forEach(n => {
        ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#9FB0BF"; ctx.lineWidth = 1;
        roundRect(ctx, x + AZPAD, gy, z.w - AZPAD * 2, ANODE_H, 4); ctx.fill(); ctx.stroke();
        ctx.font = FC.font; ctx.fillStyle = FC.ink;
        ctx.fillText(n, x + AZPAD + 12, gy + ANODE_H / 2);
        gy += ANODE_H + ANODE_GAP;
      });
      gy += AGRP_GAP - ANODE_GAP;
    });

    x += z.w + AGAP;
  });
}

function renderMd(src) {
  if (!src) return `<p class="detail">문서 내용이 없다.</p>`;
  let html;
  try {
    html = window.marked ? marked.parse(src, { mangle: false, headerIds: false })
                         : `<pre><code>${esc(src)}</code></pre>`;
  } catch (e) { html = `<pre><code>${esc(src)}</code></pre>`; }
  // 열이 많은 표는 눌러 담지 않고 가로로 넘긴다
  html = html.replace(/<table>([\s\S]*?)<\/table>/g, (m, body) => {
    const cols = (body.match(/<th[ >]/g) || []).length;
    const cls = cols >= 8 ? "tablewrap wide" : "tablewrap";
    return `<div class="${cls}"><table>${body}</table></div>`;
  });
  // 코드 블록 중 흐름도를 도형으로 교체
  const box = document.createElement("div");
  box.innerHTML = html;
  box.querySelectorAll("pre > code").forEach(code => {
    const text = code.textContent || "";
    const isIA = code.classList.contains("language-ia");
    const isArch = code.classList.contains("language-arch");
    if (code.classList.contains("language-wf")) {
      const holder = document.createElement("div");
      holder.innerHTML = renderWF(code.textContent);
      code.parentElement.replaceWith(holder.firstElementChild);
      return;
    }
    if (code.classList.contains("language-ui")) {
      const holder = document.createElement("div");
      holder.innerHTML = renderUIMap(code.textContent);
      code.parentElement.replaceWith(holder.firstElementChild);
      return;
    }
    if (code.classList.contains("language-map")) {
      const holder = document.createElement("div");
      holder.innerHTML = renderMap(code.textContent);
      code.parentElement.replaceWith(holder.firstElementChild);
      return;
    }
    if (!isIA && !isArch && !isFlowBlock(text)) return;
    const holder = document.createElement("div");
    holder.innerHTML = isIA ? renderIA(text) : isArch ? renderArch(text) : renderFlow(text);
    code.parentElement.replaceWith(holder.firstElementChild);
  });
  return box.innerHTML;
}

let bz = 1, bx = 0, by = 0, bStage = null, bVal = null, bView = null;
function bApply() {
  if (!bStage) return;
  bStage.style.transform = "translate(" + bx + "px," + by + "px) scale(" + bz + ")";
  bStage.style.setProperty("--iz", String(1 / bz));
  if (bVal) bVal.textContent = Math.round(bz * 100) + "%";
}
function bSetZoom(v, cx, cy) {
  const nz = Math.min(2.5, Math.max(0.2, v));
  if (cx == null) { cx = bView.clientWidth / 2; cy = bView.clientHeight / 2; }
  bx = cx - (cx - bx) * (nz / bz);
  by = cy - (cy - by) * (nz / bz);
  bz = nz;
  bApply();
}
function openBoard(host) {

      return;
    }
    let h = d.previousElementSibling, name = "", sid = "";
    while (h) {
      if (/^H[2-4]$/.test(h.tagName)) {
        const txt = h.textContent.trim();
        const m = txt.match(SID_ONE);
        sid = m ? m[0] : "";
        name = sid ? txt.replace(sid, "").trim() : txt;
        break;
      }
      h = h.previousElementSibling;
    }
    shots.push({ cv: cv, name: name || sid, sid: sid });
  });
  if (!shots.length) return openFlowModal(host);

  let title = "화면";

  while (s) {

  }
  if (title === "화면") {

  const box = document.createElement("div");

  box.innerHTML = `

      <div class="zoom">
        <button type="button" data-b="out" aria-label="축소"><i data-lucide="minus"></i></button>
        <span class="zval">100%</span>

      </div>

      <button type="button" class="mclose" aria-label="닫기"><i data-lucide="x"></i></button>
    </div>
    <div class="bview"><div class="bstage"><div class="bwrap"></div></div>
      <div class="bhint">끌어서 이동 · 휠로 확대 · 제목을 누르면 화면 설계로 이동 · Esc 닫기</div></div>`;
  document.body.appendChild(box);
  document.body.style.overflow = "hidden";

  const wrap = box.querySelector(".bwrap");
  shots.forEach(sh => {
    const fig = document.createElement("figure");
    if (!sh.board) {
      const cap = document.createElement("figcaption");
      cap.innerHTML = `<b>${esc(sh.name)}</b><span>${esc(sh.sid)}</span>`;
      fig.appendChild(cap);
    } else {
      fig.className = "plain";
    }
    fig.appendChild(sh.cv.cloneNode(true));

  });

  bStage = box.querySelector(".bstage");
  bView = box.querySelector(".bview");
  bVal = box.querySelector(".zval");
  bz = 1; bx = 0; by = 0;

  // 캔버스를 다시 그려 선명하게 둔다
  drawFlowCanvases(box, 1);
  wrap.querySelectorAll("canvas.wfcanvas").forEach(wfMarks);

  const fit = () => {
    const w = wrap.scrollWidth, h = wrap.scrollHeight;
    const z = Math.min(bView.clientWidth / w, bView.clientHeight / h, 1);
    bz = Math.max(0.2, z);
    bx = (bView.clientWidth - w * bz) / 2;
    by = 20;
    bApply();
  };
  requestAnimationFrame(fit);

  box.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.classList.contains("mclose")) return closeBoard();
    if (b.dataset.b === "in") bSetZoom(bz + 0.15);
    if (b.dataset.b === "out") bSetZoom(bz - 0.15);
    if (b.dataset.b === "fit") fit();
  });

  // 카드 제목을 누르면 그 화면 설계로 간다
  wrap.addEventListener("click", (e) => {
    const cap = e.target.closest("figcaption");
    if (!cap) return;

  let dragging = false, px = 0, py = 0;
  bView.addEventListener("pointerdown", (e) => {

  const stop = (e) => {

  bView.addEventListener("pointerup", stop);
  bView.addEventListener("pointercancel", stop);

    bSetZoom(bz * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  icons();
  box.querySelector(".mclose").focus();
}

  const one = SID_ONE;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!one.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      let p = n.parentElement;
      while (p && p !== root) {
        const g = p.tagName;
        if (g === "PRE" || g === "CODE" || g === "A" || /^H[1-4]$/.test(g)) return NodeFilter.FILTER_REJECT;
        if (p.classList && p.classList.contains("fref")) return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const targets = [];
  while (walker.nextNode()) targets.push(walker.currentNode);
  const all = SID_ALL;
  targets.forEach(n => {
    const text = n.nodeValue;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    all.lastIndex = 0;
    while ((m = all.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const s = document.createElement("span");
      s.className = "fref go sref";
      s.setAttribute("role", "link");
      s.tabIndex = 0;
      s.textContent = m[0];
      frag.appendChild(s);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}
function goToScreen(id) {
  const t = document.querySelector('[data-sid="' + id + '"]');
  if (!t) return (window.goToScreenDoc ? window.goToScreenDoc(id) : false);
  t.scrollIntoView({ block: "start", behavior: "smooth" });
  t.classList.add("hit");
  setTimeout(() => t.classList.remove("hit"), 1600);
  return true;
}
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".sref");
  if (chip) return goToScreen((chip.textContent || "").trim());
  const mk = e.target.closest(".wfmark");
  if (mk) {
    if (mk.closest(".board")) closeBoard();
    return goToScreen(mk.dataset.sid);
  }
  const cv = e.target.closest("canvas.wfcanvas");
  if (!cv || !cv._wfhits) return;
  const r = cv.getBoundingClientRect();
  const sc = cv._scale || 1;
  const x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
  const hit = cv._wfhits.find(h => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + 30);
  if (hit && hit.id) {
    if (cv.closest(".board")) closeBoard();
    goToScreen(hit.id);
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const chip = e.target.closest && e.target.closest(".sref");
  if (!chip) return;
  e.preventDefault();
  goToScreen((chip.textContent || "").trim());
});
function linkFlowRefs(root) {
  const RE = /\bFL-\d{3}\b/;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!RE.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      let p = n.parentElement;
      while (p && p !== root) {
        const g = p.tagName;
        if (g === "PRE" || g === "CODE" || g === "A" || /^H[1-4]$/.test(g)) return NodeFilter.FILTER_REJECT;
        if (p.classList && p.classList.contains("fref")) return NodeFilter.FILTER_REJECT;
        p = p.parentElement;
      }
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const targets = [];
  while (walker.nextNode()) targets.push(walker.currentNode);
  const ALL = /\bFL-\d{3}\b/g;
  targets.forEach(n => {
    const text = n.nodeValue;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    ALL.lastIndex = 0;
    while ((m = ALL.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const s = document.createElement("span");
      s.className = "fref go";
      s.setAttribute("role", "link");
      s.tabIndex = 0;
      s.textContent = m[0];
      frag.appendChild(s);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    n.parentNode.replaceChild(frag, n);
  });
}
function buildDocBody(html) {
  const body = document.getElementById("docBody");
  const aside = document.getElementById("docAside");
  const nav = document.getElementById("secNav");
  body.innerHTML = html;
  linkFlowRefs(body);

  const flowIndex = new Map();
  const nodes = [...body.childNodes];
  const pre = document.createDocumentFragment();
  const secs = [];
  let cur = null;
  nodes.forEach(n => {
    if (n.nodeType === 1 && n.tagName === "H2") {
      cur = { title: n.textContent.trim().replace(/^\d+\.\s*/, ""), frag: document.createDocumentFragment() };
      secs.push(cur);
      cur.frag.appendChild(n);
    } else if (cur) {
      if (n.nodeType === 1 && n.tagName === "H3") {
        const fm = n.textContent.match(/\b(FL-\d{3})\b/);
        if (fm) {
          n.id = "flow-" + fm[1];
          n.classList.add("flow-target");
          flowIndex.set(fm[1], secs.length - 1);
        }
      }
      cur.frag.appendChild(n);
    }
    else pre.appendChild(n);
  });

  body.innerHTML = "";
  body.appendChild(pre);
  if (secs.length < 2) {
    aside.hidden = true;
    secs.forEach(s => body.appendChild(s.frag));
    icons();
    drawFlowCanvases(body);
    return;
  }
  const holder = document.createElement("div");
  body.appendChild(holder);
  aside.hidden = false;
  nav.innerHTML = secs.map((s, i) =>
    `<button type="button" data-sec="${i}" ${i === 0 ? 'aria-current="true"' : ""}>${esc(s.title)}</button>`).join("");
  const splitFlows = (frag) => {
    const lead = document.createDocumentFragment();
    const items = [];
    let cur = null;
    [...frag.childNodes].forEach(n => {
      if (n.nodeType === 1 && n.tagName === "H3") {
        cur = { id: (n.textContent.match(/\bFL-\d{3}\b/) || [])[0] || "",
                label: n.textContent.trim().replace(/\s*\([^)]*\)\s*$/, ""),
                frag: document.createDocumentFragment() };
        items.push(cur);
      }
      (cur ? cur.frag : lead).appendChild(n);
    });
    return { lead, items };
  };
  let showItem = null;
  const pick = (i, flowId) => {
    holder.innerHTML = "";
    const { lead, items } = splitFlows(secs[i].frag.cloneNode(true));
    holder.appendChild(lead);
    showItem = null;
    if (items.length < 2) {
      items.forEach(it => holder.appendChild(it.frag));
    } else {
      const tabs = document.createElement("div");
      tabs.className = "ftabs";
      tabs.innerHTML = items.map((it, k) =>
        `<button type="button" data-flow="${k}">${esc(it.label)}</button>`).join("");
      holder.appendChild(tabs);
      const bar = document.createElement("div");
      bar.className = "fnav";
      bar.innerHTML = `<div class="fnav-title"></div><div class="fnav-btns">` +
        `<button type="button" data-step="-1" aria-label="이전 Flow">←</button>` +
        `<button type="button" data-step="1" aria-label="다음 Flow">→</button></div>`;
      holder.appendChild(bar);
      const barTitle = bar.querySelector(".fnav-title");
      const slot = document.createElement("div");
      slot.className = "fslot";
      holder.appendChild(slot);
      let at = 0;
      showItem = (k) => {
        at = k;
        slot.innerHTML = "";
        barTitle.innerHTML = "";
        const frag = items[k].frag.cloneNode(true);
        const h = frag.querySelector("h3");
        if (h) barTitle.appendChild(h);
        slot.appendChild(frag);
        tabs.querySelectorAll("button").forEach((b, j) => {
          if (j === k) { b.setAttribute("aria-current", "true"); b.scrollIntoView({ block: "nearest", inline: "nearest" }); }
          else b.removeAttribute("aria-current");
        });
        bar.querySelectorAll("[data-step]").forEach(b => {
          const n = k + (+b.dataset.step);
          b.disabled = n < 0 || n >= items.length;
        });
        addLegend(slot);
        markScreenHeads(slot);
        linkScreenRefs(slot);
        icons();
        drawFlowCanvases(slot);
      };
      bar.onclick = (e) => {
        const b = e.target.closest("[data-step]");
        if (!b || b.disabled) return;
        const n = at + (+b.dataset.step);
        if (n >= 0 && n < items.length) showItem(n);
      };
      tabs.onclick = (e) => {
        const b = e.target.closest("[data-flow]");
        if (b) showItem(+b.dataset.flow);
      };
      const start = flowId ? items.findIndex(it => it.id === flowId) : 0;
      showItem(start < 0 ? 0 : start);
    }
    addLegend(holder);
    markScreenHeads(holder);
    linkScreenRefs(holder);
    nav.querySelectorAll("button").forEach((b, j) =>
      j === i ? b.setAttribute("aria-current", "true") : b.removeAttribute("aria-current"));
    icons();
    drawFlowCanvases(holder);
  };
  const addLegend = (root) => {
    const first = root.querySelector(".flow");
    if (!first || root.querySelector(".flegend")) return;
    const lg = document.createElement("div");
    lg.innerHTML = FLOW_LEGEND;
    first.parentNode.insertBefore(lg.firstElementChild, first);
  };
  nav.onclick = (e) => { const b = e.target.closest("[data-sec]"); if (b) pick(+b.dataset.sec); };
  window.pickSection = (sid) => {
    for (let i = 0; i < secs.length; i++) {
      const txt = secs[i].frag.textContent || "";
      if (txt.indexOf(sid) >= 0) { pick(i); return true; }
    }
    return false;
  };
  window.goToFlow = (id) => {
    if (!flowIndex.has(id)) return false;
    pick(flowIndex.get(id), id);
    requestAnimationFrame(() => {
      const h = body.querySelector("#flow-" + id);
      if (!h) return;
      h.scrollIntoView({ block: "center", behavior: "auto" });
      h.classList.add("hit");
      setTimeout(() => h.classList.remove("hit"), 1600);
    });
    return true;
  };
  pick(0);
}

const SCREEN_DOC = new Map();
D.documents.forEach((d, i) => {
  const re = /^#### ((?:ADM|STR|WEB|KSK)-[A-Z]{3,4}-[A-Z]{3,6})/gm;
  let m;
  while ((m = re.exec(d.content || ""))) if (!SCREEN_DOC.has(m[1])) SCREEN_DOC.set(m[1], i);
});
window.goToScreenDoc = (id) => {
  if (!SCREEN_DOC.has(id)) return false;
  const i = SCREEN_DOC.get(id);
  show("doc", i);
  let n = 0;
  const tryHit = () => {
    if (goToScreenLocal(id)) return;
    if (++n > 40) return;
    if (window.pickSection && window.pickSection(id)) { setTimeout(tryHit, 60); return; }
    setTimeout(tryHit, 60);
  };
  setTimeout(tryHit, 80);
  return true;
};
function goToScreenLocal(id) {
  const el = document.querySelector('[data-sid="' + id + '"]');
  if (!el) return false;
  el.scrollIntoView({ block: "start", behavior: "smooth" });
  el.classList.add("hit");
  setTimeout(() => el.classList.remove("hit"), 1600);
  return true;
}
function show(view, doc) {
  current = { view, doc: doc ?? current.doc };
  Object.entries(pages).forEach(([k, el]) => { el.hidden = (k !== view); });
  tabs.forEach(b => b.setAttribute("aria-selected", String(b.dataset.nav === view)));
  if (view === "doc") renderDoc(current.doc);
  const hash = view === "doc" ? `#/doc/${D.documents[current.doc].no}` : view === "changes" ? "#/changes" : "#/";
  if (location.hash !== hash) history.replaceState(null, "", hash);
  try { localStorage.setItem("dash.route", hash); } catch (e) {}
}
function routeFrom(hash) {
  const m = String(hash || "").match(/^#\/doc\/(\d+)/);
  if (m) {
    const i = D.documents.findIndex(d => d.no === Number(m[1]));
    if (i >= 0) return show("doc", i);
  }
  if (/^#\/changes/.test(hash || "")) return show("changes");
  return show("list");
}
tabs.forEach(b => b.addEventListener("click", () => show(b.dataset.nav)));
document.getElementById("docList").addEventListener("click", e => {
  const b = e.target.closest("[data-doc]"); if (b) show("doc", +b.dataset.doc);
});
document.getElementById("backBtn").addEventListener("click", () => show("list"));
window.addEventListener("hashchange", () => routeFrom(location.hash));

// ── 커스텀 드롭다운
function makeSelect(host, label, values, onChange) {
  const opts = [{ v: "", t: "전체" }, ...values.map(v => ({ v, t: v }))];
  let cur = "", open = false, cursor = 0;
  host.innerHTML = `
    <button class="sel-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span>${esc(label)}</span><span class="val">전체</span><i data-lucide="chevron-down" class="chev"></i>
    </button>
    <ul class="sel-menu" role="listbox" aria-label="${esc(label)}" hidden>
      ${opts.map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === 0}"><i data-lucide="check"></i>${esc(o.t)}</li>`).join("")}
    </ul>`;
  const btn = host.querySelector(".sel-btn"), menu = host.querySelector(".sel-menu");
  const paintCursor = () => menu.querySelectorAll("li").forEach((li, i) => li.classList.toggle("cursor", i === cursor));
  const setOpen = (v) => {
    open = v; menu.hidden = !v; host.dataset.open = String(v); btn.setAttribute("aria-expanded", String(v));
    if (v) { cursor = Math.max(0, opts.findIndex(o => o.v === cur)); paintCursor(); }
  };
  const pick = (i) => {
    cur = opts[i].v;
    btn.querySelector(".val").textContent = opts[i].t;
    btn.classList.toggle("set", cur !== "");
    menu.querySelectorAll("li").forEach((li, j) => li.setAttribute("aria-selected", String(i === j)));
    setOpen(false); btn.focus(); onChange(cur);
  };
  btn.addEventListener("click", () => setOpen(!open));
  menu.addEventListener("click", (e) => { const li = e.target.closest("li"); if (li) pick(+li.dataset.i); });
  host.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && open) { e.stopPropagation(); setOpen(false); btn.focus(); return; }
    if (!open && (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") && e.target === btn) { e.preventDefault(); setOpen(true); return; }
    if (!open) return;
    if (e.key === "ArrowDown") { e.preventDefault(); cursor = (cursor + 1) % opts.length; paintCursor(); }
    if (e.key === "ArrowUp") { e.preventDefault(); cursor = (cursor - 1 + opts.length) % opts.length; paintCursor(); }
    if (e.key === "Enter") { e.preventDefault(); pick(cursor); }
  });
  document.addEventListener("click", (e) => { if (open && !host.contains(e.target)) setOpen(false); });
  return () => cur;
}

const uniq = (k) => [...new Set(D.changes.map(c => c[k]).filter(Boolean))];
const getStatus = makeSelect(document.getElementById("selStatus"), "상태", uniq("status"), renderChanges);
const getSource = makeSelect(document.getElementById("selSource"), "출처", uniq("source"), renderChanges);
const getDoc = makeSelect(document.getElementById("selDoc"), "문서", uniq("document_title"), renderChanges);
document.getElementById("fText").addEventListener("input", renderChanges);

function renderChanges() {
  const st = getStatus(), so = getSource(), dc = getDoc();
  const tx = document.getElementById("fText").value.trim().toLowerCase();
  const rows = D.changes.filter(c =>
    (!st || c.status === st) && (!so || c.source === so) && (!dc || c.document_title === dc) &&
    (!tx || `${c.summary} ${c.id} ${c.requested_by || ""}`.toLowerCase().includes(tx)));
  document.getElementById("changeCount").textContent = `${rows.length} / ${D.changes.length}건`;
  document.querySelector("#changeTable tbody").innerHTML = rows.length ? rows.map(c => `<tr>
    <td class="mono nowrap">${esc(c.date)}</td>
    <td class="mono">${esc(c.id)}</td>
    <td><span class="type"><i data-lucide="${TYPE_ICON[c.type] || "dot"}"></i>${esc(c.type)}</span></td>
    <td class="nowrap">${esc(c.source)}</td>
    <td class="nowrap">${esc(c.document_title)}</td>
    <td>${esc(c.summary)}</td>
    <td class="detail">${c.affects_titles.length ? esc(c.affects_titles.join(", ")) : "-"}</td>
    <td class="nowrap">${esc(c.requested_by || "")}</td>
    <td>${pill(c.status)}</td>
  </tr>`).join("") : `<tr><td colspan="9" class="empty">조건에 맞는 변경 이력이 없다.</td></tr>`;
  icons();
}
renderChanges();

let saved = location.hash;
if (!saved) { try { saved = localStorage.getItem("dash.route") || "#/"; } catch (e) { saved = "#/"; } }
routeFrom(saved);
icons();
