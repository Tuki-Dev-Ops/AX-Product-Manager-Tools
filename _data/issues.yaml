issues:
- id: IS-001
  type: 확인 필요
  document: DOC-01
  title: 계층에서 '행사'의 정의
  detail: 행사는 시작일과 종료일을 가진 운영 단위로 정의했다. 종료일이 지나면 소속 매장을 자동 종료한다. 상설 매장은 종료일 없는 상시 행사에 소속시킨다. 02 문서 3.1에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-002
  type: 확인 필요
  document: DOC-01
  title: '''상권''의 정의 기준'
  detail: 상권은 행사 안에서 매장을 묶는 지역 구분 단위로 정의했다. 전국 단위 공개 상권코드가 없어 자체 코드로 관리하고 행정동코드를 참조 항목으로 함께 보관한다. 03 문서 3절에 코드 형식을 확정했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-003
  type: 확인 필요
  document: DOC-01
  title: '''지점''과 ''1호점, 2호점''의 관계'
  detail: 매장은 브랜드 아래 지점번호로 표현한다. 1호점, 2호점이 지점번호다. 매장 계층을 두 단계로 두지 않는다. 02 문서 3.1과 03 문서 2절에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-004
  type: 확인 필요
  document: DOC-01
  title: 직영과 가맹의 정책 차이
  detail: 직영과 가맹을 구분하지 않기로 확정했다. 두 유형 사이에 메뉴, 가격, 권한의 정책 차이가 없다. 매장 등록에서 운영 형태 항목을 제거했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-005
  type: 확인 필요
  document: DOC-03
  title: POS 연동 대상과 제공 방식
  detail: 제공 방식을 확정했다. 조회 전용, 웹훅 통지, 증분 조회, 백업 폴링 30분, 접근 키 인증, 이벤트 식별자 멱등. 연동 대상 제품은 계약 시점에 개별 확인한다. 02 문서 3.2에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-006
  type: 확인 필요
  document: DOC-03
  title: 모바일 스마트오더 회원 체계
  detail: 하이브리드 웹앱에 회원 개념을 두지 않기로 확정했다. 모든 주문은 비회원 주문이다. 이름과 휴대폰번호를 입력받고, 주문번호와 휴대폰번호 조합으로 조회한다. 02 문서 3.9에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-007
  type: 확인 필요
  document: DOC-03
  title: 메뉴 정보의 관리 주체
  detail: ERP를 단일 기준으로 확정했다. 외부 POS에서 직접 등록·수정할 수 없다. 02 문서 3.2에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-008
  type: 의사결정 필요
  document: DOC-02
  title: 메뉴 정보 마스터의 위치
  detail: ERP를 단일 소유자로 확정했다. 양방향 동기화를 두지 않으므로 충돌 처리가 필요 없다. 02 문서 3.2에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-009
  type: 의사결정 필요
  document: DOC-02
  title: 메뉴 변경의 채널 반영 시점
  detail: 채널별로 확정했다. 웹앱은 즉시, 키오스크는 유휴 시점과 결제 완료 시점, 외부 POS는 통지 후 조회. 영업 중 변경은 진행 중 주문이 있으면 배포 시점을 선택하게 한다. 02 문서 3.4에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-010
  type: 확인 필요
  document: DOC-03
  title: 키오스크 오프라인 운영 여부
  detail: 오프라인 결제를 설계하지 않기로 확정했다. 국내 VAN 승인은 온라인 실시간이 전제다. 결제 이전 단계는 주문 불가로 안내하고, 결제 완료 후 전송 실패는 단말 보관 후 재전송으로 처리한다. 02 문서 3.5에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-011
  type: 의사결정 필요
  document: DOC-02
  title: 결제·정산 계약 구조
  detail: 외부 PG사가 정산을 전담하고 플랫폼은 정보만 제공하는 구조로 확정했다. 플랫폼은 대금을 수취하지 않는다. 전자지급결제대행업 등록 의무가 없다. 02 문서 3.7에 반영했다.
  related:
  - DC-001
  status: 해결
  raised: 2026-09-03
- id: IS-012
  type: 의사결정 필요
  document: DOC-03
  title: 주문 접수 화면의 위치
  detail: 가맹 어드민에 주문 접수 화면을 두고, 수락 시 매장 프린터로 주문서를 출력한다. 프린터가 없으면 화면 목록만으로 운영한다. 02 문서 3.9와 FL-203에 반영했다.
  related:
  - DC-004
  - FL-203
  status: 해결
  raised: 2026-09-03
- id: IS-013
  type: 확인 필요
  document: DOC-03
  title: 어드민의 주문자 개인정보 노출 여부
  detail: 안전한 인증수단을 전 어드민 사용자에게 적용하기로 확정했다. 개인정보 노출 여부와 무관하게 상위 기준을 적용한다. 02 문서 3.8에 반영했다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-014
  type: 확인 필요
  document: DOC-03
  title: 알레르기·영양성분 표시 의무 대상 여부
  detail: 표시 의무 대상 여부와 무관하게 메뉴 등록 시 필수 입력으로 확정했다. 나중에 의무 대상이 되었을 때 소급 입력하는 일을 피한다. FL-106에서 판단 단계를 제거했다.
  related:
  - FN-109
  status: 해결
  raised: 2026-09-03
- id: IS-015
  type: 확인 필요
  document: DOC-01
  title: 선불충전 기능 도입 여부
  detail: 선불충전을 도입하지 않기로 확정했다. 포인트와 기프트 기능을 두지 않으므로 선불업 등록 검토 대상에서 벗어난다.
  related: []
  status: 해결
  raised: 2026-09-03
- id: IS-016
  type: 의사결정 필요
  document: DOC-02
  title: 메뉴 배포의 승인과 되돌리기 지원 여부
  detail: 배포 절차를 두지 않기로 확정했다. 매장이 저장하면 그 매장의 주문 채널에 반영된다. 승인과 되돌리기도 두지 않는다.
  related:
  - FL-102
  - DC-003
  status: 해결
  raised: 2026-09-03
- id: IS-017
  type: 의사결정 필요
  document: DOC-03
  title: 알레르기 정보의 등록 단위
  detail: 메뉴 단위로 확정했다. 법정 19개 품목 중에서 고르고 자유 입력은 두지 않는다. 옵션은 항목마다 따로 받아 주문 화면에서 합집합으로 계산한다.
  related:
  - FN-109
  status: 해결
  raised: 2026-09-03
- id: IS-037
  type: 확인 필요
  document: DOC-04
  title: 주문 미응답 제한 시간
  detail: 1분으로 확정했다. 초과하면 주문을 자동 취소한다. FL-203에 반영했다.
  related:
  - FL-203
  status: 해결
  raised: 2026-09-04
- id: IS-038
  type: 확인 필요
  document: DOC-04
  title: 키오스크 서명 대상 금액 기준
  detail: 5만원 이상으로 확정했다. FL-401에 반영했다.
  related:
  - FL-401
  status: 해결
  raised: 2026-09-04
- id: IS-018
  type: 확인 필요
  document: DOC-03
  title: 한 매장이 여러 브랜드를 운영하는지
  detail: 한 브랜드가 여러 매장을 운영하는 구조로 확정했다. 매장은 브랜드 하나에 속한다. 현재 구조 그대로다.
  related: []
  status: 해결
  raised: '2026-09-04'
- id: IS-019
  type: 확인 필요
  document: DOC-03
  title: 메뉴의 관리 주체
  detail: 브랜드가 카테고리와 메뉴를 소유하고 매장이 참조하는 구조로 확정했다. 생성은 본사만 하고, 매장 통제로 지정된 매장은 자기 매장의 판매가와 노출 여부, 품절 상태만 바꾼다. 02 문서 3.2와 03 문서 7절에 반영했다.
  related: []
  status: 해결
  raised: '2026-09-04'
- id: IS-020
  type: 확인 필요
  document: DOC-01
  title: 현재 운영의 기준값
  detail: 현재 운영의 기준값을 확보할 수 없으므로 구축과 함께 측정을 시작하는 방식으로 바꿨다. 01 문서에 측정 항목 4건과 비교 시점을 정의했다. 첫 행사를 기준값 회차로 본다.
  related: []
  status: 해결
  raised: '2026-09-04'
- id: IS-021
  type: 의사결정 필요
  document: DOC-02
  title: 품절과 노출의 축 분리
  detail: 품절로 설정한 메뉴는 주문 채널 목록에서 제외하는 것으로 확정했다. 표시 후 선택을 막는 방식을 쓰지 않는다. 본사와 매장 모두 설정할 수 있고 뒤에 설정한 값이 적용된다. DC-007로 등록했고 02 문서 3.13에 반영했다.
  related:
  - FN-113
  - FN-206
  - FL-128
  - FL-907
  status: 해결
  raised: '2026-09-04'
- id: IS-022
  type: 확인 필요
  document: DOC-02
  title: 취소와 환불의 매출 계상 일자
  detail: 매입 후 취소는 취소 일자에 별도 거래로 기록되고 원거래 일자로 소급되지 않는 것을 결제대행사 문서로 확인했다. 매입 전 승인취소는 원거래가 매출로 확정되지 않는다. 02 문서 3.11에 반영했다.
  related:
  - FN-114
  - FN-115
  status: 해결
  raised: '2026-09-04'
- id: IS-023
  type: 확인 필요
  document: DOC-02
  title: VAN사 기술 규격
  detail: VAN사 규격에 맡길 수 없는 항목을 우리 쪽 기준으로 정했다. 망취소 재시도 3회, 간격 1초와 3초와 5초, 승인 대기 30초, 실패 시 보류 기록이다. VAN사 계약 시 확인할 항목 5건도 02 문서 3.21에 정리했다.
  related:
  - FN-405
  - FL-904
  status: 해결
  raised: '2026-09-04'
- id: IS-024
  type: 확인 필요
  document: DOC-02
  title: 결제대행사 정산 조건
  detail: 정산 주기가 계약 사항임을 확인했다. 계약 시 확인할 항목 7건을 02 문서 3.20에 정리했다. 정산 예정일은 결제대행사 값을 그대로 쓰고 대사는 API와 파일 두 방식을 모두 받을 수 있게 설계한다.
  related:
  - FN-114
  status: 해결
  raised: '2026-09-04'
- id: IS-025
  type: 확인 필요
  document: DOC-08
  title: 정산 대사 기능과 화면
  detail: 정산 대사 기능 FN-120과 화면 ADM-RECN-LIST, ADM-RECN-DIFF를 정의했다. Flow FL-141, FL-142를 작성했다. 1만 건 초과 시 파일 수신으로 전환한다.
  related:
  - FN-114
  status: 해결
  raised: '2026-09-04'
- id: IS-026
  type: 확인 필요
  document: DOC-08
  title: 비기능 요구사항
  detail: 비기능 요구사항 40건을 01 문서 8절에 정의했다. 성능, 용량, 가용성, 결제 시간 제약, 보안, 보관과 파기, 접근성으로 나눴다. 근거가 있는 값과 자체 판단으로 정한 값을 구분해 표기했다. 조사 근거는 research/비기능요구사항_조사.md 에 있다.
  related: []
  status: 해결
  raised: '2026-09-04'
- id: IS-027
  type: 확인 필요
  document: DOC-08
  title: 비밀번호 재설정 경로
  detail: 비밀번호 재설정 기능 FN-210과 화면 STR-AUTH-RESET, Flow FL-229를 정의했다. 아이디와 등록된 휴대폰번호로 본인을 확인한다. 02 문서 3.14에 계정 정책을 정리했다.
  related:
  - FN-116
  - FN-201
  status: 해결
  raised: '2026-09-04'
- id: IS-028
  type: 확인 필요
  document: DOC-08
  title: 메뉴 가져오기
  detail: 메뉴 가져오기 기능 FN-211과 화면 STR-MENU-IMPT, Flow FL-230을 정의했다. 판매가는 복사하지 않는다. 02 문서 3.16에 기준을 정리했다.
  related:
  - FN-107
  status: 해결
  raised: '2026-09-04'
- id: IS-029
  type: 확인 필요
  document: DOC-08
  title: 개인정보 파기
  detail: 개인정보 파기 기능 FN-123과 화면 ADM-PRIV-LIST, Flow FL-145를 정의했다. 일 배치로 실행하고 개인 식별 항목만 지운다. 02 문서 3.17에 기준을 정리했다.
  related:
  - FN-305
  status: 해결
  raised: '2026-09-04'
- id: IS-030
  type: 의사결정 필요
  document: DOC-08
  title: 표시 정보 검수 주체
  detail: 표시 정보 검수를 두기로 했다. 기능 FN-124와 화면 ADM-CHEK-LIST, Flow FL-146을 정의했다. 미검수 판매는 막지 않고 검수 대기 건을 대시보드에 표시한다. 02 문서 3.15에 기준을 정리했다.
  related:
  - FN-109
  - FN-110
  status: 해결
  raised: '2026-09-04'
- id: IS-031
  type: 의사결정 필요
  document: DOC-08
  title: 매장 이관과 폐업 처리
  detail: 매장 상태값을 영업, 일시중지, 종료, 폐점 네 단계로 나눴다. 매장을 삭제하지 않고 코드도 재사용하지 않는다. 소속이 바뀌어도 과거 주문의 귀속을 바꾸지 않고, 주문에 발생 시점의 행사와 상권과 브랜드를 값으로 저장한다. 비교를 위해 현재 소속 기준 재집계를 선택 항목으로 제공한다. 02 문서 3.20에 정리했다.
  related:
  - FN-105
  status: 해결
  raised: '2026-09-04'
- id: IS-032
  type: 의사결정 필요
  document: DOC-08
  title: 조리 중 전환 방식
  detail: 접수 완료 후 1분이 지나면 시스템이 자동으로 조리 중으로 바꾼다. 매장이 조작하지 않는다. 취소 가능 시간은 접수 완료 후 1분으로 고정되며 매장마다 달라지지 않는다. 02 문서 2.10에 기준을 정리했다.
  related:
  - FN-207
  status: 해결
  raised: '2026-09-04'
- id: IS-033
  type: 의사결정 필요
  document: DOC-08
  title: 본사의 단말 조작 범위
  detail: 본사는 전체 조회와 사용 중지, 사용 재개까지 한다. 등록과 수정, 삭제는 매장이 한다. 본사가 중지할 때 사유를 필수로 입력하고 매장에 통지한다. 중지한 쪽이 재개하므로 본사가 막은 단말은 매장이 풀 수 없다. 02 문서 2.23에 기준을 정리했다.
  related:
  - FN-213
  - FN-214
  - FN-409
  status: 해결
  raised: '2026-09-04'
- id: IS-034
  type: 확인 필요
  document: DOC-08
  title: 조리 시작 이후 환불 경로
  detail: 조리 시작 이후에는 주문 취소 기능을 제공하지 않는다. 환불 여부는 매장이 현장에서 판단한다. 플랫폼은 환불 요청 화면과 승인 절차를 두지 않는다. 매장이 환불하기로 정하면 카드 단말이나 키오스크 관리자 모드에서 결제 취소로 처리한다.
  related:
  - FN-207
  status: 해결
  raised: '2026-09-04'
- id: IS-035
  type: 의사결정 필요
  document: DOC-05
  title: 이상 항목의 알림 발송 여부
  detail: 단말 미연결만 알림으로 보낸다. 30분에 매장, 60분에 본사로 2단계로 나눈다. 접수 지연과 매출 급락과 품절 급증은 화면에만 둔다. 받는 사람이 취할 조치가 없기 때문이다. 같은 행사에서 5분 안에 3건 이상이면 묶어서 보내고, 행사 영업시간 안에만 발송한다. 02 문서 2.24에 기준을 정리했다.
  related:
  - FN-101
  - FN-409
  status: 해결
  raised: '2026-09-04'
- id: IS-036
  type: 확인 필요
  document: DOC-02
  title: 표시 정보 검수 폐지에 따른 책임 명시
  detail: 조사 결과 원산지와 알레르기 표시 의무자는 조리·판매하는 매장이며 과태료도 매장에 부과된다. 플랫폼에는 식품 표시 법령상 의무가 없고 전자상거래법상 중개자 고지 의무와 연대 배상 책임만 남는다. 계약서에 표시 의무와 과태료 부담 주체를 매장으로 명시하고, 주문 화면에 등록 주체를 고지하며, 안내 이력을 남긴다. 근거는 research/표시책임_조사.md에 있다.
  related: []
  status: 해결
  raised: '2026-09-07'
- id: IS-039
  type: 확인 필요
  document: DOC-05
  title: 상권을 가로지르는 매장 검색 경로
  detail: 대시보드에 전역 매장 검색을 두지 않는다. 매출 조회의 매장 조건을 드롭다운에서 이름·사업자번호 검색으로 바꿔 그 경로로 처리한다. 상권을 모르는 조회는 매출과 정산 문의 대응에서 생기며 그 진입점이 매출 조회다. 검색 화면을 따로 두면 매장 관리 경로가 둘이 된다.
  related:
  - ADM-ZONE-DETAIL
  - ADM-HOME-MAIN
  status: 해결
  raised: 2026-09-08
- id: IS-040
  type: 가정
  document: DOC-07
  title: 상권 담당 계정이 여러 명인 경우
  detail: 상권 등록에서는 담당 계정을 한 건만 발급한다. 담당자가 여러 명이면 시스템 > 관리자에서 계정을 추가한다. 상권 등록 화면에 계정을 여러 개 만드는 구성은 두지 않는다.
  related:
  - ADM-ZONE-FORM
  - ADM-USER-FORM
  status: 해결
  raised: 2026-09-08
- id: IS-041
  type: 가정
  document: DOC-05
  title: 브랜드 관리 주체
  detail: 브랜드는 매장 등록 시 이름으로 만들고 본사 운영자가 관리한다. 별도 브랜드 화면과 선택 전용 제약을 두지 않는다. 입력 주체가 본사 운영자 한 곳이므로 이름이 갈라질 위험을 관리로 감당한다.
  related:
  - ADM-ZONE-FORM
  - FN-119
  status: 해결
  raised: 2026-09-08
- id: IS-042
  type: 확인 필요
  document: DOC-05
  title: 매점 정보 변경 요청을 본사가 확정하는 화면
  detail: 본사 확정을 두지 않기로 했다. 매장이 자율로 바꾸고 변경 이력만 남긴다. 이력은 상권 등록·수정의 히스토리 탭에서 본다. 사업자 정보와 정산계좌도 매장이 직접 바꾸며 누가 언제 무엇을 바꿨는지 기록으로 추적한다.
  related:
  - STR-INFO-FORM
  - ADM-ZONE-FORM
  status: 해결
  raised: 2026-09-08
- id: IS-043
  type: 의사결정 필요
  document: DOC-02
  title: 매장 미응답 제한 시간
  detail: 5분으로 정했다. 픽업만 다루는 토스오더가 5분을 쓰고 조건이 같다. 배민스토어 15분은 배달 기준이라 길다. 접수 화면에 남은 시간을 표시하고 1분 남으면 붉게 바꾼다. 근거는 research/주문흐름_대조.md.
  related:
  - FL-203
  - FL-903
  status: 해결
  raised: 2026-09-09
- id: IS-044
  type: 의사결정 필요
  document: DOC-04
  title: 예상 준비 시간을 정하는 주체와 시점
  detail: 두 곳에서 정한다. 매장이 매점 정보에 기본 준비 시간을 미리 두고 고객이 결제하기 전에 이 값을 안내한다. 매장이 접수할 때 5, 10, 15, 20, 30분에서 다시 고르고 그 값을 고객에게 알린다. 준비 시간은 상태를 바꾸지 않는다.
  related:
  - FL-203
  - FL-314
  - WEB-ORDR-DONE
  status: 해결
  raised: 2026-09-09
- id: IS-045
  type: 의사결정 필요
  document: DOC-04
  title: 미수령 주문 처리
  detail: 영업 종료 한 시간 뒤 배치가 조리 완료 주문을 수령 완료로 바꾸고 수령 구분을 미수령으로 남긴다. 결제는 취소하지 않는다. 매장이 만들어 둔 음식이므로 매출과 정산에 그대로 들어간다. 배치 순서는 FL-146.
  related:
  - FL-203
  - FL-302
  status: 해결
  raised: 2026-09-09
- id: IS-046
  type: 의사결정 필요
  document: DOC-04
  title: 매장 거절 사유
  detail: 품절, 재료 소진, 마감, 기타 넷으로 받는다. 품절과 재료 소진은 그 메뉴를 품절로 바꿀지 함께 묻는다. 마감은 영업 상태를 일시중지로 바꿀지 묻는다. 고객에게는 사유를 문구로 바꿔 보내고 매장 사정을 그대로 노출하지 않는다. 사유는 본사 통계에서 매장별로 본다.
  related:
  - FL-203
  - FL-903
  - STR-ORDR-LIST
  status: 해결
  raised: 2026-09-09
- id: IS-047
  type: 확인 필요
  document: DOC-02
  title: 개인정보 처리방침 본문
  detail: 개인정보보호위원회 작성지침(2025.4.)의 항목과 순서를 따라 02 문서 2.10.4에 담을 내용을 정했다. 처리 목적, 처리 항목, 보유 기간, 파기 절차, 제3자 제공, 위탁, 안전성 확보조치, 보호책임자, 권리와 행사 방법이다. 14세 미만 아동, 추가적인 이용·제공, 국외 이전, 민감정보, 가명정보는 해당하지 않아 적지 않는다. 최종 문구와 보호책임자 지정은 법률 검토로 확정한다.
  related:
  - WEB-INFO-SELL
  status: 해결
  raised: 2026-09-09
- id: IS-048
  type: 확인 필요
  document: DOC-02
  title: 이용약관 본문
  detail: 공정거래위원회 전자상거래 표준약관을 바탕으로 02 문서 2.10.4에 담을 조항 열 가지를 정했다. 배송과 회원 가입, 포인트 조항은 뺀다. 주문은 매장이 접수한 때 성립한다. 미수령을 환불하지 않는 것은 고객에게 불리한 조항이므로 약관과 결제 전 화면에 함께 적는다. 약관 변경은 시행일 7일 전, 불리한 변경은 30일 전에 알린다. 최종 문구는 법률 검토로 확정한다.
  related:
  - WEB-INFO-SELL
  status: 해결
  raised: 2026-09-09
- id: IS-049
  type: 확인 필요
  document: DOC-02
  title: 위치기반서비스사업 신고
  detail: 신고 대상으로 보고 갖추기로 정했다. 면제 여부를 다투지 않는다. 판단이 갈리는 상태로 열면 동의 없이 위치정보를 수집·이용한 것이 되어 5년 이하 징역 또는 5천만원 이하 벌금까지 갈 수 있고, 신고와 그에 따른 의무를 갖추는 비용이 그 위험보다 작다. 본사가 방송통신위원회에 신고하고 위치정보관리책임자를 지정한다. 이용약관에 위치정보 조항을 두고 권한을 요청하기 전에 별도로 동의를 받는다. 반경 판정은 단말에서 하고 좌표를 서버로 보내지 않으므로 보관할 이용·제공 사실 확인자료가 없다. 내용은 02 문서 2.10.2에 있다.
  related:
  - FL-310
  - WEB-STOR-ENTRY
  status: 해결
  raised: 2026-09-09
- id: IS-050
  type: 확인 필요
  document: DOC-02
  title: 알림톡 템플릿 문구
  detail: 02 문서 2.10.4에 접수, 거절, 준비 완료, 미수령 마감 네 가지 문구를 정했다. 기본형을 쓰고 주문번호와 매장명, 상태만 알린다. 광고를 붙이지 않고 주문 조회는 웹링크 버튼으로 둔다. 본문 1,000자, 변수 40개 이하 규격을 지킨다. 카카오 심사를 받아야 한다.
  related:
  - STR-NOTI-LIST
  - FL-903
  status: 해결
  raised: 2026-09-09
- id: IS-051
  type: 의사결정 필요
  document: DOC-02
  title: 매장과 고객 사이 분쟁에서 본사의 역할
  detail: 전자상거래법 제20조의2 제3항이 통신판매중개자에게 분쟁 해결을 위해 원인과 피해를 파악하는 등 필요한 조치를 신속히 시행하도록 한다. 선택이 아니라 의무다. 02 문서 2.10.5에 절차를 두었다. 주문 기록을 확인해 원인을 판정하고, 시스템 문제는 아이오더가, 매장 문제는 매장에 확인을 요청해 결과를 알린다. 접수 창구는 본사 대표 연락처, 처리 기한은 3영업일이다.
  related:
  - WEB-INFO-SELL
  status: 해결
  raised: 2026-09-09
- id: IS-052
  type: 의사결정 필요
  document: DOC-05
  title: 매장을 등록하는 화면이 없다
  detail: 가맹 어드민 설정 > 매장에 매장 목록과 매장 등록·수정 화면을 두었다. 담당 상권의 매장을 만들고 폐점한다. 지점번호는 자동으로 붙고 매장명은 브랜드명과 지점번호로 만든다. 정산계좌와 사업자 정보는 상권의 것을 잇는다. 폐점은 되돌릴 수 없고 연결 단말은 사용 중지로 바뀐다. 순서는 FL-234.
  related:
  - FN-104
  - REQ-004
  status: 해결
  raised: 2026-09-09
- id: IS-053
  type: 확인 필요
  document: DOC-03
  title: 매장의 소속 행사를 정하는 시점
  detail: 매장을 등록할 때 상권의 참여 행사 중 진행 전·진행 중인 것에서 고른다. 필수다. 주문이 하나도 없는 매장만 소속 행사를 바꿀 수 있다. 매장이 속한 행사는 상권에서 뗄 수 없고 행사가 끝나 매장이 정리된 뒤에 뗀다. 이 규칙으로 주문 → 매장 → 행사가 하나로 정해진다.
  related:
  - FN-104
  - ADM-SALE-LIST
  status: 해결
  raised: 2026-09-09
- id: IS-054
  type: 의사결정 필요
  document: DOC-02
  title: 매장 개설 절차
  status: 해결
  raised: 2026-09-09
  resolved: 2026-09-09
  detail: 가맹 관리자가 등록하면 개설 준비, 본사가 결제대행사 하위가맹점 심사 결과로 개시를 확정하면 영업으로 정했다. 배달앱 입점·프랜차이즈 개설·축제 부스 선정이 모두 "정보는 매장이 내고 돈이 걸린 확정은 주최가 한다"는 모양이라 그대로 따랐다. 확정 전에는 채널 비노출·정산 제외·소속 행사 변경 가능, 확정 후 잠금. 근거는 research/매장개설_조사.md.
