nfrs:
- id: NFR-01
  title: 웹앱 최대 콘텐츠 표시 시간
  area: 성능
  criterion: 2.5초 이내. 75 백분위
  basis: Core Web Vitals
- id: NFR-02
  title: 웹앱 상호작용 응답
  area: 성능
  criterion: 200밀리초 이내. 75 백분위
  basis: Core Web Vitals
- id: NFR-03
  title: 웹앱 누적 레이아웃 이동
  area: 성능
  criterion: 0.1 이하. 75 백분위
  basis: Core Web Vitals
- id: NFR-04
  title: 서버 첫 바이트 도착
  area: 성능
  criterion: 0.8초 이내
  basis: Core Web Vitals 보조 지표
- id: NFR-05
  title: 주문 API 응답
  area: 성능
  criterion: 평시 95 백분위 500밀리초, 피크 1초
  basis: 자체 판단
- id: NFR-06
  title: 키오스크 화면 전환
  area: 성능
  criterion: 300밀리초 이내
  basis: 자체 판단
- id: NFR-07
  title: 매출 조회 응답
  area: 성능
  criterion: 3초 이내
  basis: 자체 판단
- id: NFR-08
  title: 동시 사용자 산정
  area: 용량
  criterion: 행사 예상 참가자의 20퍼센트
  basis: 정보시스템 하드웨어 규모산정 지침의 일반값
- id: NFR-09
  title: 주문 1건당 트랜잭션
  area: 용량
  criterion: 4건으로 산정
  basis: 같은 지침의 단순 업무 계수
- id: NFR-10
  title: 키오스크 메뉴 항목
  area: 용량
  criterion: 매장당 100개 이하 권장
  basis: 조사한 제품이 초과 시 동기화 지연을 안내한다
- id: NFR-11
  title: 행사 운영시간 가용률
  area: 가용성
  criterion: 99.9퍼센트
  basis: 자체 판단
- id: NFR-12
  title: 월간 가용률
  area: 가용성
  criterion: 99.5퍼센트
  basis: 자체 판단
- id: NFR-13
  title: 복구 목표 시간
  area: 가용성
  criterion: 30분
  basis: 자체 판단. 공공 A2등급보다 강화
- id: NFR-14
  title: 복구 목표 시점
  area: 가용성
  criterion: 5분
  basis: 자체 판단
- id: NFR-15
  title: 결제 승인 요청 시한
  area: 결제 시간 제약
  criterion: 인증 후 10분 이내
  basis: 결제대행사 규격
- id: NFR-16
  title: 결제 API 연결 제한시간
  area: 결제 시간 제약
  criterion: 5초
  basis: 결제대행사 규격
- id: NFR-17
  title: 결제 API 읽기 제한시간
  area: 결제 시간 제약
  criterion: 60초
  basis: 결제대행사 규격
- id: NFR-18
  title: 멱등키 유효기간
  area: 결제 시간 제약
  criterion: 15일
  basis: 결제대행사 규격
- id: NFR-19
  title: 웹훅 응답
  area: 결제 시간 제약
  criterion: 10초 이내
  basis: 결제대행사 규격
- id: NFR-20
  title: 단말 승인 대기
  area: 결제 시간 제약
  criterion: 30초. 초과 시 망취소
  basis: 자체 판단
- id: NFR-21
  title: 관리자 계정
  area: 보안
  criterion: 취급자별 개별 발급. 공유 금지
  basis: 개인정보의 안전성 확보조치 기준 제5조 제4항
- id: NFR-22
  title: 비밀번호 저장
  area: 보안
  criterion: 복호화되지 않는 일방향 암호화
  basis: 같은 기준 제7조 제1항
- id: NFR-23
