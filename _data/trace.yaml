decisions:
- id: DC-001
  title: 결제·정산 계약 구조
  status: 미결
  requirements: []
- id: DC-002
  title: 메뉴 마스터의 위치와 충돌 처리
  status: 미결
  requirements: []
- id: DC-003
  title: 메뉴 변경의 채널 반영 시점
  status: 미결
  requirements: []
- id: DC-004
  title: 주문 접수 화면의 위치
  status: 미결
  requirements: []
- id: DC-005
  title: 메뉴 배포 승인 절차를 두지 않는다
  status: 확정
  requirements: []
- id: DC-006
  title: 알레르기 정보는 메뉴 단위로 등록하고 옵션 영향 시 상품을 복제한다
  status: 확정
  requirements: []
- id: DC-007
  title: 품절 메뉴의 노출 처리
  decision: 품절로 설정한 메뉴는 주문 채널 목록에서 제외한다. 표시 후 선택을 막는 방식을 쓰지 않는다.
  reason: 행사 매장은 회차마다 품절이 잦다. 표시된 메뉴를 선택했다가 막히는 경험이 반복되면 주문 속도가 떨어진다.
  requirements:
  - REQ-013
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-008
  title: 메뉴 관리 주체와 배포 폐지
  decision: 메뉴, 카테고리, 옵션, 판매가, 표시 정보, 품절을 매장이 직접 관리한다. 본사는 메뉴를 만들지 않으며 배포 절차를 두지 않는다.
  reason: 매장이 자기 메뉴를 직접 관리하는 편이 운영에 맞다. 본사가 만들지 않으므로 내려보낼 것이 없어 배포가 필요 없다.
  requirements:
  - REQ-006
  - REQ-007
  - REQ-008
  - REQ-009
  - REQ-010
  - REQ-013
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-009
  title: 하이브리드 웹앱의 매장 진입
  decision: QR에 담긴 매장으로 바로 진입한다. 매장 선택 화면을 두지 않는다.
  reason: 매장을 고르는 절차가 없으면 잘못된 매장에 주문하는 일이 생기지 않는다.
  requirements:
  - REQ-014
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-010
  title: 매장 수명주기
  decision: 매장을 삭제하지 않는다. 상태를 영업, 일시중지, 종료, 폐점 네 단계로 나누고 매장 코드를 재사용하지 않는다.
  reason: 조사한 8개 제품 중 삭제가 가능한 것은 하나뿐이고 법령이 거래 기록을 5년 보존하도록 요구한다.
  requirements:
  - REQ-005
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-011
  title: 매출의 소속 귀속
  decision: 주문에 발생 시점의 행사와 상권과 브랜드를 값으로 저장한다. 매장 소속이 바뀌어도 과거 주문의 귀속을 바꾸지 않는다. 현재 소속 기준 재집계는 선택 항목으로 제공한다.
  reason: 소급하면 종료된 행사의 실적이 사후에 바뀐다. 비교 목적의 재집계 요구는 회계기준이 인정하므로 선택으로 둔다.
  requirements:
  - REQ-023
  - REQ-024
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-012
  title: 조리 중 전환 방식
  decision: 접수 완료 후 1분이 지나면 시스템이 자동으로 조리 중으로 바꾼다. 매장이 조작하지 않는다.
  reason: 매장 조작에 맡기면 전환 시점이 매장마다 달라지고 취소 가능 구간도 함께 달라진다. 시간 기준으로 고정한다.
  requirements:
  - REQ-029
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-013
  title: 조리 시작 이후 환불
  decision: 조리 중부터는 주문 취소 기능을 제공하지 않는다. 환불 여부는 매장이 현장에서 판단한다. 플랫폼은 환불 요청 화면과 승인 절차를 두지 않는다.
  reason: 조리가 시작되면 원재료 손실이 확정된다. 환불 판단은 매장의 손익 문제이므로 플랫폼이 대신 정하지 않는다.
  requirements:
  - REQ-029
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-014
  title: 본사의 단말 조작 범위
  decision: 본사는 전체 조회와 사용 중지, 사용 재개까지 한다. 등록과 수정, 삭제는 매장이 한다. 중지한 쪽이 재개한다.
  reason: 오작동 단말이 주문을 계속 받으면 결제가 쌓인 채 처리되지 않는다. 매장에 연락이 닿지 않는 시간대가 있으므로 본사가 직접 멈출 수 있어야 한다.
  requirements:
  - REQ-034
  - REQ-047
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-015
  title: 이상 알림 발송 범위
  decision: 단말 미연결만 보낸다. 30분에 매장, 60분에 본사로 나눈다. 나머지 이상 유형은 화면에만 둔다.
  reason: 받는 사람이 취할 구체적 조치가 있는 건만 보낸다. EEMUA 191은 운영자 1명당 10분에 1건을 넘지 않도록 권고한다.
  requirements:
  - REQ-048
  decided_by: 기획 담당
  date: '2026-09-04'
- id: DC-016
  title: 표시 정보 검수 폐지
  decision: 본사 검수 절차를 두지 않는다. 매장이 입력하고 시스템이 필수 항목 누락만 막는다. 표시 내용의 정확성은 매장 책임이다.
  reason: 개시 직전 수백 건이 몰리고 본사가 원산지의 사실 여부를 확인할 방법이 없다. 확인하지 못한 것을 확인한 것처럼 기록하면 책임 소재만 흐려진다.
  requirements: []
  decided_by: 기획 담당
  date: '2026-09-07'
