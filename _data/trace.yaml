  title: 단말기 등록
  users:
  - UT-02
  requirements:
  - REQ-047
  description: 매장에서 쓰는 키오스크, 카드 단말, 주문서 프린터를 등록하고 연결한다
- id: FN-214
  title: 단말기 상태 확인
  users:
  - UT-02
  requirements:
  - REQ-047
  description: 등록한 단말의 연결 상태와 마지막 통신 시각을 확인한다
- id: FN-412
  title: 판매 메뉴 설정
  users:
  - UT-02
  requirements:
  - REQ-033
  description: 그날 판매할 메뉴를 단말에서 열고 닫는다. 매장별 메뉴 설정의 노출 여부를 바꿔 다른 채널에도 함께 적용한다
- id: FN-125
  title: 이상 알림 발송
  users:
  - UT-01
  - UT-02
  requirements:
  - REQ-048
  description: 단말 미연결이 30분을 넘기면 매장에, 60분을 넘기면 본사에 알린다
- id: FN-126
  title: 업체별 정산 조회
  users:
  - UT-01
  requirements:
  - REQ-049
  description: 결제대행사 지급 내역을 업체 단위로 조회한다. 플랫폼이 정산금액을 계산하지 않는다
- id: FN-127
  title: 오류 로그 조회
  users:
  - UT-01
  requirements:
  - REQ-050
  description: 배치와 알림 발송과 외부 연동 오류를 한곳에서 조회하고 확인 처리한다
- id: FN-128
  title: 행사 준비 현황
  users:
  - UT-01
  requirements:
  - REQ-051
  description: 행사에 속한 상권과 업체, 개시 준비 상태를 한 화면에서 확인하고 미완료 업체에 안내를 보낸다
- id: FN-130
  title: 매장 일괄 등록
  users:
  - UT-01
  requirements:
  - REQ-053
  description: 파일로 매장을 한 번에 등록한다. 검증에 실패한 행은 빼고 처리한다
