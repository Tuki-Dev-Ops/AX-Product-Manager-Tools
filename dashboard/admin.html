<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내부 어드민 화면 모음</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#F4F6F8; --surface:#FFFFFF; --line:#DCE3EA; --ink:#1A2530; --muted:#6B7784;
  --accent:#2A5D8F; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:14px/1.6 "IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif; }
header.top { position:sticky; top:0; z-index:50; background:var(--surface);
  border-bottom:1px solid var(--line); padding:14px 26px; display:flex; align-items:center; gap:14px; }
header.top h1 { margin:0; font-size:15px; font-weight:600; }
header.top em { font-style:normal; font-family:var(--mono); font-size:11.5px; color:var(--muted); }
header.top .sp { margin-left:auto; }
.zbtn { appearance:none; font:inherit; font-size:12px; padding:5px 11px; border-radius:5px;
  border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; }
.zbtn.on { background:var(--accent); border-color:var(--accent); color:#FFF; }
.wrap { padding:26px; display:flex; flex-direction:column; gap:34px; }
.grp { font-size:12px; letter-spacing:.05em; color:var(--muted); border-top:1px solid var(--line);
  padding-top:18px; margin-bottom:-16px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:8px;
  box-shadow:0 1px 2px rgba(28,39,51,.05); overflow:hidden; }
.cap { display:flex; align-items:baseline; gap:10px; padding:13px 18px;
  border-bottom:1px solid var(--line); }
.cap b { font-size:13.5px; font-weight:600; }
.cap i { font-style:normal; font-family:var(--mono); font-size:11px; color:var(--muted); }
.cap span { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted); }
.hold { padding:18px; overflow:auto; background:#F7F8FA; }
.hold > div { transform-origin:0 0; }
.wf-screen { background:#FFF; border:1px solid #8A96A3; position:relative;
  font:13px/1.55 "IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif; color:#2B3442; }
.wf-shell { display:flex; }
.wf-nav { width:232px; flex:none; background:#2B3442; color:#A9B6C4; }
.wf-brand { height:62px; display:flex; align-items:center; padding:0 22px;
  color:#FFF; font-weight:600; font-size:14px; }
.wf-nav ul { list-style:none; margin:18px 0 0; padding:0 10px; }
.wf-nav li { padding:11px 16px; border-radius:4px; font-size:12.5px; cursor:default; }
.wf-nav li.on { background:#3C4857; color:#FFF; font-weight:600;
  box-shadow:inset 3px 0 0 #8FB3D9; }
.wf-body { flex:1; min-width:0; display:flex; flex-direction:column; }
.wf-top { height:62px; display:flex; align-items:center; justify-content:flex-end;
  padding:0 26px; background:#FFF; border-bottom:1px solid #C7CFD8; font-size:11.5px; color:#6B7784; }
.wf-main { flex:1; padding:18px; background:#F7F8FA; }
.wf-screen > .wf-main { background:#FFF; }

.wf-h { display:flex; align-items:center; gap:12px; padding-bottom:12px;
  border-bottom:1px solid #C7CFD8; margin-bottom:14px; }
.wf-h h1 { margin:0; font-size:15px; font-weight:600; }
.wf-h .wf-btn { margin-left:auto; width:auto; max-width:none; height:38px; }
.wf-sub { margin:16px 0 8px; padding:8px 10px; background:#EEF2F6; border-radius:4px;
  font-size:11.5px; font-weight:600; color:#2B3442; }
.wf-tx { margin:6px 0; font-size:12px; color:#6B7784; }
.wf-note { margin:8px 0; padding:10px 12px; background:#F2F5F8; border:1px solid #E3E8ED;
  border-radius:4px; font-size:11px; color:#6B7784; }
.wf-note::before { content:"(!) "; }
.wf-err { margin:6px 0 2px; font-size:11px; color:#B4444A; }
.wf-err::before { content:"! "; font-weight:600; }
.wf-hr { border:0; border-top:1px solid #C7CFD8; margin:12px 0; }
.wf-sp { height:14px; }
.wf-page { text-align:center; padding:14px 0; font-size:12px; color:#6B7784; }
.wf-big { width:200px; margin:6px auto; padding:22px 0; border:1.4px solid #8A96A3;
  border-radius:4px; text-align:center; font-size:40px; font-weight:600; }
.wf-li { margin:4px 0; padding-left:14px; font-size:12px; position:relative; }
.wf-li::before { content:""; position:absolute; left:2px; top:9px; width:5px; height:5px;
  border-radius:50%; background:#6B7784; }
.wf-lines i { display:block; height:1px; margin:12px 0; border-top:1px dashed #C7CFD8; }
.wf-lines i:last-child { width:60%; }

.wf-row { display:flex; gap:12px; align-items:flex-end; margin:0 0 16px; }
.wf-c:empty { pointer-events:none; }
.wf-c { min-width:0; flex:0 1 auto; }
.wf-fld { display:block; width:220px; }
.wf-fld > b { display:block; font-size:12px; font-weight:600; margin:0 0 7px; color:#2B3442;
  letter-spacing:-.1px; }
.wf-req { color:#B4444A; }
.wf-in { display:flex; align-items:center; gap:6px; height:40px; padding:0 11px; width:220px;
  border:1px solid #D5DBE1; border-radius:4px; background:#FFF; font-size:12px; color:#7C8794;
  transition:border-color .12s; }
.wf-in > span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wf-in .wf-val { font-weight:400; font-size:11.5px; color:#2B3442; }
.wf-in.on { border-color:#2A5D8F; box-shadow:0 0 0 2px rgba(42,93,143,.10); color:#2B3442; }
.wf-in.bad { border-color:#B4444A; box-shadow:0 0 0 2px rgba(180,68,74,.10); color:#2B3442; }
.wf-in.off { background:#F2F5F8; border-color:#E3E8ED; color:#A9B3BD; }
.wf-caret { width:9px; height:9px; border-right:1.3px solid #6B7784;
  border-bottom:1.3px solid #6B7784; transform:rotate(45deg) translate(-2px,-2px); flex:none; }
.wf-cal { width:15px; height:15px; border:1.3px solid #6B7784; border-top-width:5px;
  border-radius:1px; flex:none; }
.wf-mag { width:11px; height:11px; border:1.3px solid #6B7784; border-radius:50%;
  flex:none; position:relative; }
.wf-mag::after { content:""; position:absolute; right:-4px; bottom:-3px; width:5px; height:1.3px;
  background:#6B7784; transform:rotate(45deg); }

.wf-btn { height:40px; padding:0 18px; width:120px; display:block; border:1px solid #8A96A3; border-radius:3px;
  background:#FFF; color:#2B3442; font:inherit; font-size:11.5px; width:100%; cursor:default; }
.wf-pri { background:#4A5560; border-color:#4A5560; color:#FFF; }
.wf-btn[disabled] { background:#EDF0F3; border-color:#C7CFD8; color:#C7CFD8; }

.wf-opt { display:flex; align-items:center; gap:8px; height:30px; font-size:12px; }
.wf-chk, .wf-rad { width:14px; height:14px; border:1px solid #8A96A3; background:#FFF;
  border-radius:2px; flex:none; display:inline-block; }
.wf-rad { border-radius:50%; }

.wf-stat { border:1px solid #C7CFD8; border-radius:3px; padding:12px 14px; background:#FFF; }
.wf-stat b { display:block; font-size:11px; font-weight:400; color:#6B7784; }
.wf-stat strong { display:block; margin-top:8px; font-size:16px; font-weight:600; }

.wf-img, .wf-box { display:flex; align-items:center; justify-content:center;
  border:1px solid #8A96A3; font-size:11px; color:#6B7784; }
.wf-img { background:#FFF; background-image:
  linear-gradient(to bottom right, transparent 49.6%, #C7CFD8 49.6%, #C7CFD8 50.4%, transparent 50.4%),
  linear-gradient(to bottom left, transparent 49.6%, #C7CFD8 49.6%, #C7CFD8 50.4%, transparent 50.4%); }
.wf-img span { background:#FFF; padding:0 6px; }
.wf-box { background:#EDF0F3; }

.wf-tbl { width:100%; border-collapse:collapse; margin:0 0 16px; font-size:11.5px; }
.wf-tbl th { background:#D7DDE4; color:#2B3442; font-weight:600; text-align:left;
  padding:12px; border-bottom:1px solid #C7CFD8; }
.wf-tbl td { padding:12px; color:#6B7784; border-bottom:1px solid #C7CFD8; }
.wf-tbl .wf-num { text-align:right; }
.wf-tbl .wf-chkcol { width:44px; text-align:center; }

.wf-tabs { display:flex; gap:6px; margin:0 0 12px; }
.wf-tab { padding:9px 14px; border:1px solid #C7CFD8; border-radius:3px; background:#FFF;
  font:inherit; font-size:11.5px; color:#2B3442; cursor:default; }
.wf-tab.on { background:#D7DDE4; font-weight:600; }

.wf-key { display:grid; grid-template-columns:repeat(3,70px); gap:8px; justify-content:center; }
.wf-key button { height:42px; border:1px solid #8A96A3; border-radius:3px; background:#FFF;
  font:inherit; font-size:13px; cursor:default; }

.wf-center { display:flex; align-items:center; justify-content:center; min-height:900px; }
.wf-form { width:100%; }
.wf-split { display:flex; min-height:1028px; }
.wf-imgpane { width:52%; flex:none; display:flex; align-items:center; justify-content:center;
  background:#E7EBEF; color:#6B7784; font-size:11px; background-image:
  linear-gradient(to bottom right, transparent 49.8%, #CBD4DC 49.8%, #CBD4DC 50.2%, transparent 50.2%),
  linear-gradient(to bottom left, transparent 49.8%, #CBD4DC 49.8%, #CBD4DC 50.2%, transparent 50.2%); }
.wf-split .wf-form { margin:auto; padding:0 40px; }
.wf-dim { position:absolute; inset:0; background:rgba(36,46,58,.42);
  display:flex; align-items:center; justify-content:center; }
.wf-modal { background:#FFF; border:1px solid #8A96A3; border-radius:4px; padding:18px;
  max-height:92%; overflow:auto; }

.wf-modal .wf-in, .wf-modal .wf-fld, .wf-form .wf-in, .wf-form .wf-fld { max-width:none; }

.wf-in.wf-q { width:320px; }
.wf-modal .wf-in, .wf-modal .wf-fld, .wf-form .wf-in, .wf-form .wf-fld { width:100%; }
.wf-modal .wf-c, .wf-form .wf-c { flex:1 1 0; }
.wf-modal .wf-c:has(.wf-btn), .wf-form .wf-c:has(.wf-btn) { flex:0 0 auto; }
.wf-c.wf-fx { flex:1 1 0; min-width:0; }
.wf-1 .wf-in, .wf-1 .wf-fld, .wf-1 .wf-btn { width:100%; }
.wf-r { justify-content:flex-end; }
.wf-narrow .wf-c { flex:1 1 0; }
.wf-narrow .wf-in, .wf-narrow .wf-fld, .wf-narrow .wf-btn { width:100%; }
.wf-cnt { margin:0; font-size:12.5px; color:#6B7784; text-align:right; white-space:nowrap;
  height:40px; line-height:40px; }
.wf-empty { display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; width:100%; min-height:230px; padding:30px 20px; color:#C7CFD8; text-align:center; }
.wf-empty b { font-size:13.5px; font-weight:600; color:#6B7784; }
.wf-empty span { font-size:12px; color:#98A4B0; }
.wf-modal .wf-box, .wf-form .wf-box { width:100%; }
.wf-box.wf-ta { display:block; padding:11px; border:1px solid #C7CFD8; border-radius:2px;
  background:#FFF; font-size:12px; color:#6B7784; text-align:left; }

/* 최소한의 시각 기준 */
.wf-btn { border-radius:4px; font-weight:500; }
.wf-btn.wf-pri { background:#2A5D8F; border-color:#2A5D8F; color:#FFF; }
.wf-btn[disabled] { background:#F2F5F8; border-color:#E3E8ED; color:#A9B3BD; }
.wf-h .wf-btn { background:#2A5D8F; border-color:#2A5D8F; color:#FFF; }
.wf-tab.on { background:#2A5D8F; border-color:#2A5D8F; color:#FFF; }
.wf-box.wf-ta { border-radius:4px; }
.wf-fld:has(.wf-in.bad) > b { color:#B4444A; }
.wf-toast { position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
  padding:11px 22px; border-radius:6px; background:rgba(29,37,47,.92); color:#FFF;
  font-size:12px; white-space:nowrap; z-index:5; }
.wf-menu { width:200px; margin:0; padding:5px 4px; list-style:none; background:#FFF;
  border:1px solid #D5DBE1; border-radius:4px; box-shadow:0 6px 16px rgba(29,37,47,.10); }
.wf-menu li { padding:0 9px; height:32px; line-height:32px; border-radius:3px; font-size:12px; }
.wf-menu li.on { background:#EAF1F8; color:#2A5D8F; font-weight:600; }
.wf-dp { width:260px; padding:10px 12px 14px; background:#FFF; border:1px solid #D5DBE1;
  border-radius:4px; box-shadow:0 6px 16px rgba(29,37,47,.10); }
.wf-dp header { display:flex; align-items:center; justify-content:space-between; height:28px;
  font-size:12px; color:#6B7784; }
.wf-dp header b { font-size:13px; font-weight:600; color:#2B3442; }
.wf-grid { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-top:6px; }
.wf-grid b { font-size:11px; font-weight:400; color:#98A4B0; line-height:24px; }
.wf-grid i { font-style:normal; font-size:11.5px; line-height:30px; color:#2B3442; }
.wf-grid i.on { background:#2A5D8F; color:#FFF; border-radius:50%; }


/* 폼 한 줄이 지나치게 길어지지 않게 */
.wf-modal .wf-fld, .wf-modal .wf-in, .wf-modal .wf-box, .wf-form .wf-fld, .wf-form .wf-in {
  max-width:none; }
/* 넓은 모달에서만 한 줄이 길어지지 않게 상한을 둔다 */
.wf-modal.wide .wf-fld, .wf-modal.wide .wf-in, .wf-modal.wide .wf-box { max-width:520px; }
.wf-modal .wf-c:has(.wf-btn) .wf-btn { max-width:none; }
/* 탭 상태 */
.wf-tab { border-radius:4px; }
.wf-tab.off { color:#A9B3BD; border-style:dashed; }
.wf-tab.bad { border-color:#B4444A; color:#B4444A; }
.wf-tab.bad i { display:inline-block; width:6px; height:6px; margin-left:6px; border-radius:50%;
  background:#B4444A; vertical-align:middle; }
.wf-tab.on.bad { background:#B4444A; border-color:#B4444A; color:#FFF; }
.wf-tab.on.bad i { background:#FFF; }
/* 실패 토스트는 닫기를 붙이고 사라지지 않는다 */
.wf-toast.keep { padding-right:14px; display:flex; align-items:center; gap:16px; }
.wf-toast.keep b { font-weight:400; font-size:15px; opacity:.75; }
/* ── 머리말: 제목과 용도 설명, 오른쪽 동작 */
.wf-h { align-items:flex-start; padding-bottom:14px; border-bottom:1px solid #E3E8ED; }
.wf-ht { min-width:0; }
.wf-ht h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:-.2px; }
.wf-ht p { margin:4px 0 0; font-size:12px; color:#6B7784; }
.wf-h .wf-btn { align-self:center; margin-left:auto; }
.wf-h .wf-btn + .wf-x { margin-left:10px; }
.wf-x { margin-left:auto; align-self:flex-start; appearance:none; border:0; background:none;
  font-size:20px; line-height:1; color:#98A4B0; cursor:pointer; padding:2px 4px; }
.wf-modal > .wf-h { align-items:flex-start; }

/* ── 탭: 밑줄형으로 두어 탭임을 분명히 한다 */
.wf-tabs { gap:0; margin:0 0 16px; border-bottom:1px solid #E3E8ED; }
.wf-tab { padding:11px 16px; border:0; border-bottom:2px solid transparent; border-radius:0;
  background:none; color:#6B7784; font-size:12.5px; }
.wf-tab.on { background:none; border-color:#2A5D8F; color:#2A5D8F; font-weight:600; }
.wf-tab.off { color:#B6BEC7; border-style:solid; }
.wf-tab.bad { color:#B4444A; border-color:transparent; }
.wf-tab.on.bad { background:none; color:#B4444A; border-color:#B4444A; }
.wf-tab.on.bad i { background:#B4444A; }

/* ── 구역 제목: 배경 없이 소제목과 얇은 선 */
.wf-sub { margin:22px 0 10px; padding:0 0 8px; background:none; border-bottom:1px solid #E3E8ED;
  border-radius:0; font-size:12.5px; font-weight:600; color:#2B3442; letter-spacing:-.1px; }

/* ── 표: 머리글은 얇게, 행은 선으로만 나눈다 */
.wf-t thead th, .wf-t th { background:#FAFBFC; font-weight:500; font-size:11.5px; color:#6B7784;
  letter-spacing:.02em; }
.wf-t { border-color:#E3E8ED; }
.wf-t td { border-color:#EEF1F4; }

/* ── 좌측 메뉴와 상단 바 */
.wf-nav { background:#232B36; }
.wf-nav li { color:#96A2AF; }
.wf-nav li.on { background:#2F3A48; box-shadow:inset 3px 0 0 #5B8FC7; }
.wf-top { border-bottom:1px solid #E3E8ED; }
.wf-main { padding:22px 24px; }

/* 모달의 머리말과 버튼 줄은 스크롤해도 자리를 지킨다 */
.wf-modal { max-height:calc(100% - 96px); overflow:auto; padding:0; }
.wf-modal > * { margin-left:18px; margin-right:18px; }
.wf-modal > .wf-h { position:sticky; top:0; z-index:3; margin:0; padding:18px 18px 14px;
  background:#FFF; }
.wf-modal > .wf-row:last-child { position:sticky; bottom:0; z-index:3; margin:0;
  padding:14px 18px 18px; background:#FFF; border-top:1px solid #E3E8ED; }
.wf-x { display:none; }
.wf-modal > .wf-h .wf-x { display:block; }

/* 상태는 배지로 두어 목록에서 한눈에 구분한다 */
.wf-badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:11px;
  background:#EEF2F6; color:#4A5560; }
/* 정렬 표시 */
.wf-sort { margin-left:5px; font-size:9px; font-weight:400; color:#2A5D8F; }
/* 페이지네이션: 가운데 쪽수, 왼쪽 페이지당 건수 */
.wf-page { display:flex; align-items:center; justify-content:space-between; }
.wf-page b { font-weight:400; }
.wf-per { min-width:78px; font-size:11.5px; color:#6B7784; }
/* 상단 바에 현재 위치 */
.wf-top { justify-content:space-between; padding:0 26px; }
.wf-crumb { font-size:11.5px; color:#98A4B0; }
.wf-crumb i { font-style:normal; margin:0 2px; }
/* 목록에서 고른 뒤 처리할 것 */
.wf-pick { display:flex; align-items:center; gap:12px; margin:0 0 10px; padding:10px 14px;
  border:1px solid #C6D6E6; border-radius:4px; background:#EEF4FA; font-size:12px; color:#2A5D8F; }
.wf-pick b { font-weight:600; }
.wf-pick b { flex:none; white-space:nowrap; }
.wf-pick .wf-btn { flex:0 0 auto; width:auto; height:32px; padding:0 14px; }
.wf-pick .wf-btn:first-of-type { margin-left:auto; }

/* 펼친 목록과 달력은 아래 내용을 밀지 않고 겹친다 */
.wf-float { position:relative; height:0; }
.wf-float > * { position:absolute; top:-4px; left:0; z-index:20; }
.wf-row:has(.wf-float) { margin:0; min-height:0; }
.wf-row:has(.wf-float) .wf-c { min-height:0; }

/* ── 표: 카드 안에 담고 여백과 정렬을 맞춘다 */
.wf-tbl { border-collapse:separate; border-spacing:0; margin:0 0 14px; font-size:12px;
  border:1px solid #E3E8ED; border-radius:6px; overflow:hidden; background:#FFF; }
.wf-tbl th { background:#F7F9FB; color:#6B7784; font-weight:500; font-size:11.5px;
  letter-spacing:.01em; padding:11px 14px; border-bottom:1px solid #E3E8ED; white-space:nowrap; }
.wf-tbl td { padding:13px 14px; color:#2B3442; border-bottom:1px solid #F0F3F6;
  vertical-align:middle; }
.wf-tbl tbody tr:last-child td { border-bottom:0; }
.wf-tbl tbody tr:hover td { background:#FAFCFE; }
.wf-tbl .wf-num { text-align:right; font-variant-numeric:tabular-nums; }
.wf-tbl .wf-chkcol { width:40px; padding-left:14px; padding-right:0; }
.wf-tbl th:first-child, .wf-tbl td:first-child { padding-left:16px; }
.wf-tbl th:last-child, .wf-tbl td:last-child { padding-right:16px; }
/* 동작 열만 링크처럼 */
.wf-tbl td.wf-act { color:#2A5D8F; white-space:nowrap; }
.wf-tbl th:last-child { text-align:left; }
/* 표 안의 배지는 한 줄로 */
.wf-tbl .wf-badge { white-space:nowrap; }
/* 모달 안의 표는 조금 촘촘하게 */
.wf-modal .wf-tbl th { padding:9px 12px; }
.wf-modal .wf-tbl td { padding:10px 12px; }

/* 표의 빈 값은 대시로 채워 값이 없음을 알린다 */

    const k = s.width ? screen.offsetWidth / s.width : 1;
    const ax = (a.left - s.left) * k, ab = (a.bottom - s.top) * k, aw = a.width * k;
    const hx1 = (hb.left - s.left) * k, hx2 = (hb.right - s.left) * k;
    panel.style.position = "absolute";
    panel.style.zIndex = "40";
    if (panel.classList.contains("wf-menu")) panel.style.width = aw + "px";
    screen.appendChild(panel);
    const ph = panel.offsetHeight, pw = panel.offsetWidth;
    const top = ab + 4;
    let left = ax;
    if (left + pw > hx2 - 8) left = Math.max(hx1 + 8, hx2 - 8 - pw);
    // 아래 버튼 줄을 가리지 않게 모달을 그만큼 늘린다
    const foot = host !== screen ? host.querySelector(":scope > .wf-row:last-child") : null;
    if (foot) {
      const limit = (foot.getBoundingClientRect().top - s.top) * k - 12;
      const over = top + ph - limit;
      if (over > 0) {
        const gap = document.createElement("div");
        gap.className = "wf-drop-space";
        gap.style.height = over + "px";
        host.insertBefore(gap, foot);
      }
    }
    panel.style.left = left + "px";
    panel.style.top = top + "px";
  });
}


const wrap = document.getElementById("wrap");
document.getElementById("cnt").textContent = DATA.length + " 화면";
let zoom = 0.5;
let last = "";
DATA.forEach(function (d, i) {
  if (d.tab !== last) {
    last = d.tab;
    const g = document.createElement("div");
    g.className = "grp";
    g.textContent = d.tab;
    wrap.appendChild(g);
  }
  const sc = parse(d.src)[0];
  if (!sc) return;
  if (sc.cw && sc.ov) {
    for (let k = i - 1; k >= 0; k--) {
      const b = parse(DATA[k].src)[0];
      if (!b || b.pane || b.w !== sc.w) continue;
      if (sc.ov === 2 ? b.ov : !b.ov) {
        if (DATA[k].id !== d.id) { sc.back = b; break; }
      }
    }
  }
  const card = document.createElement("div");
  card.className = "card";
  card.id = d.id;
  card.innerHTML = '<div class="cap"><b>' + esc(d.name || d.id) + '</b><i>' + esc(d.id) +
    '</i><span>' + sc.w + ' x ' + sc.h + '</span></div>' +
    '<div class="hold"><div>' + frameHTML(sc) + '</div></div>';
  wrap.appendChild(card);
  placeDrops(card);
  const hold = card.querySelector(".hold");
  const inner = hold.firstElementChild;
  inner.dataset.w = sc.w;
  inner.dataset.h = sc.h;
});
function apply() {
  document.querySelectorAll(".hold > div").forEach(function (el) {
    el.style.transform = "scale(" + zoom + ")";
    el.style.width = el.dataset.w + "px";
    el.style.height = el.dataset.h + "px";
    el.parentElement.style.height = (el.dataset.h * zoom + 36) + "px";
  });
}
apply();
document.querySelectorAll("[data-z]").forEach(function (b) {
  b.addEventListener("click", function () {
    zoom = +b.dataset.z;
    document.querySelectorAll("[data-z]").forEach(function (x) { x.classList.toggle("on", x === b); });
    apply();
  });
});
</script>
