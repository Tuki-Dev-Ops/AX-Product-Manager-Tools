<title>기획 문서 상황판</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  color-scheme: light;
  --ground:#FFFFFF; --surface:#FFFFFF; --raise:#F6F8FA; --ink:#1A2530; --muted:#5F6F7E; --faint:#8A99A6;
  --line:#DCE3E9; --line-soft:#EBF0F4;
  --accent:#2A5D8F; --accent-soft:#E4EEF7; --accent-ink:#1E4568;
  --good:#1F7A4D; --good-bg:#E3F2E9; --warn:#9A6A12; --warn-bg:#FBF0D6;
  --crit:#B1362E; --crit-bg:#F9E3E1; --neutral:#5F6F7E; --neutral-bg:#ECEFF2;
  --track:#E5EAEF;
  --font:"IBM Plex Sans KR","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono","Consolas","D2Coding",monospace;
  --pad:28px; --shadow:none;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.55; }
svg.lucide { width:1em; height:1em; flex:none; }
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
a { color:var(--accent-ink); }

.wrap { max-width:1180px; margin:0 auto; padding:0 var(--pad); }
header { background:var(--surface); border-bottom:1px solid var(--line); }
.head { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 28px; padding:26px 0 18px; }
.eyebrow { color:var(--faint); font-size:12px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
.head h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-0.01em; line-height:1.3; }
.head .sub { color:var(--muted); font-size:13.5px; margin-top:6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.head .sub .bar { color:var(--line); }
.head .built { color:var(--muted); font-size:12.5px; display:flex; align-items:center; gap:6px; }
nav { display:flex; gap:2px; border-top:1px solid var(--line-soft); flex-wrap:wrap; }
nav button { appearance:none; background:none; border:0; border-bottom:2px solid transparent; padding:13px 14px; font:inherit; font-size:14px; color:var(--muted); cursor:pointer; margin-bottom:-1px; display:flex; align-items:center; gap:7px; white-space:nowrap; }
nav button:hover { color:var(--ink); }
nav button[aria-selected="true"] { color:var(--accent-ink); border-bottom-color:var(--accent); font-weight:500; }
nav button:focus-visible { outline:2px solid var(--accent); outline-offset:-3px; border-radius:4px; }
main { padding:32px 0 80px; }
section { display:flex; flex-direction:column; gap:16px; padding:20px 0 28px; }
.secbar { display:flex; align-items:baseline; justify-content:space-between; gap:12px 20px; flex-wrap:wrap; }
h2.sec { font-size:15px; font-weight:600; margin:0; display:flex; align-items:baseline; gap:10px; }
h2.sec .count { color:var(--muted); font-weight:400; font-size:13px; }
.secbar .note { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.secbar .note b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

.gauge { height:8px; background:var(--track); border-radius:99px; overflow:hidden; }
.gauge > i { display:block; height:100%; background:var(--accent); border-radius:99px; }
.gauge.g-good > i { background:var(--good); }
.gauge.g-idle > i { background:var(--neutral); opacity:.45; }

.list { display:flex; flex-direction:column; gap:10px; }
.item { width:100%; text-align:left; font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px 20px 17px; display:grid; grid-template-columns:26px 1fr; column-gap:12px; row-gap:11px; box-shadow:var(--shadow); cursor:pointer; }
.item:hover { border-color:var(--accent); }
.item:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.item.idle { background:var(--raise); }
.item .no { color:var(--faint); font-size:13px; font-family:var(--mono); padding-top:2px; }
.item .row1 { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.item .stat-i { color:var(--muted); font-size:16px; display:inline-flex; }
.item.on .stat-i { color:var(--accent); }
.item.done .stat-i { color:var(--good); }
.item .cat { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 7px; line-height:19px; }
.item .name { font-size:15px; font-weight:500; }
.item .spacer { flex:1 1 auto; }
.item .open { color:var(--faint); font-size:12.5px; display:inline-flex; align-items:center; gap:4px; }
.item:hover .open { color:var(--accent-ink); }
.item .bar { grid-column:2; }
.item .foot { grid-column:2; display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:13px; margin-top:-3px; }
.item .foot .sep { color:var(--line); }
.item .foot b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
.item .foot .late { color:var(--crit); font-weight:600; }
.item .foot .none { color:var(--faint); }

.pill { display:inline-block; padding:1px 9px; border-radius:11px; font-size:12px; font-weight:500; line-height:19px; white-space:nowrap; }
.pill.good { background:var(--good-bg); color:var(--good); }
.pill.warn { background:var(--warn-bg); color:var(--warn); }
.pill.crit { background:var(--crit-bg); color:var(--crit); }
.pill.neutral { background:var(--neutral-bg); color:var(--neutral); }
.pill.accent { background:var(--accent-soft); color:var(--accent-ink); }

.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.search { position:relative; flex:0 1 280px; min-width:200px; }
.search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); width:15px; height:15px; pointer-events:none; }
.search input { width:100%; font:inherit; font-size:13.5px; padding:8px 12px 8px 33px; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--ink); }
.search input::placeholder { color:var(--faint); }
.search input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.sel { position:relative; }
.sel-btn { display:flex; align-items:center; gap:7px; font:inherit; font-size:13.5px; padding:8px 11px; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap; }
.sel-btn:hover { border-color:var(--faint); }
.sel-btn .chev { color:var(--faint); font-size:15px; transition:transform .12s ease; }
.sel[data-open="true"] .sel-btn { border-color:var(--accent); }
.sel[data-open="true"] .chev { transform:rotate(180deg); }
.sel-btn:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.sel-btn .val { color:var(--muted); }
.sel-btn.set .val { color:var(--accent-ink); font-weight:500; }
.sel-menu { position:absolute; z-index:20; top:calc(100% + 5px); left:0; min-width:100%; background:var(--surface); border:1px solid var(--line); border-radius:5px; box-shadow:0 6px 18px rgba(28,39,51,.13); padding:4px; margin:0; list-style:none; }
.sel-menu li { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:4px; font-size:13.5px; cursor:pointer; white-space:nowrap; color:var(--ink); }
.sel-menu li:hover, .sel-menu li.cursor { background:var(--accent-soft); }
.sel-menu li svg { color:var(--accent); font-size:15px; opacity:0; }
.sel-menu li[aria-selected="true"] svg { opacity:1; }

.tbl { background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow-x:auto; box-shadow:var(--shadow); }
table { border-collapse:collapse; width:100%; min-width:760px; }
th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top; font-variant-numeric:tabular-nums; }
th { font-size:12.5px; color:var(--muted); font-weight:500; white-space:nowrap; }
tr:last-child td { border-bottom:0; }
td.nowrap, th.nowrap { white-space:nowrap; }
td .type { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
td .type svg { color:var(--faint); font-size:15px; }
.empty { color:var(--muted); padding:18px 14px; }
.detail { color:var(--muted); font-size:13px; }

/* 문서 페이지 */
#page-doc { gap:18px; }
#page-doc .backlink { margin-bottom:2px; }
.backlink { appearance:none; background:none; border:0; font:inherit; font-size:13px; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:5px; padding:0; }
.backlink:hover { color:var(--ink); }
.backlink:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
.dochead { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:20px 24px; box-shadow:var(--shadow); }
.dochead h2 { margin:0; font-size:19px; font-weight:600; }
.dochead .dmeta { color:var(--muted); font-size:13px; margin-top:9px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.dochead .dmeta .sep { color:var(--line); }
.dochead .dpath { font-family:var(--mono); font-size:12px; color:var(--faint); }
.dochead .gauge { margin-top:14px; }
.docbody { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:30px 34px 44px; box-shadow:var(--shadow); }

.md { font-size:14px; line-height:1.7; }
.md > p, .md > ul, .md > ol, .md > h1, .md > h2, .md > h3, .md > h4, .md > blockquote { max-width:78ch; }
.md h1 { font-size:19px; font-weight:600; margin:0 0 18px; padding-bottom:12px; border-bottom:1px solid var(--line); }
.md h2 { font-size:16px; font-weight:600; margin:34px 0 10px; }
.md h3 { font-size:14.5px; font-weight:600; margin:24px 0 8px; }
.md h4 { font-size:14px; font-weight:600; margin:18px 0 6px; color:var(--muted); }
.md p { margin:0 0 12px; }
.md ul, .md ol { margin:0 0 12px; padding-left:20px; }
.md li { margin:3px 0; }
.md strong { font-weight:600; }
.md code { font-family:var(--mono); font-size:12.5px; background:var(--neutral-bg); padding:1px 5px; border-radius:3px; }
.md pre { background:var(--raise); border:1px solid var(--line); border-radius:5px; padding:14px 16px; overflow-x:auto; margin:0 0 14px; }
.md pre code { background:none; padding:0; font-size:12.5px; line-height:1.65; white-space:pre; }
.md blockquote { margin:0 0 12px; padding:2px 0 2px 14px; border-left:3px solid var(--line); color:var(--muted); }
.md table { border-collapse:collapse; width:100%; min-width:0; margin:0; border:0; font-size:13.5px; }
.md th, .md td { border:0; border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:8px 11px; vertical-align:top; }
.md th:last-child, .md td:last-child { border-right:0; }
.md tbody tr:last-child td { border-bottom:0; }
.md th { background:var(--raise); font-weight:500; color:var(--muted); }
.md hr { border:0; border-top:1px solid var(--line); margin:26px 0; }
.md .tablewrap { overflow-x:auto; max-width:100%; margin:0 0 16px; border:1px solid var(--line); border-radius:6px; }
.diagram { display:block; }
.dhead { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 18px; background:var(--surface); border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; }
.dtitle { color:var(--faint); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; }
.dscroll { overflow-x:auto; padding:0 0 1px; background:#FFFFFF; border-radius:0 0 6px 6px; }
.fmodal .mscale .diagram { border:0; margin:0; }
.fmodal .mscale .dhead { display:none; }
.fmodal .mscale .dscroll { overflow:visible; }
.md .tablewrap.wide table { min-width:1240px; }
.md .tablewrap.wide td:nth-child(4), .md .tablewrap.wide td:nth-child(6) { white-space:nowrap; }
.md pre.wf { background:#FFFFFF; border:1px solid var(--line); border-radius:4px; padding:18px 20px; }
.md pre.wf code { font-family:var(--mono); font-size:12px; line-height:1.5; color:var(--ink); }

/* Flow 도형 — 캔버스 */
.flow { background:var(--surface); border:1px solid var(--line); border-radius:6px; margin:0 0 18px; }
.fscroll { overflow-x:auto; padding:0 0 1px; background:#FFFFFF; border-radius:0 0 6px 6px; }
.fcanvas { display:block; }
.fhead { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 18px; background:var(--surface); border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; }
.ftitle { color:var(--faint); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; }
.fview { appearance:none; font:inherit; font-size:12.5px; padding:4px 11px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:5px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.fview:hover { border-color:var(--accent); color:var(--accent-ink); }
.fview:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.fmark { color:var(--muted); font-size:12.5px; padding:10px 18px 14px; background:#FFFFFF; }
.fref { font-family:var(--mono); font-size:12px; background:var(--neutral-bg); color:var(--ink); padding:0 6px; border-radius:3px; line-height:19px; }
.fref.go { cursor:pointer; color:var(--accent-ink); background:var(--accent-soft); }
.fref.go:hover { text-decoration:underline; }
.fref.go:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.md h3.flow-target { scroll-margin-top:16px; }
.diagram { background:var(--surface); border:1px solid var(--line); border-radius:6px; margin:0 0 18px; }
.diagram canvas { display:block; }
.diagram canvas.wfcanvas { cursor:pointer; }
.ftabs { display:flex; flex-wrap:nowrap; overflow-x:auto; gap:6px; margin:2px 0 0; padding:14px 0 12px; border-top:1px solid var(--line-soft); scrollbar-width:none; -ms-overflow-style:none; }
.ftabs::-webkit-scrollbar { width:0; height:0; display:none; }
.ftabs button { appearance:none; flex:none; font:inherit; font-size:12.5px; line-height:1; padding:7px 12px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:5px; cursor:pointer; white-space:nowrap; }
.fnav { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 0 10px; margin:0 0 16px; border-bottom:1px solid var(--line-soft); }
.fnav .fnav-title { min-width:0; }
.fnav .fnav-title h3 { margin:0; }
.fnav .fnav-btns { display:inline-flex; gap:4px; flex:none; }
.fnav .fnav-btns button { appearance:none; width:34px; height:30px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:5px; cursor:pointer; font:inherit; font-size:14px; line-height:1; }
.fnav .fnav-btns button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent-ink); }
.fnav .fnav-btns button:disabled { opacity:.35; cursor:default; }
.ftabs button:hover { border-color:var(--accent); color:var(--accent-ink); }
.ftabs button[aria-current="true"] { background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.ftabs button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.md h3.hit { background:var(--accent-soft); border-radius:4px; padding:2px 8px; margin-left:-8px; }
.md h4.hit { background:var(--accent-soft); border-radius:4px; padding:2px 8px; margin-left:-8px; }

/* 범례 */
.flegend { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; background:#FFFFFF; border:1px solid var(--line); border-radius:6px; padding:11px 16px; margin:0 0 16px; font-size:12.5px; color:#5F6F7E; }
.flegend span { display:inline-flex; align-items:center; gap:7px; }
.flegend i { display:inline-block; width:26px; height:15px; background:#FFFFFF; border:1px solid #6B7A88; flex:none; }
.flegend i.l-term { border-radius:999px; }
.flegend i.l-proc { border-radius:2px; }
.flegend i.l-io { transform:skewX(-14deg); }
.flegend i.l-dec { border:0; background:#2A5D8F; width:18px; height:18px; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
.flegend i.l-ref { border-radius:2px;
  background:
    linear-gradient(#6B7A88,#6B7A88) 4px 0/1px 100% no-repeat,
    linear-gradient(#6B7A88,#6B7A88) calc(100% - 4px) 0/1px 100% no-repeat,
    #FFFFFF; }
.flegend i.l-br { border-radius:999px; width:22px; height:13px; border-color:#C9D2DA; }
.flegend .lgnote { color:var(--faint); font-size:11.5px; margin-left:auto; }


/* 화면 이름표 */
.wfhost { position:relative; }
.wfmark { position:absolute; transform-origin:0 0; transform:scale(var(--iz,1));
  display:inline-flex; align-items:baseline; gap:7px; white-space:nowrap; pointer-events:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:4px 9px;
  box-shadow:0 1px 3px rgba(20,32,45,.10); cursor:pointer; }
.wfmark b { font-size:12.5px; font-weight:600; color:var(--ink); }
.wfmark span { font-family:var(--mono); font-size:10.5px; color:var(--muted); }
.wfmark:hover { border-color:var(--accent); }

/* 화면 보드 */
.board { position:fixed; inset:0; z-index:210; display:flex; flex-direction:column; background:#EEF1F4; }
.board .bhead { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--surface); flex:none; }
.board .btitle { font-weight:600; font-size:14px; color:var(--ink); margin-right:auto; }
.board .bcount { font-family:var(--mono); font-size:11.5px; color:var(--muted); }
.board .bview { flex:1; overflow:hidden; position:relative; cursor:grab; touch-action:none; }
.board .bview.drag { cursor:grabbing; }
.board .bstage { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
.board .bwrap { display:flex; flex-wrap:wrap; align-items:flex-start; gap:36px 40px; padding:40px; }
.board figure { margin:0; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:0 0 4px; box-shadow:0 2px 10px rgba(20,32,45,.07); }
.board figcaption { cursor:pointer; display:flex; align-items:baseline; gap:8px; padding:11px 14px 9px; border-bottom:1px solid var(--line-soft); }
.board figcaption b { font-size:13px; font-weight:600; color:var(--ink); }
.board figcaption span { font-family:var(--mono); font-size:11px; color:var(--muted); }
.board figure canvas { display:block; margin:8px; }
.board figure.plain { background:none; border:0; box-shadow:none; padding:0; }
.board figure.plain canvas { margin:0; }
.board .bhint { position:absolute; right:16px; bottom:14px; background:rgba(30,40,52,.82); color:#FFFFFF; font-size:11.5px; padding:7px 12px; border-radius:5px; }

/* 크게 보기 */
.fmodal { position:fixed; inset:0; z-index:200; display:flex; flex-direction:column; background:#FFFFFF; }
.fmodal .mhead { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--surface); flex:none; }
.fmodal .mtitle { font-weight:600; font-size:14px; color:var(--ink); margin-right:auto; }
.fmodal .zoom, .board .zoom { display:inline-flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:5px; overflow:hidden; }
.fmodal .zoom button, .board .zoom button { appearance:none; border:0; background:var(--surface); color:var(--muted); font:inherit; line-height:1; width:32px; height:28px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.fmodal .zoom button svg, .board .zoom button svg { width:15px; height:15px; }
.fview svg { width:14px; height:14px; }
.fmodal .zoom button:hover, .board .zoom button:hover { background:var(--raise); color:var(--accent-ink); }
.fmodal .zval, .board .zval { font-family:var(--mono); font-size:12px; color:var(--muted); min-width:46px; text-align:center; }
.fmodal .mclose, .board .mclose { appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:5px; width:32px; height:28px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.fmodal .mclose svg, .board .mclose svg { width:15px; height:15px; }
.fmodal .mclose:hover, .board .mclose:hover { border-color:var(--accent); color:var(--accent-ink); }
.fmodal .mbody { flex:1; overflow:auto; padding:18px 24px 28px; background:#FFFFFF; }
.fmodal .mscale { display:inline-block; min-width:100%; }
.fmodal .mscale .flow { border:0; margin:0; }
.fmodal .mscale .fhead { display:none; }
.fmodal .mscale .fscroll { overflow:visible; }

/* 정보계층도 */
.ia-chart { background:var(--surface); border:1px solid var(--line); border-radius:6px; margin:0 0 18px; }
.ia-scroll { overflow-x:auto; padding:26px 20px 30px; }
.ia-tree, .ia-tree ul { display:flex; justify-content:center; list-style:none; margin:0; padding:0; min-width:min-content; }
.ia-tree ul { position:relative; padding-top:28px; }

<script>
const D = {"built": "2026-09-09 16:15", "project": {"name": "아이오더 F&B 플랫폼", "department": "기획팀", "phase": "착수", "started": "2026-09-03"}, "summary": {"progress": 100, "total": 8, "done": 8, "active": 0, "waiting": 0, "eta": ""}, "documents": [{"no": 1, "id": "DOC-01", "title": "프로젝트 개요", "file": "docs/01_프로젝트개요.md", "category": "기획", "status": "확정", "progress": 100, "eta": "", "version": "2.5", "updated": "2026-09-08", "inherits_titles": [], "content": "# 01. 프로젝트 개요\n\n## 1. 추진 배경\n\n본사는 여러 브랜드를 행사 단위로 운영한다. 행사마다 상권을 나누고 그 아래 매장을 배치한다. 행사가 끝나면 매장을 철수하고 다음 행사에 다시 배치한다.\n\n현재는 매장별 판매 실적을 행사가 끝난 뒤에 모아서 확인한다. 행사가 진행되는 동안에는 어느 상권이 잘 팔리는지 판단할 근거가 없다. 그래서 매장 배치와 메뉴 구성을 다음 행사에 반영하는 시점이 한 주기 늦는다.\n\n메뉴 정보는 매장이 각자 관리한다. 표시 정보를 종이나 개별 도구로 다루다 보니 누락이 생기고, 주문 채널마다 다시 입력한다. 행사가 시작될 때마다 같은 작업을 반복한다.\n\n## 2. 목적\n\n세 가지를 해결한다.\n\n| 문제 | 목적 |\n| --- | --- |\n| 행사 종료 후에야 상권별 실적을 알 수 있다 | 행사 진행 중 일 단위로 상권별 매출을 확인한다 |\n| 표시 정보 누락과 채널별 재입력이 생긴다 | 매장이 한 번 등록하면 모든 주문 채널이 같은 정보를 쓴다 |\n| 주문 채널마다 메뉴 정보가 다르다 | 하나의 메뉴 마스터를 웹앱, 키오스크, 외부 POS가 함께 사용한다 |\n\n### 목표\n\n| ID | 목표 | 달성 판단 기준 |\n| --- | --- | --- |\n| GO-01 | 행사 진행 중 상권별 매출을 확인한다 | 전일 매출이 확정치로, 당일 매출이 잠정치로 조회된다 |\n| GO-02 | 행사 간과 상권 간 실적을 비교한다 | 기간과 매장 수가 다른 대상을 같은 기준으로 환산해 비교한다 |\n| GO-03 | 매장이 한 번 등록한 메뉴를 모든 채널이 쓴다 | 매장에서 메뉴를 바꾸면 웹앱, 키오스크, 외부 POS에 같은 값이 나간다 |\n| GO-04 | 법정 표시 정보를 누락 없이 관리한다 | 알레르기와 원산지가 입력되지 않은 메뉴는 저장되지 않는다 |\n| GO-05 | 매장 개설과 메뉴 등록을 분리한다 | 본사가 매장을 열면 매장이 바로 메뉴를 등록할 수 있다 |\n\n### 기대효과\n\n| 항목 | 내용 |\n| --- | --- |\n| 운영 판단 시점 | 행사 종료 후에서 행사 진행 중으로 앞당긴다 |\n| 메뉴 정보 관리 | 채널마다 반복하던 등록을 매장 단위 1회로 줄인다 |\n| 표시 정보 누락 | 등록 단계에서 막아 매장 운영 중 발생을 없앤다 |\n\n수치 목표는 정하지 않는다. 현재 운영의 기준값이 확인되지 않았기 때문이다. 대신 구축과 함께 측정을 시작해 다음 행사부터 비교할 수 있게 한다.\n\n| 측정 항목 | 수집 방법 | 비교 시점 |\n| --- | --- | --- |\n| 매장당 메뉴 등록 소요 시간 | 메뉴 가져오기 사용 여부와 등록 완료까지의 시각 차 | 두 번째 행사부터 |\n| 표시 정보 누락 건수 | 판매 불가 상태로 남은 메뉴 수 | 행사 종료 시 |\n| 실적 확인 시점 | 매출 집계 완료 시각과 운영자 조회 시각 | 매 행사 |\n| 주문 미접수 건수 | 제한 시간 초과로 자동 취소된 건 | 매 행사 |\n\n첫 행사는 기준값을 만드는 회차로 본다. 개선 폭은 두 번째 행사부터 판정한다.\n\n## 3. 서비스 개요\n\nF&B 매장 운영을 위한 플랫폼이다. 본사 ERP에서 행사, 상권, 매장, 메뉴 정보를 관리하고, 주문 채널이 이 정보를 받아 사용한다.\n\n정보 계층은 다음과 같이 정의한다.\n\n```ia\n본사 :: 전체 기준\n  행사 :: 기간 단위 운영\n    상권 :: 지역 구분\n      매장 :: 브랜드와 지점번호를 갖는다\n  브랜드 :: 메뉴를 소유한다\n    카테고리 :: 상품 분류\n      메뉴 :: 판매 단위\n```\n\n## 4. 대상 사용자\n\n| 구분 | 사용 시스템 | 설명 |\n| --- | --- | --- |\n| 본사 운영자 | 내부 어드민 | 행사, 상권, 매장, 메뉴를 관리하고 매출 통계를 조회한다 |\n| 가맹 관리자 | 가맹 어드민 | 담당 매장의 운영 정보를 관리하고 주문을 접수한다 |\n| 고객 | 하이브리드 웹앱 | 회원가입 없이 매장 메뉴를 조회하고 주문·결제한다 |\n| 고객 | 키오스크 | 매장에서 직접 주문·결제한다 |\n\n## 5. 주요 범위\n\n초도 작업 범위는 ERP로 정의한다.\n\n### 포함\n\n| 구분 | 내용 |\n| --- | --- |\n| 내부 어드민 | 행사·상권·브랜드·매장 등록, 가맹 관리자 계정 발급, 전체 매장 매출 통계 |\n| 가맹 어드민 | 매장 관리, 메뉴·카테고리·옵션·가격·표시 정보 등록, 품절 설정, 주문 접수, 주문서 출력 |\n| 하이브리드 웹앱 | 스마트오더, PG 결제, 비회원 주문 |\n| 키오스크 | 매장 주문, VAN 결제 |\n| 외부 연계 | POS가 지점 정보와 메뉴 정보를 받아갈 수 있는 연동 구조 |\n\n### 제외\n\n| 구분 | 사유 |\n| --- | --- |\n| POS 개발 | 과업 범위 밖. 정보를 제공하는 연동만 포함한다 |\n| 앱스토어·구글플레이 등록 | 하이브리드 웹앱은 웹 링크와 QR로 접근한다 |\n\n## 6. 구축 순서\n\n| 순서 | 대상 | 결제 |\n| --- | --- | --- |\n| 1 | 내부 어드민 | 해당 없음 |\n| 2 | 가맹 어드민 (매장 관리) | 해당 없음 |\n| 3 | 하이브리드 웹앱 | PG |\n| 4 | 키오스크 | VAN |\n\n## 7. 요구사항\n\n기능 66건이 모두 아래 요구사항 중 하나 이상에 연결된다. 연결되지 않은 기능은 두지 않는다.\n\n업무 도메인으로 나눠 적는다. 도메인 구분은 03 문서 8절 화면 분류 기준과 같다.\n\n| 도메인 | 건수 | 실행 주체 |\n| --- | --- | --- |\n| 기준정보 | 8 | 본사 |\n| 메뉴 | 7 | 매장 |\n| 주문 | 5 | 매장과 고객 |\n| 결제 | 2 | 고객과 외부 |\n| 매장 운영 | 8 | 매장 |\n| 매출 | 5 | 본사와 매장 |\n| 보안 | 7 | 본사 |\n| 운영 | 5 | 본사 |\n| 외부 연계 | 2 | 외부 POS |\n| 합계 | 49 | |\n\n### 7.1 기준정보\n\n행사, 상권, 브랜드, 매장을 등록하고 상태를 관리한다. 본사가 실행한다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-001 | 본사 운영자는 행사를 등록하고 행사 기간과 참여 상권을 지정한다. | FN-102 |\n| REQ-002 | 본사 운영자는 상권을 등록하고 담당 계정을 발급한다. | FN-103 |\n| REQ-003 | 본사 운영자는 브랜드를 등록하고 브랜드 단위로 메뉴를 관리한다. | FN-119 |\n| REQ-004 | 가맹 관리자는 담당 상권에 매장을 등록하고 소속 행사와 지점번호를 지정한다. | FN-104 |\n| REQ-052 | 본사 운영자는 하위가맹점 심사가 끝난 매장의 개시를 확정한다. | FN-129 |\n| REQ-051 | 본사 운영자는 행사별 개시 준비 상태를 한 화면에서 확인하고 미완료 매장에 안내를 보낸다. | FN-128 |\n\n### 7.2 메뉴\n\n매장이 자기 메뉴를 등록하고 관리한다. 본사는 메뉴에 관여하지 않는다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-006 | 가맹 관리자는 브랜드별로 카테고리와 메뉴를 등록한다. | FN-106, FN-107 |\n| REQ-007 | 가맹 관리자는 메뉴에 옵션 그룹을 연결하고 최소·최대 선택 수를 지정한다. | FN-108 |\n| REQ-008 | 시스템은 메뉴 등록 시 알레르기 유발물질과 영양성분 입력을 요구한다. | FN-109 |\n| REQ-009 | 시스템은 표시 대상 품목에 대해 원산지 입력을 요구한다. | FN-110 |\n| REQ-010 | 가맹 관리자는 매장별 판매 가격을 기준 가격과 다르게 지정한다. | FN-111 |\n| REQ-013 | 가맹 관리자는 메뉴의 품절 상태를 설정하고 재개 시각을 지정한다. | FN-206 |\n| REQ-043 | 가맹 관리자는 다른 매장의 메뉴를 가져와 자기 매장 메뉴로 등록한다. | FN-211 |\n\n### 7.3 주문\n\n주문 생성부터 상태 전이와 취소까지 다룬다. 채널이 달라도 같은 상태값을 쓴다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-014 | 고객은 회원가입 없이 웹앱에서 매장 메뉴를 조회하고 주문한다. | FN-301, FN-302, FN-303, FN-304, FN-305 |\n| REQ-016 | 고객은 키오스크에서 메뉴와 옵션을 선택하고 주문한다. | FN-401, FN-402, FN-403, FN-404 |\n| REQ-018 | 시스템은 결제 승인 후 주문번호를 발번하고 매장에 주문 내용을 전달한다. | FN-406, FN-209, FN-407 |\n| REQ-021 | 고객은 주문번호와 휴대폰번호로 주문 상태를 조회하고 상태 변경을 통지받는다. | FN-307, FN-308, FN-309 |\n| REQ-022 | 고객은 조리 시작 전까지 주문을 취소한다. | FN-310 |\n\n### 7.4 결제\n\n승인과 취소를 다룬다. 정산은 결제대행사가 전담하고 플랫폼은 대금을 수취하지 않는다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-015 | 고객은 웹앱에서 결제대행사를 통해 결제한다. | FN-306 |\n| REQ-017 | 고객은 키오스크에서 결제 단말로 결제한다. | FN-405 |\n\n### 7.5 매장 운영\n\n매장이 매일 하는 일이다. 영업 상태, 주문 접수, 품절, 단말, 알림이다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-019 | 가맹 관리자는 주문을 접수하고 조리 완료와 수령 완료를 처리한다. | FN-207 |\n| REQ-020 | 시스템은 매장이 제한 시간 안에 접수하지 않은 주문을 취소한다. | FN-207 |\n| REQ-030 | 가맹 관리자는 매장 정보를 조회하고 변경을 요청한다. | FN-202, FN-203 |\n| REQ-031 | 가맹 관리자는 매장의 영업 상태를 변경한다. | FN-204 |\n| REQ-032 | 가맹 관리자는 매장에 적용된 메뉴와 표시 정보를 조회한다. | FN-205 |\n| REQ-033 | 가맹 관리자는 키오스크 관리자 모드에서 메뉴를 갱신하고, 판매할 메뉴와 품절을 설정한다. | FN-408, FN-412 |\n| REQ-044 | 가맹 관리자는 알림 발송 결과를 확인하고 실패한 알림을 다시 보낸다. | FN-212 |\n| REQ-047 | 가맹 관리자는 매장에서 쓰는 단말을 등록하고 연결 상태를 확인한다. | FN-213, FN-214 |\n\n### 7.6 매출\n\n주문과 결제를 집계해 비교 가능한 형태로 만든다. 대사도 여기에 둔다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-023 | 본사 운영자는 기간, 행사, 상권, 브랜드, 매장, 채널을 조건으로 매출을 조회한다. | FN-114 |\n| REQ-024 | 본사 운영자는 행사 간과 상권 간 매출을 같은 기준으로 환산해 비교한다. | FN-115 |\n| REQ-025 | 가맹 관리자는 담당 매장 범위의 매출을 조회한다. | FN-208 |\n| REQ-038 | 본사 운영자는 결제 원장과 결제대행사 내역을 대조하고 불일치를 처리한다. | FN-120 |\n| REQ-049 | 본사 운영자는 매장별 정산 진행 상태와 미정산 금액을 조회한다. | FN-126 |\n\n### 7.7 보안\n\n계정과 접근 통제, 기록 보관과 개인정보 파기다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-026 | 본사 운영자는 계정을 등록하고 권한과 담당 매장 범위를 지정한다. | FN-116 |\n| REQ-027 | 시스템은 어드민 접속에 2차 인증을 적용한다. | FN-101, FN-201 |\n| REQ-028 | 시스템은 접속기록과 작업 이력을 보관하고 조회할 수 있게 한다. | FN-117 |\n| REQ-029 | 본사 운영자는 가맹 계정으로 대행 접속하고 조작자와 대상 계정을 함께 기록한다. | FN-118 |\n| REQ-040 | 시스템은 계정의 권한과 담당 매장 범위 변경을 기록한다. | FN-122 |\n| REQ-041 | 시스템은 보유 기간이 지난 개인정보를 파기하고 기록을 남긴다. | FN-123 |\n| REQ-042 | 가맹 관리자는 등록된 휴대폰번호로 본인을 확인하고 비밀번호를 재설정한다. | FN-210 |\n\n### 7.8 운영\n\n배치, 단말 상태, 접근성처럼 서비스를 굴러가게 하는 일이다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-034 | 본사 운영자는 매장 단말의 연결 상태를 확인한다. | FN-409 |\n| REQ-048 | 시스템은 단말 미연결이 이어지면 매장과 본사에 단계별로 알린다. | FN-125 |\n| REQ-039 | 본사 운영자는 배치 실행 결과를 확인하고 실패한 배치를 다시 실행한다. | FN-121 |\n| REQ-050 | 본사 운영자는 배치와 알림 발송과 외부 연동 오류를 한 곳에서 확인한다. | FN-127 |\n| REQ-046 | 키오스크는 접근성 검증기준을 준수한 단말을 쓰고 위치를 음성으로 안내한다. | FN-411 |\n\n### 7.9 외부 연계\n\n외부 POS에 매장과 메뉴를 제공하고 변경을 통지한다.\n\n| ID | 요구사항 | 관련 기능 |\n| --- | --- | --- |\n| REQ-036 | 외부 POS는 허용된 범위의 매장 정보와 메뉴 정보를 조회하고 변경 통지를 받는다. | FN-501, FN-502, FN-410 |\n| REQ-037 | 본사 운영자는 외부 연동 계정을 발급하고 접근 범위를 지정한다. | FN-503 |\n## 8. 비기능 요구사항\n\n기능이 아니라 품질과 제약을 정한다. 특정 기능 하나에 붙지 않으므로 별도 번호 체계를 쓴다. 근거가 있는 값과 우리가 정한 값을 구분한다.\n\n### 8.1 성능\n\n| ID | 항목 | 기준 | 근거 |\n| --- | --- | --- | --- |\n| NFR-01 | 웹앱 최대 콘텐츠 표시 시간 | 2.5초 이내. 75 백분위 | Core Web Vitals |\n| NFR-02 | 웹앱 상호작용 응답 | 200밀리초 이내. 75 백분위 | Core Web Vitals |\n| NFR-03 | 웹앱 누적 레이아웃 이동 | 0.1 이하. 75 백분위 | Core Web Vitals |\n| NFR-04 | 서버 첫 바이트 도착 | 0.8초 이내 | Core Web Vitals 보조 지표 |\n| NFR-05 | 주문 API 응답 | 평시 95 백분위 500밀리초, 피크 1초 | 자체 판단 |\n| NFR-06 | 키오스크 화면 전환 | 300밀리초 이내 | 자체 판단 |\n| NFR-07 | 매출 조회 응답 | 3초 이내 | 자체 판단 |\n\n### 8.2 용량\n\n| ID | 항목 | 기준 | 근거 |\n| --- | --- | --- | --- |\n| NFR-08 | 동시 사용자 산정 | 행사 예상 참가자의 20퍼센트 | 정보시스템 하드웨어 규모산정 지침의 일반값 |\n| NFR-09 | 주문 1건당 트랜잭션 | 4건으로 산정 | 같은 지침의 단순 업무 계수 |\n| NFR-10 | 키오스크 메뉴 항목 | 매장당 100개 이하 권장 | 조사한 제품이 초과 시 동기화 지연을 안내한다 |\n\n### 8.3 가용성\n\n| ID | 항목 | 기준 | 근거 |\n| --- | --- | --- | --- |\n| NFR-11 | 행사 운영시간 가용률 | 99.9퍼센트 | 자체 판단 |\n| NFR-12 | 월간 가용률 | 99.5퍼센트 | 자체 판단 |\n| NFR-13 | 복구 목표 시간 | 30분 | 자체 판단. 공공 A2등급보다 강화 |\n| NFR-14 | 복구 목표 시점 | 5분 | 자체 판단 |\n\n행사가 수 시간 단위로 끝난다. 공공 기준의 시간 단위 복구 목표를 그대로 쓰면 행사가 끝난 뒤에 복구된다. 운영시간대와 월간을 나눠 정했다.\n\n### 8.4 결제 시간 제약\n\n| ID | 항목 | 기준 | 근거 |\n| --- | --- | --- | --- |\n| NFR-15 | 결제 승인 요청 시한 | 인증 후 10분 이내 | 결제대행사 규격 |\n| NFR-16 | 결제 API 연결 제한 시간 | 5초 | 결제대행사 규격 |\n| NFR-17 | 결제 API 읽기 제한 시간 | 60초 | 결제대행사 규격 |\n| NFR-18 | 멱등키 유효기간 | 15일 | 결제대행사 규격 |\n| NFR-19 | 웹훅 응답 | 10초 이내 | 결제대행사 규격 |\n| NFR-20 | 단말 승인 대기 | 30초. 초과 시 망취소 | 자체 판단 |\n\n### 8.5 보안\n\n| ID | 항목 | 기준 | 근거 |\n| --- | --- | --- | --- |\n| NFR-21 | 관리자 계정 | 취급자별 개별 발급. 공유 금지 | 개인정보의 안전성 확보조치 기준 제5조 제4항 |\n| NFR-22 | 비밀번호 저장 | 복호화되지 않는 일방향 암호화 | 같은 기준 제7조 제1항 |\n| NFR-23 | 비밀번호 작성 규칙 | 3종류 조합 8자리 이상 또는 2종류 10자리 이상 | 자체 판단. 2023년 폐지된 구 기준값을 내부 기준으로 유지 |\n| NFR-24 | 비밀번호 변경 주기 | 강제하지 않는다. 유출 정황 시 즉시 변경 | 자체 판단. 현행 고시에 주기 규정이 없다 |\n| NFR-25 | 로그인 실패 제한 | 5회 실패 시 10분 잠금 | 자체 판단. 고시는 횟수를 정하지 않는다 |\n| NFR-26 | 관리자 세션 종료 | 30분 미사용 시 | 자체 판단. 고시는 시간을 정하지 않는다 |\n| NFR-27 | 접근권한 변경 이력 | 3년 이상 보관 | 안전성 확보조치 기준 제5조 제3항 |\n| NFR-28 | 접속기록 보관 | 2년 이상 | 같은 기준 제8조 제1항. 5만명 이상 처리 시 |\n| NFR-29 | 접속기록 점검 | 월 1회 이상 | 같은 기준 제8조 제2항 |\n\n주기적 비밀번호 변경을 강제하지 않는 이유는 현행 고시에 규정이 없고, 강제하면 예측 가능한 비밀번호를 쓰게 되기 때문이다.\n\n### 8.6 보관과 파기\n\n| ID | 항목 | 기준 | 근거 |\n| --- | --- | --- | --- |\n| NFR-30 | 계약과 청약철회 기록 | 5년 | 전자상거래법 시행령 제6조 |\n| NFR-31 | 대금결제와 재화 공급 기록 | 5년 | 같은 조 |\n| NFR-32 | 소비자 불만과 분쟁처리 기록 | 3년 | 같은 조 |\n| NFR-33 | 표시와 광고 기록 | 6개월 | 같은 조 |\n| NFR-34 | 장부와 세금계산서 | 확정신고 기한 후 5년 | 부가가치세법 제71조 제3항 |\n| NFR-35 | 개인정보 파기 시한 | 불필요해진 날부터 5일 이내 | 표준 개인정보 보호지침 제10조 제1항 |\n| NFR-36 | 파기 방법 | 복원이 불가능한 방법으로 영구 삭제 | 개인정보 보호법 시행령 제16조 제1항 |\n| NFR-37 | 법령 보존 대상의 분리 | 다른 개인정보와 분리해 저장 | 개인정보 보호법 제21조 제3항 |\n| NFR-38 | 파기 기록 | 파기에 관한 사항을 기록하고 관리 | 표준 개인정보 보호지침 제10조 제3항 |\n\n### 8.7 접근성\n\n키오스크와 웹앱 모두 법정 의무 대상이다. 근거가 되는 법이 둘이고 적용 기준이 다르다.\n\n| 트랙 | 근거 | 규모 기준 | 상태 |\n| --- | --- | --- | --- |\n| 차별금지 | 장애인차별금지법 제15조 제3항, 시행령 제10조의2 | 있다. 상시 100명 미만도 2025년 1월부터 대상 | 시행 중 |\n| 디지털포용 | 디지털포용법 제19조 제1항 제3호, 제20조 | 없다. 모든 설치와 운영자 | 시행 중 |\n\n두 트랙을 함께 봐야 한다. 소상공인 완화는 차별금지 트랙의 것이고 디지털포용 트랙에는 규모에 따른 완화가 없다.\n\n#### 키오스크\n\n| ID | 항목 | 기준 |\n| --- | --- | --- |\n| NFR-39 | 단말 | 과학기술정보통신부 고시의 검증기준을 준수한 단말을 쓴다 |\n| NFR-40 | 위치 안내 | 단말 위치를 음성으로 안내하는 장치를 설치한다 |\n| NFR-41 | 작동부 높이 | 바닥에서 400밀리미터부터 1220밀리미터 사이 |\n| NFR-42 | 필수 시각정보 | 바닥에서 1400밀리미터 이하에 표시한다 |\n| NFR-43 | 음성 안내 | 화면의 모든 필수 시각정보를 청각정보로 제공한다. 중단과 다시듣기가 된다 |\n| NFR-44 | 개인청취 | 연결 단자나 기능을 제공한다. 연결하면 본체 스피커를 끈다 |\n| NFR-45 | 화면 확대 | 필수 문자를 200퍼센트까지 확대한다. 확대해도 기능이 사라지지 않는다 |\n| NFR-46 | 문자 높이 | 7.25밀리미터 이상 |\n| NFR-47 | 색 대비 | 문자와 배경 4.5대 1 이상. 고대비 화면은 7대 1 이상 |\n| NFR-48 | 시간 연장 | 만료 최소 20초 전에 알리고 연장 방법을 제공한다 |\n| NFR-49 | 버튼 간격 | 터치스크린 2.5밀리미터 이상 |\n| NFR-50 | 작동부 크기 | 각 변 12밀리미터 이상, 면적 144제곱밀리미터 이상 |\n| NFR-51 | 음량 | 65데시벨 이상 조절할 수 있다. 사용 후 자동으로 되돌린다 |\n| NFR-52 | 깜박임 | 초당 3회 미만 |\n| NFR-53 | 인증 | 생체인식 외 대체 수단을 제공한다. 개인정보를 음성으로 출력하지 않는다 |\n| NFR-54 | 인지 지원 | 취소와 이전 단계 복귀, 직원 호출을 제공한다. 기호에 문자를 함께 적는다 |\n\n시간 연장 기준은 키오스크의 무입력 대기와 직접 부딪친다. 04 문서에서 일정 시간 무입력 시 대기화면으로 돌아가도록 정했다. 이 동작에 만료 20초 전 알림과 연장 수단을 반드시 붙인다.\n\n개인정보 음성 출력 금지도 설계에 영향을 준다. 고객 호출용 휴대폰번호 입력 화면에서 입력값을 음성으로 읽지 않는다. 개인청취 장치를 연결한 경우만 예외다.\n\n#### 웹앱과 관리자 웹\n\n| ID | 항목 | 기준 |\n| --- | --- | --- |\n| NFR-55 | 준거 | 한국형 웹 콘텐츠 접근성 지침 2.2. 표준번호 KS X OT0003 |\n| NFR-56 | 검사항목 | 33개 항목을 모두 확인한다 |\n\n하이브리드 웹앱은 앱스토어에 등록하지 않으므로 모바일 앱 기준이 아니라 웹 기준을 적용한다.\n\n#### 검증\n\n무인정보단말기는 접근성 품질인증 대상이 아니다. 품질인증은 웹사이트와 모바일 앱 두 종류다.\n\n키오스크는 우선구매 대상 지능정보제품 검증을 받는다. 처리 기한이 신청일부터 60일이고 유효기간은 3년이다. 단말을 조달할 때 검증서 보유 여부를 확인한다.\n\n#### 제재\n\n시정명령을 이행하지 않으면 3천만원 이하 과태료다. 두 법 모두 같은 금액이다.\n\n### 8.8 확인이 필요한 항목\n\n| 항목 | 확인할 것 |\n| --- | --- |\n| 소상공인 해당 여부 | 사업자가 소상공인기본법상 소상공인인지. 음식점업은 상시근로자 5명 미만이다. 해당해도 차별금지 트랙만 완화되고 디지털포용 트랙은 그대로다 |\n| 단말 화면 크기 | 화면 대각선이 28센티미터 이하면 소형제품으로 완화 대상이다. 조달할 단말의 크기를 확인한다 |\n| 단말 검증서 | 조달할 키오스크가 검증서를 보유했는지. 없으면 검증에 60일이 걸린다 |\n| 정보주체 규모 | 5만명을 넘는 시점. 접속기록 보관이 1년에서 2년으로 늘어난다 |\n| VAN사 타임아웃 | 승인 전문의 응답 제한 시간. 공개 출처가 없어 계약 시 확인한다 |\n\n## 9. 전제 조건 및 제약\n\n| 구분 | 내용 |\n| --- | --- |\n| 결제 | 하이브리드 웹앱은 PG, 키오스크는 VAN을 사용한다 |\n| 정산 | 외부 결제대행사가 정산을 전담한다. 플랫폼은 대금을 수취하지 않으며 명의 수납 계좌를 두지 않는다 |\n| 가맹점 계약 | 각 매장이 결제대행사의 하위가맹점이 된다. 플랫폼은 대표가맹점이 되지 않는다 |\n| 규제 시점 | 개정 전자금융거래법이 2026년 12월 17일 시행된다. 무수취 구조는 개정 후에도 등록 대상이 아니다 |\n| 선불충전 | 도입하지 않는다 |\n| 회원 | 하이브리드 웹앱에 회원 개념을 두지 않는다 |\n| 앱 배포 | 하이브리드 웹앱은 앱스토어에 등록하지 않는다 |\n| 외부 시스템 | POS는 외부 시스템이다. 본 서비스는 정보를 제공한다 |\n| 메뉴 관리 | 매장이 자기 메뉴를 등록하고 관리한다. 본사는 메뉴를 만들지 않으며 배포 절차를 두지 않는다 |\n| 웹앱 진입 | QR에 담긴 매장으로 바로 진입한다. 매장 선택 화면을 두지 않는다 |\n| 일정 | 단계별 목표일은 착수 시점에 정한다. 구축 순서는 6절에 있다 |\n"}, {"no": 2, "id": "DOC-02", "title": "기획 검토", "file": "docs/02_기획검토.md", "category": "기획", "status": "확정", "progress": 100, "eta": "", "version": "2.12", "updated": "2026-09-08", "inherits_titles": ["프로젝트 개요"], "content": "# 02. 기획 검토\n\n조사 원본은 `research/` 아래에 근거 URL과 함께 있다. 이 문서에는 판단만 적는다.\n\n## 1. 조사 개요\n\n| 조사 | 대상 | 원본 |\n| --- | --- | --- |\n| 모바일 스마트오더 | 사이렌오더, 배민오더, 카카오톡 주문하기, 네이버 주문, 페이히어, 티오더, 토스오더, 해피오더. 국내 PG 4개사 문서 | research/스마트오더_조사.md |\n| 키오스크·외부 POS | 오케이포스, 토스플레이스, 페이히어, Toast, Square. VAN 3개사 문서 | research/키오스크_조사.md |\n| 본사 ERP | 위 제품에 배달의민족, 티오더, 도도포인트, 캐시노트, Oracle Simphony 추가. 법령 원문 확인 | research/본사ERP_조사.md |\n| 인프라 아키텍처 | 국내 커머스 기술 자료, 클라우드 공식 문서, PG·VAN 연동 문서, 규제 원문 | research/아키텍처_조사.md |\n| ERP 기능 범위 | Toast, Square, Lightspeed, Olo, Flipdish, 토스플레이스, 오케이포스, 배달의민족, 페이히어, 티오더, 하이오더 공식 문서 | research/ERP기능범위_조사.md |\n| 결제·정산 규제 | 전자금융거래법 조문, 금융위 보도자료, 국내 결제대행사 4개사 개발자 문서 | research/결제정산규제_조사.md |\n| 정산 대사 | 결제대행사 정산·대사 API 문서, 여신전문금융업법 조문 | research/정산대사_조사.md |\n| VAN·현장 결제 | VAN 3개사 규격, 여신전문금융업법과 하위 고시 | research/VAN결제_조사.md |\n| 매장 수명주기 | 국내외 프랜차이즈 운영 도구의 매장 상태 관리, 부가가치세법 시행령 임시사업장 | research/매장수명주기_조사.md |\n| 문서 표준 | ISO 5807, ISO/IEC/IEEE 29148·15289·42010 원문 | research/문서표준_조사.md |\n| 비기능 요구사항 | Core Web Vitals, 개인정보 보호법과 표준 지침, 장애인차별금지법·디지털포용법과 고시 | research/비기능요구사항_조사.md |\n| 상권 매출 분석 | 행사·팝업 운영 도구의 매출 비교 지표와 집계 기준 | research/상권매출분석_조사.md |\n| 코드 체계 | 공통표준용어·공통표준도메인, 국내 ERP 코드 부여 방식 | research/코드체계_조사.md |\n| 표시 의무 | 식품표시광고법, 어린이식생활안전관리특별법, 원산지표시법과 시행령 | research/표시의무_조사.md |\n| 표시 책임 귀속 | 원산지표시법 제5조·제18조, 어린이식생활안전관리특별법 제11조의2, 전자상거래법 제20조·제20조의2 | research/표시책임_조사.md |\n| 이상 알림 | EEMUA 191, Google SRE, 정보통신망법의 정보성·광고성 구분 | research/이상알림_조사.md |\n| 어드민 화면 표준 | KRDS, 국내외 어드민 디자인 시스템의 목록·폼·팝업 규칙 | research/어드민UIUX_조사.md |\n| 정책 문서 표준 | 전자상거래 표준약관 제10023호, 개인정보 보호법 제30조와 시행령 제31조, 처리방침 작성지침, 위치정보법 제18조·제19조, 카카오 알림톡 심사 가이드 | research/정책문서표준_조사.md |\n| 매장 개설 절차 | 배달의민족 입점, 프랜차이즈 가맹, 지역축제 먹거리 부스 모집, 결제대행사 하위가맹점 심사 | research/매장개설_조사.md |\n\n## 2. 적용 기준\n\n조사에서 나온 문제를 항목별로 기준으로 확정한다. 남은 결정은 5절에 모은다.\n\n### 2.0 두 어드민의 역할 경계\n\n내부 어드민은 기준정보를 등록하고 가맹 어드민 계정을 발급한다. 여기까지가 본사의 일이다.\n\n매장 등록, 메뉴와 판매가, 영업 상태, 주문 접수, 단말 관리는 가맹 어드민에서 한다. 본사가 같은 항목을 양쪽에서 고칠 수 있으면 어느 값이 기준인지 정할 수 없고, 매장이 자기 정보를 관리한다는 전제가 무너진다.\n\n본사가 보는 매출, 정산, 로그는 등록한 기준정보로 집계된 결과다. 본사가 값을 만들지 않는다.\n\n### 2.1 계층 구조\n\n선례가 없으므로 직접 정의한다.\n\n| 계층 | 정의 | 판단 기준 |\n| --- | --- | --- |\n| 행사 | 시작일과 종료일을 가진 운영 단위. 그 기간에만 소속 매장이 열린다 | 종료일이 지나면 소속 매장을 자동으로 영업 종료로 전환한다 |\n| 상권 | 행사 안에서 매장을 묶는 지역 구분 단위 | 통계 비교의 기본 축이다. 매장은 상권 하나에만 속한다 |\n| 브랜드 | 메뉴와 카테고리를 소유하는 단위 | 같은 브랜드의 매장은 같은 메뉴를 쓴다 |\n| 매장 | 실제 판매가 일어나는 장소 | 브랜드 하나에 속하고 그 안에서 지점번호를 갖는다 |\n\n매장 표시명은 브랜드명과 지점번호를 조합한다. 1호점, 2호점이 지점번호에 해당한다.\n\n직영과 가맹은 구분하지 않는다. 두 유형 사이에 메뉴, 가격, 권한의 정책 차이가 없다.\n\n상설 매장은 종료일이 없는 상시 행사에 소속시킨다. 행사 개념을 우회하지 않고 하나의 구조로 처리한다.\n\n상권은 전국 단위 표준 코드가 없다. 자체 코드로 관리하고 행정동 코드를 참조 항목으로 함께 보관한다. 외부 상권 데이터와 결합할 때 연결 고리가 된다.\n\n#### 매장 식별\n\n사업자등록번호를 매장 식별자로 쓰지 않는다. 법령상 유일성이 성립하지 않는다.\n\n부가가치세법 시행령 제10조는 행사장에 개설한 임시사업장을 기존사업장에 포함되는 것으로 정한다. 한 사업자가 다섯 개 행사장에 부스를 내도 사업자등록번호는 하나다. 사업자단위과세의 종된사업장도 본점 번호를 공유한다.\n\n매장에는 자체 식별자를 부여한다. 사업자등록번호는 운영 주체의 속성으로 보관하고, 국세청 상태조회로 휴폐업과 과세유형을 확인하는 용도로만 쓴다.\n\n설치기간이 10일 이내면 임시사업장 개설신고를 하지 않을 수 있다. 매장 등록 화면에서 사업자 정보를 받되 중복을 저장 불가 사유로 삼지 않는다.\n\n### 2.2 메뉴 마스터 제공 규격\n\n업계는 POS가 기준이다. 본 서비스는 ERP가 기준이므로 제공 규격을 우리가 정의한다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 소유자 | 브랜드가 메뉴와 카테고리를 소유한다. 매장은 참조한다 |\n| 생성 권한 | 메뉴와 카테고리 생성은 본사에서만 한다. 매장은 만들 수 없다 |\n| 매장 권한 | 매장 통제로 지정된 매장은 자기 매장의 판매가, 노출 여부, 품절 상태만 바꾼다 |\n| 외부 POS | 직접 등록·수정할 수 없다. 조회만 제공한다 |\n| 제공 방식 | 조회 전용. 등록·수정 기능을 열지 않는다 |\n| 제공 리소스 | 매장, 카테고리, 메뉴, 옵션 그룹, 옵션 항목 |\n| 변경 통지 | 웹훅. 매장 식별자와 변경 시각만 보낸다. 상세는 조회하게 한다 |\n| 증분 조회 | 변경 시각 기준 조회를 제공한다. 전량 재조회를 피한다 |\n| 백업 폴링 | 최종 변경 시각 조회를 30분 주기로 허용한다 |\n| 품절·일시중지 | 메뉴 전체 동기화와 분리해 항목 단위로 통지한다 |\n| 인증 | 접근 키와 비밀 키. 매장 범위는 요청 헤더로 지정한다 |\n| 멱등 | 이벤트 식별자로 중복을 걸러낸다. 2xx를 먼저 응답하고 비동기로 처리한다 |\n| 버전 | 날짜 기반으로 표기한다. 신규 버전을 먼저 시험한 뒤 전환한다 |\n\n### 2.3 표시 의무\n\n의무는 세 갈래이고 대상 판정 기준이 서로 다르다. 하나의 설정으로 묶지 않는다.\n\n| 구분 | 대상 판정 | 판정 단위 | 근거 |\n| --- | --- | --- | --- |\n| 원산지 | 영업 종류. 휴게음식점, 일반음식점, 위탁급식, 집단급식소 | 매장 | 원산지표시법 시행령 제4조 |\n| 알레르기 | 가맹사업이고 직영과 가맹 합산 50개 이상 | 브랜드 | 어린이식생활안전관리특별법 시행령 제8조 |\n| 영양성분 | 알레르기와 동일 | 브랜드 | 같은 조문 |\n\n브랜드에 알레르기·영양성분 표시 대상 값을 두고, 매장에 원산지 표시 대상 값을 둔다. 원산지는 규모와 무관하게 대상이며 제과점영업만 제외된다.\n\n팝업과 행사 매장에 예외를 두지 않는다. 표시 의무를 완화하는 규정이 없다. 완화되는 것은 시설기준과 영업신고 절차뿐이다.\n\n#### 등록 항목\n\n| 항목 | 기준 |\n| --- | --- |\n| 알레르기 | 메뉴 단위. 법정 18개 품목 중 선택한다. 자유 입력을 두지 않는다 |\n| 알레르기 함량 | 입력란을 두지 않는다. 고시가 양과 관계없이 표시하도록 정한다 |\n| 해당 없음 | 명시적으로 선택하게 한다. 미입력과 구분한다 |\n| 옵션 알레르기 | 옵션 항목마다 별도로 입력받는다. 주문 화면에서 합집합으로 계산한다 |\n| 영양성분 | 열량, 당류, 단백질, 포화지방, 나트륨 5종이다. 9종은 가공식품 기준이며 음식점에 적용되지 않는다 |\n| 표시 기준량 | 총 내용량당, 100그램당, 단위 내용량당, 1회 섭취참고량당 중 선택해 함께 보관한다 |\n| 세트 메뉴 | 총 열량을 별도로 받는다. 조합이 여럿이면 최소값과 최대값을 받는다 |\n| 산출 근거 | 영양성분에 근거 자료를 첨부한다. 근거 없는 임의 표시는 과태료 대상이다 |\n| 원산지 | 메뉴 단위. 법정 30개 품목 중 사용한 품목의 원산지를 입력한다 |\n| 쇠고기 | 원산지와 별도로 식육의 종류를 받는다. 한우, 젖소, 육우로 구분한다 |\n| 혼합 원산지 | 섞음 비율이 높은 순서로 입력한다. 순서 없는 복수 원산지는 저장하지 않는다 |\n\n입력 필수 여부는 법정 대상 여부와 무관하게 항상 필수로 둔다. 나중에 대상이 되었을 때 과거 메뉴를 소급 입력하는 일을 피한다.\n\n#### 화면 표시\n\n구체 기준이 있는 것은 원산지뿐이다.\n\n| 항목 | 원산지 | 알레르기·영양성분 |\n| --- | --- | --- |\n| 위치 | 제품명 또는 가격 옆, 위, 아래에 붙인다 | 제품명 또는 가격표시 주변 |\n| 글자 크기 | 제품명 또는 가격과 같거나 커야 한다 | 기준 없음 |\n| 글자색 | 제품명 또는 가격과 같은 색 | 바탕색과 구분되는 색상 |\n| 표시 시점 | 제품이 화면에 나타나는 시점부터 | 기준 없음 |\n| 별도 창 | 첫 화면에 그 위치를 알리는 표시를 둔다 | 기준 없음 |\n\n키오스크도 같은 기준을 적용한다. 시행규칙 별표 4가 전자적 매체 메뉴판에 통신판매 기준을 적용할 수 있게 한다.\n\n알레르기와 영양성분은 크기와 시점 기준이 없다. 원산지 기준을 준용해 설계한다. 상세 화면 하단이나 별도 탭에만 두는 구조는 근거가 약하다.\n\n매장 메뉴판에서 열량은 식품명 또는 가격 활자 크기의 80퍼센트 이상으로 표시한다. 온라인 화면에는 이 기준이 없다.\n\n#### 배달과 외부 채널\n\n배달은 포장재에 원산지를 표시한다. 어려우면 전단지, 스티커, 영수증으로 대체한다.\n\n영양성분은 온라인으로만 주문받아 배달하고 온라인으로 정보를 제공하면 리플릿 동봉을 생략할 수 있다. 채널마다 온라인 전용 여부를 두어 판정한다.\n\n2026년 10월 22일부터 통신판매중개사업자에게 입점 사업자 대상 원산지 표시제도 고지 의무가 생긴다. 아이오더는 통신판매중개자이므로 이 의무의 대상이다. 매장에 원산지 표시제도를 알리는 절차를 시행일 전에 갖춘다. 지위 판단은 2.10.3에 있다.\n\n### 2.4 메뉴 반영\n\n배포 절차를 두지 않는다. 매장이 저장하면 그 매장의 주문 채널에 반영된다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 관리 주체 | 매장. 본사는 메뉴를 만들지 않는다 |\n| 저장과 반영 | 분리하지 않는다. 저장하면 반영된다 |\n| 판매 조건 | 표시 정보가 입력되지 않은 메뉴는 판매 불가 상태로 둔다 |\n| 반영 시점 | 웹앱은 즉시. 키오스크는 유휴 시점과 결제 완료 시점. 외부 POS는 통지 후 상대가 조회 |\n| 변경 이력 | 변경 시각, 처리자, 변경 항목을 남긴다 |\n| 영업 중 변경 | 진행 중 주문이 있으면 경고를 표시한다. 진행 건은 기존 가격으로 처리한다 |\n\n조사한 상용 제품은 본사가 발행하고 매장이 받는 구조다. 본 서비스는 매장이 원본을 갖는다. 내려보낼 것이 없으므로 발행 개념이 성립하지 않는다.\n\n### 2.5 결제 데이터\n\n| 항목 | 기준 |\n| --- | --- |\n| 최상위 키 | 플랫폼 자체 결제 식별자를 쓴다. 채널별 식별자는 하위 항목으로 붙인다 |\n| 공통 항목 | 승인번호는 PG와 VAN 공통으로 보관한다. 카드 승인번호는 최대 8자다 |\n| 채널별 항목 | PG는 결제 키와 거래 키, VAN은 단말번호와 거래일련번호를 보관한다 |\n| 결제 상태 | 준비, 진행 중, 입금 대기, 완료, 취소, 부분취소, 중단, 만료 여덟 가지를 보관한다 |\n| 매입 상태 | 준비, 요청, 완료, 취소 요청, 취소 다섯 가지를 결제 상태와 별도로 보관한다 |\n| 부분취소 | 전체 금액과 취소 가능 잔액을 함께 보관한다. 두 값의 차이로 부분취소를 판정한다 |\n| 취소 참조 | 취소 건마다 금액, 사유, 시각, 거래 키를 개별로 남긴다 |\n| 매출 집계 | 채널을 통합해 집계한다 |\n| 정산 | 통합하지 않는다. VAN 대금은 카드사가 가맹점에 직접 지급한다 |\n| PG 처리 | 인증과 승인 사이에 서버가 금액을 검증한다. 검증 실패 시 승인을 호출하지 않는다 |\n| 승인 유효 시간 | 인증 후 10분이다. 승인 경로에 외부 호출이나 긴 작업을 두지 않는다 |\n| 멱등 | 헤더로 멱등키를 받는 곳은 토스페이먼츠뿐이다. 그 밖에는 주문번호 단위 잠금과 승인 상태 선점으로 대체한다 |\n| 웹훅 | 순서를 가정하지 않는다. 수신 즉시 조회 API로 다시 확인한다. 일반 결제 웹훅에는 서명 수단이 없다 |\n| 미승인 건 | 자동 취소 배치를 두지 않는다. 승인하지 않으면 결제 세션이 만료되어 결제가 성립하지 않는다 |\n| 오프라인 결제 | 설계하지 않는다. 국내 VAN 승인은 온라인 실시간이 전제다 |\n\n### 2.6 알림과 결제 복귀\n\n| 항목 | 기준 |\n| --- | --- |\n| 주문 알림 | 카카오 알림톡을 주 경로로 한다. 실패 시 문자로 대체 발송한다 |\n| 웹 푸시 | 사용하지 않는다. iOS는 브라우저 탭에서 받을 수 없다 |\n| 결제 복귀 | 복귀 주소 수신, 웹훅 수신, 서버 조회 세 경로를 함께 둔다 |\n| 결과 유실 | 복귀 결과가 없으면 서버가 결제 상태를 조회한다. 그래도 판단이 안 되면 웹훅을 기다린다 |\n| 주문 상태 | 서버에서 조회한다. 브라우저 저장소에 의존하지 않는다 |\n\n### 2.7 결제·정산 계약 구조\n\n외부 결제대행사가 정산을 전담하고 플랫폼은 정산에 필요한 정보만 제공한다. 금융위원회가 2024년 6월 보도설명자료에서 등록이 필요 없는 사례로 명시한 구조다.\n\n플랫폼은 대금을 수취하지 않는다. 자금이 플랫폼 계좌를 경유하거나 플랫폼이 매장별 정산금액을 계산해 집행하면 등록 대상이 된다. 플랫폼 명의 수납 계좌를 두지 않는 것을 설계 제약으로 못 박는다.\n\n각 매장을 결제대행사의 하위가맹점으로 등록한다. 대표가맹점은 등록 결제대행사가 맡고 플랫폼은 대표가맹점이 되지 않는다. 조건은 셋이다.\n\n1. 대표가맹점 지위를 갖는 자가 등록 결제대행사여야 한다. 선불과 직불 영역은 2025년 9월 15일부터 법정 의무다.\n2. 실제 재화와 용역을 제공한 가맹점 정보를 이용자가 알 수 있게 해야 한다.\n3. 세무자료 제출 주체가 등록 결제대행사다. 매출은 실제 가맹점에 귀속된다.\n\n매장별 사업자등록번호와 정산계좌를 매장 마스터의 필수 항목으로 관리한다. 하위가맹점 심사 완료를 주문 개시 조건으로 둔다. 행사와 상권 계층은 내부 운영 단위로만 쓰고 결제와 정산 계층에는 매장만 노출한다.\n\n2026년 12월 17일에 개정 전자금융거래법이 시행된다. 정의에 제3자 사이라는 문구가 명시되어 자기 사업 내부정산을 배제한다. 무수취 구조는 개정 후에도 등록 대상이 아니다. 다만 정산대상금액 전액을 외부에서 관리하는 의무가 신설되므로, 플랫폼이 대금을 수취하는 기능을 나중에 추가하면 그 의무까지 함께 걸린다.\n\n자금과 정보의 흐름은 다음과 같다.\n\n```arch\n== 거래 ==\n[고객]\n행위: 주문, 결제\n[매장]\n행위: 조리, 제공\n== 결제와 정산 ==\n[아이오더 플랫폼]\n역할: 주문과 결제 정보 제공\n[결제대행사]\n역할: 승인 중계, 대금 정산\n[카드사]\n역할: 승인, 대금 지급, 청구\n@ 고객 -> 매장 : 주문과 수령\n@ 고객 -> 결제대행사 : 결제 요청\n@ 결제대행사 -> 카드사 : 승인 요청\n@ 카드사 -> 결제대행사 : 대금 입금\n@ 결제대행사 -> 매장 : 대금 입금. 수수료를 뺀 금액\n@ 매장 => 결제대행사 : 결제 수수료\n@ 카드사 => 고객 : 결제대금 청구와 수납\n@ 아이오더 플랫폼 => 결제대행사 : 매장 계좌와 주문 정보\n@ 결제대행사 => 아이오더 플랫폼 : 승인 결과와 정산 내역\n!플랫폼은 자금 경로에 없다. 정보만 제공한다. 이 구조라서 전자지급결제대행업 등록 의무가 없다.\n!점선은 정보와 청구의 흐름이고 실선은 자금과 승인의 흐름이다.\n!정산 내역은 대사에만 쓴다. 플랫폼이 매장별 정산금액을 계산하지 않는다.\n```\n\n선불충전은 도입하지 않는다. 업종 기준이 폐지되어 두 매장 이상에서 쓰이면 선불전자지급수단에 해당한다. 등록 면제는 발행잔액 30억원 미만이면서 연간 총발행액 500억원 미만인 경우에만 적용된다. 두 요건을 모두 충족해야 한다. 선불충전금 전액 별도관리 의무에는 유예가 없다.\n\n### 2.8 어드민 접근 통제\n\n| 항목 | 기준 |\n| --- | --- |\n| 인증 | 외부에서 접속하는 모든 어드민 사용자에게 안전한 인증수단을 적용한다. 계정과 비밀번호만으로는 요건을 충족하지 않는다 |\n| 접근 제한 | IP 주소 기준 접근 제한을 둔다. 접속 IP를 분석해 유출 시도를 탐지한다 |\n| 로그인 실패 | 실패 횟수를 제한하고 초과 시 계정을 잠근다 |\n| 접속기록 | 계정, 일시, 접속지, 처리한 정보주체, 수행업무를 남기고 1년 이상 보관하며 월 1회 점검한다 |\n| 대행 접속 | 본사가 가맹 화면을 대신 볼 때 실제 조작자와 대상 계정을 함께 기록한다 |\n| 권한 구조 | 역할과 데이터 범위를 분리한다. 범위는 조직 계층으로 판정한다 |\n\n### 2.9 회원 체계\n\n하이브리드 웹앱에 회원 개념을 두지 않는다. 모든 주문을 비회원 주문으로 처리한다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 로그인 | 없다. 주문에 계정이 필요하지 않다 |\n| 주문자 정보 | 이름과 휴대폰번호를 입력받는다 |\n| 주문 조회 | 주문번호와 휴대폰번호 조합으로 조회한다 |\n| 알림 발송 | 입력받은 휴대폰번호로 알림톡을 보낸다 |\n| 개인정보 | 이름과 휴대폰번호를 주문 처리 목적으로만 쓴다. 수집 시 이용 목적과 보유 기간을 안내하고 동의를 받는다 |\n| 보유 기간 | 거래기록 보존 기간을 따른다. 대금결제와 재화 공급 기록은 5년이다 |\n\n쿠폰과 포인트를 두지 않으므로 회원 식별이 필요한 기능이 없다.\n\n### 2.10 주문 접수\n\nPOS가 과업 범위 밖이므로 주문을 받을 경로를 직접 만든다.\n\n주문 흐름은 스타벅스 사이렌 오더, 토스오더, 배민스토어 픽업과 대조해 정했다. 대조 결과는 `research/주문흐름_대조.md`에 있다.\n\n미응답 제한 시간을 5분으로 두는 이유는 이렇다. 토스오더는 5분, 배민스토어는 15분을 쓴다.\n배민은 배달이라 길고, 픽업만 다루는 토스오더가 본 서비스와 조건이 같다.\n행사장은 피크에 주문이 몰리고 인원이 적다. 1분은 음료 하나 만드는 동안 다음 주문이 취소되는 길이다.\n\n접수 완료 후 1분간 고객이 취소할 수 있게 두는 것은 스타벅스, 배민과 다르다.\n둘은 접수와 동시에 취소를 막는다. 본 서비스는 결제가 선불이고 행사장에서 급히 누르는 주문이 많다.\n접수 전 5분에 더해 접수 후 1분을 두어 잘못 누른 주문을 되돌릴 수 있게 한다.\n매장은 이 1분 동안 조리를 시작하지 않아도 되고, 시작했다면 취소 시 손실을 감수한다.\n1분이 지나면 조리 중으로 바뀌고 그때부터는 취소할 수 없다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 접수 화면 | 가맹 어드민에 주문 접수 화면을 둔다 |\n| 주문서 출력 | 수락 시 매장 프린터로 주문서를 출력한다. 주방이 종이로 확인한다 |\n| 프린터 미설치 | 화면 목록만으로 운영한다. 출력 실패는 화면에 표시한다 |\n| 미응답 제한 시간 | 5분. 초과하면 주문을 자동 취소한다. 남은 시간을 접수 화면에 표시하고 1분 남으면 색을 바꿔 알린다 |\n| 준비 시간 | 매장이 접수할 때 5, 10, 15, 20, 30분 중에서 고른다. 고른 값을 고객에게 알린다 |\n| 기본 준비 시간 | 매장이 매장 정보에 미리 정해 둔다. 고객이 결제하기 전에 이 값을 안내한다 |\n| 조리 중 전환 | 접수 완료 후 1분이 지나면 자동으로 조리 중으로 바꾼다. 매장이 누르지 않는다 |\n| 취소 가능 구간 | 접수 대기와 접수 완료에서만 취소한다. 조리 중부터는 취소 기능을 제공하지 않는다 |\n| 거절 사유 | 품절, 재료 소진, 마감, 기타 중에서 고른다. 품절이면 그 메뉴를 품절로 바꾼다. 사유는 고객 안내와 본사 통계에 쓴다 |\n| 미수령 주문 | 조리 완료 후 고객이 오지 않으면 영업 종료 한 시간 뒤 배치가 수령 완료로 바꾼다. 결제는 그대로 두고 미수령으로 기록한다 |\n| 조리 시작 이후 환불 | 시스템에서 처리하지 않는다. 환불 여부는 매장이 현장에서 판단한다 |\n| 결제수단 | 결제대행사가 제공하는 수단과 현장 카드 단말 결제만 받는다. 현금은 받지 않는다 |\n| 채널별 수단 | 하이브리드 웹앱은 결제대행사 결제창, 키오스크는 현장 카드 단말을 쓴다 |\n| 현금영수증 | 현금을 받지 않으므로 발행 화면을 두지 않는다 |\n| 호출 순번 | 주문 확정 시점에 매장별로 부여한다. 매일 1번부터 다시 시작한다 |\n| 순번과 주문번호 | 순번은 현장에서 부르는 번호다. 주문 조회와 대사에는 주문번호를 쓴다 |\n\n### 2.10.1 서비스를 열기 전에 갖출 정책\n\n법으로 갖춰야 하는 것과 아직 정하지 않은 것을 나눠 둔다. 근거는 `research/필수정책_조사.md`에 있다.\n\n| 항목 | 근거 | 누가 | 지금 상태 |\n| --- | --- | --- | --- |\n| 개인정보 처리방침 | 개인정보 보호법 제30조, 시행령 제31조 | 본사 | 목차와 항목, 수탁자, 보호책임자 표기를 확정했다. 2.10.4 참조 |\n| 이용약관 | 전자상거래법 제13조 제2항 | 본사 | 표준약관 제10023호 기준으로 쓸 조와 뺄 조를 확정했다. 시행일과 개정 절차도 정했다 |\n| 위치기반서비스 이용약관 | 위치정보법 제19조 | 본사 | 이용약관과 분리해 별도 문서로 둔다 |\n| 통신판매업 신고 | 전자상거래법 제12조 | 매장마다 | 신고번호를 상권 등록에서 받는다 |\n| 위치기반서비스사업 신고 | 위치정보법 제9조 | 본사 | 신고 대상으로 보고 갖춘다. 신고 접수와 위치정보관리책임자 지정이 남는다 |\n| 알림톡 템플릿 | 카카오 알림톡 심사 | 본사 | 유형과 문구, 변수를 확정했다. 행사 개시 10영업일 전까지 심사를 넣는다 |\n\n세 문서는 서비스 개시일을 시행일로 하고, 시행일 7일 전에 게시한다.\n최종 문구는 법률 검토를 거쳐 확정한다. 담을 내용과 순서는 2.10.4에서 정했다.\n\n### 2.10.2 위치정보 처리\n\n**신고 대상으로 보고 갖춘다.** 면제 여부를 다투지 않는다.\n\n면제는 단말 안에서만 일시로 처리하고 외부로 보내지 않는 경우에 볼 여지가 있을 뿐이고,\n서비스 구조와 처리 방식에 따라 판단이 갈린다. 갈리는 상태로 서비스를 열면\n동의 없이 위치정보를 수집·이용한 것이 되어 5년 이하 징역 또는 5천만원 이하 벌금까지 갈 수 있다.\n신고와 그에 따른 의무를 갖추는 비용이 이 위험보다 훨씬 작다.\n\n| 항목 | 근거 | 본 서비스의 처리 |\n| --- | --- | --- |\n| 사업 신고 | 위치정보법 제9조 | 본사가 방송통신위원회에 신고한다 |\n| 이용약관 명시 | 제19조 | 위치기반서비스 이용약관을 따로 둔다. 내용은 2.10.4에 있다 |\n| 별도 동의 | 제18조·제19조 | 위치 권한을 요청하기 전에 안내하고 동의를 받는다. 개인정보 동의와 따로 받는다 |\n| 이용·제공 사실 확인자료 | 제16조 제2항 | 좌표를 저장하지 않으므로 보관할 자료가 없다. 그 사실을 약관에 적는다 |\n| 제3자 제공 | 제19조 제4항 | 제공하지 않는다 |\n| 관리책임자 | 제26조 | 본사가 지정하고 소속과 연락처를 약관에 적는다 |\n| 8세 이하 아동 등 | 제25조 | 보호의무자의 동의로 갈음한다 |\n\n**반경 판정은 단말에서 한다.** 신고를 하더라도 좌표를 서버로 보낼 이유가 없다.\n개인정보를 최소로 다루는 것이 원칙이고, 보관하는 위치정보가 없으면 유출 위험도 없다.\n신고는 하되 좌표는 저장하지 않는 조합으로 간다.\n\n반경 확인은 다른 곳에서 QR을 찍어 주문하는 것을 막는 장치다.\n**위치 권한을 거부해도 주문할 수 있게 두고 반경 확인만 건너뛴다.**\n위치정보 동의는 선택 동의이므로 거부를 이유로 서비스를 막지 않는다.\n\n### 2.10.3 플랫폼의 법적 지위\n\n음식을 팔고 대금을 받는 것은 매장이다. 아이오더는 주문을 받아 매장에 전달하는 수단을 제공하고,\n결제는 결제대행사가 처리하며 아이오더는 대금을 수취하지 않는다.\n따라서 **아이오더는 통신판매중개자이고 매장이 통신판매중개의뢰자다.**\n\n| 조문 | 의무 | 반영 |\n| --- | --- | --- |\n| 전자상거래법 제20조 제1항 | 자신이 거래 당사자가 아니라는 사실을 미리 고지한다 | 판매자 정보 화면에 적는다 |\n| 제20조 제2항 | 중개의뢰자의 정보를 제공하거나 열람할 방법을 제공한다 | 판매자 정보 화면이 그 방법이다 |\n| 제20조의2 제1항·제2항 | 위 둘을 하지 않았거나 정보가 사실과 다르면 연대해 배상한다 | 매장 정보는 상권 등록에서 받고 변경 이력을 남긴다 |\n| 제20조의2 제3항 | 분쟁이 생기면 원인과 피해를 파악하는 등 필요한 조치를 신속히 시행한다 | 2.10.5에 절차를 둔다 |\n\n분쟁 처리는 선택이 아니라 의무다. 매장 연락처만 안내하고 손을 떼면 이 조항에 어긋난다.\n\n### 2.10.4 정책 문서\n\n근거와 작성 기준은 `research/정책본문_조사.md`에 있다.\n아래는 문서에 담을 내용이다. 최종 문구는 법률 검토를 거쳐 확정한다.\n\n#### 이용약관\n\n공정거래위원회 「전자상거래(인터넷사이버몰) 표준약관」 제10023호를 기준으로 삼는다.\n표준약관 24개 조 가운데 회원 제도와 배송, 연결몰 조항을 빼고 중개와 현장 수령 조항을 더한다.\n조별 판단은 `research/정책문서표준_조사.md`에 있다.\n\n| 구분 | 조 |\n| --- | --- |\n| 그대로 쓴다 | 목적, 정의, 약관의 명시와 개정, 서비스의 제공과 변경, 서비스의 중단, 구매신청과 개인정보 제공 동의, 환급, 청약철회의 효과, 개인정보보호, 이용자의 의무, 저작권, 분쟁해결, 재판권과 준거법 |\n| 고쳐 쓴다 | 계약의 성립, 지급방법, 수신확인통지와 구매신청 변경·취소, 재화 등의 공급, 청약철회, 아이오더의 의무 |\n| 뺀다 | 회원가입, 회원 탈퇴와 자격 상실, 회원에 대한 통지, 회원 ID와 비밀번호 의무, 연결몰과 피연결몰의 관계 |\n| 더한다 | 중개자의 지위와 책임, 매장의 접수와 거절, 준비 시간, 미수령 마감 |\n\n고쳐 쓰는 조에 담을 내용이다.\n\n| 조 | 정할 내용 |\n| --- | --- |\n| 계약의 성립 | 매장이 접수한 때 성립한다. 결제 승인만으로는 성립하지 않는다 |\n| 지급방법 | 결제대행사를 통한 카드와 간편결제만 둔다. 아이오더는 대금을 수취하지 않는다 |\n| 수신확인통지·변경·취소 | 접수 전과 접수 후 1분까지 고객이 취소한다. 조리 중부터는 취소할 수 없다 |\n| 재화 등의 공급 | 배송이 아니라 매장에서 직접 받는다. 준비 완료를 알림톡으로 알린다 |\n| 청약철회 | 조리를 시작한 음식은 다시 판매할 수 없어 철회를 제한한다 |\n| 아이오더의 의무 | 중개자로서 매장 정보를 제공하고 분쟁 발생 시 원인과 피해를 파악한다 |\n\n더하는 조에 담을 내용이다.\n\n| 조 | 정할 내용 |\n| --- | --- |\n| 중개자의 지위 | 아이오더는 통신판매중개자이고 매장이 판매자다. 아이오더는 거래 당사자가 아니다 |\n| 매장의 거절 | 거절하거나 5분 안에 접수하지 않으면 자동 취소하고 전액 환불한다 |\n| 준비 시간 | 매장이 접수할 때 정한 준비 시간은 예상 시간이며 현장 상황에 따라 달라질 수 있다 |\n| 미수령 | 영업 종료 한 시간 뒤 수령 완료로 마감하고 환불하지 않는다 |\n\n청약철회 제한은 약관에 적는 것만으로 효력이 생기지 않는다.\n전자상거래법 제17조 제6항이 소비자가 쉽게 알 수 있는 곳에 표시하도록 정하므로 결제 전 화면에 함께 적는다.\n미수령을 환불하지 않는 것도 고객에게 불리한 조항이므로 같은 자리에 적는다.\n\n시행일은 서비스 개시일로 하고 시행일 7일 전에 게시한다.\n개정은 표준약관 제3조가 정한 방식을 따른다. 적용일자와 개정사유를 밝혀 적용일자 7일 전부터 공지하고,\n고객에게 불리한 개정은 30일 전부터 공지하면서 개별 통지한다. 이전 판은 지우지 않고 시행일과 함께 남긴다.\n\n#### 위치기반서비스 이용약관\n\n위치정보법 제19조가 요구하는 명시 사항은 이용약관에 담아야 한다.\n이용약관 안의 한 조로 두지 않고 별도 문서로 둔다. 위치정보 동의를 개인정보 동의와 따로 받고,\n거부해도 주문할 수 있게 두었으므로 동의 단위와 문서 단위를 맞추는 편이 확인하기 쉽다.\n\n| 항목 | 본 서비스의 내용 |\n| --- | --- |\n| 사업자 정보 | 상호, 주소, 전화번호 등 연락처 |\n| 서비스의 내용 | 매장 반경 안에서 주문하는지 확인한다 |\n| 개인위치정보의 보유목적과 보유 기간 | 반경 판정에만 쓰고 단말에서 판정한 뒤 즉시 버린다. 서버로 보내지 않는다 |\n| 이용·제공 사실 확인자료 | 좌표를 서버로 보내지 않으므로 남는 자료가 없다. 그 사실을 적는다 |\n| 제3자 제공 | 하지 않는다. 제공하지 않으므로 통보할 내역도 없다 |\n| 이용자와 법정대리인의 권리 | 동의 철회, 이용·제공 사실 확인자료 열람, 오류 정정을 요구할 수 있다. 거부해도 주문할 수 있다 |\n| 8세 이하 아동 등 | 보호의무자의 동의로 갈음한다 |\n| 관리책임자 | 본사가 지정하고 소속과 연락처를 적는다 |\n| 손해배상과 분쟁조정 | 위치정보법 제27조·제28조에 따른 절차를 적는다 |\n\n#### 개인정보 처리방침\n\n개인정보 보호법 제30조 제1항 각 호와 시행령 제31조가 정한 항목을 모두 담는다.\n순서는 개인정보보호위원회 「개인정보 처리방침 작성지침」(2025.4.)을 따른다.\n\n| 순서 | 항목 | 본 서비스의 내용 |\n| --- | --- | --- |\n| 1 | 처리 목적 | 주문 접수와 처리, 주문 상태 안내, 주문 조회 |\n| 2 | 처리하는 개인정보 항목 | 이름, 휴대폰번호 |\n| 3 | 처리 및 보유 기간 | 전자상거래법에 따라 5년. 목적을 다하면 그 전에 파기한다 |\n| 4 | 제3자 제공 | 하지 않는다. 없다고 적는다 |\n| 5 | 처리업무 위탁 | 결제대행사, 알림 발송사, 클라우드 사업자 |\n| 6 | 파기 절차와 방법 | 보유 기간이 지나면 배치가 지운다. 주문번호와 금액은 남기고 개인 식별 항목만 지운다. 전자상거래법에 따라 보존하는 분은 보존근거와 항목을 적는다 |\n| 7 | 정보주체와 법정대리인의 권리·의무와 행사 방법 | 열람, 정정, 삭제, 처리정지를 요구할 수 있다. 접수 창구를 둔다 |\n| 8 | 안전성 확보조치 | 접근 권한 관리, 접속기록 보관과 점검, 암호화, 접근 통제 |\n| 9 | 자동 수집 장치 | 쓰지 않는다고 적는다 |\n| 10 | 개인정보 보호책임자 | 부서 명칭과 대표 연락처를 적는다 |\n| 11 | 권익침해 구제 방법과 처리방침 변경 | 분쟁조정위원회 등 구제 창구, 시행일, 이전 판 조회 |\n\n수탁자에 클라우드 사업자를 넣는다. 주문자 이름과 휴대폰번호가 클라우드에 저장되므로 위탁에 해당한다.\n\n보호책임자는 개인의 성명 대신 부서 명칭과 대표 연락처를 적는다. 법이 요구하는 창구는 그대로 두면서\n담당자가 바뀔 때마다 처리방침을 고치지 않아도 된다.\n\n민감정보, 가명정보, 국외 이전, 14세 미만 아동 처리는 해당하지 않는다.\n제3자 제공과 국외 이전은 없다는 사실을 적고, 나머지는 항목을 두지 않는다.\n\n#### 알림톡 템플릿\n\n기본형에 웹링크 버튼 하나를 붙인다. 강조표기형과 이미지형은 쓰지 않는다.\n심사 기준과 근거는 `research/정책문서표준_조사.md`에 있다.\n\n| 보낼 때 | 문구 |\n| --- | --- |\n| 접수 | #{매장명}에서 주문을 접수했습니다. 준비 시간은 약 #{준비시간}분입니다. 주문번호 #{주문번호} |\n| 거절 | #{매장명}에서 주문을 준비할 수 없어 취소되었습니다. #{사유} 결제 금액은 전액 취소됩니다. 주문번호 #{주문번호} |\n| 준비 완료 | #{매장명}에서 음식이 준비되었습니다. 순번 #{순번}으로 받아 가세요. |\n| 미수령 마감 | #{매장명}의 주문이 영업 종료로 마감되었습니다. 주문번호 #{주문번호} |\n\n거절 사유는 문구로 바꿔 넣는다. 품절과 재료 소진은 \"재료가 떨어져 준비할 수 없습니다\",\n마감은 \"영업이 끝나 준비할 수 없습니다\", 기타와 미응답은 \"매장 사정으로 준비할 수 없습니다\"다.\n\n| 심사 기준 | 지키는 방법 |\n| --- | --- |\n| 정보성 메시지 | 계약 이행 정보만 담는다. 홍보와 할인 문구를 넣지 않는다 |\n| 변수 | 네 종 모두 변수 세 개 이하다. 변수마다 예시 텍스트를 함께 등록한다 |\n| 버튼 | 버튼명은 \"주문 상태 보기\"로 고정한다. 버튼명에 변수를 넣지 않는다 |\n| 채널 추가 | 유도 문구를 넣지 않는다 |\n| 심사 기간 | 영업일 2일이다. 반려와 재제출을 감안해 행사 개시 10영업일 전까지 제출한다 |\n\n### 2.10.5 분쟁 처리\n\n전자상거래법 제20조의2 제3항이 정한 의무다. 매장 연락처만 안내하고 끝내지 않는다.\n\n```text\n고객 문의 접수\n ↓\n주문 기록 확인\n ├─ 주문과 결제 내역\n ├─ 상태 변경 이력과 시각\n └─ 알림 발송 기록\n ↓\n원인 판정\n ├─ 시스템 문제   → 아이오더가 처리한다\n ├─ 매장 문제     → 매장에 확인을 요청하고 결과를 고객에게 알린다\n └─ 판단이 갈림   → 양쪽 기록을 정리해 함께 확인한다\n ↓\n처리 결과 통지\n ↓\n처리 기록 보관   ← 같은 유형이 반복되면 매장별로 집계해 본사가 확인한다\n```\n\n접수 창구는 본사 대표 연락처로 한다. 처리 기한은 접수한 날부터 3영업일로 둔다.\n조리 시작 이후 환불은 매장이 판단하지만, 매장이 응답하지 않으면 아이오더가 기록을 근거로 처리한다.\n\n### 2.10.6 매장 개설 절차\n\n매장은 가맹 관리자가 만들고 본사가 개시를 확정한다. 근거는 `research/매장개설_조사.md`에 있다.\n배달앱 입점, 프랜차이즈 개설, 축제 부스 선정이 모두 \"정보는 매장이 내고 돈이 걸린 확정은 주최가 한다\"는 모양이다.\n\n| 단계 | 누가 | 상태 |\n| --- | --- | --- |\n| 매장 등록 | 가맹 관리자 | 개설 준비 |\n| 하위가맹점 심사 | 결제대행사 (본사가 정보를 넘긴다) | 개설 준비 |\n| 개시 확정 | 본사. 심사 결과가 자동으로 오면 사람이 누르지 않는다 | 영업 |\n\n개설 준비 동안은 주문 채널에 나오지 않고 정산에도 들어가지 않는다. 메뉴와 단말은 미리 갖춘다.\n확정 전에는 매장이 소속 행사를 바꿀 수 있고, 확정 뒤에는 잠긴다.\n확정 근거가 결제대행사 심사이므로 본사의 자의가 끼지 않는다.\n\n### 2.11 상권 통계\n\n제품 내장 기능이 없으므로 자체 집계로 만든다. 행사와 상권 단위로 진행 중 매출을 비교하는 기능은 국내에서 확인된 사례가 없다.\n\n#### 집계\n\n| 항목 | 기준 |\n| --- | --- |\n| 집계 축 | 행사, 상권, 브랜드, 매장, 채널, 결제수단, 기간 |\n| 집계 방식 | 야간 배치로 집계 테이블을 만든다. 당일 구간은 운영 데이터에서 조회한다 |\n| 적재 시점 | 집계 테이블은 주문이 발생하는 시점부터 함께 적재한다. 나중에 만들면 과거 구간이 빈다 |\n| 시작 시점 | 주문이 발생하는 단계에서 함께 시작한다. 나중에 만들면 과거 구간이 빈다 |\n\n#### 비교 지표\n\n행사 기간과 매장 수가 다르므로 총매출만으로는 비교가 되지 않는다. 세 지표를 함께 낸다.\n\n| 지표 | 산식 | 용도 |\n| --- | --- | --- |\n| 매장·일 평균 매출 | 총매출 ÷ (매장 수 × 운영일수) | 상권 간 1차 비교 |\n| 객수 | 결제 건수 | 매출 변화의 원인 분해 |\n| 객단가 | 매출 ÷ 결제 건수 | 같음 |\n\n맥도날드와 스타벅스가 동일점포매출을 객수와 객단가로 나눠 공시하는 방식을 따른다. 어느 상권이 잘 팔린다는 것이 사람이 많아서인지 많이 사서인지 구분해야 다음 행사 구성에 반영할 수 있다.\n\n매장당 평균 매출을 낼 때 영업일수를 지표 정의 안에서 제거한다. Noodles and Company는 매출을 그 기간의 영업일수로 나눈 뒤 표준 영업일수를 곱해 환산한다. 같은 방식으로 매장 수와 운영일수를 모두 분모에 넣는다.\n\n운영일수가 지나치게 짧은 매장은 평균을 왜곡한다. 최소 운영일수를 정해 그에 못 미치는 매장을 평균 산정에서 제외하고, 제외한 매장 수를 함께 표시한다. Wingstop이 개점 52주 이상 매장만으로 평균을 내는 것과 같은 취지다.\n\n요일 구성 차이를 보정한다. 맥도날드는 요일과 휴일 구성의 영향을 별도 조정 항목으로 공시하며, 그 영향이 기간이 짧을수록 크다고 밝힌다. 행사는 1~2주다. 주중과 주말을 분리해 집계하고 같은 요일 유형끼리 비교한다.\n\n입장객 수를 확보할 수 있는 행사에 한해 1인당 지출을 부가 지표로 제공한다. 확보하지 못하는 행사가 많으므로 필수 지표로 두지 않는다.\n\n1인당 지출은 방문객 구성에 따라 크게 갈린다. 한국관광공사가 문화관광축제 62개를 분석한 결과 전체 평균은 32,415원이나 외지인은 53,951원, 현지인은 1,480원이다. 36배 차이다. 구성을 나누지 않은 값은 해석하기 어렵다. 구성 정보를 받을 수 있으면 나눠서 제공한다.\n\n1인당 지출을 낼 때 분모의 단위를 밝힌다. 전시 산업 감사 규칙은 방문객과 방문을 구분한다. 방문객은 행사 전 기간에 한 번만 세고, 방문은 하루에 한 번 센다. 방문객 기준은 개최일수에 거의 영향받지 않고 방문 기준은 일수에 비례한다. 어느 단위로 받은 값인지 모르면 행사 간 비교가 성립하지 않는다.\n\n기상 보정은 초기 범위에서 다루지 않는다. 소매와 외식 기업 중 날씨 영향을 수치로 분리해 공시한 사례가 확인되지 않는다. 제도화된 곳은 전력업계뿐이다. 근거 없이 보정하면 판단을 흐린다.\n\n#### 잠정치와 확정치\n\n당일 수치가 바뀌는 것은 정상이다. 카드 매출전표 제출 기한이 승인일부터 30일이고 매입취소는 사흘가량 걸린다. 정산은 영업일 기준이므로 주말과 공휴일이 끼면 더 늦다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 상태 | 매출 레코드에 잠정과 확정을 두고 확정 시각을 함께 보관한다 |\n| 화면 표기 | 잠정치를 숨기지 않는다. 주석이 아니라 숫자 옆에 표시한다 |\n| 확정 전환 | 배치로 처리하고 전환 시 원래 수치와의 차이를 보관한다 |\n| 진행 중 판단 | 잠정치 기준으로 화면을 만든다. 확정을 기다리면 행사가 끝난다 |\n| 취소 반영 | 매입 후 취소는 취소 일자에 별도 거래로 기록한다. 원거래 일자로 소급하지 않는다 |\n| 승인취소 | 매입 전 취소는 원거래가 매출로 확정되지 않는다. 매출에서 제외한다 |\n\n한국은행은 속보치와 잠정치 사이에 7주 간격을 두고, 개정 사유를 기간 마지막 구간의 실적자료 미확보로 설명한다. 행사 매출도 같은 구조다.\n\n국가데이터처 소매판매액지수는 최근 2개월을 잠정치로 두고 보도자료 표지에 그 사실을 밝힌다. 연쇄지수 특성상 매년 초에 직전연도 수치가 한 번 더 수정된다. 공표 자료에서도 수정 경로가 두 갈래다.\n\n#### 데이터 완전성\n\n행사장에는 현금만 받는 부스가 실재한다. 본 서비스는 현금을 받지 않으므로 그런 매장의 매출은 플랫폼에 들어오지 않는다.\n\n플랫폼 밖 현금 매출을 입력받지 않는다. 대신 주문 채널을 쓰지 않는 매장을 상권 비교에서 제외 대상으로 표시한다. 일부만 집계된 수치를 전체인 것처럼 보여주지 않는다.\n\n#### 외부 데이터 결합\n\n초기 범위에서 제외한다. 공공 상권 체계로는 요구를 충족하지 못한다.\n\n건물 내부의 층과 구역을 표현할 수 없다. 공공 상권의 최소 단위는 골목상권 수준의 면적 구역이다. 서울 밖에는 전국 단위 상권 경계 파일이 없다. 갱신도 분기 단위이거나 비정기여서 진행 중 판단에 쓸 수 없다.\n\n상권 마스터에 자체 코드를 두고 중심좌표, 폴리곤, 행정동코드, 서울 상권코드를 부가 필드로 관리한다. 서울 지역은 공개된 상권 경계 파일과 공간 교차로 연결하고, 그 밖의 지역은 행정동코드까지만 연결한다. 공공 데이터는 사후 대조용이지 운영 지표가 아니다.\n\n### 2.12 관리 주체\n\n본사와 매장이 다루는 대상을 나눈다. 같은 대상을 둘이 함께 고치지 않는다.\n\n| 대상 | 본사 | 매장 |\n| --- | --- | --- |\n| 행사, 상권, 브랜드 | 관리. 상권이 참여할 행사를 여러 건 지정한다 | 조회 불가 |\n| 매장 등록과 상태 | 개시 확정 | 등록과 폐점. 설정 > 매장에서 등록하고 상권의 참여 행사 중에서 소속 행사를 고른다. 개시는 본사가 하위가맹점 심사 결과로 확정한다 |\n| 가맹 관리자 계정 | 발급 | 불가 |\n| 카테고리, 메뉴, 옵션 | 불가 | 관리 |\n| 판매가 | 불가 | 관리 |\n| 알레르기, 원산지, 영양성분 | 불가 | 관리 |\n| 품절 | 불가 | 관리 |\n| 매출 조회 | 전체 매장 | 담당 매장 |\n| 외부 연동 계정 | 관리 | 불가 |\n\n가맹 어드민에 회원가입을 두지 않는다. 본사가 계정을 발급하고 담당 매장 범위를 지정한다.\n\n표시 정보를 매장이 관리하므로 입력 책임도 매장에 있다. 미입력 메뉴는 판매할 수 없게 막아 누락이 운영으로 넘어가지 않게 한다.\n\n### 2.13 품절 처리\n\n품절로 설정한 메뉴는 주문 채널에서 노출하지 않는다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 노출 | 품절 메뉴는 목록에 표시하지 않는다. 담기 차단이나 품절 표시를 쓰지 않는다 |\n| 반영 시점 | 웹앱은 즉시. 키오스크는 유휴 시점과 결제 완료 시점 |\n| 설정 주체 | 본사와 매장 모두 설정한다. 뒤에 설정한 값이 적용되고 처리자를 기록한다 |\n| 재개 | 재개 예정 시각을 지정하면 그 시각에 자동으로 노출된다 |\n| 장바구니 | 담은 뒤 품절되면 장바구니에서 해당 항목을 제거하고 사용자에게 알린다 |\n| 외부 POS | 품절 통지를 별도 경로로 보낸다. 상대가 노출을 제어한다 |\n\n조사한 상용 제품은 품절 메뉴를 표시하고 선택만 막는 방식과 목록에서 제외하는 방식을 모두 제공한다. 본 서비스는 제외로 통일한다. 행사 매장은 회차마다 품절이 잦아 표시된 메뉴를 선택했다가 막히는 경험이 반복되면 주문 속도가 떨어진다.\n\n### 2.14 계정 정책\n\n가맹 어드민에 회원가입을 두지 않는다. 본사가 계정을 발급한다. 그래서 잃어버렸을 때의 복구 경로를 반드시 둔다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 발급 | 본사가 이메일, 이름, 연락처, 비밀번호, 권한, 담당 매장 범위를 지정해 만든다 |\n| 초기 비밀번호 | 등록한 휴대폰번호로 보낸다. 첫 로그인 시 변경을 강제한다 |\n| 변경 | 이메일은 바꿀 수 없다. 담당자가 바뀌면 계정을 사용 중지하고 새로 발급한다 |\n| 재설정 | 이메일과 등록된 휴대폰번호로 본인을 확인한 뒤 인증번호를 보낸다 |\n| 재설정 안내 | 이메일과 휴대폰번호 중 어느 쪽이 틀렸는지 밝히지 않는다 |\n| 로그인 실패 | 연속 5회 실패하면 계정을 잠근다. 성공하면 횟수를 초기화한다 |\n| 실패 안내 | 남은 횟수를 함께 보여준다. 갑자기 잠기지 않게 한다 |\n| 잠금 해제 | 매장 계정은 비밀번호 재설정을 마치면 자동으로 풀린다. 본인 확인을 거치기 때문이다 |\n| 본사 해제 | 본사가 계정 목록에서 직접 풀 수 있다. 사유를 남긴다 |\n| 본사 계정 | 본사 계정이 잠기면 다른 본사 운영자가 푼다. 전원이 잠기는 상황을 막기 위해 본사 계정은 둘 이상 유지한다 |\n| 인증 실패 제한 | 재설정 과정의 인증번호 실패가 이어지면 일정 시간 차단하고 본사 문의로 안내한다 |\n| 이전 값 | 직전 비밀번호와 같은 값으로 바꾸지 못한다 |\n| 변경 기록 | 계정, 시각, 접속 주소, 처리 방식을 남긴다 |\n| 권한 변경 | 권한과 담당 매장 범위를 바꾸면 변경 전후 값을 별도 이력으로 남긴다 |\n\n잠금 해제를 두 경로로 둔다. 매장이 스스로 풀 수 있어야 야간과 주말에 영업이 멈추지 않고, 본사 해제를 남겨야 재설정 경로까지 막힌 경우를 처리할 수 있다.\n\n권한 변경을 접속기록과 분리한다. 접속기록은 누가 들어왔는지를 남기고, 계정 변경 이력은 누가 누구의 권한을 바꿨는지를 남긴다. 두 질문이 다르다.\n\n### 2.15 표시 정보 책임\n\n알레르기와 영양성분, 원산지는 메뉴를 등록한 매장이 입력하고 그 내용에 책임을 진다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 입력 주체 | 매장 |\n| 입력 시점 | 메뉴 등록 시. 법정 의무 대상 여부와 무관하게 받는다 |\n| 미입력 처리 | 판매 불가 상태로 두고 주문 채널에 노출하지 않는다 |\n| 검증 | 시스템이 필수 항목 누락만 막는다. 값의 사실 여부는 검증하지 않는다 |\n| 본사 관여 | 두지 않는다 |\n| 책임 | 표시 내용의 정확성은 매장에 있다. 가맹 계약서에 명시한다 |\n\n본사 검수 절차를 두지 않는다. 행사 개시 전 며칠 사이에 수백 건이 몰리고, 본사가 원산지의 사실 여부를 확인할 방법이 없다. 확인하지 못하는 것을 확인한 것처럼 기록하면 책임 소재만 흐려진다.\n\n표시 위반의 과태료는 조리·판매하는 매장에 부과된다. 원산지 표시 의무자는 판매하는 자이고(원산지표시법 제5조제1항, 미표시 1천만원 이하 과태료), 알레르기 표시 의무자는 각 가맹점 영업자다(어린이식생활안전관리특별법 제11조의2). 대상 판정만 브랜드 규모로 하고 의무는 매장에 있다.\n\n플랫폼에는 식품 표시 법령상 의무가 없다. 다만 전자상거래법 제20조와 제20조의2에 따라 중개자로서 고지 의무와 연대 배상 책임이 남는다. 매장이 등록한 정보를 그대로 전달하고 등록 주체와 시각을 남긴다.\n\n원산지표시법에 통신판매중개업자의 방치 금지 의무를 넣는 개정안이 발의되어 있다. 시행되면 매장 표시 상태를 점검하는 기능을 검토한다. 지금의 누락 차단과 안내 이력은 시행되더라도 방치하지 않았다는 근거가 된다. 조사 근거는 `research/표시책임_조사.md`에 있다.\n\n대신 매장이 입력을 빠뜨리지 못하게 막는다. 미입력 메뉴는 저장은 되지만 팔리지 않는다.\n\n### 2.16 메뉴 가져오기\n\n매장이 메뉴 원본을 가지므로 행사가 바뀔 때마다 다시 등록하게 된다. 가져오기로 그 부담을 줄인다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 대상 | 같은 사업자의 이전 매장, 같은 브랜드의 다른 매장 |\n| 범위 | 카테고리, 메뉴, 옵션 구성, 알레르기, 원산지 |\n| 제외 | 판매가. 매장마다 다르므로 복사하지 않는다 |\n| 중복 | 같은 이름이 있으면 덮어쓰기와 건너뛰기 중 고르게 한다 |\n| 판매가 미입력 | 판매 불가 상태로 저장한다 |\n| 기록 | 원본 매장, 대상 건수, 처리자, 시각을 남긴다 |\n\n조사한 상용 제품은 복사보다 버전 생성을 권장한다. 복사가 리포팅에서 중복 항목을 만들기 때문이다. 다만 버전은 상위 소유자와 하위 대상이라는 계층이 있어야 성립한다. 본 서비스는 매장이 원본을 가지므로 그 축이 없다.\n\n같은 구조를 가진 제품은 실제로 값 복사를 제공한다. Square의 메뉴 복제는 복제본이 원본과 독립적으로 동작하고, 토스플레이스의 상품 불러오기도 값 복사다. 원본 연결을 유지하는 Olo와 Lightspeed는 모두 본사 마스터 모델이다.\n\nLightspeed는 반대 사례다. 상품을 공유 상태로 바꾸면 되돌릴 수 없고 원본 매장에서만 수정할 수 있게 된다. 연결을 만들면 해제 경로를 함께 설계해야 하고, 설계하지 못하면 매장 자율성이 영구히 사라진다.\n\n복사한 메뉴는 원본과 연결하지 않고 독립된 값으로 둔다. 원본 매장이 바뀌어도 따라가지 않는다.\n\n리포팅 중복은 실재하는 위험이므로 보완한다.\n\n| 보완 | 내용 |\n| --- | --- |\n| 브랜드 집계 축 | 원본의 브랜드 메뉴 식별자를 함께 복사한다. 매장 메뉴 코드와 별개로 브랜드 단위 집계에 쓴다. 값만 물려받고 수정은 연동하지 않는다 |\n| 표시 정보 | 복사한 알레르기와 원산지는 미확인 상태로 둔다. 매장이 확인해야 판매 가능 상태가 된다 |\n| 노출 순서 | 카테고리와 옵션의 정렬 순서를 함께 복사한다 |\n\n원산지는 매장과 시기에 따라 달라진다. 복사한 값을 그대로 판매에 쓰면 표시가 사실과 어긋날 수 있다.\n\n### 2.17 개인정보 파기\n\n보유 기간만 정하고 지우는 절차가 없으면 기간 이상 보유하게 된다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 대상 | 주문자명, 휴대폰번호 |\n| 유지 | 주문번호, 금액, 결제 식별자는 남긴다. 매출 집계와 대사에 쓴다 |\n| 판정 | 주문 종결일부터 보유 기간이 지난 건 |\n| 실행 | 일 배치 |\n| 방법 | 복원할 수 없는 방법으로 처리한다 |\n| 기록 | 파기 시각, 대상 건수, 파기 항목, 처리 결과를 남긴다 |\n\n파기해도 매출은 유지된다. 개인 식별 항목만 지우고 거래 기록은 남긴다.\n\n### 2.18 알림 발송 관리\n\n| 항목 | 기준 |\n| --- | --- |\n| 주 경로 | 알림톡 |\n| 대체 | 발송 실패 시 문자로 다시 보낸다 |\n| 이력 | 주문번호, 시각, 경로, 수신 번호, 결과를 남긴다 |\n| 재발송 | 매장이 주문 상세에서 직접 다시 보낼 수 있다 |\n| 확인 위치 | 가맹 어드민의 알림 발송 이력 |\n\n발송 실패를 아무도 모르는 상태를 만들지 않는다. 고객이 조리 완료를 못 받으면 음식이 식는다.\n\n### 2.19 배치 운영\n\n| 항목 | 기준 |\n| --- | --- |\n| 대상 | 매출 집계, 개인정보 파기, 알림 재발송 |\n| 이력 | 배치명, 실행 시각, 대상 건수, 처리 건수, 결과를 남긴다 |\n| 실패 처리 | 실패 사유를 남기고 화면에 표시한다 |\n| 재실행 | 운영자가 직접 다시 실행한다. 이미 처리한 건은 건너뛴다 |\n| 확인 위치 | 내부 어드민의 배치 실행 이력 |\n\n### 2.20 매장 수명주기\n\n행사가 끝나면 매장을 철수하고 다음 행사에 다시 배치한다. 이 구조에서 상태와 소속을 어떻게 다룰지 정한다.\n\n#### 상태값\n\n기존 세 값에 폐점을 더해 넷으로 나눈다. 운영자가 수시로 바꾸는 값과 마스터 데이터 상태값을 한 필드에 두면 리포트 제외 기준이 흔들린다.\n\n| 상태 | 의미 | 주문 | 리포트 |\n| --- | --- | --- | --- |\n| 영업 | 운영 중 | 접수 | 포함 |\n| 일시중지 | 매장이 임시로 중단 | 차단 | 포함 |\n| 종료 | 행사 종료로 철수. 다음 행사에 재배치 가능 | 차단 | 포함 |\n| 폐점 | 영구 종료. 재배치하지 않는다 | 차단 | 기본 제외. 필터로 포함 |\n\nOlo가 주문 일시 중단, 일시 폐점, 영구 폐점을 각각 다른 값으로 두는 것과 같은 이유다.\n\n#### 삭제하지 않는다\n\n매장을 지우지 않는다. 조사한 8개 제품 중 삭제가 가능한 것은 하나뿐이고, Square와 Olo는 거래 데이터 보존을 이유로 삭제를 명시적으로 막는다.\n\n법령도 삭제를 막는다. 부가가치세법 제71조 제3항이 장부와 세금계산서를 확정신고 기한 후 5년, 국세기본법 제85조의3 제2항이 장부와 증거서류를 법정신고기한 후 5년, 전자상거래법 시행령 제6조가 대금결제와 재화 공급 기록을 5년 보존하도록 정한다. 폐업으로 이 의무가 사라진다는 규정은 없다.\n\n폐점 매장은 목록 기본 조회에서 숨기고 필터로만 노출한다. 매장 코드는 재사용하지 않는다. 같은 장소에 다시 열어도 새 코드를 부여한다. 재사용하면 과거 매출이 새 매장에 섞인다.\n\n#### 소속 변경과 매출 귀속\n\n매장이 다른 행사나 상권으로 옮겨가도 과거 주문의 귀속을 바꾸지 않는다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 저장 | 주문에 발생 시점의 행사, 상권, 브랜드를 값으로 복사해 둔다 |\n| 소속 이력 | 매장에 행사, 상권, 유효 시작일, 유효 종료일을 이력으로 남긴다 |\n| 적용 시점 | 소속 변경은 변경일부터 적용한다. 소급하지 않는다 |\n| 조회 기준 | 기본은 주문 시점 소속. 현재 소속 기준 재집계를 선택할 수 있다 |\n| 화면 표기 | 어느 기준으로 조회했는지 표시한다. 두 값이 다를 수 있음을 알린다 |\n\n근거는 넷이다.\n\n첫째, Toast는 메뉴의 매출 분류를 바꾸면 이후 리포트에만 반영되고 이미 만들어진 리포트는 바뀌지 않는다고 명시한다. 그룹 재배치에 대한 서술은 어느 제품에도 없어 인접 문제의 원칙을 준용했다.\n\n둘째, 덮어쓰기 방식은 이력을 파괴한다. 행사가 끝난 뒤 상권 배치를 조정하면 종료된 행사의 상권별 실적이 사후에 바뀐다. 목표 GO-02가 성립하지 않는다.\n\n셋째, 국가데이터처는 행정구역이 바뀌어도 원 통계표를 덮어쓰지 않고 기준 시점별 재집계본을 병렬로 제공한다. 소급이 원칙인 것은 측정 방법 자체가 바뀐 경우다. 매장 소속 변경은 분류 축의 변경이다.\n\n넷째, 이 문서가 이미 같은 원칙을 쓰고 있다. 주문 항목은 주문 시점의 메뉴와 단가를 보관하고, 취소는 원거래 일자로 소급하지 않는다.\n\n다만 비교 목적의 재집계 요구는 수용한다. IFRS 8 문단 29는 보고부문 구성이 바뀌면 과거 기간을 재작성하도록 하고, 문단 30은 재작성하지 않으면 신 기준과 구 기준을 함께 공시하도록 한다. 그래서 두 기준을 모두 제공하고 어느 쪽으로 봤는지 화면에 남긴다.\n\n이 항목은 참고할 제품 사례를 찾지 못했다. 회계기준과 공공 통계 처리 원칙을 준거로 삼아 정했다.\n\n### 2.21 정산 대사\n\n대사는 세 단계로 나눈다.\n\n| 단계 | 맞추는 대상 | 주기 |\n| --- | --- | --- |\n| 거래대사 | 우리 결제 원장과 결제대행사 거래 내역 | 일 단위 |\n| 정산 대사 | 거래 내역과 정산 내역 | 일 단위 |\n| 입금대사 | 정산 내역과 실제 입금액 | 지급일 기준 |\n\n| 항목 | 기준 |\n| --- | --- |\n| 조인 키 | 결제 키와 주문번호를 쓴다. 승인번호는 보조 키다 |\n| 조회 기준일 | 거래대사는 승인일, 정산 대사는 정산 매출일을 기준으로 한다 |\n| 취소 처리 | 승인과 취소를 상계하지 않고 개별로 조회한다. 부분취소와 익일취소가 있으면 상계 조회로는 원장과 맞지 않는다 |\n| 매입 구분 | 매입 상태를 따로 보관해 매입 지연과 매입 실패를 승인 성공과 구분한다 |\n| 미정산 | 정산 지급일이 도래하지 않은 건은 미정산으로 분류한다 |\n| 정산 예정일 | 플랫폼이 추정하지 않는다. 결제대행사가 내려주는 지급일을 그대로 표시한다 |\n| 조회 방식 | 대사 API는 등록된 서버 주소에서만 쓸 수 있고 1만 건 제한이 있다. 행사 규모가 커지면 파일 수신 방식으로 바꾼다 |\n\n정산 주기는 공개 표준값이 없다. 카드 정산은 결제대행사와 카드사가 체결한 입금주기를 따른다. 여신전문금융업법에도 지급 기한 규정이 없다. 계약 사항이다.\n\n#### 결제대행사 계약 시 확인할 것\n\n| 항목 | 확인 내용 | 정해지지 않으면 |\n| --- | --- | --- |\n| 정산 주기 | 결제수단별 주기와 지급일 산정 방식 | 매장에 정산 예정일을 안내할 수 없다 |\n| 정산 조회 | 제공 여부, 응답 항목, 조회 기준일 선택 가능 여부 | 정산 대사를 자동화할 수 없다 |\n| 대사 자료 | API와 파일 중 무엇을 제공하는지, 건수 제한 | 행사 규모가 커지면 대사가 막힌다 |\n| 하위가맹점 | 매장 단위 등록 절차와 심사 기간 | 매장 개설부터 주문 개시까지의 기간을 잡을 수 없다 |\n| 웹훅 | 이벤트 종류, 재전송 정책, 서명 제공 여부 | 결과 유실 대응을 설계할 수 없다 |\n| 멱등 | 헤더 지원 여부와 유효 기간 | 중복 승인 방지 방식이 달라진다 |\n| 부분취소 | 지원 여부와 처리 방식 | 부분 환불 기능을 넣을 수 없다 |\n\n계약 전에는 확인되지 않은 항목을 가정하지 않는다. 정산 예정일은 결제대행사가 내려주는 값을 그대로 표시하고, 대사는 API와 파일 두 방식을 모두 받을 수 있게 설계한다.\n\n### 2.22 VAN 처리 기준\n\n망취소는 법령 용어가 아니다. VAN사 기술 규격상의 용어이므로 발동 조건과 재시도 정책을 연동 대상 VAN사 규격서로 확정한다.\n\n공개 문서에서 확인된 발동 조건은 셋이다.\n\n| 조건 | 내용 |\n| --- | --- |\n| 읽기 시간 초과 | 승인 요청 후 설정한 시간 안에 응답이 오지 않는다 |\n| 연결 오류 | 승인 요청 중 연결이 끊기거나 네트워크 오류가 난다 |\n| 응답 해석 실패 | 응답은 받았으나 형식이 깨져 성공 여부를 판단할 수 없다 |\n\n프린터 오류와 전표 출력 실패는 망취소 조건이 아니다. 출력 실패는 재출력으로 처리하고 결제를 취소하지 않는다.\n\n망취소는 승인번호를 쓰지 않는다. 승인 결과를 받지 못한 상태이므로 단말번호, 거래일련번호, 금액, 거래일시로 원거래를 식별한다. 네 값을 승인 요청 시점에 저장한다.\n\n무서명 5만원 기준은 여신전문금융업감독규정 제24조의6 제2항이 근거다. 카드사 자율 정책이 아니다. 거래금액이 5만원 이하이고 카드사가 부정사용 책임을 부담하기로 가맹점에 통지한 경우에만 본인확인을 생략할 수 있다. 2007년 이후 금액 기준이 바뀐 적이 없으며 2026년 5월 시행 현행 규정에서도 같다.\n\n키오스크 서명 입력은 5만원 초과 거래에서 요구한다. 카드사 통지가 전제이므로 VAN사 계약 시 무서명거래 적용 여부를 확인한다.\n\n#### 우리 쪽에서 정하는 것\n\nVAN사 규격에 맡길 수 없는 항목은 우리가 정한다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 망취소 재시도 | 3회까지. 간격은 1초, 3초, 5초 |\n| 재시도 실패 | 주문을 만들지 않고 거래를 보류로 기록한다 |\n| 보류 거래 처리 | 키오스크 관리자 모드의 거래 내역에 표시한다. 대사에서 확인한다 |\n| 화면 안내 | 승인 여부를 알 수 없을 때 결제되지 않았다고 단정하지 않는다. 확인 중으로 표시하고 직원 호출을 안내한다 |\n| 승인 대기 시간 | 30초. 초과하면 망취소 조건으로 본다 |\n\n승인 여부를 모르는 상태에서 결제 실패로 안내하면 고객이 다시 결제해 이중 청구가 생긴다. 확인 중으로 두고 사람이 개입하게 한다.\n\n#### VAN사 계약 시 확인할 것\n\n| 항목 | 확인 내용 |\n| --- | --- |\n| 망취소 규격 | 발동 조건, 재시도 허용 횟수, 시간 제한 |\n| 무서명거래 | 카드사 통지 여부와 적용 금액 |\n| 단말 연동 | 통신 방식, 응답 시간, 오류 코드 체계 |\n| 거래 식별 | 단말번호와 거래일련번호의 채번 규칙 |\n| 대사 자료 | 제공 방식과 항목 |\n\n### 2.23 단말 관리\n\n단말을 등록하는 주체와 장애 때 멈추는 주체를 나눈다.\n\n| 항목 | 기준 |\n| --- | --- |\n| 등록·수정·삭제 | 매장이 한다. 본사는 하지 않는다 |\n| 연결 방식 | 매장이 발급한 연결 코드를 단말에 입력한다. 유효시간 10분 |\n| 본사 권한 | 전체 조회와 사용 중지, 사용 재개까지 한다 |\n| 사용 중지 사유 | 본사가 중지할 때 사유를 필수로 입력한다 |\n| 재개 주체 | 중지한 쪽이 재개한다. 본사가 중지한 단말은 매장이 풀 수 없다 |\n| 통지 | 본사가 중지하면 매장에 통지한다 |\n| 기록 | 조작자, 시각, 사유, 대상 단말을 남긴다 |\n\n본사에 사용 중지 권한을 두는 이유는 장애 대응이다. 오작동하는 단말이 주문을 계속 받으면 고객 결제가 쌓인 채 처리되지 않는다. 매장에 연락이 닿지 않는 시간대가 있으므로 본사가 직접 멈출 수 있어야 한다.\n\n재개를 중지한 쪽으로 묶는 이유는 대응의 실효성이다. 본사가 장애로 막은 단말을 매장이 바로 풀면 중지가 의미를 잃는다.\n\n### 2.24 이상 알림\n\n대시보드는 알림을 대체하지 않는다. 화면에만 두면 운영자가 열어볼 때까지 모른다.\n\n보낼 대상을 고르는 기준은 하나다. 받는 사람이 취할 구체적 조치가 있는가.\n\n| 이상 유형 | 본사가 할 수 있는 조치 | 판단 |\n| --- | --- | --- |\n| 단말 미연결 | 매장 연락, 사용 중지 처리, 다른 채널 안내 | 보낸다 |\n| 접수 지연 | 없다. 매장이 처리한다 | 화면에만 둔다 |\n| 매출 급락 | 특정되지 않는다. 한산한 경우와 구분되지 않는다 | 화면에만 둔다 |\n| 품절 급증 | 없다. 매장의 운영 판단이다 | 화면에만 둔다 |\n\n#### 발송 기준\n\n| 항목 | 기준 |\n| --- | --- |\n| 1단계 | 단말 미연결 30분. 해당 매장에 보낸다 |\n| 2단계 | 미연결 60분. 본사에 보낸다. 1단계 후에도 풀리지 않은 건만 해당한다 |\n| 반복 | 단말당 단계별 1회. 해소될 때까지 다시 보내지 않는다 |\n| 묶음 | 같은 행사에서 5분 안에 3건 이상 발생하면 건별로 보내지 않고 한 건으로 묶는다 |\n| 시간대 | 행사 영업시간 안에만 보낸다. 영업 종료 후 발생 건은 다음 개시 30분 전에 묶어서 보낸다 |\n| 경로 | 알림톡. 실패 시 문자로 대체한다 |\n| 내용 | 매장명, 단말 종류, 미연결 경과 시간, 조치 방법을 담는다 |\n\n#### 근거\n\n산업 경보 기준 EEMUA 191은 정상 운영 중 운영자 1명당 10분에 1건을 넘지 않도록 권고한다. 시간당 6~12건을 넘으면 대응 품질이 떨어지고 중요한 건을 놓친다. 행사장에 단말이 140대 있으면 네트워크 장애 한 번에 수십 건이 동시에 발생한다. 묶음 발송을 두는 이유다.\n\n먼저 매장에 보내는 이유는 조치할 수 있는 사람에게 먼저 가야 하기 때문이다. 프린터 용지나 전원처럼 현장에서 1분이면 푸는 건이 대부분이다. 본사가 먼저 받으면 결국 매장에 다시 연락하게 된다.\n\n야간 발송은 법으로 막혀 있지 않다. 광고성 메시지만 21시부터 다음 날 8시까지 제한되고 거래와 서비스 이용에 필요한 정보성 메시지는 해당하지 않는다. 그래도 영업시간 안으로 제한한다. 영업이 끝난 뒤에는 받아도 할 수 있는 일이 없다.\n\n조사 근거는 `research/이상알림_조사.md`에 있다.\n\n### 2.24 이상 알림\n\n대시보드는 알림을 대체하지 않는다. 화면에만 두면 운영자가 열어볼 때까지 모른다.\n\n보낼 대상을 고르는 기준은 하나다. 받는 사람이 취할 구체적 조치가 있는가.\n\n| 이상 유형 | 본사가 할 수 있는 조치 | 판단 |\n| --- | --- | --- |\n| 단말 미연결 | 매장 연락, 사용 중지 처리, 다른 채널 안내 | 보낸다 |\n| 접수 지연 | 없다. 매장이 처리한다 | 화면에만 둔다 |\n| 매출 급락 | 특정되지 않는다. 한산한 경우와 구분되지 않는다 | 화면에만 둔다 |\n| 품절 급증 | 없다. 매장의 운영 판단이다 | 화면에만 둔다 |\n\n#### 발송 기준\n\n| 항목 | 기준 |\n| --- | --- |\n| 1단계 | 단말 미연결 30분. 해당 매장에 보낸다 |\n| 2단계 | 미연결 60분. 본사에 보낸다. 1단계 후에도 풀리지 않은 건만 해당한다 |\n| 반복 | 단말당 단계별 1회. 해소될 때까지 다시 보내지 않는다 |\n| 묶음 | 같은 행사에서 5분 안에 3건 이상 발생하면 건별로 보내지 않고 한 건으로 묶는다 |\n| 시간대 | 행사 영업시간 안에만 보낸다. 영업 종료 후 발생 건은 다음 개시 30분 전에 묶어서 보낸다 |\n| 경로 | 알림톡. 실패 시 문자로 대체한다 |\n| 내용 | 매장명, 단말 종류, 미연결 경과 시간, 조치 방법을 담는다 |\n\n#### 근거\n\n산업 경보 기준 EEMUA 191은 정상 운영 중 운영자 1명당 10분에 1건을 넘지 않도록 권고한다. 시간당 6~12건을 넘으면 대응 품질이 떨어지고 중요한 건을 놓친다. 행사장에 단말이 140대 있으면 네트워크 장애 한 번에 수십 건이 동시에 발생한다. 묶음 발송을 두는 이유다.\n\n먼저 매장에 보내는 이유는 조치할 수 있는 사람에게 먼저 가야 하기 때문이다. 프린터 용지나 전원처럼 현장에서 1분이면 푸는 건이 대부분이다. 본사가 먼저 받으면 결국 매장에 다시 연락하게 된다.\n\n야간 발송은 법으로 막혀 있지 않다. 광고성 메시지만 21시부터 다음 날 8시까지 제한되고 거래와 서비스 이용에 필요한 정보성 메시지는 해당하지 않는다. 그래도 영업시간 안으로 제한한다. 영업이 끝난 뒤에는 받아도 할 수 있는 일이 없다.\n\n조사 근거는 `research/이상알림_조사.md`에 있다.\n\n### 2.25 운영 동선\n\n본사 운영자의 일은 행사 단위로 시작하고 끝난다. 메뉴는 업무 영역으로 나뉘어 있지만 실제 작업은 행사 하나를 두고 여러 영역을 오간다.\n\n행사 하나를 열려면 상권을 만들고, 브랜드를 등록하고, 매장을 붙이고, 계정을 발급한다. 메뉴를 따라가면 네 곳을 오가야 한다. 개시일이 가까울수록 이 왕복이 부담이 된다.\n\n| 기준 | 내용 |\n| --- | --- |\n| 상권 상세 | 상권 하나를 열면 그 안에서 소속 매장과 등록 상태를 함께 본다. 준비 현황은 대시보드에서 본다 |\n| 상위 항목 추가 | 하위를 만들다 상위가 없으면 그 자리에서 만든다. 상권 선택 칸에서 상권을 새로 만들 수 있다 |\n| 반복 개설 | 이전 행사의 상권과 매장 구성을 복제한다. 매번 처음부터 만들지 않는다 |\n| 대량 등록 | 매장은 파일로 한 번에 올린다. 한 행사에 수십 개가 들어온다 |\n| 조회 조건 유지 | 목록에서 상세로 갔다 돌아오면 조건과 페이지와 스크롤 위치를 되살린다 |\n| 빈 상태 | 결과가 없을 때 다음에 할 일을 함께 제시한다. 문구만 남기지 않는다 |\n| 일괄 처리 | 목록에서 여러 건을 골라 상태를 한 번에 바꾼다. 대상 건수를 확인 팝업에 적는다 |\n\n#### 왜 상권 상세를 두는가\n\n매장은 상권에 속한다. 매장을 따로 관리하면 어느 상권의 매장인지 매번 조건을 걸어 찾아야 한다.\n\n그 브랜드에 속한 매장은 매출 조회에서 상권 조건을 걸어 본다. 매장을 만드는 것은 가맹 관리자다. 행사 단위의 개시 준비 현황은 대시보드에서 본다.\n\n#### 조회 조건을 유지하는 이유\n\n매장 38개의 준비 상태를 확인하는 작업은 목록과 상세를 서른여덟 번 오간다. 돌아올 때마다 조건이 초기화되면 매번 다시 걸러야 한다.\n\n브라우저 뒤로 가기와 화면 안의 목록 버튼이 같게 동작해야 한다. 둘이 다르면 사용자가 어느 쪽을 눌러야 할지 매번 판단하게 된다.\n\n## 3. 의사결정 사항\n\n### DC-001 결제·정산 계약 구조\n\n* 배경: 본사가 가맹점 대금을 수취해 정산하면 전자지급결제대행업 등록 대상이 될 수 있다. 미등록 시 3년 이하 징역 또는 2천만원 이하 벌금이다.\n* 결정: 외부 결제대행사가 정산을 전담한다. 플랫폼은 대금을 수취하지 않고 정산에 필요한 정보만 제공한다. 각 매장을 결제대행사의 하위가맹점으로 등록하고 플랫폼은 대표가맹점이 되지 않는다.\n* 근거: 금융위원회가 2024년 6월 보도설명자료에서 등록이 필요 없는 사례로 명시한 구조다. 기준은 2.7에 있다.\n* 상태: 확정. 계약 체결 전 법무 검토를 거친다\n\n### DC-002 메뉴 기준의 위치\n\n* 배경: 업계는 POS가 기준이다. 본 서비스는 ERP가 기준이다. 매장이 POS에 직접 등록한 메뉴와 충돌할 수 있다.\n* 결정: 매장이 우리 화면에서 등록한 메뉴를 유일한 기준으로 둔다. 외부 POS는 조회만 하고 등록과 수정을 할 수 없다. 양방향 동기화를 두지 않는다.\n* 근거: 조사한 제품들이 양방향 동기화를 위험한 작업으로 경고한다. 기준을 하나로 고정하면 충돌 처리 규칙 자체가 필요 없다. 제공 규격은 2.2에 있다.\n* 상태: 확정\n\n### DC-003 메뉴 변경의 반영 시점\n\n* 배경: 배포를 없애고 매장이 메뉴 원본을 갖기로 하면서 발행 시점을 고르는 문제가 사라졌다. 남은 것은 각 채널이 언제 새 값을 읽느냐다.\n* 결정: 저장과 반영을 분리하지 않는다. 매장이 저장하면 반영된다. 채널별 확인 시점은 웹앱 즉시, 키오스크는 유휴 시점과 결제 완료 시점, 외부 POS는 통지 후 조회로 둔다.\n* 근거: 키오스크는 주문 중 화면이 바뀌면 고객이 고른 값과 결제 금액이 달라진다. 진행 중 주문은 기존 가격으로 처리한다. 기준은 2.4에 있다.\n* 상태: 확정\n\n### DC-004 주문 접수 화면의 위치\n\n* 배경: POS가 범위 밖이므로 스마트오더 주문을 받을 화면이 필요하다.\n* 결정: 가맹 어드민 안에 주문 접수 화면을 둔다. 별도 매장 전용 화면을 만들지 않는다.\n* 근거: 매장이 쓰는 화면을 두 개로 나누면 계정과 권한을 이중으로 관리해야 한다. 접수와 메뉴 관리는 같은 담당자가 한다. 주방 확인은 화면이 아니라 주문서 출력으로 처리한다.\n* 상태: 확정\n\n### DC-005 메뉴 등록 주체\n\n* 배경: 조사한 14개 제품 모두 가맹점 승인 절차가 없다. 본사 마스터 모델과 매장 소유 모델 중 하나를 고른다.\n* 결정: 매장이 자기 메뉴를 등록하고 관리한다. 본사는 메뉴를 만들지 않는다. 내려보낼 원본이 없으므로 배포 절차와 승인 절차를 두지 않는다. 본사는 메뉴에 관여하지 않는다.\n* 상태: 확정\n\n### DC-006 알레르기 정보의 등록 단위\n\n* 배경: 어느 제품에도 알레르기 필드가 없다. 업계는 옵션별 알레르기를 상품 복제로 처리한다.\n* 결정: 메뉴 단위로 등록한다. 옵션이 알레르기 유발물질을 바꾸면 조합별로 상품을 복제해 각각 등록한다. 복제 관계를 기록해 원 메뉴 수정 시 복제본을 확인 대상으로 표시한다.\n* 상태: 확정\n\n### DC-015 이상 알림 발송 범위\n\n* 배경: 대시보드에 이상 감지를 두었으나 화면을 열지 않으면 알 수 없다. 네 가지 이상 유형 중 무엇을 알림으로 보낼지 정해야 한다.\n* 결정: 단말 미연결만 보낸다. 30분에 매장, 60분에 본사로 2단계로 나눈다. 나머지 세 유형은 화면에만 둔다.\n* 근거: 받는 사람이 취할 구체적 조치가 있는 건만 보낸다. 접수 지연과 품절은 매장의 운영 상황이고 본사가 할 일이 없다. 매출 급락은 장애와 한산함을 구분하지 못한다.\n* 상태: 확정\n"}, {"no": 3, "id": "DOC-03", "title": "서비스 구조", "file": "docs/03_서비스구조.md", "category": "설계", "status": "확정", "progress": 100, "eta": "", "version": "2.7", "updated": "2026-09-08", "inherits_titles": ["프로젝트 개요", "기획 검토"], "content": "# 03. 서비스 구조\n\n## 1. 서비스 구성\n\n| 구성 | 대상 | 구축 순서 |\n| --- | --- | --- |\n| 내부 어드민 | 본사 운영자 | 1 |\n| 가맹 어드민 | 가맹 관리자 | 2 |\n| 하이브리드 웹앱 | 고객 | 3 |\n| 키오스크 | 고객 | 4 |\n| 외부 연계 | 외부 POS | 3단계와 병행 |\n\nERP가 행사, 상권, 매장, 카테고리, 메뉴 정보의 기준이다. 주문 채널과 외부 POS는 이 정보를 받아 쓴다.\n\n## 2. 정보 계층\n\n### 마스터 정보\n\n```ia\n본사 :: 전체 기준. 마스터 정보를 보유한다\n  행사 :: 기간 단위 운영. 시작일·종료일\n    상권 :: 지역 구분. 통계 비교 축\n      매장 :: 브랜드, 지점번호, 영업시간, 채널 사용 여부\n        *매장별 메뉴 설정 :: 판매가, 노출 여부, 품절 상태\n  브랜드 :: 메뉴를 소유하는 단위\n    카테고리 :: 상품 분류. 정렬 순서\n      메뉴 :: 가격, 이미지, 판매 시간, 원산지, 알레르기\n        옵션 그룹 :: 필수 여부, 최소·최대 선택 수\n          옵션 항목 :: 추가금\n```\n\n점선 상자는 두 계열을 잇는 연결 객체다. 매장별 메뉴 설정은 매장과 메뉴를 함께 참조한다.\n\n상권 하나에 브랜드 하나를 둔다. 상권명이 곧 브랜드명이다. 매장은 그 브랜드에 속하고 그 안에서 지점번호를 갖는다. 표시명은 브랜드명과 지점번호를 조합한다. 직영과 가맹은 구분하지 않는다.\n\n### 거래 정보\n\n```ia\n주문 :: 매장, 채널, 주문 상태, 호출 순번, 주문자 이름·휴대폰번호\n  주문 항목 :: 메뉴, 옵션, 수량, 단가\n  결제 :: 결제수단, 승인번호, 취소 이력\n```\n\n주문은 매장을 참조한다. 매장이 상권 하나와 행사 하나에 속하므로 매출을 행사와 상권 축으로 집계할 수 있다.\n상권은 행사 여러 개에 참여할 수 있지만 매장은 행사 하나에 속한다. 그래서 주문이 어느 행사의 매출인지 하나로 정해진다.\n\n### Level 정의\n\n| Level | 객체 | 정의 | 관리 기능 |\n| --- | --- | --- | --- |\n| L1 | 본사 | 전체 기준. 마스터 정보의 소유자 | 계정·권한 관리 |\n| L2 | 행사 | 기간 단위 운영 묶음 | 행사 관리 |\n| L2 | 브랜드 | 메뉴를 소유하는 단위 | 브랜드 관리 |\n| L3 | 상권 | 브랜드 하나에 대응하는 운영 묶음. 통계 비교 축. 행사 여러 개에 참여할 수 있다 | 상권 관리 |\n| L3 | 카테고리 | 상품 분류. 집계와 관리에 사용 | 카테고리 관리 |\n| L4 | 매장 | 실제 판매 장소. 상권과 행사 하나씩에 속하고 지점번호를 갖는다 | 매장 등록, 매장 상태 관리 |\n| L4 | 메뉴 | 판매 단위. 원산지와 알레르기를 속성으로 가진다 | 메뉴 등록, 알레르기 등록 |\n| L5 | 매장별 메뉴 설정 | 매장과 메뉴를 잇는 연결 객체 | 매장별 가격 설정, 품절 관리 |\n| L5 | 옵션 그룹 | 메뉴에 연결하는 선택 묶음 | 옵션 관리 |\n| L6 | 옵션 항목 | 개별 선택지 | 옵션 관리 |\n\n### 객체 간 관계\n\n| 상위 | 하위 | 관계 | 설명 |\n| --- | --- | --- | --- |\n| 본사 | 행사 | 1:N | 본사가 여러 행사를 운영한다 |\n| 행사 | 상권 | N:M | 행사 하나에 상권 여러 개가 참여하고, 상권 하나가 행사 여러 개에 참여한다 |\n| 상권 | 매장 | 1:N | 상권 하나에 매장 여러 개가 속한다 |\n| 행사 | 매장 | 1:N | 매장은 행사 하나에 속한다. 상권의 참여 행사 중 하나를 고른다 |\n| 본사 | 브랜드 | 1:N | 본사가 여러 브랜드를 운영한다 |\n| 브랜드 | 매장 | 1:N | 매장은 브랜드 하나에 속한다 |\n| 브랜드 | 카테고리 | 1:N | 카테고리는 브랜드가 소유한다 |\n| 카테고리 | 메뉴 | 1:N | 메뉴는 카테고리 하나에 속한다 |\n| 메뉴 | 옵션 그룹 | N:M | 옵션 그룹을 여러 메뉴에 연결한다 |\n| 옵션 그룹 | 옵션 항목 | 1:N | 옵션 그룹 하나에 선택지 여러 개가 속한다 |\n| 매장 | 메뉴 | N:M | 매장별 메뉴 설정으로 연결한다 |\n| 매장 | 주문 | 1:N | 주문은 매장에서 발생한다 |\n| 주문 | 주문 항목 | 1:N | 주문 하나에 항목 여러 개가 속한다 |\n| 주문 항목 | 메뉴 | N:1 | 주문 시점의 메뉴와 단가를 보관한다 |\n| 주문 | 결제 | 1:N | 취소와 재결제로 결제가 여러 건 생길 수 있다 |\n\n### 구조 판단\n\n**메뉴는 브랜드가 소유한다.** 카테고리와 메뉴를 매장 아래에 두면 매장 수만큼 같은 메뉴가 중복된다. 같은 브랜드의 매장은 같은 메뉴를 쓰므로 브랜드가 소유하고 매장이 참조한다.\n\n**매장과 메뉴는 연결 객체로 잇는다.** 판매가, 노출 여부, 품절 상태는 매장마다 다르다. 메뉴에 직접 두면 매장별 값을 담을 수 없고, 매장에 두면 메뉴 정보가 중복된다.\n\n**직영과 가맹을 구분하지 않는다.** 두 유형 사이에 메뉴, 가격, 권한의 정책 차이가 없다. 지점번호는 브랜드 안에서의 일련번호이며 계층이 아니다.\n\n**옵션은 메뉴의 하위 계층이 아니다.** 같은 옵션 그룹을 여러 메뉴에 연결한다. 온도 선택처럼 공통으로 쓰는 묶음이 여기에 해당한다.\n\n**알레르기와 원산지는 메뉴의 속성이다.** 별도 계층으로 두지 않는다. 옵션 선택에 따라 알레르기 유발물질이 달라지면 메뉴를 복제해 각각 등록한다.\n\n**관리축과 표시축을 분리한다.** 카테고리는 집계와 관리에 쓴다. 채널별 노출 순서와 배치는 별도로 관리한다. 같은 구조로 다루면 메뉴를 다시 저장할 때 채널 설정이 덮어써진다.\n\n## 3. 코드 체계\n\n조사 근거는 `research/코드체계_조사.md`에 있다. 표준이 있는 항목은 참조하고, 없는 항목만 자체 정의한다.\n\n### 참조하는 공개 표준\n\n| 항목 | 표준 | 형식 | 저장 방식 |\n| --- | --- | --- | --- |\n| 매장 주소의 행정구역 | 행정표준코드 행정동코드 | 숫자 10자리. 실무는 앞 8자리 사용 | 문자열. 선행 0을 유지한다 |\n| 매장 주소의 법정 구역 | 행정표준코드 법정동코드 | 숫자 10자리 | 문자열 |\n| 매장 사업자 | 사업자등록번호 | 10자리 | 문자열. 검증번호로 형식을 확인한다 |\n| 매장 지점 | 종사업장번호 | 4자리 | 문자열 |\n| 매장 업종 | 한국표준산업분류 제11차 | 음식점업은 대분류 I, 중분류 56 | 문자열 |\n| 알레르기 유발물질 | 어린이 기호식품 등의 알레르기 유발 식품 표시기준 및 방법 | 18종. 명칭만 있고 코드가 없다 | 명칭을 고시 원문과 글자 단위로 일치시킨다. 별표 2의 19종은 가공식품 기준이므로 쓰지 않는다 |\n| 영양성분 | 어린이식생활안전관리특별법 고시 별표 1 | 음식점 의무 표시 5종 | 성분별 수치와 기준량을 함께 보관한다. 9종은 가공식품 기준이다 |\n| 원산지 표시 대상 | 원산지표시법 시행령 제3조 제5항 | 30품목. 명칭만 있고 코드가 없다 | 명칭을 법령 원문과 일치시킨다 |\n| 원산지 국가 | 국가표준코드 | 2자리 영문 | 문자열. 표시 문구는 한글 국가명을 쓴다 |\n\n전국 단위 상권 코드는 공개된 것이 없다. 서울시 상권코드는 서울에 한정되고 상업적 이용이 가능하나 전국을 덮지 못한다. 따라서 상권은 자체 코드로 관리하고 행정동코드를 참조 항목으로 함께 보관한다. 외부 상권 데이터와 결합할 때 연결 고리가 된다.\n\n### 자체 정의하는 코드\n\n| 대상 | 형식 | 예 |\n| --- | --- | --- |\n| 행사 | EV + 연도 4자리 + 일련 3자리 | EV2026001 |\n| 브랜드 | BR + 일련 4자리 | BR0001 |\n| 상권 | ZN + 일련 5자리 | ZN00001 |\n| 매장 | ST + 일련 6자리 | ST000001 |\n| 지점번호 | 브랜드 안의 일련번호. 코드가 아니라 정수 속성 | 1, 2, 3 |\n| 카테고리 | CT + 일련 5자리 | CT00001 |\n| 메뉴 | MN + 일련 7자리 | MN0000001 |\n| 옵션 그룹 | OG + 일련 5자리 | OG00001 |\n| 옵션 항목 | OI + 일련 6자리 | OI000001 |\n| 주문 | OD + 영업일 8자리 + 일련 6자리 | OD20260904000001 |\n| 결제 | PY + 영업일 8자리 + 일련 6자리 | PY20260904000001 |\n| 알레르기 유발물질 | AL + 순번 2자리 | AL01 |\n| 원산지 표시 품목 | OR + 순번 2자리 | OR01 |\n\n### 코드 설계 규칙\n\n* 코드는 문자열로 저장한다. 선행 0이 의미를 갖고, 외부 코드는 자리수가 문서마다 다른 경우가 있다.\n* 상위 코드를 하위 코드의 접두사로 넣지 않는다. 매장이 다른 상권으로 옮겨질 때 코드를 바꾸지 않기 위해서다. 계층은 참조 항목으로 표현한다.\n* 한 번 부여한 코드는 바꾸지 않는다. 대상이 삭제되어도 재사용하지 않는다.\n* 코드값과 의미를 하나로 유지한다. 의미가 바뀌면 새 값을 부여한다.\n* 외부 코드는 원본 그대로 보관한다. 우리 형식으로 바꾸지 않는다.\n* 컬럼명과 데이터 형식은 공통표준용어와 공통표준도메인을 준용한다.\n\n### 법령 명칭을 코드로 다룰 때의 주의\n\n알레르기 유발물질과 원산지 표시 품목은 법령이 명칭만 규정한다. 내부 코드는 조회와 정렬을 위해 부여하되, 화면과 출력물에는 법령 원문의 명칭을 그대로 쓴다. 명칭이 다르면 표시 위반이 된다.\n\n알레르기 유발물질은 참깨, 들깨, 아몬드, 캐슈너트 4종 추가가 입법예고되어 있다. 확정되면 23종이 된다. 목록을 코드 테이블로 관리해 추가에 대응한다.\n\n## 4. 사용자 유형\n\n| ID | 사용자 유형 | 정의 | 접근 범위 |\n| --- | --- | --- | --- |\n| UT-01 | 본사 운영자 | 행사와 브랜드를 등록하고 가맹 어드민 계정을 발급한다. 전체 매출과 정산을 확인한다. 매장 운영에는 관여하지 않는다 | 전체 |\n| UT-02 | 가맹 관리자 | 담당 매장의 운영 정보를 관리한다 | 담당 매장 |\n| UT-03 | 고객 | 하이브리드 웹앱 또는 키오스크로 주문한다. 회원가입 없이 비회원으로 주문한다 | 주문 채널 |\n\n역할 부여와 데이터 범위 제한은 분리해 관리한다. 역할이 있다는 것과 특정 매장만 보인다는 것은 별개의 통제다. 매장이 늘어날 때마다 권한 정의를 고치지 않도록 데이터 범위는 조직 계층 기준으로 판정한다.\n\n## 5. 주요 기능\n\n### 1단계 내부 어드민\n\n| ID | 기능 | 사용자 | 설명 |\n| --- | --- | --- | --- |\n| FN-101 | 관리자 로그인 | UT-01 | 계정과 2차 인증으로 로그인한다 |\n| FN-102 | 행사 관리 | UT-01 | 행사를 등록하고 기간과 상태를 관리한다. 이 행사에 참여할 상권을 붙이고 뗀다 |\n| FN-103 | 상권 관리 | UT-01 | 상권을 등록하고 담당 계정을 발급한다. 상권 하나에 브랜드 하나를 둔다 |\n| FN-119 | 브랜드 관리 | UT-01 | 매장을 등록할 때 브랜드를 고르거나 새로 만든다. 별도 브랜드 화면을 두지 않는다 |\n| FN-104 | 매장 등록 | UT-02 | 담당 상권에 매장을 등록한다. 소속 행사는 상권의 참여 행사 중에서 고른다. 지점번호는 자동으로 부여한다. 개시는 본사가 하위가맹점 심사 결과로 확정한다 |\n| FN-106 | 카테고리 관리 | UT-02 | 카테고리를 등록하고 정렬 순서를 지정한다 |\n| FN-107 | 메뉴 등록 | UT-02 | 메뉴명, 가격, 이미지, 설명, 판매 시간을 등록한다 |\n| FN-108 | 옵션 관리 | UT-02 | 옵션 그룹과 항목, 필수 여부, 최소·최대 선택 수, 추가금을 등록한다 |\n| FN-109 | 알레르기·영양성분 등록 | UT-02 | 메뉴 단위로 알레르기 유발물질과 영양성분을 등록한다. 필수 입력이다. 옵션이 유발물질을 바꾸면 상품을 복제해 등록한다 |\n| FN-110 | 원산지 등록 | UT-02 | 원산지 표시 대상 품목의 원산지를 등록한다 |\n| FN-111 | 매장별 가격 설정 | UT-02 | 매장 단위로 기준 가격을 덮어쓴다 |\n| FN-114 | 매출 조회 | UT-01 | 기간, 매장, 채널, 결제수단 기준으로 매출을 조회한다 |\n| FN-115 | 행사·상권 매출 비교 | UT-01 | 행사와 상권을 축으로 매출을 비교한다 |\n| FN-116 | 계정·권한 관리 | UT-01 | 계정을 등록하고 역할과 접근 범위를 부여한다 |\n| FN-117 | 접속기록 조회 | UT-01 | 접속기록을 조회하고 점검한다 |\n| FN-118 | 대행 접속 | UT-01 | 가맹 어드민 화면에 대신 접속한다 |\n| FN-120 | 정산 대사 | UT-01 | 거래, 정산, 입금 세 단계로 대조하고 불일치를 처리한다 |\n| FN-121 | 배치 실행 관리 | UT-01 | 집계와 파기 배치의 결과를 확인하고 다시 실행한다 |\n| FN-122 | 계정 변경 이력 | UT-01 | 권한과 담당 매장 범위의 변경 전후 값을 기록한다 |\n| FN-123 | 개인정보 파기 | UT-01 | 보유 기간이 지난 개인정보를 파기하고 기록을 남긴다 |\n\n### 2단계 가맹 어드민\n\n| ID | 기능 | 사용자 | 설명 |\n| --- | --- | --- | --- |\n| FN-201 | 가맹 관리자 로그인 | UT-02 | 계정과 2차 인증으로 로그인한다 |\n| FN-202 | 매장 정보 조회 | UT-02 | 담당 매장의 등록 정보를 조회한다 |\n| FN-203 | 매장 정보 변경 | UT-02 | 영업시간, 대표 연락처, 정산계좌를 바꾼다. 저장하면 바로 반영하고 변경 이력에 남긴다 |\n| FN-204 | 영업 상태 관리 | UT-02 | 영업 일시중지와 재개를 설정한다 |\n| FN-205 | 매장 메뉴 조회 | UT-02 | 등록한 메뉴를 조회한다 |\n| FN-206 | 품절 설정 | UT-02 | 메뉴 판매를 중지하고 재개 시각을 지정한다. 품절 메뉴는 주문 채널 목록에서 제외된다 |\n| FN-207 | 주문 접수 관리 | UT-02 | 들어온 주문을 수락할 때 준비 시간을 고르고 조리 완료를 처리한다. 거절하면 사유를 남긴다. 미응답 5분이 지나면 자동 취소한다. 접수 완료 후 1분이 지나면 조리 중으로 자동 전환되고 그때부터 취소할 수 없다 |\n| FN-209 | 주문서 출력 | UT-02 | 수락한 주문을 매장 프린터로 출력한다 |\n| FN-208 | 매장 매출 조회 | UT-02 | 담당 매장의 매출을 조회한다 |\n| FN-210 | 비밀번호 재설정 | UT-02 | 등록된 휴대폰번호로 본인을 확인하고 비밀번호를 재설정한다 |\n| FN-211 | 메뉴 가져오기 | UT-02 | 이전 매장이나 같은 브랜드 매장의 메뉴를 복사해 온다 |\n| FN-212 | 알림 발송 이력 | UT-02 | 발송 결과를 확인하고 실패 건을 다시 보낸다 |\n| FN-213 | 단말 등록 | UT-02 | 매장에서 쓰는 키오스크, 카드 단말, 주문서 프린터를 등록하고 연결한다 |\n| FN-214 | 단말 상태 확인 | UT-02 | 등록한 단말의 연결 상태와 마지막 통신 시각을 확인한다 |\n\n### 3단계 하이브리드 웹앱\n\n| ID | 기능 | 사용자 | 설명 |\n| --- | --- | --- | --- |\n| FN-301 | 매장 진입 | UT-03 | QR 또는 링크로 매장을 확정한다 |\n| FN-302 | 메뉴 조회 | UT-03 | 매장 메뉴를 카테고리별로 조회한다 |\n| FN-303 | 옵션 선택 | UT-03 | 옵션을 선택하고 수량을 지정한다 |\n| FN-304 | 장바구니 | UT-03 | 담은 항목을 확인하고 수정한다 |\n| FN-305 | 주문서 작성 | UT-03 | 이름, 휴대폰번호, 요청사항을 입력한다 |\n| FN-306 | PG 결제 | UT-03 | 결제창을 호출하고 서버 검증 후 승인한다 |\n| FN-307 | 주문 상태 확인 | UT-03 | 접수와 준비 상태를 확인한다 |\n| FN-308 | 주문 알림 | UT-03 | 접수와 준비 완료를 알림톡으로 통지한다 |\n| FN-309 | 주문 조회 | UT-03 | 주문번호와 휴대폰번호로 주문을 조회한다 |\n| FN-310 | 주문 취소 | UT-03 | 조리 시작 전 주문을 취소하고 결제를 취소한다 |\n\n### 4단계 키오스크\n\n| ID | 기능 | 사용자 | 설명 |\n| --- | --- | --- | --- |\n| FN-401 | 대기화면 | UT-03 | 주문 전 화면을 노출하고 터치로 주문을 시작한다 |\n| FN-402 | 취식유형 선택 | UT-03 | 먹고가기와 포장을 선택한다 |\n| FN-403 | 메뉴·옵션 선택 | UT-03 | 카테고리에서 메뉴와 옵션을 선택한다 |\n| FN-404 | 장바구니 | UT-03 | 담은 항목을 확인하고 수정한다 |\n| FN-405 | VAN 결제 | UT-03 | 결제수단을 선택하고 단말로 승인을 요청한다 |\n| FN-406 | 주문번호 발행 | UT-03 | 주문번호와 호출 순번을 발행하고 주문서를 출력한다. 카드 매출전표는 카드 단말이 낸다 |\n| FN-407 | 고객 호출 | UT-03 | 주문번호 또는 휴대폰번호로 준비 완료를 알린다 |\n| FN-408 | 키오스크 관리자 모드 | UT-02 | 인증 후 설정과 거래 내역에 접근한다 |\n| FN-409 | 단말 상태 감시 | UT-01 | 전체 매장
