  r.querySelectorAll("canvas.iacanvas").forEach(cv => {
    const m = IA_MODELS.get(cv.dataset.ia);
    if (m) { try { drawIACanvas(cv, m, scale); } catch (e) { console.error("계층도 작도 실패", e); } }
  });
  r.querySelectorAll("canvas.mapcanvas").forEach(cv => {
    const m = MAP_MODELS.get(cv.dataset.mp);
    if (m) { try { drawMapCanvas(cv, m, scale); } catch (e) { console.error("사이트맵 작도 실패", e); } }
  });
  r.querySelectorAll("canvas.wfcanvas").forEach(cv => {
    const m = WF_MODELS.get(cv.dataset.wf);
    if (m) {
      try { drawWFCanvas(cv, m, scale); wfMarks(cv); }
      catch (e) { console.error("와이어프레임 작도 실패", e); }
    }
  });
  r.querySelectorAll("canvas.uicanvas").forEach(cv => {
    const m = UI_MODELS.get(cv.dataset.ui);
    if (m) { try { drawUICanvas(cv, m, scale); } catch (e) { console.error("화면 흐름 작도 실패", e); } }
  });
  r.querySelectorAll("canvas.acanvas").forEach(cv => {
    const m = ARCH_MODELS.get(cv.dataset.ac);
    if (m) { try { drawArchCanvas(cv, m, scale); } catch (e) { console.error("구조도 작도 실패", e); } }
  });
  r.querySelectorAll("canvas.fcanvas").forEach(cv => {
    const model = FLOW_MODELS.get(cv.dataset.fc);
    if (!model) return;
    try { drawFlowCanvas(cv, model, scale); }
    catch (err) {
      console.error("Flow 작도 실패", cv.dataset.fc, err);
      const ctx = cv.getContext("2d");
      cv.width = 600; cv.height = 60; cv.style.width = "600px"; cv.style.height = "60px";
      ctx.fillStyle = FC.bg; ctx.fillRect(0, 0, 600, 60);
      ctx.font = FC.fontSm; ctx.fillStyle = FC.bad; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText("작도 실패 " + cv.dataset.fc + " : " + err.message, 12, 30);
    }
  });
}
function flowHit(cv, e) {
  const r = cv.getBoundingClientRect();
  const s = cv._scale || 1;
  const x = (e.clientX - r.left) / s, y = (e.clientY - r.top) / s;
  return cv._hits.find(h => x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
}
document.addEventListener("mousemove", (e) => {
  const cv = e.target.closest("canvas.fcanvas");
  if (!cv || !cv._hits) return;
  cv.style.cursor = flowHit(cv, e) ? "pointer" : "default";
});
document.addEventListener("click", (e) => {
  const cv = e.target.closest("canvas.fcanvas");
  if (!cv || !cv._hits) return;
  const hit = flowHit(cv, e);
  if (!hit) return;
  if (cv.closest(".fmodal")) closeFlowModal();
  if (window.goToFlow) window.goToFlow(hit.id);
});


// ── 화면 흐름 캔버스
const UI_MODELS = new Map();
let UI_SEQ = 1;
const UW = 246, UHEAD = 32, UBLK = 26, UBGAP = 7, UPAD = 13, UGX = 78, UGY = 74, UPADD = 22;
const UCOLS = 3;

function renderUIMap(src) {
  const lines = src.split(String.fromCharCode(10));
  const screens = [];
  const edges = [];
  let cur = null;
  lines.forEach(raw => {
    const l = raw.trim();
    if (!l) return;
    if (l.charAt(0) === "@") {
      const body = l.slice(1).trim();
      const sp = body.indexOf(" ");
      cur = {
        id: sp === -1 ? body : body.slice(0, sp),
        name: sp === -1 ? "" : body.slice(sp + 1).trim(),
        blocks: [],
      };
      screens.push(cur);
      return;
    }
    if (l.charAt(0) === ">") {
      const m = l.slice(1).split("->");
      if (m.length < 2) return;
      const right = m[1].split(":");
      edges.push({ a: m[0].trim(), b: right[0].trim(), label: (right[1] || "").trim() });
      return;
    }
    if (l.charAt(0) === "-" && cur) cur.blocks.push(l.slice(1).trim());
  });
  const id = "ui" + (UI_SEQ++);
  UI_MODELS.set(id, { screens: screens, edges: edges });
  return diagramBox("화면 흐름", `<canvas class="uicanvas" data-ui="${id}"></canvas>`);
}

function uiCardH(s) {
  const n = Math.max(1, s.blocks.length);
  return UHEAD + UPAD + n * UBLK + (n - 1) * UBGAP + UPAD;
}

function drawUICanvas(canvas, model, scale) {
  const ctx = canvas.getContext("2d");
  const S = model.screens;
  if (!S.length) return;
  ctx.font = FC.fontSm;

  const cols = Math.min(UCOLS, S.length);
  S.forEach((s, i) => {
    s.col = i % cols;
    s.row = Math.floor(i / cols);
    s.h = uiCardH(s);
  });
  const rows = Math.floor((S.length - 1) / cols) + 1;
  const rowH = [], rowY = [];
  for (let r = 0; r < rows; r++) {
    rowH[r] = Math.max.apply(null, S.filter(s => s.row === r).map(s => s.h));
  }
  let y = UPADD;
  for (let r = 0; r < rows; r++) { rowY[r] = y; y += rowH[r] + UGY; }
  const h = y - UGY + UPADD;
  const w = UPADD * 2 + cols * UW + (cols - 1) * UGX;
  S.forEach(s => { s.x = UPADD + s.col * (UW + UGX); s.y = rowY[s.row]; });

  const dpr = (window.devicePixelRatio || 1) * (scale || 1);
  canvas.width = Math.ceil(w * dpr); canvas.height = Math.ceil(h * dpr);
  canvas.style.width = Math.ceil(w * (scale || 1)) + "px";
  canvas.style.height = Math.ceil(h * (scale || 1)) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = FC.bg; ctx.fillRect(0, 0, w, h);

  const byId = new Map();
  S.forEach(s => byId.set(s.id, s));

  // 이동 경로를 먼저 깔고 카드를 위에 올린다
  const marks = [];
  let far = 0;
  model.edges.forEach(e => {
    const a = byId.get(e.a), b = byId.get(e.b);
    if (!a || !b) return;
    ctx.strokeStyle = "#8FA3B5"; ctx.lineWidth = 1.3; ctx.setLineDash([]);
    ctx.fillStyle = "#8FA3B5";
    if (a.row === b.row && b.col === a.col + 1) {
      const y1 = a.y + a.h / 2;
      ctx.beginPath();
      ctx.moveTo(a.x + UW, y1); ctx.lineTo(b.x - 8, y1); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(b.x - 9, y1 - 4.5); ctx.lineTo(b.x - 9, y1 + 4.5); ctx.lineTo(b.x - 1, y1);
      ctx.closePath(); ctx.fill();
      if (e.label) marks.push({ t: e.label, x: (a.x + UW + b.x) / 2, y: y1 - 9 });
      return;
    }
    const corr = rowY[a.row] + rowH[a.row] + 16 + (far % 3) * 11;
    far++;
    const ax = a.x + UW / 2, bx = b.x + UW / 2;
    const down = b.row > a.row;
    const ey = down ? b.y : b.y + b.h;
    ctx.beginPath();
    ctx.moveTo(ax, a.y + a.h); ctx.lineTo(ax, corr);
    ctx.lineTo(bx, corr); ctx.lineTo(bx, down ? ey - 8 : ey + 8);
    ctx.stroke();
    const d = down ? 1 : -1;
    ctx.beginPath();
    ctx.moveTo(bx - 4.5, ey - d * 9); ctx.lineTo(bx + 4.5, ey - d * 9); ctx.lineTo(bx, ey - d * 1);
    ctx.closePath(); ctx.fill();
    if (e.label) marks.push({ t: e.label, x: (ax + bx) / 2, y: corr - 8 });
  });

  S.forEach(s => {
    // 카드
    ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = "#C9D3DC"; ctx.lineWidth = 1;
    roundRect(ctx, s.x, s.y, UW, s.h, 6); ctx.fill(); ctx.stroke();
    // 머리 띠
    ctx.save();
    roundRect(ctx, s.x, s.y, UW, s.h, 6); ctx.clip();
    ctx.fillStyle = "#2B3442";
    ctx.fillRect(s.x, s.y, UW, UHEAD);
    ctx.restore();
    ctx.fillStyle = "#FFFFFF";
    ctx.font = FC.fontB; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(clipText(ctx, s.name || s.id, UW - 84), s.x + 12, s.y + UHEAD / 2);
    ctx.font = FC.fontMonoSm; ctx.fillStyle = "#9FB0C0"; ctx.textAlign = "right";
    ctx.fillText(s.id.split("-").slice(1).join("-"), s.x + UW - 12, s.y + UHEAD / 2 + 0.5);
    ctx.textAlign = "left";
    // 영역 블록
    let by = s.y + UHEAD + UPAD;
    s.blocks.forEach((b, k) => {
      ctx.fillStyle = k === 0 ? "#DCE3EA" : "#EDF1F5";
      ctx.strokeStyle = "#DCE3EA"; ctx.lineWidth = 1;
      roundRect(ctx, s.x + 12, by, UW - 24, UBLK, 3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = FC.muted; ctx.font = FC.fontXs;
      ctx.fillText(clipText(ctx, b, UW - 44), s.x + 20, by + UBLK / 2 + 0.5);
      by += UBLK + UBGAP;
    });
  });

  ctx.font = FC.fontXs; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  marks.forEach(m => {
    const tw = ctx.measureText(m.t).width;
    ctx.fillStyle = FC.bg;
    ctx.fillRect(m.x - tw / 2 - 4, m.y - 7, tw + 8, 13);
    ctx.fillStyle = FC.muted;
    ctx.fillText(m.t, m.x, m.y);
  });
  ctx.textAlign = "left";

  canvas._scale = scale || 1;
  canvas._uihits = S.map(s => ({ id: s.id, x: s.x, y: s.y, w: UW, h: UHEAD }));
}
function clipText(ctx, s, max) {
  if (ctx.measureText(s).width <= max) return s;
  let out = s;
  while (out.length > 1 && ctx.measureText(out + "…").width > max) out = out.slice(0, -1);
  return out + "…";
}


// ── 와이어프레임
const WF_MODELS = new Map();
let WF_SEQ = 1;
const WFPRESET = {
  admin:  [1920, 1030, 0, 0],
  center: [1920, 1030, 520, 0],
  popup:  [1920, 1030, 560, 1],
  popup2: [1920, 1030, 560, 2],
  wpopup: [1920, 1030, 880, 1],
  wpopup2:[1920, 1030, 880, 2],
  mobile: [390, 844, 0, 0],
  mpopup: [390, 844, 330, 1],
  kiosk:  [1080, 1920, 0, 0],
  kpopup: [1080, 1920, 780, 1],
  split:  [1920, 1030, 420, 0, 0.52],
};
const WFC = {
  line: "#98A4B0", soft: "#D5DBE1", fill: "#F2F5F8", deep: "#F7F9FB",
  bar: "#2B3442", ink: "#2B3442", mut: "#6B7784", bg: "#FFFFFF",
  pri: "#2A5D8F", bad: "#B4444A", hint: "#7C8794",
};

function renderWF(src) {
  const rows = src.split(String.fromCharCode(10));
  const screens = [];
  const shell = { nav: null, cur: "", brand: "", acct: "" };
  let cur = null;
  const open = (name, sid) => {
    cur = { name: name || "", id: sid || "", w: 1920, fhMin: 1030, cw: 0, ov: 0, pane: 0, items: [] };
    screens.push(cur);
  };
  rows.forEach(raw => {
    const l = raw.replace(/\s+$/, "");
    if (!l.trim()) return;
    const s = l.trim();
    if (s.charAt(0) === "!") {
      const body = s.slice(1).trim();
      const sp2 = body.indexOf(" ");
      const key = sp2 === -1 ? body : body.slice(0, sp2);
      const val = sp2 === -1 ? "" : body.slice(sp2 + 1).trim();
      if (key === "nav") shell.nav = val.split("/").map(v => v.trim()).filter(Boolean);
      if (key === "cur") shell.cur = val;
      if (key === "brand") shell.brand = val;
      if (key === "acct") shell.acct = val;
      return;
    }
    if (s.charAt(0) === "#") {
      const body = s.slice(1).trim();
      const m = body.match(SID_ONE);
      const sid = m ? m[0] : "";
      open(sid ? body.replace(sid, "").trim() : body, sid);
      return;
    }
    if (!cur) open("", "");
    if (s.charAt(0) === "@") {
      const k = s.slice(1).trim();
      const ps = WFPRESET[k];
      if (ps) { cur.w = ps[0]; cur.fhMin = ps[1]; cur.cw = ps[2]; cur.ov = ps[3]; cur.pane = ps[4] || 0; }
      else { cur.w = parseInt(k, 10) || 1920; cur.fhMin = 0; cur.cw = 0; cur.ov = 0; cur.pane = 0; }
      return;
    }
    const cells = l.split("|").map(c => c.trim()).filter(c => c !== "");
    cur.items.push(cells.map(parseCell));
  });
  screens.forEach(sc => {
    if (shell.nav && sc.w >= 1000 && sc.fhMin >= 900) {
      sc.nav = shell.nav; sc.cur = shell.cur;
      sc.brand = shell.brand; sc.acct = shell.acct;
    }
  });
  const id = "wf" + (WF_SEQ++);
  WF_MODELS.set(id, { screens: screens });
  return diagramBox("화면 " + screens.length, `<canvas class="wfcanvas" data-wf="${id}"></canvas>`);
}
function parseCell(c) {
  const sp = c.indexOf(" ");
  let head = (sp === -1 ? c : c.slice(0, sp)).toLowerCase();
  const text = sp === -1 ? "" : c.slice(sp + 1).trim();
  let wt = 1;
  const q = head.indexOf(":");
  if (q > 0) { wt = parseFloat(head.slice(q + 1)) || 1; head = head.slice(0, q); }
  let req = false;
  if (head.slice(-1) === "*") { req = true; head = head.slice(0, -1); }
  return { kind: head, text: text, wt: wt, req: req };
}

const WFH = {
  top: 56, h: 60, sub: 34, f: 40, fx: 40, fe: 40, fo: 40, fd: 40, fq: 40, sel: 40, b: 40, b2: 40, bd: 40,
  err: 30, chk: 30, rad: 30, seg: 40, sw: 40, swo: 40,
  tx: 26, cnt: 40, pick: 44, note: 40, empty: 230, fs: 40, toast: 0, selx: 40, sele: 40, selo: 40, fsx: 40, fse: 40, fso: 40, fdx: 40, fde: 40, fdo: 40, t: 42, td: 42, p: 44, tab: 44, hr: 18, sp: 16,
  stat: 84, img: 160, box: 110, lines: 0, key: 260, big: 130, list: 34,
};
// 손으로 누르는 화면은 조작 영역을 키운다 (키오스크, 모바일)
const TOUCH = ["f", "fx", "fe", "fo", "fd", "fq", "sel", "fs", "b", "b2", "bd", "seg", "sw", "swo",
               "selx", "sele", "selo", "fsx", "fse", "fso", "fdx", "fde", "fdo",
               "chk", "rad", "tab", "t", "td"];
function wfCellH(c, touch) {
  if (c.kind === "seg" && c.text && c.text.indexOf("//") >= 0) return touch ? 80 : 68;
  if (touch && TOUCH.indexOf(c.kind) >= 0) {
    const base = wfCellH(c, false);
    return Math.max(base, base > 52 ? base + 12 : 52);
  }
  if (c.text && c.text.indexOf("//") >= 0 &&
      ["f", "fx", "fe", "fo", "fd", "fdx", "fde", "fdo", "fq",
       "fs", "fsx", "fse", "fso", "sel", "selx", "sele", "selo"].indexOf(c.kind) >= 0) {
    return touch ? 80 : 68;
  }
  if (c.kind === "img" || c.kind === "box") {
    const n = parseInt(c.text, 10);
    const bh0 = isNaN(n) ? WFH[c.kind] : n;
    return c.text.indexOf("//") >= 0 ? bh0 + 24 : bh0;
  }
  if (c.kind === "menu") return c.text.split("/").length * 32 + 10;
  if (c.kind === "cal") return 224;
  if (c.kind === "lines") return (parseInt(c.text, 10) || 4) * 13 + 4;
  return WFH[c.kind] || 26;
}

const WFPAD = 24, WFGAP = 16, WFCG = 12, WFCAP = 30, WFBGX = 44, WFBGY = 46, WFEDGE = 30, WFGRP = 130;
function wfMeasure(sc) {
  const touch = sc.h > sc.w;
  sc.heights = sc.items.map(row => Math.max.apply(null, row.map(c => wfCellH(c, touch))));
  let hh = WFPAD;
  sc.heights.forEach((h, i) => { hh += h + (i < sc.heights.length - 1 ? WFGAP : 0); });
  sc.rawh = hh + WFPAD;
  sc.ch = sc.rawh + (sc.nav ? 62 : 0);
  sc.fh = Math.max(sc.ch, sc.fhMin || 0);
  sc.bw = sc.w + WFPAD * 2;
  sc.bh = WFCAP + sc.fh + WFPAD;
}
function drawWFCanvas(canvas, model, scale) {
  const ctx = canvas.getContext("2d");
  const S = model.screens;
  if (!S || !S.length) return;
  ctx.font = FC.fontSm;
  S.forEach(wfMeasure);
  // 덮개 화면은 바로 앞의 일반 화면을 바탕으로 쓴다
  let plain = null, plainAny = null, modal = null;
  S.forEach(sc => {
    if (sc.pane) return;
    // 상태 변형은 같은 화면 위에 겹치지 않는다. 원래 화면의 바탕을 그대로 쓴다
    if (sc.ov === 2) sc.back = modal && modal.id !== sc.id ? modal : (modal ? modal.back : null);
    else if (sc.ov) sc.back = plain || plainAny;
    if (sc.ov) { if (sc.name.indexOf(" · ") < 0) modal = sc; }
    else { plainAny = sc; if (sc.name.indexOf(" · ") < 0) plain = sc; }
  });

  // 같은 화면의 상태를 한 줄에 모으고 화면이 바뀌면 구분선을 넣는다
  const BOARD = 4400;
  const rules = [];
  let x = WFEDGE, y = WFEDGE, rowMax = 0, boardW = 0, prevId = null;
  S.forEach(sc => {
    const isNew = prevId !== null && sc.id !== prevId;
    if (isNew) {
      y += rowMax + WFGRP;
      rules.push({ y: y - WFGRP / 2 });
      x = WFEDGE; rowMax = 0;
    } else if (x > WFEDGE && x + sc.bw > BOARD) {
      x = WFEDGE; y += rowMax + WFBGY; rowMax = 0;
    }
    prevId = sc.id;
    sc.bx = x; sc.by = y;
    rowMax = Math.max(rowMax, sc.bh);
    x += sc.bw + WFBGX;
    boardW = Math.max(boardW, sc.bx + sc.bw);
  });
  const w = boardW + WFEDGE, h = y + rowMax + WFEDGE;

  // 실제 해상도로 그리므로 판이 커진다. 화면 안에서는 줄여 보여주고 그리는 배율도 제한한다
  const inBoard = !!canvas.closest(".board");
  const k = inBoard ? 1 : Math.min(1, 1480 / w);
  const eff = (scale || 1) * k;
  const area = w * h;
  const cap = area > 8000000 ? 1 : 1.6;
  const px = Math.min(cap, (window.devicePixelRatio || 1) * eff);
  canvas.width = Math.ceil(w * px); canvas.height = Math.ceil(h * px);
  canvas.style.width = Math.ceil(w * eff) + "px";
  canvas.style.height = Math.ceil(h * eff) + "px";
  ctx.setTransform(px, 0, 0, px, 0, 0);
  ctx.fillStyle = "#F1F3F6"; ctx.fillRect(0, 0, w, h);

  rules.forEach(r => {
    ctx.fillStyle = "#C3CDD6";
    ctx.fillRect(WFEDGE, r.y - 2, w - WFEDGE * 2, 4);
  });
  S.forEach(sc => drawWFScreen(ctx, sc));
  canvas._scale = eff;
  canvas._wfhits = S.map(sc => ({ id: sc.id, name: sc.name, x: sc.bx, y: sc.by, w: sc.bw, h: sc.bh }));
}
function wfMarks(cv) {
  const host = cv.parentElement;
  if (!host) return;
  host.classList.add("wfhost");
  host.querySelectorAll(".wfmark").forEach(el => el.remove());
  if (!cv._wfhits) return;
  const k = cv._scale || 1;
  if (!cv.closest(".board")) host.style.setProperty("--iz", "1");
  const top = cv.offsetTop || 0, left = cv.offsetLeft || 0;
  cv._wfhits.forEach(h => {
    const d = document.createElement("div");
    d.className = "wfmark";
    d.dataset.sid = h.id;
    d.innerHTML = `<b>${esc(h.name || h.id)}</b><span>${esc(h.id)}</span>`;
    d.style.left = (left + (h.x + 3) * k) + "px";
    d.style.top = (top + (h.y + 3) * k) + "px";
    host.appendChild(d);
  });
}
// 셀 구분은 쉼표 뒤 공백을 기준으로 한다. 금액의 천 단위 구분과 괄호 안 쉼표는 나누지 않는다
function wfCells(str) {
  const out = []; let d = 0, cur = "";
  for (let k = 0; k < str.length; k++) {
    const c = str.charAt(k);
    if (c === "(" || c === "[") d++;
    else if (c === ")" || c === "]") d = Math.max(0, d - 1);
    if (c === "," && d === 0 && (k + 1 >= str.length || str.charAt(k + 1) === " ")) {
      out.push(cur.trim()); cur = ""; continue;
    }
    cur += c;
  }
  out.push(cur.trim());
  return out;
}
const NUMRE = /^[+-]?[\d,]+(\.\d+)?\s*(원|천원|건|개|명|%|kcal|g|mg|초|분|시간|회)?$/;
const LEFTRE = /번호|우편|일자|일시|날짜|시각|시간|코드|ID|아이디/;
function tableCols(items, from) {
  const head = wfCells(items[from][0].text);
  const wide = head.map(h => (h === "[]" || h === "#") ? 0.4 : 1);
  const align = head.map(() => "left");
  for (let k = from + 1; k < items.length; k++) {
    const r = items[k];
    if (r.length !== 1) break;
    if (r[0].kind !== "td") break;
    const cells = wfCells(r[0].text);
    cells.forEach((v, i) => {
      if (i < align.length && v && !LEFTRE.test(head[i] || "") && NUMRE.test(v)) align[i] = "right";
    });
    break;
  }

  { deep: "#14603C", mid: "#1F8A57", soft: "#D7EDE2" },
  { deep: "#8A4B12", mid: "#C06A1C", soft: "#F6E5D2" },

    const body = l.trim();
    const i = body.indexOf("::");

    col.items.forEach(it => {

      ctx.strokeStyle = col.hue.mid; ctx.lineWidth = 1;

      ctx.fillStyle = col.hue.mid;
      it.kids.forEach(k => {
        const ky = k.y + k.h / 2;

        ctx.beginPath();
        ctx.moveTo(k.x - 7, ky - 4); ctx.lineTo(k.x - 7, ky + 4); ctx.lineTo(k.x, ky);

// ── 시스템 구조도
const ARCH_MODELS = new Map();

function renderArch(src) {
  const bands = [{ label: "", zones: [] }];
  const notes = [], edges = [];
  let band = bands[0], zone = null;
  src.split(String.fromCharCode(10)).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    if (line.startsWith("!")) { notes.push(line.slice(1).trim()); return; }
    const bm = line.match(/^==\s*(.*?)\s*==$/);
    if (bm) { band = { label: bm[1], zones: [] }; bands.push(band); zone = null; return; }
    if (line.startsWith("@")) {

      if (m) edges.push({ from: m[1].trim(), to: m[3].trim(), label: (m[4] || "").trim(), dashed: m[2] === "=>" });
      return;
    }
    const zm = line.match(/^\[(.+?)\]$/);
    if (zm) {
      const parts = zm[1].split("|");
      zone = { title: parts[0].trim(), sub: (parts[1] || "").trim(), groups: [], arrow: "" };
      band.zones.push(zone);
      return;
    }
    const i = line.indexOf(":");
    if (i === -1 || !zone) return;
    zone.groups.push({
      label: line.slice(0, i).trim(),
      nodes: line.slice(i + 1).split(",").map(s => s.trim()).filter(Boolean),
    });
  });
  const id = "ac" + (ARCH_SEQ++);
  ARCH_MODELS.set(id, { bands: bands.filter(b => b.zones.length), edges });
  const noteHtml = notes.length
    ? `<ol class="arch-notes">` + notes.map((n, i) =>
        `<li><span class="num">${i + 1}</span><span>${esc(n)}</span></li>`).join("") + `</ol>`
    : "";

}

    ctx.font = FC.fontSm;
    if (z.sub) w = Math.max(w, ctx.measureText(z.sub).width);
    z.groups.forEach(g => {
      ctx.font = FC.fontXs;

function drawArchCanvas(canvas, model, scale) {
  const bands = model.bands || model;

  ctx.font = FC.fontXs;
  let labelW = 0;
  bands.forEach(b => { if (b.label) labelW = Math.max(labelW, ctx.measureText(b.label).width + 22); });

  const w = Math.max(...bands.map(b => b.w)) + AZPAD * 2 + labelW + lane;
  const h = bands.reduce((a, b, i) => a + b.h + b.below + (i < bands.length - 1 ? b.gap : 0), 0) + AZPAD * 2;
  const dpr = (window.devicePixelRatio || 1) * (scale || 1);

  canvas.style.width = Math.ceil(w * (scale || 1)) + "px";
  canvas.style.height = Math.ceil(h * (scale || 1)) + "px";

  ctx.fillStyle = FC.bg; ctx.fillRect(0, 0, w, h);

      ctx.fillText(bd.label, AZPAD, bandTop + bd.h / 2);

    bandTop += bd.h + bd.below + bd.gap;
  });

  drawArchEdges(ctx, bands, cross, inband, Math.max(...bands.map(b => b.w)) + AZPAD + labelW + 14);

      const down = e.b.bi > e.a.bi;

        e: e, down: down,

      ctx.lineWidth = e.dashed ? 1.1 : 1.4;

      ctx.beginPath();
      ctx.moveTo(ax, e.a.py + e.a.h); ctx.lineTo(ax, y);
      ctx.lineTo(bx, y); ctx.lineTo(bx, e.b.py + e.b.h + 8);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(bx - 4.5, e.b.py + e.b.h + 9); ctx.lineTo(bx + 4.5, e.b.py + e.b.h + 9);

    }

      };
      bar.onclick = (e) => {
        const b = e.target.closest("[data-step]");
        if (!b || b.disabled) return;
        const n = at + (+b.dataset.step);
        if (n >= 0 && n < items.length) showItem(n);
      };
      tabs.onclick = (e) => {
        const b = e.target.closest("[data-flow]");
        if (b) showItem(+b.dataset.flow);
      };
      const start = !flowId ? 0
        : /^t\d+$/.test(flowId) ? Number(flowId.slice(1))
        : items.findIndex(it => it.id === flowId);
      showItem(start < 0 || start >= items.length ? 0 : start, true);
    }
    addLegend(holder);
    markScreenHeads(holder);
    linkScreenRefs(holder);
    nav.querySelectorAll("button").forEach((b, j) =>
      j === i ? b.setAttribute("aria-current", "true") : b.removeAttribute("aria-current"));
    icons();
    drawFlowCanvases(holder);
  };
  const addLegend = (root) => {
    const first = root.querySelector(".flow");
    if (!first || root.querySelector(".flegend")) return;
    const lg = document.createElement("div");
    lg.innerHTML = FLOW_LEGEND;
    first.parentNode.insertBefore(lg.firstElementChild, first);
  };
  nav.onclick = (e) => { const b = e.target.closest("[data-sec]"); if (b) { pick(+b.dataset.sec); putHash(true); } };
  window.pickSection = (sid) => {
    for (let i = 0; i < secs.length; i++) {
      const txt = secs[i].frag.textContent || "";
      if (txt.indexOf(sid) >= 0) { pick(i); return true; }
    }
    return false;
  };
  window.goToFlow = (id) => {
    if (!flowIndex.has(id)) return false;
    pick(flowIndex.get(id), id);
    requestAnimationFrame(() => {
      const h = body.querySelector("#flow-" + id);
      if (!h) return;
      h.scrollIntoView({ block: "center", behavior: "auto" });
      h.classList.add("hit");
      setTimeout(() => h.classList.remove("hit"), 1600);
    });
    return true;
  };
  const st = window.__start || { sec: 0, flow: "" };
  window.__start = null;
  pick(st.sec < secs.length ? st.sec : 0, st.flow);
  putHash();
}

const SCREEN_DOC = new Map();
D.documents.forEach((d, i) => {
  const re = /^#### ((?:ADM|STR|WEB|KSK)-[A-Z]{3,4}-[A-Z]{3,6})/gm;
  let m;
  while ((m = re.exec(d.content || ""))) if (!SCREEN_DOC.has(m[1])) SCREEN_DOC.set(m[1], i);
});
window.goToScreenDoc = (id) => {
  if (!SCREEN_DOC.has(id)) return false;
  const i = SCREEN_DOC.get(id);
  show("doc", i);
  let n = 0;
  const tryHit = () => {
    if (goToScreenLocal(id)) return;
    if (++n > 40) return;
    if (window.pickSection && window.pickSection(id)) { setTimeout(tryHit, 60); return; }
    setTimeout(tryHit, 60);
  };
  setTimeout(tryHit, 80);
  return true;
};
function goToScreenLocal(id) {
  const el = document.querySelector('[data-sid="' + id + '"]');
  if (!el) return false;
  el.scrollIntoView({ block: "start", behavior: "smooth" });
  el.classList.add("hit");
  setTimeout(() => el.classList.remove("hit"), 1600);
  return true;
}
function show(view, doc) {
  current = { view, doc: doc ?? current.doc, sec: current.sec || 0, flow: current.flow || "" };
  Object.entries(pages).forEach(([k, el]) => { el.hidden = (k !== view); });
  tabs.forEach(b => b.setAttribute("aria-selected", String(b.dataset.nav === view)));
  if (view === "doc") renderDoc(current.doc, current.sec, current.flow);
  putHash();
}
// 절과 Flow까지 주소에 담는다. 새로 고쳐도 보던 자리가 그대로 열린다
function putHash(push) {
  const v = current.view;
  let hash = "#/";
  if (v === "doc") {
    hash = `#/doc/${D.documents[current.doc].no}`;
    if (current.sec) hash += "/" + current.sec;
    if (current.flow) hash += "/" + current.flow;
  } else if (v === "changes") hash = "#/changes";
  if (location.hash === hash) return;
  if (push) history.pushState(null, "", hash);
  else history.replaceState(null, "", hash);
  try { localStorage.setItem("dash.route", hash); } catch (e) {}
}
window.markPlace = (sec, flow) => {
  if (current.view !== "doc") return;
  current.sec = sec || 0;
  current.flow = flow || "";
  putHash();
};
function routeFrom(hash) {
  const m = String(hash || "").match(/^#\/doc\/(\d+)(?:\/(\d+))?(?:\/(FL-\d{3}|t\d+))?/);
  if (m) {
    const i = D.documents.findIndex(d => d.no === Number(m[1]));
    if (i >= 0) {
      current.sec = m[2] ? Number(m[2]) : 0;
      current.flow = m[3] || "";
      return show("doc", i);
    }
  }
  if (/^#\/changes/.test(hash || "")) return show("changes");
  return show("list");
}
tabs.forEach(b => b.addEventListener("click", () => show(b.dataset.nav)));
document.getElementById("docList").addEventListener("click", e => {
  const b = e.target.closest("[data-doc]");
  if (b) { current.sec = 0; current.flow = ""; show("doc", +b.dataset.doc); }
});
document.getElementById("backBtn").addEventListener("click", () => show("list"));
window.addEventListener("hashchange", () => routeFrom(location.hash));

// ── 커스텀 드롭다운
function makeSelect(host, label, values, onChange) {
  const opts = [{ v: "", t: "전체" }, ...values.map(v => ({ v, t: v }))];
  let cur = "", open = false, cursor = 0;
  host.innerHTML = `
    <button class="sel-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span>${esc(label)}</span><span class="val">전체</span><i data-lucide="chevron-down" class="chev"></i>
    </button>
    <ul class="sel-menu" role="listbox" aria-label="${esc(label)}" hidden>
      ${opts.map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === 0}"><i data-lucide="check"></i>${esc(o.t)}</li>`).join("")}
    </ul>`;
  const btn = host.querySelector(".sel-btn"), menu = host.querySelector(".sel-menu");
  const paintCursor = () => menu.querySelectorAll("li").forEach((li, i) => li.classList.toggle("cursor", i === cursor));
  const setOpen = (v) => {
    open = v; menu.hidden = !v; host.dataset.open = String(v); btn.setAttribute("aria-expanded", String(v));
    if (v) { cursor = Math.max(0, opts.findIndex(o => o.v === cur)); paintCursor(); }
  };
  const pick = (i) => {
    cur = opts[i].v;
    btn.querySelector(".val").textContent = opts[i].t;
    btn.classList.toggle("set", cur !== "");
    menu.querySelectorAll("li").forEach((li, j) => li.setAttribute("aria-selected", String(i === j)));
    setOpen(false); btn.focus(); onChange(cur);
  };
  btn.addEventListener("click", () => setOpen(!open));
  menu.addEventListener("click", (e) => { const li = e.target.closest("li"); if (li) pick(+li.dataset.i); });
  host.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && open) { e.stopPropagation(); setOpen(false); btn.focus(); return; }
    if (!open && (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") && e.target === btn) { e.preventDefault(); setOpen(true); return; }
    if (!open) return;
    if (e.key === "ArrowDown") { e.preventDefault(); cursor = (cursor + 1) % opts.length; paintCursor(); }
    if (e.key === "ArrowUp") { e.preventDefault(); cursor = (cursor - 1 + opts.length) % opts.length; paintCursor(); }
    if (e.key === "Enter") { e.preventDefault(); pick(cursor); }
  });
  document.addEventListener("click", (e) => { if (open && !host.contains(e.target)) setOpen(false); });
  return () => cur;
}

const uniq = (k) => [...new Set(D.changes.map(c => c[k]).filter(Boolean))];
const getStatus = makeSelect(document.getElementById("selStatus"), "상태", uniq("status"), renderChanges);
const getSource = makeSelect(document.getElementById("selSource"), "출처", uniq("source"), renderChanges);
const getDoc = makeSelect(document.getElementById("selDoc"), "문서", uniq("document_title"), renderChanges);
document.getElementById("fText").addEventListener("input", renderChanges);

function renderChanges() {
  const st = getStatus(), so = getSource(), dc = getDoc();
  const tx = document.getElementById("fText").value.trim().toLowerCase();
  const rows = D.changes.filter(c =>
    (!st || c.status === st) && (!so || c.source === so) && (!dc || c.document_title === dc) &&
    (!tx || `${c.summary} ${c.id} ${c.requested_by || ""}`.toLowerCase().includes(tx)));
  document.getElementById("changeCount").textContent = `${rows.length} / ${D.changes.length}건`;
  document.querySelector("#changeTable tbody").innerHTML = rows.length ? rows.map(c => `<tr>
    <td class="mono nowrap">${esc(c.date)}</td>
    <td class="mono">${esc(c.id)}</td>
    <td><span class="type"><i data-lucide="${TYPE_ICON[c.type] || "dot"}"></i>${esc(c.type)}</span></td>
    <td class="nowrap">${esc(c.source)}</td>
    <td class="nowrap">${esc(c.document_title)}</td>
    <td>${esc(c.summary)}</td>
    <td class="detail">${c.affects_titles.length ? esc(c.affects_titles.join(", ")) : "-"}</td>
    <td class="nowrap">${esc(c.requested_by || "")}</td>
    <td>${pill(c.status)}</td>
  </tr>`).join("") : `<tr><td colspan="9" class="empty">조건에 맞는 변경 이력이 없다.</td></tr>`;
  icons();
}
renderChanges();

let saved = location.hash;
if (!saved) { try { saved = localStorage.getItem("dash.route") || "#/"; } catch (e) { saved = "#/"; } }
routeFrom(saved);
icons();
</script>
