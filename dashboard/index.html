하기\nnote 주문이 진행 중이면 갱신하지 않습니다\n# KSK-ADMN-OPEN 판매 메뉴 설정\n@ kiosk\nh 오늘 열 메뉴를 고르세요 ~ 38 / 42 노출\nsub 커피\nchk 아메리카노 4,800 | chk 라떼 5,000 | chk 콜드브루 5,500 | b2 모두 열기\nsub 디저트\nchk 크루아상 3,000 | chk 마들렌 3,500 (품절) | b2 모두 닫기\nnote 여기서 바꾸면 웹앱과 외부 POS에도 함께 적용됩니다\nb2 취소 | b 저장\n# KSK-ADMN-SOUT 품절 설정\n@ kiosk\nh 품절 설정 ~ 뒤로\nfq 검색어 | tx 품절 3건\nt 메뉴명, 판매가, 상태, 재개 시각, 동작\ntd 아메리카노, 4,800, 판매중, , 품절\ntd 크루아상, 3,000, 품절, 16:00, 판매 재개\ntd 마들렌, 3,500, 품절, 수동 해제까지, 판매 재개\nnote 여기서 바꾸면 웹앱과 외부 POS에도 함께 적용됩니다\nnote 네트워크가 끊기면 단말에 두었다가 복구 후 보냅니다\n# KSK-ADMN-DEVC 단말 상태 확인\n@ kiosk\nh 단말 상태 확인 ~ 뒤로\nt 단말, 상태, 사유·마지막 통신, 동작\ntd 주문서 프린터, 오류, 용지 없음 · 09-04 10:20, 다시 확인\ntd 카드 단말, 정상, 09-04 14:02, 시험 결제\ntd 네트워크, 정상, 응답 42ms, 다시 확인\nnote 프린터 오류 상태에서도 주문은 받습니다. 주문서는 화면으로 확인합니다\n```\n"}, {"no": 7, "id": "DOC-07", "title": "기능 명세", "file": "docs/07_기능명세.md", "category": "명세", "status": "확정", "progress": 100, "eta": "", "version": "1.0", "updated": "2026-09-04", "inherits_titles": ["서비스 구조", "IA", "Wireframe", "기획 검토"], "content": "# 07. 기능 명세\n\n화면 단위로 무엇을 처리하고 어떤 조건과 예외를 두는지 정의한다. 화면 ID와 화면명은 05 IA와 같다.\n\n배치는 06 Wireframe, 처리 순서는 04 Flow에 있다. 여기서는 화면이 지켜야 할 규칙을 적는다.\n\n확인 팝업과 결과 토스트는 05 문서 7절 공통 규칙을 따른다. 화면마다 다시 적지 않는다.\n\n## 1. 내부 어드민\n\n### 인증\n\n#### ADM-AUTH-LOGIN 로그인\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 아이디와 비밀번호로 인증한다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-110 로그인 · FL-908 로그인 실패 |\n\n**처리**\n\n1. 로그인 → 성공 시 ADM-AUTH-OTP\n2. 아이디 저장 → 다음 접속 시 아이디를 채워 둔다\n\n**조건**\n\n* 실패 5회 시 계정을 잠근다\n* 어느 항목이 틀렸는지 밝히지 않는다\n\n**예외**\n\n* 불일치 시 \"아이디 또는 비밀번호가 올바르지 않습니다. (2/5)\" 표시. 어느 항목이 틀렸는지 밝히지 않고 남은 횟수만 알린다\n* 연속 5회 실패 시 \"계정이 잠겼습니다. 관리자에게 문의해 주세요.\" 표시하고 잠금 시각을 함께 보여준다. 로그인 버튼을 비활성으로 둔다\n* 잠긴 본사 계정은 다른 본사 운영자가 계정 목록에서 푼다\n* 로그인에 성공하면 실패 횟수를 초기화한다\n\n#### ADM-AUTH-OTP 2차 인증\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록 단말로 인증번호를 확인한다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-111 2차 인증 |\n\n**처리**\n\n1. 인증하기 → 성공 시 ADM-HOME-MAIN\n2. 시간이 남아 있으면 버튼은 인증하기로 둔다\n3. 유효시간이 끝나면 버튼을 재발급으로 바꾸고 입력칸을 비활성으로 둔다\n4. 재발급 → 새 인증번호를 보내고 남은 시간을 초기화한다\n5. 다른 계정으로 로그인하기 → 진행 중이던 인증을 버리고 로그인 화면으로 돌아간다\n\n**조건**\n\n* 외부 접속은 2차 인증을 건너뛸 수 없다\n* 인증번호 유효시간 3분\n\n**예외**\n\n* 인증번호를 다 입력하기 전에는 인증하기를 비활성으로 둔다\n* 불일치 시 \"인증번호가 올바르지 않습니다. (2/5)\" 표시하고 남은 횟수를 알린다\n* 유효시간 3분이 지나면 \"인증 시간이 지났습니다. 다시 받아 주세요.\" 표시하고 버튼을 재발급으로 바꾼다\n* 실패 횟수를 넘기면 일정 시간 차단한다\n* 다른 계정으로 돌아가면 발송한 인증번호를 무효로 만든다. 이전 번호로는 인증할 수 없다\n\n### 대시보드\n\n#### ADM-HOME-MAIN 대시보드\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 조치가 필요한 항목과 오늘 실적, 정산 상태, 행사 개시 준비를 표시한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-112 대시보드 |\n\n**처리**\n\n1. 이상 항목을 판정해 지금 확인할 것 영역에 발생 시각 순으로 표시한다\n2. 오늘 실적을 주문, 결제, 취소, 순매출로 표시하고 집계 시점을 함께 적는다\n3. 처리 대기를 건수와 가장 오래된 건의 경과 시간으로 표시한다\n4. 최근 정산 대사 상태를 기준일별로 표시한다\n5. 개시 7일 이내 행사의 준비 완료 수를 표시한다\n6. 각 항목을 선택하면 해당 화면으로 이동한다\n\n**이상 판정 기준**\n\n| 유형 | 기준 |\n| --- | --- |\n| 단말 미연결 | 마지막 통신 후 30분 경과 |\n| 접수 지연 | 접수 대기가 30초를 넘긴 주문이 있는 매장 |\n| 매출 급락 | 최근 1시간 주문이 같은 요일 같은 시간대 평균의 30% 미만 |\n| 품절 급증 | 판매 메뉴의 30% 이상이 품절 |\n\n**조건**\n\n* 추세 그래프와 매장 순위를 두지 않는다. 비교는 매출 화면에서 한다\n* 모든 항목에 이동 경로를 붙인다. 누를 곳이 없는 숫자는 두지 않는다\n* 이상 판정 기준은 전체 공통이다. 매장별로 다르게 두지 않는다\n* 한 화면의 지표 묶음을 다섯 개 이하로 유지한다\n\n**예외**\n\n* 이상 항목이 없으면 \"확인할 항목이 없습니다.\"를 표시한다\n* 집계가 아직 돌지 않은 구간은 수치를 비우고 \"집계 중\"으로 표시한다\n* 개시 7일 이내 행사가 없으면 개시 준비 영역을 숨긴다\n* 매출 급락은 개시 첫날과 종료일에는 판정하지 않는다. 비교할 과거 구간이 없다\n\n### 행사\n\n#### ADM-EVNT-LIST 행사 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 기간과 상태로 행사를 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 진행 전, 진행 중, 종료 |\n| 연결 Flow | FL-101 매장 개설 · FL-113 행사 목록·등록 |\n\n**처리**\n\n1. 조회 → 조건에 맞는 행사를 표시한다\n2. 행 선택 → ADM-EVNT-FORM\n3. 행사 등록 → ADM-EVNT-FORM 신규\n\n**조건**\n\n* 종료 행사는 기본 조회에서 제외한다\n\n**예외**\n\n* 결과가 없으면 \"조회 결과가 없습니다.\" 표시\n* 종료 행사는 기본 조회에서 제외한다. 상태를 종료로 지정해야 나온다\n\n#### ADM-EVNT-FORM 행사 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 행사명과 기간을 등록한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-113 행사 목록·등록 |\n\n**처리**\n\n1. 저장 → 확인 팝업 후 목록으로 이동\n2. 소속 상권 선택 → ADM-ZONE-FORM\n\n**조건**\n\n* 종료일은 시작일 이후여야 한다\n* 종료된 행사는 수정할 수 없다\n\n**예외**\n\n* 종료일이 시작일보다 빠르면 해당 항목에 \"종료일은 시작일 이후여야 합니다.\" 표시하고 저장을 막는다\n* 종료된 행사는 입력을 읽기 전용으로 두고 \"종료된 행사는 수정할 수 없습니다.\" 표시\n\n#### ADM-BRND-LIST 브랜드 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 브랜드를 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-115 브랜드 목록·등록 |\n\n**처리**\n\n1. 행 선택 → ADM-BRND-FORM\n\n**예외**\n\n* 결과가 없으면 \"조회 결과가 없습니다.\" 표시\n\n#### ADM-BRND-FORM 브랜드 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 브랜드명과 표시명 규칙을 등록한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-115 브랜드 목록·등록 |\n\n**처리**\n\n1. 저장 → 확인 팝업 후 목록으로 이동\n\n**조건**\n\n* 브랜드명 중복을 허용하지 않는다\n\n**예외**\n\n* 브랜드명이 겹치면 해당 항목에 \"이미 등록된 브랜드명입니다.\" 표시하고 저장을 막는다\n\n#### ADM-STOR-LIST 매장 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 행사, 상권, 브랜드, 상태로 매장을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 영업, 일시중지, 종료, 폐점 |\n| 연결 Flow | FL-105 매장 상태 전환 · FL-116 매장 목록 |\n\n**처리**\n\n1. 행 선택 → ADM-STOR-DETAIL\n2. 매장 등록 → ADM-STOR-FORM 신규\n3. 상태 선택 → ADM-STOR-STATE\n\n**조건**\n\n* 폐점 매장은 기본 조회에서 제외한다\n\n**예외**\n\n* 폐점 매장은 기본 조회에서 제외한다. 선택해야 나온다\n* 결과가 없으면 \"조회 결과가 없습니다.\" 표시\n\n#### ADM-STOR-FORM 매장 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 매장 기본 정보와 소속, 사업자 정보를 등록한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-117 매장 등록·수정 |\n\n**처리**\n\n1. 사업자등록번호 조회 → 휴폐업 상태를 확인해 표시한다\n2. 저장 → 확인 팝업 후 상세로 이동\n\n**조건**\n\n* 폐업 사업자는 저장할 수 없다\n* 임시사업장은 모사업자 번호를 공유하므로 사업자번호 중복을 허용한다\n\n**예외**\n\n* 폐업 사업자면 \"폐업 상태의 사업자등록번호입니다.\" 표시하고 저장을 막는다\n* 사업자등록번호 중복은 허용한다. 임시사업장은 모사업자 번호를 함께 쓴다\n* 하위가맹점 심사가 완료되지 않으면 주문을 받지 않는다는 안내를 상단에 표시\n\n#### ADM-STOR-DETAIL 매장 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 매장 정보와 변경 요청 이력을 확인한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-105 매장 상태 전환 · FL-118 매장 상세 |\n\n**처리**\n\n1. 확정 → 요청 값을 매장 정보에 반영한다\n2. 반려 → 사유를 입력받고 매장에 통지한다\n3. 상태 전환 → ADM-STOR-STATE\n\n**조건**\n\n* 매장이 올린 변경 요청은 본사 확정 전까지 반영하지 않는다\n\n**예외**\n\n* 매장이 등록한 메뉴는 조회만 한다. 본사가 수정하지 않는다\n* 변경 요청이 없으면 해당 영역을 숨긴다\n\n#### ADM-STOR-STATE 매장 상태 전환\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 매장 상태를 바꾼다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 상태값 | 영업, 일시중지, 종료, 폐점 |\n| 연결 Flow | FL-105 매장 상태 전환 · FL-119 매장 상태 전환 |\n\n**처리**\n\n1. 변경 → 확인 팝업 후 처리하고 결과를 토스트로 알린다\n\n**조건**\n\n* 진행 중 주문이 있으면 완료 후 종료한다\n* 폐점은 되돌릴 수 없고 매장 코드를 재사용하지 않는다\n\n**예외**\n\n* 진행 중 주문이 있으면 종료를 예약하고 주문이 끝난 뒤 적용한다\n* 폐점은 되돌릴 수 없다. 확인 버튼을 기본 선택으로 두지 않는다\n* 폐점한 매장 코드는 재사용하지 않는다\n\n#### ADM-EVNT-DETAIL 행사 상세\n\n#### ADM-EVNT-COPY 행사 복제\n\n#### ADM-STOR-BULK 매장 일괄 등록\n\n### 상권\n\n#### ADM-EVNT-DETAIL 행사 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 행사에 속한 상권과 업체, 개시 준비 상태를 한 화면에서 확인하고 채운다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 진행 전, 진행 중, 종료 |\n| 연결 Flow | FL-150 행사 상세 |\n\n**처리**\n\n1. 행사 기간과 상태, 개시까지 남은 일수를 표시한다\n2. 준비 항목을 상권 등록, 업체 등록, 메뉴 등록, 표시 정보, 하위가맹점 심사 다섯으로 나눠 완료와 미완료 수를 표시한다\n3. 미완료 항목을 누르면 해당 업체만 걸러서 아래 목록에 표시한다\n4. 업체를 열면 매장 상세로 이동한다. 돌아오면 걸러 둔 조건을 되살린다\n5. 업체를 골라 준비 요청 안내를 보낸다\n\n**조건**\n\n* 준비 항목의 미완료 수는 그 행사에 속한 업체를 기준으로 센다\n* 안내 발송은 매장 계정의 휴대폰번호로 보내고 발송 이력에 남긴다\n* 개시일이 지나면 준비 현황을 더 이상 갱신하지 않고 마지막 상태를 남긴다\n\n**예외**\n\n* 미완료가 없으면 준비 완료 안내를 표시하고 업체 목록을 숨긴다\n* 종료된 행사는 안내 발송을 막는다\n\n#### ADM-EVNT-COPY 행사 복제\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 이전 행사의 상권과 업체 구성을 새 행사로 복사한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-151 행사 복제 |\n\n**처리**\n\n1. 복제할 행사를 고른다. 상권 수와 업체 수를 함께 보여준다\n2. 가져올 항목을 고른다. 상권 구성, 업체 목록, 업체와 상권의 연결, 담당 계정이다\n3. 새 행사의 이름과 기간을 입력한다\n4. 복제하면 새 행사와 그 아래 상권, 업체를 만든다\n5. 복제 결과와 확인이 필요한 항목을 보여준 뒤 행사 상세로 보낸다\n\n**조건**\n\n* 업체는 새 매장 코드로 만든다. 이전 코드를 재사용하지 않는다\n* 사업자 정보와 정산계좌는 복사하지 않는다. 행사마다 다시 확인해야 한다\n* 메뉴와 판매가는 복사하지 않는다. 매장이 직접 등록한다\n* 하위가맹점 심사는 미신청 상태로 만든다\n\n**예외**\n\n* 복제할 행사를 고르지 않으면 진행할 수 없다\n* 종료일이 시작일보다 빠르면 해당 항목에 표시하고 막는다\n* 복제 중 일부가 실패하면 성공한 건만 남기고 실패 목록을 보여준다\n\n#### ADM-STOR-BULK 매장 일괄 등록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 파일로 매장을 한 번에 등록한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-152 매장 일괄 등록 |\n\n**처리**\n\n1. 양식을 내려받아 채운 뒤 올린다\n2. 행 단위로 검증한다. 사업자등록번호 휴폐업, 상권 존재 여부, 브랜드와 지점번호 중복, 필수 항목 누락을 본다\n3. 등록 가능 건수와 오류 건수를 보여준다\n4. 오류 행을 뺀 나머지만 등록한다\n\n**조건**\n\n* 오류 행은 사유와 함께 표시하고 파일로 내려받을 수 있게 한다\n* 임시사업장은 사업자등록번호가 겹칠 수 있으므로 중복을 오류로 보지 않는다\n* 한 번에 올릴 수 있는 행 수를 제한한다. 초과하면 나눠 올리도록 안내한다\n\n**예외**\n\n* 파일 형식이 다르면 검증하지 않고 형식을 안내한다\n* 전부 오류면 등록 버튼을 비활성으로 둔다\n\n#### ADM-ZONE-LIST 상권 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 행사에 속한 상권을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-114 상권 목록·등록 |\n\n**처리**\n\n1. 행 선택 → ADM-ZONE-FORM\n2. 매장 수 선택 → 해당 상권으로 걸러진 ADM-STOR-LIST\n\n**조건**\n\n* 상권은 행사 하나에만 속한다\n\n**예외**\n\n* 결과가 없으면 \"조회 결과가 없습니다.\" 표시\n\n#### ADM-ZONE-FORM 상권 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 상권명과 소속 행사를 등록한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-114 상권 목록·등록 |\n\n**처리**\n\n1. 저장 → 확인 팝업 후 목록으로 이동\n\n**조건**\n\n* 매장이 있는 상권은 소속 행사를 바꿀 수 없다\n\n**예외**\n\n* 매장이 있는 상권은 소속 행사를 읽기 전용으로 두고 \"매장이 있어 소속 행사를 바꿀 수 없습니다.\" 표시\n\n### 매출\n\n#### ADM-SALE-COMP 행사·상권 비교\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 행사와 상권을 축으로 매출을 비교한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-103 매출 통계 조회 · FL-135 행사·상권 비교 |\n\n**처리**\n\n1. 행 선택 → 해당 상권으로 걸러진 ADM-SALE-LIST\n\n**조건**\n\n* 비교 구간의 매장 수가 다르면 함께 표시한다\n\n**예외**\n\n* 주문 채널을 쓰지 않는 매장이 있으면 비고에 표시하고 비교에서 제외한다\n* 비교 구간의 매장 수가 다르면 매장당 평균을 함께 보도록 안내한다\n\n#### ADM-SALE-LIST 매출 조회\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 기간과 소속 기준으로 매출을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 잠정, 확정 |\n| 연결 Flow | FL-103 매출 통계 조회 · FL-133 매출 조회 |\n\n**처리**\n\n1. 행 선택 → ADM-SALE-DETAIL\n2. 내려받기 → 조회 조건 그대로 파일 생성\n\n**조건**\n\n* 당일 구간은 집계 시점을 함께 표시한다\n* 소속 기준을 주문 시점과 현재 중 선택한다\n\n**예외**\n\n* 당일 구간은 집계 시점을 함께 표시한다\n* 소속 기준을 현재로 바꾸면 과거 구간 수치가 달라진다는 안내를 표시\n\n#### ADM-SALE-DETAIL 매출 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 매장별 주문과 결제 내역을 확인한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-103 매출 통계 조회 · FL-134 매출 상세 |\n\n**처리**\n\n1. 주문 행 선택 → 주문 상세를 레이어로 표시\n\n**조건**\n\n* 매입 후 취소는 취소 일자에 별도 거래로 기록한다\n* 승인취소는 매출에서 제외한다\n\n**예외**\n\n* 매입 후 취소는 취소 일자에 별도 거래로 표시한다\n* 승인취소는 매출에서 제외하고 목록에도 넣지 않는다\n\n### 정산\n\n#### ADM-RECN-LIST 정산 대사\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 결제 원장과 결제대행사 내역을 대조한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 거래, 정산, 입금 |\n| 연결 Flow | FL-141 정산 대사 |\n\n**처리**\n\n1. 대사 실행 → 결과를 요약으로 표시\n2. 불일치 보기 → ADM-RECN-DIFF\n\n**조건**\n\n* 1만 건 초과 시 파일 수신으로 전환한다\n* 결제 키와 주문번호로 연결한다\n\n**예외**\n\n* 조회 건수가 1만 건을 넘으면 \"건수가 많아 파일 수신으로 처리합니다.\" 표시하고 방식을 바꾼다\n* 외부 조회 실패 시 사유를 표시하고 조건 입력 상태로 되돌린다\n\n#### ADM-RECN-DIFF 대사 불일치\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 불일치 건을 유형별로 처리한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 우리에만, 상대에만, 금액 불일치, 매입 지연 |\n| 연결 Flow | FL-142 대사 불일치 |\n\n**처리**\n\n1. 건 선택 → 좌우 값을 나란히 표시\n2. 처리 기록 → 처리자와 시각, 사유를 남기고 목록을 갱신\n\n**조건**\n\n* 처리자와 사유를 남긴다\n* 매입 지연은 다음 대사로 이월한다\n\n**예외**\n\n* 매입 지연은 다음 대사로 이월하고 완료로 처리하지 않는다\n* 사유 없이 처리할 수 없다\n\n#### ADM-RECN-STOR 업체별 정산\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 업체별로 정산 진행 상태와 미정산 금액을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 미정산, 정산 완료 |\n| 연결 Flow | FL-148 업체별 정산 |\n\n**처리**\n\n1. 기간과 소속, 정산 상태로 업체를 조회한다\n2. 거래 금액, 정산 금액, 미정산 금액, 최종 지급일을 표시한다\n3. 내려받기 → 조회 조건 그대로 파일을 만든다\n\n**조건**\n\n* 결제대행사가 지급한 내역을 그대로 보여준다. 플랫폼이 정산금액을 계산하지 않는다\n* 거래 금액과 정산 금액의 차이는 결제대행사 수수료다. 차감 내역은 결제대행사 자료를 따른다\n\n**예외**\n\n* 하위가맹점 심사가 끝나지 않은 매장은 정산 대상에서 제외하고 사유를 표시한다\n* 지급일이 오지 않은 건은 미정산이 아니라 대기로 표시한다\n\n### 시스템\n\n#### ADM-USER-LIST 계정 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 계정과 담당 매장 범위를 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 활성, 잠금 |\n| 연결 Flow | FL-104 계정·권한 운영 · FL-136 계정 목록·등록 |\n\n**처리**\n\n1. 행 선택 → ADM-USER-FORM\n2. 대행 접속 → ADM-USER-PROXY\n3. 잠금 해제 → 사유를 입력받고 실패 횟수를 초기화한다\n4. 비밀번호 초기화 → 등록된 휴대폰번호로 새 초기 비밀번호를 보낸다\n\n**조건**\n\n* 잠긴 계정은 사유와 잠금 시각을 함께 표시한다\n\n**예외**\n\n* 잠긴 계정은 사유와 잠금 시각을 함께 표시한다\n\n#### ADM-USER-FORM 계정 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 가맹 관리자 계정을 발급하고 담당 매장을 지정한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-104 계정·권한 운영 · FL-136 계정 목록·등록 |\n\n**처리**\n\n1. 중복 확인 → 사용 가능 여부를 즉시 표시\n2. 저장 → 확인 팝업 후 목록으로 이동\n\n**조건**\n\n* 본사 계정은 이상 알림 수신 여부를 함께 지정한다. 수신으로 지정한 계정에만 단말 미연결 2단계 알림을 보낸다\n\n* 아이디 중복 시 저장할 수 없다\n* 역할과 데이터 범위를 따로 지정한다\n\n**예외**\n\n* 아이디가 겹치면 저장을 막는다\n* 역할과 담당 매장 범위는 따로 지정한다. 역할을 바꿔도 범위는 유지된다\n\n#### ADM-USER-PROXY 대행 접속\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 가맹 어드민 화면을 대신 본다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-104 계정·권한 운영 · FL-137 대행 접속 |\n\n**처리**\n\n1. 접속 → 가맹 어드민을 조회 전용으로 연다. 상단에 대행 중 표시를 고정한다\n\n**조건**\n\n* 실제 조작자와 대상 계정을 함께 기록한다\n* 조회만 하고 저장은 막는다\n\n**예외**\n\n* 사유 없이 접속할 수 없다\n* 대행 중에는 저장과 삭제 버튼을 비활성으로 표시한다\n\n#### ADM-APIK-LIST 연동 계정 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 외부 연동 계정을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-140 연동 계정 · FL-501 메뉴 정보 제공 |\n\n**처리**\n\n1. 행 선택 → ADM-APIK-FORM\n2. 사용 중지 → 확인 팝업 후 처리\n\n**예외**\n\n* 접근 키 전체를 목록에 표시하지 않는다\n\n#### ADM-APIK-FORM 연동 계정 등록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 접근 키를 발급하고 매장 범위를 지정한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-140 연동 계정 · FL-501 메뉴 정보 제공 |\n\n**처리**\n\n1. 저장 → 접근 키와 비밀 키를 발급해 한 번만 표시\n2. 복사 → 값을 클립보드에 넣고 토스트로 알린다\n\n**조건**\n\n* 비밀 키는 발급 시점에만 보여준다\n* 다시 조회할 수 없다\n\n**예외**\n\n* 비밀 키는 다시 조회할 수 없다. 화면을 벗어나면 재발급해야 한다\n\n#### ADM-ERRL-LIST 오류 로그\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 배치, 알림 발송, 외부 연동에서 발생한 오류를 한곳에서 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 미확인, 확인 |\n| 연결 Flow | FL-149 오류 로그 |\n\n**처리**\n\n1. 기간, 유형, 확인 상태로 오류를 조회한다\n2. 발생 시각, 유형, 대상, 내용을 표시한다\n3. 확인 → 확인자와 시각을 기록하고 기본 조회에서 뺀다\n\n**조건**\n\n* 유형은 배치, 알림 발송, 외부 연동 셋으로 나눈다\n* 확인 처리한 건은 기본 조회에서 제외한다. 조건을 바꾸면 다시 볼 수 있다\n* 같은 원인으로 반복 발생한 건은 묶어서 발생 횟수로 표시한다\n\n**예외**\n\n* 배치 오류는 재실행 경로를 함께 표시한다\n* 알림 발송 오류는 재발송 경로를 함께 표시한다\n\n#### ADM-BATC-LIST 배치 실행 이력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 배치 실행 결과를 확인하고 다시 실행한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 성공, 실패, 부분 실패 |\n| 연결 Flow | FL-143 배치 실행 이력 |\n\n**처리**\n\n1. 재실행 → 대상 범위를 확인 팝업에 표시한 뒤 실행\n2. 처리 내역 보기 → 건별 결과를 레이어로 표시\n\n**조건**\n\n* 다시 실행할 때 이미 처리한 건은 건너뛴다\n\n**예외**\n\n* 재실행 시 이미 처리한 건은 건너뛴다\n* 실행 중인 배치는 재실행 버튼을 비활성으로 둔다\n\n#### ADM-ALOG-LIST 접속기록 조회\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 접속과 처리 내역을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-104 계정·권한 운영 · FL-138 접속기록 조회 |\n\n**처리**\n\n1. 내려받기 → 조회 조건 그대로 파일 생성\n\n**조건**\n\n* 1년 이상 보관하고 월 1회 점검한다\n\n**예외**\n\n* 대행 접속은 조작자와 대상 계정을 함께 표시한다\n* 보관 기간이 지난 기록은 조회되지 않는다\n\n#### ADM-ULOG-LIST 계정 변경 이력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 권한과 담당 범위 변경 내역을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-144 계정 변경 이력 |\n\n**처리**\n\n1. 점검 확인 → 점검자와 시각을 기록\n2. 내려받기 → 조회 조건 그대로 파일 생성\n\n**조건**\n\n* 변경 전후 값을 보관한다\n* 권한 상향 건은 점검 대상으로 분류한다\n\n**예외**\n\n* 권한이 올라간 변경은 표시로 구분하고 점검 대상으로 분류한다\n\n#### ADM-PRIV-LIST 개인정보 파기 이력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 보유 기간이 지난 개인정보의 파기 결과를 확인한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-145 개인정보 파기 이력 |\n\n**처리**\n\n1. 행 선택 → 처리 내역을 레이어로 표시\n\n**조건**\n\n* 일 배치로 실행한다\n* 주문번호와 금액은 남기고 개인 식별 항목만 지운다\n\n**예외**\n\n* 파기 대상이 없어도 실행 기록은 남긴다\n* 다른 법령에 따라 보존해야 하는 정보는 분리 보관하고 파기 대상에서 제외한다\n\n## 2. 가맹 어드민\n\n### 인증\n\n#### STR-AUTH-LOGIN 로그인\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 아이디와 비밀번호로 인증한다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매점 운영 · FL-210 로그인 · FL-908 로그인 실패 |\n\n**처리**\n\n1. 로그인 → 성공 시 STR-AUTH-OTP\n2. 비밀번호 재설정 → STR-AUTH-RESET\n\n**조건**\n\n* 실패 5회 시 계정을 잠근다\n* 회원가입 경로를 두지 않는다\n\n**예외**\n\n* 회원가입 경로를 두지 않는다. 계정은 본사가 발급한다\n* 연속 5회 실패 시 계정을 잠근다. 비밀번호 재설정을 마치면 자동으로 풀린다\n* 재설정 경로까지 막힌 경우 본사가 계정 목록에서 푼다\n\n#### STR-AUTH-OTP 2차 인증\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록 단말로 인증번호를 확인한다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매점 운영 · FL-211 2차 인증·매장 선택 |\n\n**처리**\n\n1. 인증하기 → 담당 매장이 둘 이상이면 STR-STOR-PICK, 하나면 STR-HOME-MAIN\n2. 유효시간이 끝나면 버튼을 재발급으로 바꾸고 입력칸을 비활성으로 둔다\n3. 재발급 → 새 인증번호를 보내고 남은 시간을 초기화한다\n4. 다른 계정으로 로그인하기 → 진행 중이던 인증을 버리고 로그인 화면으로 돌아간다\n\n**조건**\n\n* 인증번호 유효시간 3분\n\n**예외**\n\n* 유효시간 3분 경과 시 시간 초과를 안내한다\n* 등록 단말이 없으면 등록 안내를 표시하고 진행을 막는다\n\n#### STR-AUTH-RESET 비밀번호 재설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록된 휴대폰번호로 본인을 확인하고 비밀번호를 바꾼다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-229 비밀번호 재설정 |\n\n**처리**\n\n1. 변경 → 처리 후 로그인 화면으로 이동하고 토스트로 알린다\n\n**조건**\n\n* 직전 비밀번호를 다시 쓸 수 없다\n* 실패 횟수 초과 시 일정 시간 차단한다\n\n**예외**\n\n* 등록 정보와 다르면 어느 항목이 틀렸는지 밝히지 않고 확인을 요청한다\n* 작성 규칙에 맞지 않거나 직전 비밀번호와 같으면 해당 항목에 표시하고 저장을 막는다\n* 실패 횟수를 넘기면 일정 시간 차단하고 본사 문의를 안내한다\n\n#### STR-STOR-PICK 매장 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담당 매장 중 작업할 매장을 고른다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매점 운영 · FL-211 2차 인증·매장 선택 |\n\n**처리**\n\n1. 매장 선택 → STR-HOME-MAIN\n2. 상단에 선택한 매장을 계속 표시하고 다른 매장으로 바꿀 수 있게 한다\n\n**조건**\n\n* 담당 매장이 하나면 건너뛴다\n\n**예외**\n\n* 담당 매장이 하나면 이 화면을 건너뛴다\n* 영업 종료와 폐점 매장은 선택할 수 없다\n\n### 매점 홈\n\n#### STR-HOME-MAIN 매점 홈\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 접수 대기 건수와 오늘 매출을 표시한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매점 운영 · FL-212 매점 홈 |\n\n**처리**\n\n1. 접수 → 주문 상태를 접수 완료로 바꾸고 주문서를 출력한다\n2. 거절 → 사유를 고르고 결제 취소를 요청한다\n3. 지표 선택 → 해당 목록으로 이동\n\n**조건**\n\n* 접수 대기가 있으면 소리로 알린다\n\n**예외**\n\n* 접수 대기가 생기면 소리로 알린다\n* 1분 안에 응답하지 않으면 자동 취소하고 목록에서 뺀다\n* 단말 오류가 있으면 알림 영역에 사유와 시각을 표시한다\n\n### 주문\n\n#### STR-ORDR-LIST 주문 접수 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 들어온 주문을 수락하고 상태를 바꾼다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 상태값 | 접수 대기, 접수 완료, 조리 중, 조리 완료 |\n| 연결 Flow | FL-203 주문 접수 · FL-213 주문 접수 목록 |\n\n**처리**\n\n1. 접수 → 접수 완료로 바꾸고 주문서를 출력\n2. 거절 → 사유 선택 후 결제 취소 요청\n3. 취소 → 접수 완료 상태에서만 가능. 남은 시간을 함께 표시\n4. 조리 완료 → 고객 호출을 발송\n\n**조건**\n\n* 1분 내 미응답 시 자동 취소한다\n* 접수 완료 후 1분이 지나면 조리 중으로 자동 전환되어 취소할 수 없다\n\n**예외**\n\n* 접수 대기는 1분 안에 응답하지 않으면 자동 취소한다\n* 접수 완료 후 1분이 지나면 조리 중으로 자동 전환되고 취소 버튼이 사라진다\n* 조리 중부터는 취소할 수 없다\n\n#### STR-ORDR-DETAIL 주문 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문 항목과 결제 내역을 확인한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-203 주문 접수 · FL-214 주문 상세 · FL-903 매장 미접수 |\n\n**처리**\n\n1. 상태 변경 → 확인 팝업 후 처리하고 결과를 토스트로 알린다\n2. 주문서 → STR-ORDR-PRNT\n\n**조건**\n\n* 취소는 접수 대기와 접수 완료에서만 할 수 있다\n* 조리 중 이후에는 취소 버튼을 노출하지 않는다\n\n**예외**\n\n* 취소는 접수 대기와 접수 완료에서만 노출한다\n* 조리 중 이후에는 취소 버튼을 노출하지 않는다\n* 개인정보 파기가 끝난 과거 주문은 주문자 정보를 비우고 표시한다\n\n#### STR-ORDR-PRNT 주문서 재출력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문서를 다시 출력한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-203 주문 접수 · FL-215 주문서 재출력 |\n\n**처리**\n\n1. 출력 → 요청 후 결과를 토스트로 알린다\n\n**조건**\n\n* 출력 실패는 화면에 표시하고 주문 처리는 계속한다\n\n**예외**\n\n* 프린터가 연결되지 않으면 출력 버튼을 비활성으로 두고 사유를 표시한다\n* 출력에 실패해도 주문 처리는 계속한다\n\n### 매점 정보\n\n#### STR-INFO-DETAIL 매점 정보\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록된 매장 정보를 확인한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매점 운영 · FL-216 매점 정보 |\n\n**처리**\n\n1. 변경 요청 → STR-INFO-FORM\n\n**조건**\n\n* 직접 수정할 수 없다\n* 변경은 요청으로 처리한다\n\n**예외**\n\n* 이 화면에서 직접 수정할 수 없다. 모든 변경은 요청으로 처리한다\n* 정산계좌와 사업자등록번호는 가려서 표시한다\n\n#### STR-INFO-FORM 매점 정보 변경 요청\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 변경할 항목을 요청한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 상태값 | 대기, 확정, 반려 |\n| 연결 Flow | FL-201 매점 운영 · FL-217 매점 정보 변경 요청 |\n\n**처리**\n\n1. 요청 → 확인 팝업 후 등록하고 본사 확정을 기다린다\n\n**조건**\n\n* 본사 확정 전까지 기존 값을 유지한다\n\n**예외**\n\n* 사유 없이 요청할 수 없다\n* 같은 항목의 대기 중 요청이 있으면 새 요청을 막고 기존 요청을 보게 한다\n* 정산계좌 변경은 첨부 없이 요청할 수 없다\n\n#### STR-OPEN-STATE 영업 상태 변경\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 영업을 일시중지하고 재개한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 상태값 | 영업, 일시중지 |\n| 연결 Flow | FL-201 매점 운영 · FL-218 영업 상태 변경 |\n\n**처리**\n\n1. 변경 → 확인 팝업 후 처리하고 주문 채널에 반영한다\n\n**조건**\n\n* 일시중지 시 재개 시각을 입력한다\n* 중지 중에는 주문을 받지 않는다\n\n**예외**\n\n* 일시중지는 재개 시각 없이 저장할 수 없다\n* 재개 시각이 지나면 자동으로 영업으로 돌아간다\n* 진행 중 주문은 취소되지 않는다\n\n### 메뉴 관리\n\n#### STR-MENU-LIST 메뉴 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록한 메뉴를 조회하고 노출을 관리한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 상태값 | 판매중, 품절, 미노출, 판매 불가 |\n| 연결 Flow | FL-202 품절 처리 · FL-219 메뉴 목록 |\n\n**처리**\n\n1. 수정 → STR-MENU-FORM\n2. 일괄 처리 → 확인 팝업에 대상 건수를 적고 처리\n\n**조건**\n\n* 표시 정보가 없는 메뉴는 판매 불가로 둔다\n\n**예외**\n\n* 표시 정보가 없는 메뉴는 판매 불가로 두고 목록에서 구분해 표시한다\n* 본사 검수에서 반려된 메뉴는 사유를 함께 표시한다\n\n#### STR-MENU-FORM 메뉴 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 메뉴명, 판매가, 이미지, 판매 시간을 등록한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-204 알레르기 정보 등록 · FL-223 메뉴 등록·수정 |\n\n**처리**\n\n1. 저장 → 확인 팝업 후 목록으로 이동\n2. 입력하기 → STR-MENU-ALGN 또는 STR-MENU-ORIG\n\n**조건**\n\n* 표시 정보 미입력 시 저장은 되고 판매 불가로 둔다\n\n**예외**\n\n* 판매가를 0원 이하로 저장할 수 없다\n* 표시 정보가 없어도 저장은 되지만 판매 불가 상태로 둔다\n* 옵션이 알레르기 유발물질을 바꾸면 STR-MENU-COPY를 안내한다\n\n#### STR-MENU-ALGN 알레르기·영양성분 입력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 법정 19개 품목과 영양성분 5종을 입력한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-204 알레르기 정보 등록 · FL-224 알레르기·영양성분 입력 |\n\n**처리**\n\n1. 저장 → 메뉴 등록 화면으로 돌아가 입력 완료로 표시\n\n**조건**\n\n* 의무 대상 여부와 무관하게 필수 입력한다\n\n**예외**\n\n* 아무것도 고르지 않으면 저장할 수 없다. 없으면 해당 없음을 골라야 한다\n* 영양성분 항목이 비면 해당 항목에 표시하고 저장을 막는다\n\n#### STR-MENU-ORIG 원산지 입력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 표시 대상 품목의 원산지를 입력한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-225 원산지 입력 |\n\n**처리**\n\n1. 저장 → 메뉴 등록 화면으로 돌아가 입력 완료로 표시\n\n**조건**\n\n* 표시 대상 30품목은 필수 입력한다\n\n**예외**\n\n* 표시 대상 품목을 쓰는데 원산지를 비우면 저장할 수 없다\n* 쇠고기는 식육 종류를 함께 받는다\n\n#### STR-MENU-COPY 상품 복제\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 옵션 조합별로 메뉴를 나눈다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-204 알레르기 정보 등록 · FL-226 상품 복제 |\n\n**처리**\n\n1. 복제 → 조합별 메뉴를 만들고 각각의 알레르기 입력을 요구한다\n\n**조건**\n\n* 옵션이 알레르기 유발물질을 바꾸는 경우에만 쓴다\n* 복제 관계를 기록한다\n\n**예외**\n\n* 복제본의 알레르기를 입력하기 전에는 모두 판매 불가로 둔다\n* 옵션이 알레르기 유발물질을 바꾸지 않으면 이 화면을 쓰지 않는다\n\n#### STR-MENU-IMPT 메뉴 가져오기\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 이전 매장이나 같은 브랜드 매장의 메뉴를 복사한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-230 메뉴 가져오기 |\n\n**처리**\n\n1. 가져오기 → 확인 팝업에 건수를 적고 처리한 뒤 판매가 입력을 안내한다\n\n**조건**\n\n* 판매가는 복사하지 않는다\n* 미입력 메뉴는 판매 불가로 저장한다\n\n**예외**\n\n* 판매가는 복사하지 않는다. 입력 전까지 판매 불가로 저장한다\n* 가져올 대상 매장이 없으면 \"가져올 매장이 없습니다.\" 표시하고 진행을 막는다\n\n#### STR-CATG-LIST 카테고리 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카테고리와 정렬 순서를 관리한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-222 카테고리 목록·등록 |\n\n**처리**\n\n1. 순서 변경 → 끌어 놓으면 바로 저장하고 토스트로 알린다\n2. 수정 → STR-CATG-FORM\n\n**조건**\n\n* 메뉴가 있는 카테고리는 삭제할 수 없다\n\n**예외**\n\n* 메뉴가 있는 카테고리는 삭제할 수 없다. 삭제 버튼을 비활성으로 두고 사유를 표시한다\n\n#### STR-CATG-FORM 카테고리 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카테고리명과 순서를 등록한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-222 카테고리 목록·등록 |\n\n**처리**\n\n1. 저장 → 목록으로 돌아가고 토스트로 알린다\n\n**조건**\n\n* 같은 매장 안에서 이름이 겹칠 수 없다\n\n**예외**\n\n* 같은 매장 안에서 이름이 겹치면 저장을 막는다\n\n#### STR-OPTG-LIST 옵션 그룹 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 옵션 그룹을 조회한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-227 옵션 그룹 |\n\n**처리**\n\n1. 수정 → STR-OPTG-FORM\n2. 연결 메뉴 수 선택 → 연결된 메뉴 목록을 레이어로 표시\n\n**조건**\n\n* 메뉴에 연결된 그룹은 삭제할 수 없다\n\n**예외**\n\n* 메뉴에 연결된 그룹은 삭제할 수 없다. 사유를 표시한다\n\n#### STR-OPTG-FORM 옵션 그룹 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 선택지와 필수 여부, 선택 수를 등록한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-227 옵션 그룹 |\n\n**처리**\n\n1. 항목 추가 → 행을 늘린다\n2. 저장 → 확인 팝업 후 목록으로 이동\n\n**조건**\n\n* 최소 선택 수는 최대 선택 수를 넘을 수 없다\n\n**예외**\n\n* 최소 선택 수가 최대 선택 수보다 크면 저장을 막는다\n* 필수 그룹인데 항목이 하나도 없으면 저장을 막는다\n\n#### STR-PRIC-FORM 판매가 설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 메뉴별 판매가를 정한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-228 매장별 가격 |\n\n**처리**\n\n1. 저장 → 확인 팝업에 변경 건수를 적고 처리한다. 저장하면 바로 반영된다\n\n**조건**\n\n* 0원 이하로 저장할 수 없다\n\n**예외**\n\n* 0원 이하는 저장할 수 없다\n* 판매가가 없는 메뉴는 판매 불가로 둔다\n* 영업 중 변경 시 진행 중 주문이 있으면 경고를 표시한다\n\n#### STR-SOUT-FORM 품절 설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 메뉴 판매를 멈추고 재개 시각을 지정한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 상태값 | 판매중, 품절 |\n| 연결 Flow | FL-202 품절 처리 · FL-220 품절 설정 |\n\n**처리**\n\n1. 적용 → 확인 팝업 후 처리하고 주문 채널에 반영한다\n\n**조건**\n\n* 재개 시각을 비우면 수동 해제까지 유지한다\n* 품절 메뉴는 주문 채널 목록에서 제외한다\n\n**예외**\n\n* 재개 시각을 비우면 수동 해제까지 유지한다\n* 재개 시각이 지나면 자동으로 판매중으로 돌아간다\n* 키오스크에서 바꾼 값과 겹치면 마지막 값을 적용하고 처리자를 기록한다\n\n### 알림\n\n#### STR-NOTI-LIST 알림 발송 이력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 알림 발송 결과를 확인하고 다시 보낸다 |\n| 대상 | 가맹 관리자, 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 성공, 실패, 대체 발송 |\n| 연결 Flow | FL-231 알림 발송 이력 |\n\n**처리**\n\n1. 재발송 → 경로를 고르고 발송한다. 기록에 재발송으로 남는다\n2. 주문번호 선택 → STR-ORDR-DETAIL\n\n**조건**\n\n* 매장은 담당 매장, 본사는 전체를 본다\n* 재발송은 발송 기록에 재발송으로 남긴다\n\n**예외**\n\n* 수신번호는 가려서 표시한다\n* 알림톡 실패 시 문자로 대체 발송한 기록을 함께 보여준다\n\n### 설정\n\n#### STR-DEVC-LIST 단말기 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록한 단말의 상태와 마지막 통신 시각을 확인한다 |\n| 대상 | 가맹 관리자, 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 연결, 연결 끊김, 사용 중지 |\n| 연결 Flow | FL-232 단말기 목록 |\n\n**처리**\n\n1. 등록과 수정 → 매장만 할 수 있다. 본사 접속 시 버튼을 두지 않는다\n2. 사용 중지 → 양쪽 다 할 수 있다. 사유를 받고 처리한다\n3. 사용 재개 → 자기가 중지한 단말만 고를 수 있다\n\n**조건**\n\n* 매장은 담당 매장, 본사는 전체를 본다\n* 등록과 수정, 삭제는 매장만 한다\n* 사용 중지는 양쪽 다 하고 중지한 쪽이 재개한다\n\n**예외**\n\n* 연결 끊김 단말은 경과 시간을 함께 표시한다\n* 본사가 중지하면 매장에 통지하고, 매장은 재개할 수 없다\n* 본사 접속 시 조작자와 대상 매장을 함께 기록한다\n\n#### STR-DEVC-FORM 단말기 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 단말 종류와 설치 위치를 등록한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-233 단말기 연결 |\n\n**처리**\n\n1. 다음 → STR-DEVC-PAIR\n\n**조건**\n\n* 종류는 키오스크, 카드 단말, 주문서 프린터 셋으로 한정한다\n\n**예외**\n\n* 종류는 세 가지로 한정한다\n* 같은 매장 안에서 단말명이 겹치면 저장을 막는다\n\n#### STR-DEVC-PAIR 단말기 연결\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 연결 코드를 발급해 단말과 매장을 잇는다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-233 단말기 연결 |\n\n**처리**\n\n1. 단말에서 코드를 입력하면 연결하고 시험 동작을 실행한다\n2. 코드 다시 받기 → 새 코드를 발급하고 시간을 초기화한다\n\n**조건**\n\n* 연결 코드 유효시간 10분. 시험 동작에 실패하면 연결 끊김으로 둔다\n\n**예외**\n\n* 유효시간 10분이 지나면 \"코드가 만료되었습니다.\" 표시하고 다시 받게 한다\n* 시험 동작에 실패하면 사유를 표시하고 상태를 연결 끊김으로 둔다\n* 종류별 시험 동작은 다르다. 키오스크는 메뉴 내려받기, 카드 단말은 승인 경로 확인, 프린터는 시험 출력이다\n\n### 매출\n\n#### STR-SALE-LIST 매출 조회\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담당 매장의 매출을 조회한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매점 운영 · FL-221 매출 조회 |\n\n**처리**\n\n1. 일자 선택 → 해당 일자의 주문 목록으로 이동\n2. 내려받기 → 조회 조건 그대로 파일 생성\n\n**조건**\n\n* 담당 매장 범위 밖은 조회할 수 없다\n\n**예외**\n\n* 담당 매장 범위 밖은 조회할 수 없다\n* 당일 구간은 집계 시점을 함께 표시한다\n\n## 3. 하이브리드 웹앱\n\n### 매장 진입\n\n#### WEB-STOR-ENTRY 매장 진입\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | QR에 담긴 매장으로 바로 들어간다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-310 매장 진입 |\n\n**처리**\n\n1. 주문 시작 → 수령 방식이 둘이면 WEB-ORDR-TYPE, 하나면 WEB-MENU-LIST\n2. 주문 조회 → WEB-ORDR-FIND\n\n**조건**\n\n* 매장 선택 단계를 두지 않는다\n* 회원가입과 로그인을 요구하지 않는다\n\n**예외**\n\n* QR에 담긴 매장으로 바로 들어간다. 매장을 고르는 단계를 두지 않는다\n* 회원가입과 로그인을 요구하지 않는다\n* 주문할 수 없는 상태면 WEB-STOR-BLOCK\n\n#### WEB-STOR-BLOCK 주문 불가 안내\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문할 수 없는 사유를 안내한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 상태값 | 영업시간 외, 일시중지, 반경 밖 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-312 주문 불가 안내 |\n\n**처리**\n\n1. 메뉴 둘러보기 → 담기 없이 메뉴만 볼 수 있게 한다\n\n**조건**\n\n* 재개 시각이 있으면 함께 표시한다\n\n**예외**\n\n* 영업시간 외: \"영업시간이 아닙니다.\" 와 다음 영업 시각\n* 일시중지: 재개 시각이 있으면 함께 표시\n* 매장 반경 밖: \"매장에서 주문해 주세요.\"\n\n### 주문\n\n#### WEB-ORDR-TYPE 수령 방식 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 수령 방식을 고른다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 상태값 | 매장 식사, 포장 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-313 수령 방식 선택 |\n\n**처리**\n\n1. 선택 → WEB-MENU-LIST\n\n**조건**\n\n* 매장이 한 방식만 운영하면 건너뛴다\n\n**예외**\n\n* 매장이 한 방식만 운영하면 이 화면을 건너뛴다\n\n#### WEB-MENU-LIST 메뉴 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카테고리별로 메뉴를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-314 메뉴 목록 |\n\n**처리**\n\n1. 메뉴 선택 → WEB-MENU-DETAIL\n2. 장바구니 → WEB-CART-LIST\n\n**조건**\n\n* 품절과 미노출 메뉴는 목록에서 제외한다\n\n**예외**\n\n* 품절과 미노출 메뉴는 목록에서 제외한다\n* 판매 시간이 아닌 메뉴는 표시하지 않는다\n* 장바구니가 비면 하단 버튼을 숨긴다\n\n#### WEB-MENU-DETAIL 메뉴 상세·옵션 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 옵션과 수량을 정하고 장바구니 담기 또는 바로 결제를 고른다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-315 메뉴 상세·옵션 선택 |\n\n**처리**\n\n1. 장바구니 담기 → 담고 메뉴 목록으로 돌아간다. 하단 토스트로 알린다\n2. 바로 결제 → 이 메뉴 하나로 WEB-ORDR-FORM\n\n**조건**\n\n* 필수 옵션을 고르지 않으면 담을 수 없다\n* 바로 결제는 장바구니를 거치지 않는다\n* 알레르기와 원산지를 함께 표시한다\n\n**예외**\n\n* 필수 옵션을 고르지 않으면 두 버튼을 비활성으로 두고 미선택 그룹을 표시한다\n* 최대 선택 수를 넘기면 초과 안내를 표시한다\n* 장바구니에 담긴 항목이 있는데 바로 결제를 고르면 함께 결제할지 묻는다\n* 원산지 글자 크기는 메뉴 이름과 같거나 크게 표시한다\n\n#### WEB-CART-LIST 장바구니\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담은 항목과 금액을 확인한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-316 장바구니 |\n\n**처리**\n\n1. 수량 변경 → 금액이 바로 바뀐다\n2. 삭제 → 확인 팝업 후 처리하고 토스트로 알린다\n3. 결제하기 → WEB-ORDR-FORM\n\n**조건**\n\n* 다른 매장 항목이 있으면 초기화 여부를 확인한다\n\n**예외**\n\n* 다른 매장 항목이 있으면 초기화 여부를 묻고 확인 시 비운다\n* 담는 사이 품절로 바뀐 항목은 표시하고 결제 대상에서 뺀다\n* 장바구니가 비면 메뉴 목록으로 돌려보낸다\n* 최소 주문 금액에 못 미치면 부족 금액을 표시하고 결제 버튼을 비활성으로 둔다\n\n#### WEB-ORDR-FORM 결제 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문 내역과 결제 금액을 확인하고 주문자 정보를 입력한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-317 결제 상세 |\n\n**처리**\n\n1. 결제하기 → 주문을 만들고 WEB-PAY-WAIT로 이동한다\n\n**조건**\n\n* 장바구니와 바로 결제 두 경로로 들어온다\n* 개인정보 수집 동의 없이 진행할 수 없다\n* 휴대폰번호 형식을 검사한다\n\n**예외**\n\n* 장바구니와 바로 결제 두 경로로 들어온다. 대상 항목이 다르다\n* 휴대폰번호 형식이 맞지 않으면 해당 항목에 표시하고 진행을 막는다\n* 필수 동의 없이 진행할 수 없다\n* 서버 재계산 금액과 다르면 진행을 멈추고 다시 확인하게 한다\n* 별도 확인 팝업을 두지 않는다. 이 화면이 확인 단계다\n\n#### WEB-PAY-WAIT 결제 진행\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 결제대행사 결제창을 호출하고 결과를 기다린다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-901 결제 결과 유실 · FL-902 금액 검증 실패 |\n\n**처리**\n\n1. 결제대행사 결제창을 호출하고 결과를 기다린다\n2. 성공 시 WEB-ORDR-DONE\n\n**조건**\n\n* 복귀가 없으면 서버 조회로 결과를 확정한다\n* 금액이 다르면 승인하지 않는다\n\n**예외**\n\n* 결제창에서 돌아오지 않으면 서버 조회로 결과를 확정한다\n* 저장 금액과 다르면 승인하지 않고 안내를 표시한다\n* 승인 실패 시 사유를 표시하고 결제 상세로 되돌린다\n* 결과를 알 수 없으면 \"확인 중\"으로 두고 이중 결제를 막는다\n\n#### WEB-ORDR-DONE 결제 완료\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 호출 순번과 주문표를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-319 결제 완료 · FL-901 결제 결과 유실 |\n\n**처리**\n\n1. 주문 상태 보기 → WEB-ORDR-STAT\n2. 주문표 저장 → 화면 이미지로 저장\n3. 추가 주문 → WEB-MENU-LIST\n\n**조건**\n\n* 순번은 매장별로 매일 1번부터 채번한다\n* 화면에서 순번을 가장 크게 둔다\n* 조회와 대사에는 주문번호를 쓴다\n\n**예외**\n\n* 호출 번호는 매장별로 매일 1번부터 채번한다\n* 조회와 문의에는 주문번호를 쓴다. 두 값을 섞지 않는다\n\n### 주문 조회\n\n#### WEB-ORDR-FIND 주문 조회\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문번호와 휴대폰번호로 주문을 찾는다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-302 주문 상태 확인·픽업 · FL-303 주문 취소 · FL-320 주문 조회 |\n\n**처리**\n\n1. 조회 → WEB-ORDR-STAT\n\n**조건**\n\n* 둘이 모두 맞아야 조회할 수 있다\n\n**예외**\n\n* 둘이 모두 맞아야 조회할 수 있다\n* 맞지 않으면 \"주문을 찾을 수 없습니다. 입력한 내용을 확인해 주세요.\" 표시. 어느 항목이 틀렸는지 밝히지 않는다\n* 개인정보 파기가 끝난 주문은 조회할 수 없다\n\n#### WEB-ORDR-STAT 주문 상태\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 현재 주문 상태를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 상태값 | 접수 대기, 접수 완료, 조리 중, 조리 완료, 취소 |\n| 연결 Flow | FL-302 주문 상태 확인·픽업 · FL-303 주문 취소 · FL-321 주문 상태 · FL-903 매장 미접수 |\n\n**처리**\n\n1. 상태가 바뀌면 화면을 갱신한다\n2. 주문 취소 → WEB-ORDR-CNCL\n\n**조건**\n\n* 취소 버튼은 접수 완료 후 1분까지만 노출하고 남은 시간을 함께 표시한다\n\n**예외**\n\n* 취소 버튼은 접수 완료 후 1분까지만 노출하고 남은 시간을 함께 표시한다\n* 조리 중부터는 버튼을 숨기고 \"조리가 시작되어 취소할 수 없습니다.\"를 표시한다\n* 취소된 주문은 사유와 환불 안내를 표시한다\n\n#### WEB-ORDR-CNCL 주문 취소\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문을 취소하고 결제 취소를 요청한다 |\n| 대상 | 고객 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-303 주문 취소 · FL-322 주문 취소 |\n\n**처리**\n\n1. 취소하기 → 주문 취소와 결제 취소를 함께 요청하고 결과를 토스트로 알린다\n\n**조건**\n\n* 조리 중으로 넘어간 주문은 취소할 수 없다\n* 이 경우 매장에 문의하도록 안내한다\n\n**예외**\n\n* 사유를 고르지 않으면 진행할 수 없다\n* 여는 사이 조리 중으로 바뀌면 \"조리가 시작되어 취소할 수 없습니다. 매장에 문의해 주세요.\" 표시하고 닫는다\n* 결제 취소에 실패하면 사유를 표시하고 주문 상태로 되돌린다\n\n## 4. 키오스크\n\n### 대기\n\n#### KSK-IDLE-MAIN 대기화면\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문 시작을 안내하고 유휴 시 메뉴를 받는다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-402 메뉴 마스터 수신 · FL-410 대기화면 |\n\n**처리**\n\n1. 주문 시작 → KSK-ORDR-TYPE 또는 KSK-MENU-LIST\n2. 음성 안내 → KSK-IDLE-ACCS\n3. 관리자 → KSK-ADMN-AUTH\n\n**조건**\n\n* 주문 중에는 메뉴를 바꾸지 않는다\n\n**예외**\n\n* 유휴 상태에서 메뉴를 확인하고 받아온다. 주문 중에는 바꾸지 않는다\n* 매장이 영업 중이 아니면 사유와 재개 시각을 표시하고 주문 시작을 막는다\n* 관리자 진입 경로는 눈에 띄지 않게 두되 감추지는 않는다\n\n#### KSK-IDLE-ACCS 접근성 안내\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 단말 위치와 사용 방법을 음성으로 안내한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-410 대기화면 |\n\n**처리**\n\n1. 조절 선택 → 주문이 끝날 때까지 설정을 유지한다\n2. 주문 시작 → 음성 안내를 켠 채로 주문에 들어간다\n\n**조건**\n\n* 검증기준을 준수한 단말을 쓴다\n* 개인정보는 음성으로 읽지 않는다\n\n**예외**\n\n* 검증기준을 준수한 단말을 전제로 한다\n* 개인정보는 음성으로 읽지 않는다. 개인청취 장치를 연결한 경우만 예외로 둔다\n* 단말 위치는 소리로도 안내한다\n\n### 주문\n\n#### KSK-ORDR-TYPE 취식유형 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 취식 유형을 고른다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 상태값 | 매장 식사, 포장 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-411 취식유형 선택 |\n\n**처리**\n\n1. 선택 → KSK-MENU-LIST\n\n**조건**\n\n* 매장이 한 유형만 운영하면 건너뛴다\n\n**예외**\n\n* 매장이 한 유형만 운영하면 이 화면을 건너뛴다\n* 무입력 시간이 지나면 대기화면으로 돌아간다. 만료 20초 전에 알리고 연장할 수 있게 한다\n\n#### KSK-MENU-LIST 메뉴 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카테고리별로 메뉴를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-412 메뉴 선택 |\n\n**처리**\n\n1. 메뉴 선택 → 옵션이 있으면 KSK-MENU-OPTN, 없으면 바로 담는다\n2. 주문 내역 확인 → KSK-CART-LIST\n\n**조건**\n\n* 품절 메뉴는 목록에서 제외한다\n\n**예외**\n\n* 품절 메뉴는 목록에서 제외한다\n* 담은 항목이 없으면 주문 내역 확인 버튼을 비활성으로 둔다\n* 담긴 사이 품절로 바뀌면 다음 화면에서 알린다\n\n#### KSK-MENU-OPTN 옵션 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 옵션과 수량을 고른다 |\n| 대상 | 고객 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-413 옵션 선택 |\n\n**처리**\n\n1. 담기 → 장바구니에 넣고 메뉴 선택으로 돌아간다\n\n**조건**\n\n* 필수 옵션을 고르지 않으면 진행할 수 없다\n\n**예외**\n\n* 필수 옵션을 고르지 않으면 담기를 비활성으로 두고 미선택 그룹을 표시한다\n* 최대 선택 수를 넘기면 더 고를 수 없게 한다\n\n#### KSK-CART-LIST 주문 내역 확인\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담은 항목과 결제 금액을 확인한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-414 주문 내역 확인 |\n\n**처리**\n\n1. 삭제 → 확인 팝업 후 처리하고 목록을 다시 그린다\n2. 결제하기 → KSK-PAY-TYPE\n\n**조건**\n\n* 무입력 대기 만료 20초 전에 알리고 연장 수단을 준다\n\n**예외**\n\n* 담는 사이 품절로 바뀐 항목은 표시하고 결제 대상에서 뺀다\n* 항목이 모두 빠지면 메뉴 선택으로 돌려보낸다\n* 무입력 만료 20초 전에 알리고 연장할 수 있게 한다\n\n#### KSK-PAY-TYPE 결제수단 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 결제수단을 고른다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 |\n\n**처리**\n\n1. 선택 → KSK-PAY-PROC\n\n**조건**\n\n* 카드와 간편결제만 노출한다\n* 현금은 받지 않는다\n* 단말 상태가 정상이 아닌 수단은 비활성으로 표시한다\n\n**예외**\n\n* 매장이 설정한 수단만 노출한다\n* 현금은 받지 않는다. 현금 버튼을 두지 않는다\n* 단말 상태가 정상이 아닌 수단은 비활성으로 두고 사유를 표시한다\n\n#### KSK-PAY-PROC 결제 진행\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카드 단말로 승인을 요청한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-904 VAN 망취소 · FL-905 키오스크 네트워크 단절 |\n\n**처리**\n\n1. 카드 단말로 승인을 요청하고 결과를 기다린다\n2. 성공 시 KSK-CALL-FORM 또는 KSK-ORDR-DONE\n\n**조건**\n\n* 5만원 이상은 서명을 받는다\n* 통신이 끊기면 망취소를 시도한다\n\n**예외**\n\n* 5만원 이상은 서명을 받는다\n* 통신이 끊기면 망취소를 시도하고 결과를 화면에 표시한다\n* 승인 결과를 알 수 없으면 \"확인 중\"으로 두고 매장 직원 호출을 안내한다. 재결제를 유도하지 않는다\n* 승인 거절 시 사유를 표시하고 결제수단 선택으로 되돌린다\n\n#### KSK-CALL-FORM 고객 호출 정보 입력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 호출용 휴대폰번호를 입력한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-418 고객 호출 정보 입력 |\n\n**처리**\n\n1. 확인 → KSK-ORDR-DONE\n2. 건너뛰기 → 번호 없이 진행하고 호출 번호로만 부른다\n\n**조건**\n\n* 휴대폰번호 방식일 때만 표시한다\n* 입력값을 음성으로 읽지 않는다\n\n**예외**\n\n* 휴대폰번호 방식일 때만 표시한다\n* 입력값을 음성으로 읽지 않는다. 개인청취 장치를 연결한 경우만 예외로 둔다\n* 형식이 맞지 않으면 확인을 비활성으로 둔다\n\n#### KSK-ORDR-DONE 주문 완료\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 호출 순번과 주문번호를 표시하고 영수증을 출력한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-419 주문 완료 · FL-905 키오스크 네트워크 단절 |\n\n**처리**\n\n1. 일정 시간 뒤 대기화면으로 돌아간다\n\n**조건**\n\n* 순번 채번 기준은 웹앱과 같다\n* 출력에 실패해도 주문은 접수된 것으로 처리한다\n\n**예외**\n\n* 호출 번호 채번 기준은 웹앱과 같다. 매장별로 매일 1번부터 시작한다\n* 영수증 출력에 실패해도 주문은 접수된 것으로 처리하고 사유를 표시한다\n\n### 관리자\n\n#### KSK-ADMN-AUTH 관리자 인증\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 관리자 모드로 들어간다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-403 키오스크 관리자 처리 · FL-420 관리자 인증 |\n\n**처리**\n\n1. 확인 → KSK-ADMN-MAIN\n\n**조건**\n\n* 고객 화면에 진입 경로를 노출하지 않는다\n\n**예외**\n\n* 실패 횟수를 제한하고 초과하면 일정 시간 차단한다\n* 입력값을 음성으로 읽지 않는다\n\n#### KSK-ADMN-MAIN 관리자 메뉴\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 관리자 기능을 고른다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-403 키오스크 관리자 처리 · FL-421 관리자 메뉴 |\n\n**처리**\n\n1. 각 버튼 → 해당 화면으로 이동\n2. 나가기 → 대기화면으로 복귀\n\n**예외**\n\n* 단말 오류가 있으면 요약 영역에 사유를 표시한다\n\n#### KSK-ADMN-SYNC 메뉴 갱신\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | ERP의 최신 메뉴를 단말로 받아온다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-425 메뉴 갱신 |\n\n**처리**\n\n1. 적용하기 → 단말 메뉴를 바꾸고 갱신 시각을 기록한 뒤 관리자 메뉴로 돌아간다\n\n**조건**\n\n* 마지막 갱신 시각 이후 변경분만 받는다\n* 주문 진행 중에는 갱신하지 않는다\n\n**예외**\n\n* 마지막 갱신 시각 이후 변경분만 받는다\n* 주문이 진행 중이면 갱신하지 않는다. 끝난 뒤 하도록 안내한다\n* 바뀐 내용이 없으면 \"최신 상태입니다.\" 표시한다\n* 반영에 실패하면 사유를 표시하고 기존 메뉴를 유지한다\n\n#### KSK-ADMN-OPEN 판매 메뉴 설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 그날 판매할 메뉴를 연다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 상태값 | 노출, 미노출 |\n| 연결 Flow | FL-426 판매 메뉴 설정 |\n\n**처리**\n\n1. 저장 → 확인 팝업에 여는 수와 닫는 수를 적고 처리한다\n2. 저장하면 매장별 메뉴 설정의 노출 여부가 바뀐다\n\n**조건**\n\n* 매장별 메뉴 설정의 노출 여부를 바꾼다\n* 웹앱과 외부 POS에도 함께 적용한다\n* 노출 메뉴가 하나도 없으면 저장할 수 없다\n\n**예외**\n\n* 노출 메뉴가 하나도 없으면 저장할 수 없다\n* 품절 메뉴는 노출로 바꿔도 주문 화면에 나오지 않는다. 품절 해제를 함께 안내한다\n* 반영에 실패하면 이전 상태를 유지하고 사유를 표시한다\n\n#### KSK-ADMN-SOUT 품절 설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 단말에서 품절을 설정하고 ERP로 올린다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 상태값 | 판매중, 품절 |\n| 연결 Flow | FL-403 키오스크 관리자 처리 · FL-423 품절 설정 |\n\n**처리**\n\n1. 품절 → 재개 시각을 고르고 처리한다. 비우면 수동 해제까지 유지한다\n2. 판매 재개 → 확인 팝업 후 처리한다\n\n**조건**\n\n* 단말에만 남기지 않는다\n* 네트워크가 끊기면 단말에 두었다가 복구 시 전송한다\n\n**예외**\n\n* 단말에만 남기지 않는다. 서버로 올려 다른 채널에 함께 적용한다\n* 네트워크가 끊기면 단말에 두고 미전송으로 표시한 뒤 복구 시 보낸다\n* 가맹 어드민에서 이미 바꿨으면 마지막 값을 적용하고 처리자를 기록한다\n\n#### KSK-ADMN-DEVC 단말 상태 확인\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 프린터, 카드 단말, 네트워크 상태를 확인한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 상태값 | 정상, 오류 |\n| 연결 Flow | FL-403 키오스크 관리자 처리 · FL-424 단말 상태 확인 |\n\n**처리**\n\n1. 다시 확인 → 상태를 새로 읽어 표시한다\n2. 시험 결제 → 소액 승인과 즉시 취소로 경로를 확인한다\n\n**조건**\n\n* 오류가 있으면 사유와 마지막 통신 시각을 표시한다\n\n**예외**\n\n* 오류가 있으면 사유와 마지막 통신 시각을 함께 표시한다\n* 프린터 오류 상태에서도 주문은 받는다. 주문서는 화면으로 확인하게 한다\n"}, {"no": 8, "id": "DOC-08", "title": "검토 결과", "file": "docs/08_검토결과.md", "category": "검토", "status": "확정", "progress": 100, "eta": "", "version": "1.0", "updated": "2026-09-03", "inherits_titles": ["Flow Chart", "IA", "Wireframe", "기능 명세"], "content": "# 08. 검토 결과\n\n검토일 2026-09-04. 01부터 07까지를 대상으로 한다.\n\n조치가 끝난 항목은 이 문서에 남기지 않는다. 처리 이력은 `_data/changes.yaml`에 있다. 아래는 현재 시점에 열려 있는 검토 내용만 적는다.\n\n## 1. 현재 상태\n\n| 구분 | 건수 |\n| --- | --- |\n| 요구사항 | 49 |\n| 비기능 요구사항 | 56 |\n| 기능 | 66 |\n| 화면 | 88 |\n| Wireframe | 144 |\n| 기능 명세 | 84 |\n| Flow | 105 |\n\n기능 66건과 화면 88건이 모두 어느 Flow에든 나온다. 요구사항에서 기능, 기능에서 화면과 Flow로 이어지는 경로에 끊긴 곳이 없다.\n\n## 2. 검토 사항\n\n### R-1 표시 정보 검수 폐지로 남은 책임\n\n본사 검수 절차를 없앴다. 알레르기와 원산지 표시의 정확성이 매장 책임으로 넘어갔다.\n\n시스템은 필수 항목 누락만 막는다. 값이 사실인지는 확인하지 않는다. 매장이 원산지를 잘못 적어도 걸러지지 않는다.\n\n**[확인 필요]** 가맹 계약서에 표시 책임을 명시해야 한다. 표시 위반 과태료가 매장에만 부과되는지 플랫폼에도 미치는지 법무 확인이 필요하다.\n\n### R-2 연계 규격이 문서에 없다\n\n07 기능 명세를 화면 단위로 작성했다. 목적, 대상, 처리, 조건, 예외, 연결 Flow를 갖췄다.\n\n외부 연계 규격은 아직 없다. 결제대행사와 VAN사, 알림톡, 외부 POS의 요청과 응답 항목이 정의되지 않았다. 계약 후 상대가 제공하는 규격에 맞춰야 하므로 지금 확정할 수 없다. 계약 시 확인할 항목은 02 문서 2.7과 2.22에 있다.\n\n### R-3 확정된 결정이 미결로 표기되어 있었다\n\n02 문서의 DC-001부터 DC-004까지가 상태 미결로 남아 있었다. 네 건 모두 이미 적용 기준과 Flow에 반영되어 있고 문서 전체가 그 결정을 전제로 쓰였다.\n\n미결 표기는 이슈 목록에도 등록되어 있지 않았다. 상황판의 미결 건수와 문서의 표기가 서로 달랐다.\n\n네 건을 확정으로 정리했다. DC-001은 계약 체결 전 법무 검토를 조건으로 단다.\n\n| 결정 | 확정 내용 |\n| --- | --- |\n| DC-001 결제·정산 계약 구조 | 외부 결제대행사가 정산을 전담한다. 플랫폼은 대금을 수취하지 않는다 |\n| DC-002 메뉴 기준의 위치 | 매장이 등록한 메뉴가 유일한 기준이다. 외부 POS는 조회만 한다 |\n| DC-003 메뉴 변경의 반영 시점 | 저장과 반영을 분리하지 않는다. 채널별 확인 시점만 다르게 둔다 |\n| DC-004 주문 접수 화면의 위치 | 가맹 어드민 안에 둔다. 매장 전용 화면을 만들지 않는다 |\n\n## 3. 확인한 것\n\n아래는 검토 결과 문제가 없었다.\n\n| 항목 | 결과 |\n| --- | --- |\n| 추적성 | 요구사항부터 화면까지 끊긴 곳이 없다 |\n| 기능과 Flow 일치 | 기능 66건이 모두 어느 Flow에든 나온다 |\n| 화면과 Flow 일치 | 화면 88건이 모두 어느 Flow에든 나온다 |\n| 예외 처리 | 결제 유실, 금액 불일치, 미접수, 망취소, 네트워크 단절, 로그인 실패 여섯 가지를 별도 Flow로 둔다 |\n| 권한 경계 | 본사와 매장이 다루는 대상이 겹치지 않는다 |\n| 기준 데이터 | 각 데이터의 원본 도메인이 정해져 있다 |\n| 법정 표시 | 알레르기, 영양성분, 원산지의 대상 판정과 화면 표시 기준이 법령 근거와 함께 있다 |\n| 규제 | 결제와 정산 구조가 등록 의무를 피하는 근거와 함께 정해져 있다 |\n| 접근성 | 키오스크 기술 기준 16개 항목이 01 문서 8.7에 있다 |\n"}], "changes": [{"id": "CH-169", "date": "2026-09-07", "type": "수정", "source": "사용자 요청", "document": "DOC-06", "summary": "조회와 초기화 버튼을 검색어 칸 오른쪽에 붙인다. 등록 버튼만 줄 오른쪽 끝에 둔다. 조회 화면 24개에 적용", "affects": ["DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "Wireframe", "affects_titles": ["IA"]}, {"id": "CH-168", "date": "2026-09-07", "type": "수정", "source": "사용자 요청", "document": "DOC-06", "summary": "조회 조건의 입력 칸과 버튼 높이를 40px로 맞추고 폭 상한을 둔다. 날짜와 상태 200px, 검색어 320px, 버튼 120px로 왼쪽부터 붙여 배치한다", "affects": ["DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "Wireframe", "affects_titles": ["IA"]}, {"id": "CH-167", "date": "2026-09-07", "type": "수정", "source": "사용자 요청", "document": "DOC-06", "summary": "등록 버튼을 제목 옆에서 조회 조건 첫 줄 오른쪽 끝으로 옮김. 오른쪽 끝을 동작 자리로 통일한다. 목록 화면 16개에 적용", "affects": ["DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "Wireframe", "affects_titles": ["IA"]}, {"id": "CH-166", "date": "2026-09-07", "type": "수정 03", "DOC-04", "DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "기획 검토", "affects_titles": ["서비스 구조", "Flow Chart", "IA"]}, {"id": "CH-075", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-08", "summary": "01부터 05까지 검수. CRITICAL 3건, MAJOR 6건, MINOR 3건, 의사결정 4건을 정리하고 미결 항목 7건을 등록", "affects": ["DOC-01", "DOC-02", "DOC-03", "DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "검토 결과", "affects_titles": ["프로젝트 개요", "기획 검토", "서비스 구조", "IA"]}, {"id": "CH-074", "date": "2026-09-04", "type": "수정", "source": "사용자 결정", "document": "DOC-04", "summary": "하이브리드 웹앱을 QR에 담긴 매장으로 바로 진입하게 변경. 매장 선택 화면과 링크 진입 경로를 제거", "affects": ["DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "Flow Chart", "affects_titles": ["IA"]}, {"id": "CH-073", "date": "2026-09-04", "type": "범위 변경", "source": "사용자 결정", "document": "DOC-03", "summary": "메뉴 관리 주체를 매장으로 옮기고 배포를 없앰. 본사는 기준정보와 계정, 매출 통계만 다룬다. 기능 6건의 주체를 바꾸고 배포 기능 2건과 화면 15건, Flow 9건을 제거. 매장 화면 10건을 새로 정의", "affects": ["DOC-01", "DOC-02", "DOC-04", "DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "서비스 구조", "affects_titles": ["프로젝트 개요", "기획 검토", "Flow Chart", "IA"]}, {"id": "CH-072", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-02", "summary": "결제와 정산의 자금 흐름 구조도를 추가. 플랫폼이 자금 경로에 없다는 점을 그림으로 드러낸다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "기획 검토", "affects_titles": []}, {"id": "CH-071", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-04", "summary": "Flow 도형에 처리 주체를 띠로 표시하고 주체마다 색을 나눔. FL-318 결제 진행에 고객, 서버, 카드사, 매장을 구분해 표기", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "Flow Chart", "affects_titles": []}, {"id": "CH-070", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-03", "summary": "구조도의 연결을 나란한 순서가 아니라 이름으로 지정하도록 바꿈. 연결마다 오가는 업무나 데이터를 라벨로 적고, 데이터 참조는 점선으로 구분한다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "서비스 구조", "affects_titles": []}, {"id": "CH-069", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-03", "summary": "서비스 아키텍처를 재설계. 기존 구조 검토, 업무 도메인 6개 기준 시스템 구성, 시스템별 책임, 기준 데이터, 주요 흐름, 연결의 성격, 설계 결정 필요 사항으로 나눠 다시 씀. 기술 구성은 별도 절로 분리", "affects": ["DOC-04", "DOC-07"], "status": "완료", "requested_by": "기획 담당", "document_title": "서비스 구조", "affects_titles": ["Flow Chart", "기능 명세"]}, {"id": "CH-068", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-03", "summary": "아키텍처를 전체 구성과 기술 구성으로 나눔. 전체 구성은 누가 무엇을 쓰는지로 적고, 기술 구성은 접점과 처리와 보관과 외부 네 계층으로 나눠 그린다. 연계 흐름은 이용자에서 플랫폼, 외부 시스템으로 이어지는 형태로 재작성", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "서비스 구조", "affects_titles": []}, {"id": "CH-067", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-05", "summary": "메뉴 구조를 사이트맵 작도로 교체. 최상위에서 갈라진 계열마다 색을 달리하고 하위는 세로로 쌓아 화살표로 잇는다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "IA", "affects_titles": []}, {"id": "CH-066", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "표 아래가 잘리던 문제 수정. 표의 여백을 감싸는 요소로 옮기고 세로 넘침을 막았다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-065", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "Flow 탭을 한 줄로 두고 아래에 제목과 좌우 이동 버튼 줄을 추가. 탭 분할 기준을 Flow에서 모든 소제목으로 확장해 주요 기능 같은 구역도 탭으로 본다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-064", "date": "2026-09-04", "type": "수정", "source": "사용자 결정", "document": "DOC-02", "summary": "품절 메뉴를 주문 채널 목록에서 제외하는 것으로 확정. 적용 기준 3.13 품절 처리 신설. 웹앱의 담기 차단과 키오스크의 표시 또는 숨김 선택을 제외로 통일", "affects": ["DOC-03", "DOC-04", "DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "기획 검토", "affects_titles": ["서비스 구조", "Flow Chart", "IA"]}, {"id": "CH-063", "date": "2026-09-04", "type": "수정", "source": "인터넷 조사", "document": "DOC-02", "summary": "취소 계상 일자를 확정해 잠정치 처리 기준에 반영. 매입 후 취소는 취소 일자에 별도 거래로 기록한다. 잠정치 근거와 1인당 지출의 방문객 구성 문제를 추가", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "기획 검토", "affects_titles": []}, {"id": "CH-062", "date": "2026-09-04", "type": "수정", "source": "인터넷 조사", "document": "DOC-02", "summary": "비교 지표의 근거 보강. 매장당 평균 매출의 영업일수 정규화와 최소 운영일수 기준, 1인당 지출의 분모 단위 구분, 기상 보정 제외 근거를 추가", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "기획 검토", "affects_titles": []}, {"id": "CH-061", "date": "2026-09-04", "type": "수정", "source": "인터넷 조사", "document": "DOC-04", "summary": "매장 등록의 사업자번호 중복 검사를 폐업 여부 확인으로 변경. 임시사업장은 기존사업장 번호를 공유하므로 매장 단위 유일성이 성립하지 않는다", "affects": ["DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "Flow Chart", "affects_titles": ["IA"]}, {"id": "CH-060", "date": "2026-09-04", "type": "수정", "source": "인터넷 조사", "document": "DOC-03", "summary": "영양성분 의무 항목을 9종에서 음식점 기준 5종으로 정정. 원산지 표시 대상을 29품목에서 30품목으로 정정. 사업자등록번호와 행정동코드의 참조 방식 정정", "affects": ["DOC-04", "DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "서비스 구조", "affects_titles": ["Flow Chart", "IA"]}, {"id": "CH-059", "date": "2026-09-04", "type": "수정", "source": "인터넷 조사", "document": "DOC-02", "summary": "조사 6건을 반영해 주요 시사점 5건 추가, 적용 기준 3.3 표시 의무 전면 재작성, 3.5 결제 데이터와 3.7 계약 구조 갱신, 3.11 상권 통계 재작성, 3.12 매장 편집 권한과 3.13 정산 대사와 3.14 VAN 처리 기준 신설", "affects": ["DOC-03", "DOC-04", "DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "기획 검토", "affects_titles": ["서비스 구조", "Flow Chart", "IA"]}, {"id": "CH-058", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-01", "summary": "추진 배경과 목적을 작성하고 요구사항 37건을 정의해 기능 51건을 모두 연결. 전제 조건에 가맹점 계약 구조와 개정 전자금융거래법 시행 시점 추가", "affects": ["DOC-02", "DOC-03"], "status": "완료", "requested_by": "기획 담당", "document_title": "프로젝트 개요", "affects_titles": ["기획 검토", "서비스 구조"]}, {"id": "CH-057", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-00", "summary": "기획 문서 Agent System 구축. Agent 6종, Harness 4종, Skill 7종, Context 5종, 산출물 서식 6종을 agent-system 아래에 작성", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-056", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "정보계층도와 시스템 구조도를 캔버스 작도로 교체. 계층은 단계별 색을 달리한 조직도 형태로, 구조도는 영역 상자와 연결 화살표로 그린다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-055", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-00", "summary": "구역을 선택하면 그 구역의 Flow 목록이 탭으로 나오고 한 번에 하나만 표시한다. 다른 Flow에서 이동해 오면 해당 탭이 선택된다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-054", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "되돌아가는 경로를 도형 바깥으로 돌려 선이 도형을 지나지 않게 함. 행마다 오른쪽 끝을 계산해 그 바깥에서 위로 올린다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-053", "date": "2026-09-04", "type": "삭제", "source": "사용자 요청", "document": "DOC-04", "summary": "Flow 구성 설명 구역을 제거하고 구역 번호를 다시 매김. 전체 Flow부터 시작한다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "Flow Chart", "affects_titles": []}, {"id": "CH-052", "date": "2026-09-04", "type": "수정", "source": "내부 정리", "document": "DOC-04", "summary": "Flow 구성 표의 물결표가 취소선으로 표시되던 것을 계열 표기로 변경", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "Flow Chart", "affects_titles": []}, {"id": "CH-051", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "크게 보기 화면이 빈 화면으로 뜨던 문제 수정. 앞선 스타일 교체 작업에서 모달 스타일이 함께 지워진 것이 원인이며 흰색 기준으로 다시 정의함", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-050", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "정의된 처리 도형에 이동 표시를 넣고 마우스를 올리면 누를 수 있음을 알린다. 작도 중 오류가 나도 해당 Flow만 표시가 멈추고 문서는 계속 열린다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-049", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "Flow 작도를 2차원 배치로 다시 씀. 분기는 판단 도형 오른쪽으로 나가 도형이 이어지고, 조건은 연결선 위에 적는다. 되돌아가는 경로는 직각으로 꺾어 대상 도형 왼쪽으로 들어간다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-048", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "정의된 처리 도형에 번호만 나오던 것을 Flow 이름과 함께 표시", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-047", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "분기 안의 단계를 글자가 아니라 도형으로 작도. 행사에서 상권, 매장으로 이어지는 순서를 화살표로 연결해 표시", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-046", "date": "2026-09-04", "type": "추가", "source": "내부 정리", "document": "DOC-05", "summary": "채널별 화면 전환 경로를 표로 정리하고 IA를 확정", "affects": ["DOC-06"], "status": "완료", "requested_by": "기획 담당", "document_title": "IA", "affects_titles": ["Wireframe"]}, {"id": "CH-045", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-04", "summary": "Flow를 세 단계로 나눠 작성. 전체 Flow 5건, 화면별 Flow 71건을 더해 24건에서 100건이 됨", "affects": ["DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "Flow Chart", "affects_titles": ["IA"]}, {"id": "CH-044", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "상황판 전체를 흰색 단일 테마로 고정. 어두운 화면 설정을 따라가지 않고 문서처럼 항상 흰 배경으로 표시한다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-043", "date": "2026-09-04", "type": "수정", "source": "내부 정리", "document": "DOC-00", "summary": "정보계층도 스타일이 이전 교체 작업에서 함께 지워진 것을 복구", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-042", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "Flow 도형을 캔버스로 다시 그림. 배경을 흰색으로 두고 단자, 처리, 판단, 데이터, 정의된 처리를 실제 도형으로 작도. 참조 이동과 되돌아가는 경로도 캔버스에서 처리", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-041", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "Flow 참조 칩을 눌러 해당 Flow 로 이동하도록 처리. 구역이 다르면 구역을 전환하고 위치를 표시한다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-040", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-05", "summary": "IA 작성. 화면ID 부여 규칙, 채널별 메뉴 구조, 화면 목록 79건, 공통 화면 규칙을 정의하고 기능·Flow와 연결", "affects": ["DOC-06", "DOC-07"], "status": "완료", "requested_by": "기획 담당", "document_title": "IA", "affects_titles": ["Wireframe", "기능 명세"]}, {"id": "CH-039", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-03", "summary": "권한 절과 용어 정의 절 추가. 역할별 데이터 범위와 주요 권한, 용어 15건과 상태값을 정리해 문서를 확정", "affects": ["DOC-05", "DOC-07"], "status": "완료", "requested_by": "기획 담당", "document_title": "서비스 구조", "affects_titles": ["IA", "기능 명세"]}, {"id": "CH-038", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-02", "summary": "메뉴 관리 주체 확정. 브랜드가 카테고리와 메뉴를 소유하고 생성은 본사만 한다. 매장 통제 매장은 판매가와 노출, 품절만 바꾼다", "affects": ["DOC-03", "DOC-04", "DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "기획 검토", "affects_titles": ["서비스 구조", "Flow Chart", "IA"]}, {"id": "CH-037", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-04", "summary": "알레르기·영양성분을 메뉴 등록 시 필수 입력으로 확정. 표시 의무 대상 판단 단계를 제거. 브랜드와 매장은 1:N으로 확정", "affects": ["DOC-02", "DOC-03"], "status": "완료", "requested_by": "기획 담당", "doc ": "완료", "requested_by": "기획 담당", "document_title": "Flow Chart", "affects_titles": []}, {"id": "CH-030", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-02", "summary": "주요 시사점을 적용 기준으로 확정. 계층 구조 정의, 메뉴 제공 규격, 알레르기·원산지, 배포 정책, 결제 데이터, 알림, 계약 구조, 접근 통제, 상권 통계 9개 영역의 기준을 문서화", "affects": ["DOC-03", "DOC-04", "DOC-05", "DOC-07"], "status": "완료", "requested_by": "기획 담당", "document_title": "기획 검토", "affects_titles": ["서비스 구조", "Flow Chart", "IA", "기능 명세"]}, {"id": "CH-029", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-04", "summary": "Flow 전체를 판단 지점 중심으로 다시 작성. 로그인과 화면 진입 등 앞 단계를 채우고 성공·실패 분기를 명시. 판단은 물음표로 끝나는 문장으로 표기해 마름모로 그려지게 함", "affects": ["DOC-05", "DOC-07"], "status": "완료", "requested_by": "기획 담당", "document_title": "Flow Chart", "affects_titles": ["IA", "기능 명세"]}, {"id": "CH-028", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "Flow 도형을 세로 흐름으로 재구성. 판단은 마름모, 시작·종료는 둥근 사각형, 입출력은 평행사변형으로 그리고 분기는 오른쪽으로 연결선을 뻗어 표시", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-027", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-03", "summary": "서비스 아키텍처와 시스템 연계 구조를 도형 구조도로 작성. 영역 구분, 계층별 구성 요소, 번호 주석을 포함", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "서비스 구조", "affects_titles": []}, {"id": "CH-026", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-03", "summary": "정보 계층을 도형 기반 구조도로 재정의. 운영 계열과 상품 계열을 분리하고 매장별 메뉴 설정을 연결 객체로 추가. Level 정의와 객체 간 관계 표 작성", "affects": ["DOC-04", "DOC-05", "DOC-07"], "status": "완료", "requested_by": "기획 담당", "document_title": "서비스 구조", "affects_titles": ["Flow Chart", "IA", "기능 명세"]}, {"id": "CH-025", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "Flow 도형을 표준 기호로 세분화. 시작·종료, 처리, 판단·분기, 입력·출력, 참조를 형태로 구분하고 범례를 추가", "affects": [], "status": "완료", "requested_by": "기획 담당", "do const BAD = /(실패|오류|불가|차단|거절|중단|단절|미응답|불일치|초과|이탈|없음|미결|누락|판단 불가|미승인|품절)/;

function chipRefs(s) {
  return esc(s)
    .replace(/\b(FL-\d{3})\b/g, '<span class="fref go" role="link" tabindex="0">$1</span>')
    .replace(/\b(FN-\d{3}|SC-\d{3}|REQ-\d{3}|DC-\d{3}|UT-\d{2})\b/g, '<span class="fref">$1</span>');
}
function splitNote(text) {
  let note = "";
  let m = text.match(/^(.*?)\s+(?:←|※|…)\s*(.+)$/);
  if (m) { text = m[1].trim(); note = m[2].trim(); }
  return { text, note };
}
function nodeParts(raw) {
  // "조건 → 결과" 분리
  const i = raw.indexOf("→");
  if (i === -1) return { head: raw.trim(), tail: "" };
  return { head: raw.slice(0, i).trim(), tail: raw.slice(i + 1).trim() };
}
function isFlowBlock(src) {
  return /[↓├└]/.test(src);
}
const IO_RE = /(입력|출력|발송|표시|스캔|안내)$/;
const TERM_RE = /(복귀|종료|완료 화면|대기화면)$/;
function nodeKind(c, i, total) {
  if (c.ref) return "n-ref";
  if (/[?？]$/.test(c.label)) return "n-dec";
  if (IO_RE.test(c.label)) return "n-io";
  if (i === 0 || i === total - 1 || TERM_RE.test(c.label)) return "n-term";
  return "n-proc";
}
const FLOW_LEGEND = `<div class="flegend">` +

function renderFlow(src) {
  const items = [];
  for (const raw of src.split(String.fromCharCode(10))) {
    if (!raw.trim()) { items.push({ k: "gap" }); continue; }
    const m = raw.match(/^([ \u2502]*)((?:\u251c\u2500|\u2514\u2500))?\s?(.*)$/);
    const pad = (m[1] || "").length;
    const marker = m[2];
    let body = (m[3] || "").trim();
    if (!body) continue;
    const lv = Math.min(3, Math.floor(pad / 4) + (marker ? 1 : 0));
    if (body === "\u2193" || body === "\u2502") { items.push({ k: "arrow", lv }); continue; }
    if (/^\u203b/.test(body)) { items.push({ k: "mark", text: body }); continue; }

    let actor = "", lane = "";
    const lm = body.match(/^\[(.+?)\]\s*(.*)$/);
    if (lm && !marker) {
      if (/별도 경로|사전/.test(lm[1])) { lane = lm[2] || lm[1]; body = ""; }
      else { actor = lm[1]; body = lm[2]; }
    }
    if (lane) { items.push({ k: "lane", text: lane }); continue; }
    if (!body) continue;

    let note = "";
    const nm = body.match(/^(.*?)\s+(?:\u2190|\u2026)\s*(.+)$/);
    if (nm) { body = nm[1].trim(); note = nm[2].trim(); }

    if (marker) {
      const i = body.indexOf("\u2192");
      const head = i === -1 ? body.trim() : body.slice(0, i).trim();
      const tail = i === -1 ? "" : body.slice(i + 1).trim();
      items.push({ k: "branch", lv, head, tail, note });
    } else {
      const parts = body.split("\u2192").map(s => s.trim()).filter(Boolean);
      items.push({ k: "step", lv, parts, note, actor });
    }
  }

  const lanes = [{ title: "", cols: [], marks: [] }];
  let lane = lanes[0], col = null;
  const newCol = (label, actor, note, ref) => {
    col = { label, actor, note, ref, subs: [] };
    lane.cols.push(col);
  };
  for (const it of items) {
    if (it.k === "lane") { lane = { title: it.text, cols: [], marks: [] }; lanes.push(lane); col = null; continue; }
    if (it.k === "mark") { lane.marks.push(it.text); continue; }
    if (it.k === "gap" || it.k === "arrow") continue;
    if (it.k === "step") {
      if (it.lv === 0) {
        it.parts.forEach((pt, i) => newCol(pt, i === 0 ? it.actor : "",
          i === it.parts.length - 1 ? it.note : "", /^(FL|FN|SC)-\d{3}$/.test(pt)));
      } else if (col) {
        col.subs.push({ lv: it.lv, step: true, head: it.parts.join(" \u2192 "), tail: "", note: it.note });
      } else newCol(it.parts.join(" \u2192 "), it.actor, it.note, false);
      continue;
    }
    if (it.k === "branch") {
      if (!col) newCol("", "", "", false);
      col.subs.push({ lv: it.lv, step: false, head: it.head, tail: it.tail, note: it.note });
    }
  }

  const id = "fc" + (FLOW_SEQ++);
  FLOW_MODELS.set(id, lanes.filter(l => l.cols.length || l.marks.length));
  const marks = lanes.flatMap(l => l.marks).map(m => `<div class="fmark">${chipRefs(m)}</div>`).join("");
  return `<div class="flow"><div class="fhead"><span class="ftitle">Flow</span>` +
         `<button class="fview" type="button"><i data-lucide="maximize-2"></i>크게 보기</button></div>` +
         `<div class="fscroll"><canvas class="fcanvas" data-fc="${id}"></canvas></div>${marks}</div>`;
}

const UI_MODELS = new Map();
let UI_SEQ = 1;
const UW = 246, UHEAD = 32, UBLK = 26, UBGAP = 7, UPAD = 13, UGX = 78, UGY = 74, UPADD = 22;
const UCOLS = 3;

function renderUIMap(src) {
  const lines = src.split(String.fromCharCode(10));
  const screens = [];
  const edges = [];
  let cur = null;
  lines.forEach(raw => {
    const l = raw.trim();
    if (!l) return;
    if (l.charAt(0) === "@") {
      const body = l.slice(1).trim();
      const sp = body.indexOf(" ");
      cur = {
        id: sp === -1 ? body : body.slice(0, sp),
        name: sp === -1 ? "" : body.slice(sp + 1).trim(),
        blocks: [],
      };
      screens.push(cur);
      return;
    }
    if (l.charAt(0) === ">") {
      const m = l.slice(1).split("->");
      if (m.length < 2) return;
      const right = m[1].split(":");
      edges.push({ a: m[0].trim(), b: right[0].trim(), label: (right[1] || "").trim() });
      return;
    }
    if (l.charAt(0) === "-" && cur) cur.blocks.push(l.slice(1).trim());
  });
  const id = "ui" + (UI_SEQ++);
  UI_MODELS.set(id, { screens: screens, edges: edges });
  return diagramBox("화면 흐름", `<canvas class="uicanvas" data-ui="${id}"></canvas>`);
}

function uiCardH(s) {
  const n = Math.max(1, s.blocks.length);
  return UHEAD + UPAD + n * UBLK + (n - 1) * UBGAP + UPAD;
}

function drawUICanvas(canvas, model, scale) {
  const ctx = canvas.getContext("2d");
  const S = model.screens;
  if (!S.length) return;
  ctx.font = FC.fontSm;

  const cols = Math.min(UCOLS, S.length);
  S.forEach((s, i) => {
    s.col = i % cols;
    s.row = Math.floor(i / cols);
    s.h = uiCardH(s);
  });

const IA_MODELS = new Map();

function renderIA(src) {
  const rows = src.split(String.fromCharCode(10)).filter(l => l.trim());

    const indent = (l.match(/^ */) || [""])[0].length;
    let body = l.trim(), link = false;
    if (body.startsWith("*")) { link = true; body = body.slice(1).trim(); }

    stack.push(n);

  canvas.style.height = Math.ceil(h * (scale || 1)) + "px";

const MAP_MODELS = new Map();

  { deep: "#1F4E79", mid: "#2A6FA8", soft: "#D6E6F2" },
  { deep: "#14603C", mid: "#1F8A57", soft: "#D7EDE2" },
  { deep: "#8A4B12", mid: "#C06A1C", soft: "#F6E5D2" },
  { deep: "#4A3277", mid: "#6B4CA8", soft: "#E4DCF2" },

    const body = l.trim();
    const i = body.indexOf("::");
    return {

      meta: i === -1 ? "" : body.slice(i + 2).trim(),
      children: [],

  nodes.forEach(n => {

    (stack.length ? stack[stack.length - 1].children : roots).push(n);
    stack.push(n);

  const ctx = canvas.getContext("2d");
  ctx.font = FC.fontSm;

  let x = MPAD;
  root.children.forEach((c, i) => {

  canvas.style.height = Math.ceil(h * (scale || 1)) + "px";

  roundRect(ctx, rx, ry, rw, rh, 3); ctx.fill();

  ctx.beginPath(); ctx.moveTo(w / 2, ry + rh); ctx.lineTo(w / 2, bus); ctx.stroke();

    ctx.beginPath();

      ctx.beginPath();

    col.items.forEach(it => {
      if (!it.kids.length) return;
      const lx = it.x + 11;
      const last = it.kids[it.kids.length - 1];
      ctx.strokeStyle = col.hue.mid; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(lx, it.y + it.h); ctx.lineTo(lx, last.y + last.h / 2); ctx.stroke();
      ctx.fillStyle = col.hue.mid;
      it.kids.forEach(k => {
        const ky = k.y + k.h / 2;
        ctx.beginPath(); ctx.moveTo(lx, ky); ctx.lineTo(k.x - 6, ky); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(k.x - 7, ky - 4); ctx.lineTo(k.x - 7, ky + 4); ctx.lineTo(k.x, ky);
        ctx.closePath(); ctx.fill();
      });

// ── 시스템 구조도
const ARCH_MODELS = new Map();

function renderArch(src) {
  const bands = [{ label: "", zones: [] }];
  const notes = [], edges = [];
  let band = bands[0], zone = null;
  src.split(String.fromCharCode(10)).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    if (line.startsWith("!")) { notes.push(line.slice(1).trim()); return; }
    const bm = line.match(/^==\s*(.*?)\s*==$/);
    if (bm) { band = { label: bm[1], zones: [] }; bands.push(band); zone = null; return; }
    if (line.startsWith("@")) {
      const m = line.slice(1).match(/^(.+?)\s*(->|=>)\s*([^:]+?)\s*(?::\s*(.*))?$/);
      if (m) edges.push({ from: m[1].trim(), to: m[3].trim(), label: (m[4] || "").trim(), dashed: m[2] === "=>" });
      return;
    }
    const zm = line.match(/^\[(.+?)\]$/);
    if (zm) {
      const parts = zm[1].split("|");
      zone = { title: parts[0].trim(), sub: (parts[1] || "").trim(), groups: [], arrow: "" };
      band.zones.push(zone);
      return;
    }
    const i = line.indexOf(":");
    if (i === -1 || !zone) return;
    zone.groups.push({
      label: line.slice(0, i).trim(),
      nodes: line.slice(i + 1).split(",").map(s => s.trim()).filter(Boolean),
    });
  });
  const id = "ac" + (ARCH_SEQ++);
  ARCH_MODELS.set(id, { bands: bands.filter(b => b.zones.length), edges });
  const noteHtml = notes.length
    ? `<ol class="arch-notes">` + notes.map((n, i) =>
        `<li><span class="num">${i + 1}</span><span>${esc(n)}</span></li>`).join("") + `</ol>`
    : "";

}
function archMeasure(ctx, zones) {

    ctx.font = FC.fontSm;
    if (z.sub) w = Math.max(w, ctx.measureText(z.sub).width);
    z.groups.forEach(g => {
      ctx.font = FC.fontXs;
      w = Math.max(w, ctx.measureText(g.label).width);

    });

function drawArchCanvas(canvas, model, scale) {
  const bands = model.bands || model;

  ctx.font = FC.fontXs;
  let labelW = 0;
  bands.forEach(b => { if (b.label) labelW = Math.max(labelW, ctx.measureText(b.label).width + 22); });
  bands.forEach(b => archMeasure(ctx, b.zones));
  bands.forEach((b, i) => {

    if (a.bi === b.bi) {

      const arr = inband.get(k) || []; arr.push(e); inband.set(k, arr);

  const w = Math.max(...bands.map(b => b.w)) + AZPAD * 2 + labelW + lane;
  const h = bands.reduce((a, b, i) => a + b.h + b.below + (i < bands.length - 1 ? b.gap : 0), 0) + AZPAD * 2;
  const dpr = (window.devicePixelRatio || 1) * (scale || 1);
  canvas.width = Math.ceil(w * dpr); canvas.height = Math.ceil(h * dpr);
  canvas.style.width = Math.ceil(w * (scale || 1)) + "px";
  canvas.style.height = Math.ceil(h * (scale || 1)) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = FC.bg; ctx.fillRect(0, 0, w, h);

  bands.forEach((bd, bi) => {
    bd.top = bandTop;

    bandTop += bd.h + bd.below + bd.gap;
  });

  drawArchEdges(ctx, bands, cross, inband, Math.max(...bands.map(b => b.w)) + AZPAD + labelW + 14);

      const down = e.b.bi > e.a.bi;

        e: e, down: down,

      ctx.lineWidth = e.dashed ? 1.1 : 1.4;
      ctx.setLineDash(e.dashed ? [4, 3] : []);
      ctx.beginPath();
      ctx.moveTo(ax, e.a.py + e.a.h); ctx.lineTo(ax, y);
      ctx.lineTo(bx, y); ctx.lineTo(bx, e.b.py + e.b.h + 8);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      ctx.moveTo(bx - 4.5, e.b.py + e.b.h + 9); ctx.lineTo(bx + 4.5, e.b.py + e.b.h + 9);
      ctx.lineTo(bx, e.b.py + e.b.h + 1); ctx.closePath(); ctx.fill();
      if (e.label) marks.push({ text: e.label, x: (ax + bx) / 2, y: y });

      ctx.fillStyle = FC.muted;

function renderMd(src) {
  if (!src) return `<p class="detail">문서 내용이 없다.</p>`;
  let html;
  try {
    html = window.marked ? marked.parse(src, { mangle: false, headerIds: false })
                         : `<pre><code>${esc(src)}</code></pre>`;
  } catch (e) { html = `<pre><code>${esc(src)}</code></pre>`; }
  // 열이 많은 표는 눌러 담지 않고 가로로 넘긴다
  html = html.replace(/<table>([\s\S]*?)<\/table>/g, (m, body) => {
    const cols = (body.match(/<th[ >]/g) || []).length;
    const cls = cols >= 8 ? "tablewrap wide" : "tablewrap";
    return `<div class="${cls}"><table>${body}</table></div>`;
  });
  // 코드 블록 중 흐름도를 도형으로 교체
  const box = document.createElement("div");
  box.innerHTML = html;
  box.querySelectorAll("pre > code").forEach(code => {
    const text = code.textContent || "";
    const isIA = code.classList.contains("language-ia");
    const isArch = code.classList.contains("language-arch");
    if (code.classList.contains("language-wf")) {
      const holder = document.createElement("div");
      holder.innerHTML = renderWF(code.textContent);
      code.parentElement.replaceWith(holder.firstElementChild);
      return;
    }
    if (code.classList.contains("language-ui")) {
      const holder = document.createElement("div");
      holder.innerHTML = renderUIMap(code.textContent);
      code.parentElement.replaceWith(holder.firstElementChild);
      return;
    }
    if (code.classList.contains("language-map")) {
      const holder = document.createElement("div");
      holder.innerHTML = renderMap(code.textContent);
      code.parentElement.replaceWith(holder.firstElementChild);
      return;
    }
    if (!isIA && !isArch && !isFlowBlock(text)) return;
    const holder = document.createElement("div");
    holder.innerHTML = isIA ? renderIA(text) : isArch ? renderArch(text) : renderFlow(text);
    code.parentElement.replaceWith(holder.firstElementChild);

}

      holder.appendChild(slot);
      let at = 0;
      showItem = (k) => {
        at = k;
        slot.innerHTML = "";
        barTitle.innerHTML = "";
        const frag = items[k].frag.cloneNode(true);
        const h = frag.querySelector("h3");
        if (h) barTitle.appendChild(h);
        slot.appendChild(frag);
        tabs.querySelectorAll("button").forEach((b, j) => {
          if (j === k) { b.setAttribute("aria-current", "true"); b.scrollIntoView({ block: "nearest", inline: "nearest" }); }
          else b.removeAttribute("aria-current");
        });
        bar.querySelectorAll("[data-step]").forEach(b => {
          const n = k + (+b.dataset.step);
          b.disabled = n < 0 || n >= items.length;
        });
        addLegend(slot);
        markScreenHeads(slot);
        linkScreenRefs(slot);
        icons();
        drawFlowCanvases(slot);
      };
      bar.onclick = (e) => {
        const b = e.target.closest("[data-step]");
        if (!b || b.disabled) return;
        const n = at + (+b.dataset.step);
        if (n >= 0 && n < items.length) showItem(n);
      };
      tabs.onclick = (e) => {
        const b = e.target.closest("[data-flow]");
        if (b) showItem(+b.dataset.flow);
      };
      const start = flowId ? items.findIndex(it => it.id === flowId) : 0;
      showItem(start < 0 ? 0 : start);
    }
    addLegend(holder);
    markScreenHeads(holder);
    linkScreenRefs(holder);
    nav.querySelectorAll("button").forEach((b, j) =>
      j === i ? b.setAttribute("aria-current", "true") : b.removeAttribute("aria-current"));
    icons();
    drawFlowCanvases(holder);
  };
  const addLegend = (root) => {
    const first = root.querySelector(".flow");
    if (!first || root.querySelector(".flegend")) return;
    const lg = document.createElement("div");
    lg.innerHTML = FLOW_LEGEND;
    first.parentNode.insertBefore(lg.firstElementChild, first);
  };
  nav.onclick = (e) => { const b = e.target.closest("[data-sec]"); if (b) pick(+b.dataset.sec); };
  window.pickSection = (sid) => {
    for (let i = 0; i < secs.length; i++) {
      const txt = secs[i].frag.textContent || "";
      if (txt.indexOf(sid) >= 0) { pick(i); return true; }
    }
    return false;
  };
  window.goToFlow = (id) => {
    if (!flowIndex.has(id)) return false;
    pick(flowIndex.get(id), id);
    requestAnimationFrame(() => {
      const h = body.querySelector("#flow-" + id);
      if (!h) return;
      h.scrollIntoView({ block: "center", behavior: "auto" });
      h.classList.add("hit");
      setTimeout(() => h.classList.remove("hit"), 1600);
    });
    return true;
  };
  pick(0);
}

const SCREEN_DOC = new Map();
D.documents.forEach((d, i) => {
  const re = /^#### ((?:ADM|STR|WEB|KSK)-[A-Z]{3,4}-[A-Z]{3,6})/gm;
  let m;
  while ((m = re.exec(d.content || ""))) if (!SCREEN_DOC.has(m[1])) SCREEN_DOC.set(m[1], i);
});
window.goToScreenDoc = (id) => {
  if (!SCREEN_DOC.has(id)) return false;
  const i = SCREEN_DOC.get(id);
  show("doc", i);
  let n = 0;
  const tryHit = () => {
    if (goToScreenLocal(id)) return;
    if (++n > 40) return;
    if (window.pickSection && window.pickSection(id)) { setTimeout(tryHit, 60); return; }
    setTimeout(tryHit, 60);
  };
  setTimeout(tryHit, 80);
  return true;
};
function goToScreenLocal(id) {
  const el = document.querySelector('[data-sid="' + id + '"]');
  if (!el) return false;
  el.scrollIntoView({ block: "start", behavior: "smooth" });
  el.classList.add("hit");
  setTimeout(() => el.classList.remove("hit"), 1600);
  return true;
}
function show(view, doc) {
  current = { view, doc: doc ?? current.doc };
  Object.entries(pages).forEach(([k, el]) => { el.hidden = (k !== view); });
  tabs.forEach(b => b.setAttribute("aria-selected", String(b.dataset.nav === view)));
  if (view === "doc") renderDoc(current.doc);
  const hash = view === "doc" ? `#/doc/${D.documents[current.doc].no}` : view === "changes" ? "#/changes" : "#/";
  if (location.hash !== hash) history.replaceState(null, "", hash);
  try { localStorage.setItem("dash.route", hash); } catch (e) {}
}
function routeFrom(hash) {
  const m = String(hash || "").match(/^#\/doc\/(\d+)/);
  if (m) {
    const i = D.documents.findIndex(d => d.no === Number(m[1]));
    if (i >= 0) return show("doc", i);
  }
  if (/^#\/changes/.test(hash || "")) return show("changes");
  return show("list");
}
tabs.forEach(b => b.addEventListener("click", () => show(b.dataset.nav)));
document.getElementById("docList").addEventListener("click", e => {
  const b = e.target.closest("[data-doc]"); if (b) show("doc", +b.dataset.doc);
});
document.getElementById("backBtn").addEventListener("click", () => show("list"));
window.addEventListener("hashchange", () => routeFrom(location.hash));

// ── 커스텀 드롭다운
function makeSelect(host, label, values, onChange) {
  const opts = [{ v: "", t: "전체" }, ...values.map(v => ({ v, t: v }))];
  let cur = "", open = false, cursor = 0;
  host.innerHTML = `
    <button class="sel-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
      <span>${esc(label)}</span><span class="val">전체</span><i data-lucide="chevron-down" class="chev"></i>
    </button>
    <ul class="sel-menu" role="listbox" aria-label="${esc(label)}" hidden>
      ${opts.map((o, i) => `<li role="option" data-i="${i}" aria-selected="${i === 0}"><i data-lucide="check"></i>${esc(o.t)}</li>`).join("")}
    </ul>`;
  const btn = host.querySelector(".sel-btn"), menu = host.querySelector(".sel-menu");
  const paintCursor = () => menu.querySelectorAll("li").forEach((li, i) => li.classList.toggle("cursor", i === cursor));
  const setOpen = (v) => {
    open = v; menu.hidden = !v; host.dataset.open = String(v); btn.setAttribute("aria-expanded", String(v));
    if (v) { cursor = Math.max(0, opts.findIndex(o => o.v === cur)); paintCursor(); }
  };
  const pick = (i) => {
    cur = opts[i].v;
    btn.querySelector(".val").textContent = opts[i].t;
    btn.classList.toggle("set", cur !== "");
    menu.querySelectorAll("li").forEach((li, j) => li.setAttribute("aria-selected", String(i === j)));
    setOpen(false); btn.focus(); onChange(cur);
  };
  btn.addEventListener("click", () => setOpen(!open));
  menu.addEventListener("click", (e) => { const li = e.target.closest("li"); if (li) pick(+li.dataset.i); });
  host.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && open) { e.stopPropagation(); setOpen(false); btn.focus(); return; }
    if (!open && (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") && e.target === btn) { e.preventDefault(); setOpen(true); return; }
    if (!open) return;
    if (e.key === "ArrowDown") { e.preventDefault(); cursor = (cursor + 1) % opts.length; paintCursor(); }
    if (e.key === "ArrowUp") { e.preventDefault(); cursor = (cursor - 1 + opts.length) % opts.length; paintCursor(); }
    if (e.key === "Enter") { e.preventDefault(); pick(cursor); }
  });
  document.addEventListener("click", (e) => { if (open && !host.contains(e.target)) setOpen(false); });
  return () => cur;
}

const uniq = (k) => [...new Set(D.changes.map(c => c[k]).filter(Boolean))];
const getStatus = makeSelect(document.getElementById("selStatus"), "상태", uniq("status"), renderChanges);
const getSource = makeSelect(document.getElementById("selSource"), "출처", uniq("source"), renderChanges);
const getDoc = makeSelect(document.getElementById("selDoc"), "문서", uniq("document_title"), renderChanges);
document.getElementById("fText").addEventListener("input", renderChanges);

function renderChanges() {
  const st = getStatus(), so = getSource(), dc = getDoc();
  const tx = document.getElementById("fText").value.trim().toLowerCase();
  const rows = D.changes.filter(c =>
    (!st || c.status === st) && (!so || c.source === so) && (!dc || c.document_title === dc) &&
    (!tx || `${c.summary} ${c.id} ${c.requested_by || ""}`.toLowerCase().includes(tx)));
  document.getElementById("changeCount").textContent = `${rows.length} / ${D.changes.length}건`;
  document.querySelector("#changeTable tbody").innerHTML = rows.length ? rows.map(c => `<tr>
    <td class="mono nowrap">${esc(c.date)}</td>
    <td class="mono">${esc(c.id)}</td>
    <td><span class="type"><i data-lucide="${TYPE_ICON[c.type] || "dot"}"></i>${esc(c.type)}</span></td>
    <td class="nowrap">${esc(c.source)}</td>
    <td class="nowrap">${esc(c.document_title)}</td>
    <td>${esc(c.summary)}</td>
    <td class="detail">${c.affects_titles.length ? esc(c.affects_titles.join(", ")) : "-"}</td>
    <td class="nowrap">${esc(c.requested_by || "")}</td>
    <td>${pill(c.status)}</td>
  </tr>`).join("") : `<tr><td colspan="9" class="empty">조건에 맞는 변경 이력이 없다.</td></tr>`;
  icons();
}
renderChanges();

let saved = location.hash;
if (!saved) { try { saved = localStorage.getItem("dash.route") || "#/"; } catch (e) { saved = "#/"; } }
routeFrom(saved);
icons();
</script>
