\n@ kiosk\nh 관리자 인증\nf 인증번호 // * * * *\nkey\nb2 나가기\nnote 실패 횟수를 넘기면 일정 시간 차단합니다\n# KSK-ADMN-MAIN 관리자 메뉴\n@ kiosk\nh 관리자  카페온 3호점 ~ 나가기\nnote 단말 상태  프린터 정상 · 카드 단말 정상 · 네트워크 정상\nbox 90 메뉴 갱신  마지막 09-04 09:00 | box 90 판매 메뉴 설정  오늘 38 / 42\nbox 90 품절 설정  품절 3건 | box 90 단말 상태 확인\n# KSK-ADMN-SYNC 메뉴 갱신\n@ kiosk\nh 메뉴 갱신 ~ 뒤로\nt 항목, 내용\ntd 마지막 갱신, 2026-09-04 09:00\ntd 현재 메뉴, 42개 · 카테고리 3개\nsub 바뀐 내용 (3건)\nt 구분, 메뉴, 내용\ntd 추가, 아이스티, 4,000원\ntd 수정, 아메리카노, 4,500 → 4,800원\ntd 삭제, 시즌 라떼,\nb 적용하기\nnote 주문이 진행 중이면 갱신하지 않습니다\n# KSK-ADMN-OPEN 판매 메뉴 설정\n@ kiosk\nh 오늘 열 메뉴를 고르세요 ~ 38 / 42 노출\nsub 커피\nchk 아메리카노 4,800 | chk 라떼 5,000 | chk 콜드브루 5,500 | b2 모두 열기\nsub 디저트\nchk 크루아상 3,000 | chk 마들렌 3,500 (품절) | b2 모두 닫기\nnote 고르지 않은 메뉴는 미노출로 바뀝니다. 여기서 바꾸면 웹앱과 외부 POS에도 함께 적용됩니다\nb2 취소 | b 저장\n# KSK-ADMN-SOUT 품절 설정\n@ kiosk\nh 품절 설정 ~ 뒤로\nfq 검색어 | tx 품절 3건\nt 메뉴명, 판매가, 상태, 재개 시각, 동작\ntd 아메리카노, 4,800, {판매중}, , {품절}\ntd 크루아상, 3,000, {품절}, 16:00, 판매 재개\ntd 마들렌, 3,500, {품절}, 수동 해제까지, 판매 재개\nnote 여기서 바꾸면 웹앱과 외부 POS에도 함께 적용됩니다\nnote 네트워크가 끊기면 단말에 두었다가 복구 후 보냅니다\n# KSK-ADMN-DEVC 단말 상태 확인\n@ kiosk\nh 단말 상태 확인 ~ 뒤로\nt 단말, 상태, 사유·마지막 통신, 동작\ntd 주문서 프린터, {오류}, 용지 없음 · 09-04 10:20, 다시 확인\ntd 카드 단말, {정상}, 09-04 14:02, 시험 결제\ntd 네트워크, {정상}, 응답 42ms, 다시 확인\nnote 프린터 오류 상태에서도 주문은 받습니다. 주문서는 화면으로 확인합니다\n```\n"}, {"no": 7, "id": "DOC-07", "title": "기능 명세", "file": "docs/07_기능명세.md", "category": "명세", "status": "확정", "progress": 100, "eta": "", "version": "2.6", "updated": "2026-09-08", "inherits_titles": ["서비스 구조", "IA", "Wireframe", "기획 검토"], "content": "# 07. 기능 명세\n\n화면 단위로 무엇을 처리하고 어떤 조건과 예외를 두는지 정의한다. 화면 ID와 화면명은 05 IA와 같다.\n\n배치는 06 Wireframe, 처리 순서는 04 Flow에 있다. 여기서는 화면이 지켜야 할 규칙을 적는다.\n\n확인 팝업과 결과 토스트는 05 문서 7절 공통 규칙을 따른다. 화면마다 다시 적지 않는다.\n\n## 1. 내부 어드민\n\n### 인증\n\n#### ADM-AUTH-LOGIN 로그인\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 이메일과 비밀번호로 인증한다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-110 로그인 · FL-908 로그인 실패 |\n\n**처리**\n\n1. 로그인 → 성공 시 ADM-AUTH-OTP\n2. 이메일 저장 → 다음 접속 시 이메일을 채워 둔다\n\n**조건**\n\n* 실패 5회 시 계정을 잠근다\n* 어느 항목이 틀렸는지 밝히지 않는다\n\n**예외**\n\n* 불일치 시 \"이메일 또는 비밀번호가 올바르지 않습니다. (2/5)\" 표시. 어느 항목이 틀렸는지 밝히지 않고 남은 횟수만 알린다\n* 연속 5회 실패 시 \"계정이 잠겼습니다. 관리자에게 문의해 주세요.\" 표시하고 잠금 시각을 함께 보여준다. 로그인 버튼을 비활성으로 둔다\n* 잠긴 본사 계정은 다른 본사 운영자가 계정 목록에서 푼다\n* 로그인에 성공하면 실패 횟수를 초기화한다\n\n#### ADM-HOME-EXAM 개시 확정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 하위가맹점 심사가 끝난 매장의 개시를 확정한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 상태값 | 심사 대기, 심사 완료 |\n| 연결 Flow | FL-112 대시보드 · FL-234 매장 등록·관리 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 행사, 심사 |\n| 열 | 선택, 순번, 매장명, 소속 행사, 심사, 심사일, 메뉴 |\n| 기본 정렬 | 심사일 (최근이 위) |\n| 행 동작 | 없다. 선택해서 일괄 확정한다 |\n| 선택 처리 | 심사 완료 매장만 고를 수 있다 |\n\n**처리**\n\n1. 대시보드 개시 준비의 심사 열에서 연다. 그 행사의 개설 준비 매장이 나온다\n2. 결제대행사 결과가 자동으로 온 매장은 심사 완료로 나온다. 오지 않은 매장은 심사 대기다\n3. 결과를 직접 확인한 매장은 행에서 심사 완료로 바꾼다. 심사일을 함께 적는다\n4. 심사 완료 매장을 골라 개시 확정 → 확인 팝업에 건수와 메뉴 없는 매장 수를 적는다 → 확정\n5. 확정한 매장은 영업으로 바뀌고 소속 행사가 잠기며 주문 채널에 노출된다\n\n**조건**\n\n* 심사 대기 매장은 확정할 수 없다\n* 되돌릴 수 없다. 확정 뒤 문제가 있으면 매장이 일시중지로 바꾼다\n* 확정 시각과 조작자를 이력에 남긴다\n\n**예외**\n\n* 확정할 매장이 없으면 \"확정할 매장이 없습니다.\"를 표시한다\n* 메뉴가 하나도 없는 매장은 확정은 되지만 판매할 것이 없어 채널에 노출되지 않는다. 확인 팝업에 그 수를 적는다\n* 결제대행사 심사가 거절이면 심사 거절로 표시하고 사유를 적는다. 매장이 정보를 고쳐 다시 요청한다\n\n#### ADM-AUTH-OTP 2차 인증\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록 단말로 인증번호를 확인한다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-111 2차 인증 |\n\n**처리**\n\n1. 인증하기 → 성공 시 ADM-HOME-MAIN\n2. 시간이 남아 있으면 버튼은 인증하기로 둔다\n3. 유효시간이 끝나면 버튼을 재발급으로 바꾸고 입력칸을 비활성으로 둔다\n4. 재발급 → 새 인증번호를 보내고 남은 시간을 초기화한다\n5. 다른 계정으로 로그인하기 → 진행 중이던 인증을 버리고 로그인 화면으로 돌아간다\n\n**조건**\n\n* 외부 접속은 2차 인증을 건너뛸 수 없다\n* 인증번호 유효시간 3분\n\n**예외**\n\n* 인증번호를 다 입력하기 전에는 인증하기를 비활성으로 둔다\n* 불일치 시 \"인증번호가 올바르지 않습니다. (2/5)\" 표시하고 남은 횟수를 알린다\n* 유효시간 3분이 지나면 \"인증 시간이 지났습니다. 다시 받아 주세요.\" 표시하고 버튼을 재발급으로 바꾼다\n* 실패 횟수를 넘기면 일정 시간 차단한다\n* 다른 계정으로 돌아가면 발송한 인증번호를 무효로 만든다. 이전 번호로는 인증할 수 없다\n\n### 대시보드\n\n#### ADM-HOME-MAIN 대시보드\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 조치가 필요한 항목과 오늘 실적, 정산 상태, 행사 개시 준비를 표시한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-112 대시보드 |\n\n**처리**\n\n1. 이상 항목을 판정해 지금 확인할 것 영역에 발생 시각 순으로 표시한다\n2. 오늘 실적을 주문, 결제, 취소, 순매출로 표시하고 집계 시점을 함께 적는다\n3. 처리 대기를 건수와 가장 오래된 건의 경과 시간으로 표시한다\n4. 최근 정산 대사 상태를 기준일별로 표시한다\n5. 개시 7일 이내 행사의 준비 완료 수를 표시한다\n6. 개시 준비의 심사 열 → ADM-HOME-EXAM\n7. 각 항목을 선택하면 해당 화면으로 이동한다\n\n**이상 판정 기준**\n\n| 유형 | 기준 |\n| --- | --- |\n| 단말 미연결 | 마지막 통신 후 30분 경과 |\n| 접수 지연 | 접수 대기가 30초를 넘긴 주문이 있는 매장 |\n| 매출 급락 | 최근 1시간 주문이 같은 요일 같은 시간대 평균의 30% 미만 |\n| 품절 급증 | 판매 메뉴의 30% 이상이 품절 |\n\n**조건**\n\n* 매장 화면에서 처리해야 하는 항목은 대행 접속으로 보낸다. 본사가 매장 화면을 직접 고치지 않는다\n\n* 추세 그래프와 매장 순위를 두지 않는다. 비교는 매출 화면에서 한다\n* 모든 항목에 이동 경로를 붙인다. 누를 곳이 없는 숫자는 두지 않는다\n* 이상 판정 기준은 전체 공통이다. 매장별로 다르게 두지 않는다\n* 한 화면의 지표 묶음을 다섯 개 이하로 유지한다\n\n**예외**\n\n* 이상 항목이 없으면 \"확인할 항목이 없습니다.\"를 표시한다\n* 집계가 아직 돌지 않은 구간은 수치를 비우고 \"집계 중\"으로 표시한다\n* 개시 7일 이내 행사가 없으면 개시 준비 영역을 숨긴다\n* 매출 급락은 개시 첫날과 종료일에는 판정하지 않는다. 비교할 과거 구간이 없다\n\n### 행사\n\n#### ADM-EVNT-LIST 행사 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 기간과 상태로 행사를 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 진행 전, 진행 중, 종료 |\n| 연결 Flow | FL-101 매장 개설 · FL-113 행사 목록·등록 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 상태, 행사명 |\n| 열 | 선택, 순번, 행사명, 등록된 브랜드, 시작일, 종료일, 상태, 동작 |\n| 기본 정렬 | 시작일 (최근이 위) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 조회 → 조건에 맞는 행사를 표시한다\n2. 행 선택 → ADM-EVNT-FORM\n3. 행사 등록 → ADM-EVNT-FORM 신규\n\n**조건**\n\n* 종료 행사는 기본 조회에서 제외한다\n* 삭제는 진행 전 행사만 할 수 있다. 붙어 있던 상권은 그 행사에서 떼어지고 상권은 남는다\n\n**예외**\n\n* 결과가 없으면 \"조회 결과가 없습니다.\" 표시\n* 그 행사에 속한 매장이 있으면 삭제할 수 없다. \"이 행사에 속한 매장 N개가 있어 삭제할 수 없습니다.\"를 표시한다\n\n#### ADM-EVNT-FORM 행사 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 행사명, 기간, 장소를 등록한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-113 행사 목록·등록 |\n\n**처리**\n\n1. 정보 탭에서 행사명, 시작일, 종료일, 장소, 관리자 메모를 입력한다\n2. 장소 선택 → ADM-ADDR-FIND\n3. 저장 → 전체 항목 검증 → 확인 팝업 → 목록으로 이동\n4. 상권 탭 → 참여할 상권을 붙이거나 뗀다 (ADM-EVNT-ZONE). 비워 두고 저장할 수 있다\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 행사명 | 필수 | 문자 50자 이내 | 기간이 겹치는 행사와 이름이 같을 수 없다 |\n| 시작일 | 필수 | 날짜 | 신규 등록은 오늘 이후만 고른다 |\n| 종료일 | 필수 | 날짜 | 시작일 이후여야 한다. 기간은 최대 90일 |\n| 장소 | 필수 | 주소 | 주소 검색으로만 입력한다. 직접 입력할 수 없다 |\n| 관리자 메모 | 선택 | 문자 200자 이내 | - |\n\n**조건**\n\n* 검증은 저장을 누를 때 한 번에 한다. 입력 도중에는 오류를 띄우지 않는다\n* 오류가 둘 이상이면 항목마다 문구를 표시하고 화면 위에 건수를 함께 적는다. 첫 오류 항목으로 이동한다\n* 탭이 있는 화면은 오류가 있는 탭에 표시를 남기고 안내 문구에 탭 이름을 적는다\n* 항목을 고치면 그 항목의 오류만 지운다\n* 종료된 행사는 수정할 수 없다\n\n**예외**\n\n* 이 행사에 매장이 있는 상권은 뗄 수 없다. 매장을 먼저 폐점해야 한다\n\n| 상황 | 표시 문구 |\n| --- | --- |\n| 행사명 미입력 | 행사명을 입력해 주세요. |\n| 행사명 50자 초과 | 행사명은 50자까지 입력할 수 있습니다. |\n| 행사명 중복 | 이미 등록된 행사명입니다. 다른 이름을 입력해 주세요. |\n| 시작일 미선택 | 시작일을 선택해 주세요. |\n| 종료일 미선택 | 종료일을 선택해 주세요. |\n| 종료일이 시작일보다 빠름 | 종료일은 시작일 이후여야 합니다. |\n| 기간 90일 초과 | 행사 기간은 최대 90일까지 등록할 수 있습니다. |\n| 장소 미입력 | 장소를 검색해 주세요. |\n| 종료된 행사 수정 시도 | 입력을 읽기 전용으로 두고 \"종료된 행사는 수정할 수 없습니다.\" 표시 |\n| 저장 실패 | 저장하지 못했습니다. 잠시 후 다시 시도해 주세요. 입력한 값은 지우지 않는다 |\n\n#### ADM-EVNT-ZONE 상권 붙이기\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 이미 만든 상권을 이 행사에 붙인다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-113 행사 목록·등록 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 브랜드명 |\n| 열 | 선택, 순번, 브랜드명, 참여 행사, 매장 수 |\n| 기본 정렬 | 등록 순 |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 행사 등록·수정의 상권 탭에서 상권 붙이기를 선택한다\n2. 브랜드명으로 조회한다\n3. 붙일 상권을 여러 건 고른다\n4. 붙이기 → 상권 탭 목록에 더한다\n\n**조건**\n\n* 행사 등록·수정 모달 위에 겹쳐 띄운다\n* 이미 이 행사에 붙어 있는 상권은 목록에 나오지 않는다\n* 상권 하나가 여러 행사에 붙을 수 있다\n* 목록에 없으면 상권 메뉴에서 새로 만든다. 이 화면에서 상권을 만들지 않는다\n\n**예외**\n\n* 조회 결과가 없으면 빈 결과 화면을 표시하고 상권 메뉴를 안내한다\n* 하나도 고르지 않고 붙이기를 누르면 \"붙일 상권을 선택해 주세요.\"를 표시한다\n\n#### ADM-ADDR-FIND 주소 검색\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 도로명, 건물명, 지번으로 주소를 찾아 입력 칸에 넣는다 |\n| 대상 | 본사 운영자, 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-113 행사 목록·등록 · FL-114 상권 목록·등록 |\n\n**처리**\n\n1. 주소 입력 칸 선택 → 주소 검색 열기\n2. 검색어 입력 후 검색 → 우편번호와 도로명주소 목록 표시\n3. 주소 선택 → 상세주소 칸 활성화\n4. 적용 → 우편번호, 도로명주소, 상세주소를 호출한 화면에 넣고 닫는다\n\n**조건**\n\n* 주소 입력 칸에 직접 입력할 수 없다. 검색 결과에서만 고른다\n* 검색어는 2자 이상 입력해야 검색한다\n* 우편번호와 도로명주소는 수정할 수 없다. 상세주소만 입력한다\n\n**예외**\n\n* 결과가 없으면 \"검색 결과가 없습니다.\"와 함께 다시 검색할 방법을 표시한다\n* 주소를 고르지 않고 적용하면 \"주소를 선택해 주세요.\" 표시하고 닫지 않는다\n* 주소 조회에 실패하면 \"주소를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.\" 표시\n\n### 상권\n\n#### ADM-COMN-CONF 확인 팝업\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 저장, 삭제, 상태 변경, 작업 취소를 실행하기 전에 확인을 받는다 |\n| 대상 | 본사 운영자, 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-605 처리 확인과 결과 안내 · FL-606 목록 일괄 처리 |\n\n**처리**\n\n1. 저장, 삭제, 상태 변경, 작업 취소를 누르면 확인 팝업을 연다\n2. 확인 → 처리 요청 → 결과를 하단 가운데 토스트로 알린다\n3. 취소 → 처리하지 않고 닫는다. 하단 토스트로 \"취소되었습니다.\"를 알린다\n\n**조건**\n\n* 조회와 검색에는 확인 팝업을 두지 않는다\n* 되돌릴 수 없는 처리는 영향 범위를 함께 적는다. 예) 이 행사에 속한 상권 4개가 함께 처리됩니다\n* 일괄 처리는 대상 건수를 제목에 적는다\n* 실행 버튼의 이름은 실제 동작으로 쓴다. \"확인\"이 아니라 \"저장\", \"삭제\", \"종료\"로 적는다\n* 성공과 취소 토스트는 화면 아래 가운데에 3초 표시하고 사라진다. 화면을 가리지 않는다\n* 실패 토스트는 사라지지 않는다. 닫기를 눌러야 없어진다\n* 처리에 실패해도 화면을 벗어나지 않는다. 입력한 값을 지우지 않는다\n\n**예외**\n\n| 상황 | 표시 문구 |\n| --- | --- |\n| 저장 성공 | 저장되었습니다. |\n| 삭제 성공 | 삭제되었습니다. |\n| 상태 변경 성공 | 변경되었습니다. |\n| 취소 | 취소되었습니다. |\n| 처리 실패 | 저장하지 못했습니다. 잠시 후 다시 시도해 주세요. |\n| 권한 없음 | 권한이 없습니다. 관리자에게 문의해 주세요. |\n\n#### ADM-ZONE-LIST 상권 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 브랜드명과 상태로 상권을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-114 상권 목록·등록 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 상태, 브랜드명 |\n| 열 | 선택, 순번, 브랜드명, 매장 수, 오늘 매출, 등록일, 동작 |\n| 기본 정렬 | 등록일 (최근이 위) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 행 선택 → ADM-ZONE-FORM\n2. 매장 수 선택 → ADM-SALE-LIST (그 상권으로 조건을 걸어 연다)\n\n**조건**\n\n* 이 화면에서는 행사를 다루지 않는다. 어느 행사에 참여하는지는 행사 등록·수정의 상권 탭에서 정한다\n* 삭제는 매장이 없는 상권만 할 수 있다. 삭제하면 붙어 있던 행사에서 빠지고 담당 계정은 사용 중지된다\n\n**예외**\n\n* 결과가 없으면 \"조회 결과가 없습니다.\" 표시\n\n#### ADM-ZONE-FORM 상권 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 브랜드 정보와 본사 사업자 정보, 담당 계정을 등록하고 그 브랜드의 매장을 확인한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-114 상권 목록·등록 · FL-116 상권 매장 관리 |\n\n**입력 항목**\n\n| 항목 | 필수 | 설명 |\n| --- | --- | --- |\n| 브랜드명 | 필수 | 전체에서 중복할 수 없다 |\n| 위치 | 필수 | 주소 검색으로만 입력한다 |\n| 상호 | 필수 | 사업자등록증의 상호를 그대로 적는다 |\n| 사업자등록번호 | 필수 | 휴폐업 조회로 확인한다 |\n| 대표자 | 필수 | |\n| 대표 연락처 | 필수 | |\n| 통신판매업 신고번호 | 필수 | 판매자 정보 화면에 표시한다 |\n| 업태·종목 | 선택 | |\n| 은행, 계좌번호, 예금주 | 필수 | 매장의 정산계좌로 상속한다 |\n| 관리자 메모 | 선택 | 고객에게 보이지 않는다 |\n\n**처리**\n\n1. 정보 탭에서 브랜드명, 위치, 본사 사업자 정보와 정산계좌, 관리자 메모를 입력한다\n2. 위치 선택 → ADM-ADDR-FIND\n3. 계정 탭에서 담당 계정의 이메일, 이름, 휴대폰번호, 비밀번호를 입력한다\n4. 저장 → 두 탭의 항목을 함께 검증 → 상권을 만들고 계정을 발급한다 → 확인 팝업 → 목록으로 이동\n5. 수정에서는 계정 탭에 발급된 계정 정보를 읽기 전용으로 표시한다\n6. 히스토리 탭에서 이 브랜드와 소속 매장의 변경 내역을 조회한다\n\n**입력 항목 — 정보**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 브랜드명 | 필수 | 문자 30자 이내 | 상권 하나에 브랜드 하나를 둔다. 전체에서 중복할 수 없다. 이 상권의 매장은 모두 이 브랜드에 속한다 |\n| 위치 | 필수 | 주소 | 주소 검색으로만 입력한다 |\n| 상호 | 필수 | 문자 | 본사 사업자의 상호 |\n| 사업자등록번호 | 필수 | 숫자 10자리 | 휴폐업 조회에서 폐업으로 나오면 저장할 수 없다 |\n| 대표자 | 필수 | 문자 | - |\n| 대표 연락처 | 필수 | 숫자 10~11자리 | - |\n| 정산계좌 | 필수 | 은행, 계좌번호, 예금주 | - |\n| 관리자 메모 | 선택 | 문자 200자 이내 | - |\n\n**입력 항목 — 계정**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 이메일 | 필수 | 이메일 형식 | 로그인 아이디로 쓴다. 전체 계정에서 중복할 수 없다. 등록한 뒤에는 바꿀 수 없다 |\n| 이름 | 필수 | 문자 20자 이내 | - |\n| 휴대폰번호 | 필수 | 숫자 10~11자리 | 형식이 맞아야 한다 |\n| 비밀번호 | 필수 | 8~20자, 영문·숫자·특수문자 중 2종 이상 | - |\n| 비밀번호 재확인 | 필수 | 비밀번호와 같은 값 | 비밀번호와 같아야 한다 |\n| 역할 | - | 고정 | 가맹 관리자로 둔다. 바꿀 수 없다 |\n| 담당 범위 | - | 고정 | 등록하는 상권으로 둔다. 바꿀 수 없다 |\n\n**히스토리 탭**\n\n| 항목 | 내용 |\n| --- | --- |\n| 목록 | 변경일시, 대상, 항목, 변경 전, 변경 후, 변경자 |\n| 대상 | 이 브랜드와 그 브랜드에 속한 매장 |\n| 조회 조건 | 기간, 대상 |\n| 기록 시점 | 본사와 매장이 바꾼 값을 모두 남긴다. 변경자에 소속을 함께 적는다 |\n| 보관 | 지우지 않는다. 매장이 폐점해도 남긴다 |\n\n**조건**\n\n* 매장은 이 상권에만 속한다. 상권은 이 화면의 값으로 자동으로 정해진다\n* 이 브랜드의 매장 목록은 매출 조회에서 상권 조건을 걸어 본다\n* 상권명이 곧 브랜드명이다. 정보 탭에서 정한다\n* 매장 표시명은 브랜드명과 지점번호로 만든다. 지점번호는 자동으로 부여한다\n* 본사는 매장을 등록하거나 고치거나 상태를 바꾸지 않는다. 조회만 한다\n* 브랜드를 입력하고 관리하는 주체는 본사 운영자다. 매장은 브랜드를 만들지 않는다\n* 매장이 등록된 상권은 브랜드명을 바꿀 수 없다. 표시명이 모두 달라진다\n* 상권을 여러 행사에 붙일 수 있다. 붙이고 떼는 일은 행사 등록·수정의 상권 탭에서 한다. 매출은 주문 시점의 참여 행사로 집계한다\n* 검증은 저장을 누를 때 세 탭을 함께 한다. 오류가 있는 탭에 표시를 남기고 그 탭으로 이동한다\n* 상권 등록은 담당 계정 발급을 포함한다. 계정 없이 상권만 저장할 수 없다\n* 계정 항목은 등록할 때만 입력한다. 수정 화면에서는 모두 읽기 전용으로 둔다\n* 계정 정보 수정, 비밀번호 재설정, 사용 중지는 ADM-USER-FORM에서 처리한다. 같은 항목을 두 화면에서 고치지 않는다\n* 상권과 계정은 한 번에 처리한다. 계정 발급에 실패하면 상권도 저장하지 않는다\n* 본사 운영자가 비밀번호를 지정한다. 발급한 비밀번호는 첫 로그인에서 바꾸게 한다\n* 이 화면에서는 행사를 붙이거나 떼지 않는다\n* 삭제는 매장이 없는 상권만 할 수 있다. 삭제하면 붙어 있던 행사에서 빠지고 담당 계정은 사용 중지된다\n* 그 행사에 속한 매장이 있으면 뗄 수 없다. 행사가 끝나 매장이 정리된 뒤에 뗀다. 붙이는 것은 언제든 할 수 있다\n\n**예외**\n\n| 상황 | 표시 문구 |\n| --- | --- |\n| 매장이 속한 행사 떼기 시도 | 이 행사에 속한 매장 N개가 있어 뗄 수 없습니다 |\n| 브랜드명 미입력 | 브랜드명을 입력해 주세요. |\n| 브랜드명 30자 초과 | 브랜드명은 30자까지 입력할 수 있습니다. |\n| 브랜드명 중복 | 같은 행사에 이미 등록된 브랜드명입니다. 다른 이름을 입력해 주세요. |\n| 위치 미입력 | 위치를 검색해 주세요. |\n| 매장이 있는 상권의 브랜드명 변경 시도 | 매장이 등록되어 있어 브랜드명을 바꿀 수 없습니다 |\n| 폐업 사업자 | 폐업한 사업자입니다. 사업자등록번호를 다시 확인해 주세요. |\n| 이메일 미입력 | 이메일을 입력해 주세요. |\n| 이메일 형식 오류 | 이메일 형식으로 입력해 주세요. |\n| 이메일 중복 | 이미 사용 중인 이메일입니다. 다른 이메일을 입력해 주세요. |\n| 이름 미입력 | 이름을 입력해 주세요. |\n| 휴대폰번호 형식 오류 | 휴대폰번호를 다시 확인해 주세요. |\n| 비밀번호 형식 오류 | 비밀번호는 8~20자로, 영문·숫자·특수문자 중 2종 이상을 넣어 주세요. |\n| 비밀번호 재확인 불일치 | 비밀번호가 일치하지 않습니다. |\n| 붙일 상권 미선택 | 붙일 상권을 선택해 주세요. |\n| 저장 실패 | 저장하지 못했습니다. 잠시 후 다시 시도해 주세요. 입력한 값은 지우지 않는다 |\n\n### 매출\n\n#### ADM-SALE-COMP 행사·상권 비교\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 행사와 상권을 축으로 매출을 비교한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-103 매출 통계 조회 · FL-135 행사·상권 비교 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 행사(여러 건), 비교 기준, 일평균으로 보기, 표시 개수 |\n| 열 (상권 기준) | 선택, 순번, 상권, 참여 행사, 기간, 순매출, 일평균, 비중, 전기 대비 |\n| 열 (행사 기준) | 선택, 순번, 행사, 기간, 상권 수, 순매출, 일평균, 비중, 전기 대비 |\n| 기본 정렬 | 순매출 (큰 값이 위) |\n| 행 동작 | 그 조건으로 매출 조회를 연다 |\n| 요약 | 순매출, 주문, 객단가 |\n\n**처리**\n\n1. 기간을 고른다. 최근 7일, 최근 30일, 행사 전체 기간 버튼으로 한 번에 넣을 수 있다\n2. 비교 기준을 상권과 행사 중에서 고른다. 기준을 바꾸면 첫 열과 세 번째 열이 함께 바뀐다\n3. 일평균으로 보기를 켜면 순매출을 기간 일수로 나눠 하루 기준으로 환산한다\n4. 표시 개수를 고른다. 상위 10개, 상위 20개, 전체 중에서 고르고 그래프는 고른 수만 그린다\n5. 조회 → 막대 그래프와 목록을 함께 그린다. 막대에 값 라벨을 붙인다\n6. 행 선택 → ADM-SALE-LIST (그 상권 또는 행사로 조건을 걸어 연다)\n7. 내려받기 → ADM-COMN-DOWN\n\n**조건**\n\n* 순매출과 비중, 전기 대비를 비교한다. 매장 수는 상권 목록에서 본다\n* 전기 대비는 같은 길이의 직전 기간과 견준다. 직전 기간에 자료가 없으면 신규로 표시한다\n* 그래프에 그리지 않은 항목은 기타 한 줄로 묶고 목록에는 모두 남긴다\n* 기간이 다른 항목을 함께 보면 기간 열에 일수를 적는다\n\n**예외**\n\n* 주문 채널을 쓰지 않는 매장이 있으면 비고에 적고 비교에서 뺀다\n* 당일이 포함된 구간은 잠정치가 섞인다는 안내를 목록 위에 적는다\n* 조회 결과가 없으면 \"조회 결과가 없습니다.\"를 표시하고 조건 초기화 버튼을 둔다\n\n#### ADM-SALE-LIST 매출 조회\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 기간과 소속 기준으로 매출을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 잠정, 확정 |\n| 연결 Flow | FL-103 매출 통계 조회 · FL-133 매출 조회 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 행사, 상권, 브랜드, 매장명·사업자번호, 집계 단위, 소속 기준 |\n| 열 | 선택, 순번, 일자, 매장, 주문, 결제, 취소, 순매출, 집계 |\n| 고를 수 있는 열 | 일자, 매장, 주문, 결제, 취소, 순매출, 객단가, 집계 |\n| 기본 정렬 | 일자 (최근이 위) |\n| 행 동작 | 그 매장의 그날 매출 상세로 간다 |\n| 요약 | 결제, 취소, 순매출, 주문 |\n\n**처리**\n\n1. 기간을 고른다. 오늘, 7일, 30일 버튼으로 한 번에 넣을 수 있다\n2. 집계 단위를 고른다. 일자별, 매장별, 매장·일자별 중에서 고르고 첫 두 열이 함께 바뀐다\n3. 소속 기준을 고른다. 주문 시점 소속이 기본이다\n4. 열 고르기에서 표에 넣을 열을 고른다. 내려받기 파일도 같은 구성으로 만든다\n5. 조회 → 요약과 목록을 그린다. 당일이 포함되면 집계 열에 잠정으로 표시한다\n6. 행 선택 → ADM-SALE-DETAIL\n7. 내려받기 → ADM-COMN-DOWN\n\n**조건**\n\n* 매장은 드롭다운이 아니라 이름과 사업자번호로 검색한다. 상권을 모르는 상태에서 매장을 찾는 경로는 이 화면 하나로 둔다\n* 당일 구간은 잠정이다. 집계 시점을 함께 적는다\n* 소속 기준을 현재 소속으로 바꾸면 상권을 옮긴 매장의 지난 매출이 지금 상권에 붙는다\n* 목록으로 돌아올 때 조회 조건과 정렬, 고른 열을 그대로 둔다\n\n**예외**\n\n* 소속 기준을 바꾸면 과거 구간 수치가 달라진다는 안내를 목록 위에 적고 토스트로 알린다\n* 조회 결과가 없으면 \"조회 결과가 없습니다.\"를 표시하고 조건 초기화 버튼을 둔다\n* 집계가 아직 돌지 않은 구간은 수치를 비우고 집계 중으로 표시한다\n\n#### ADM-SALE-DETAIL 매출 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 매장별 주문과 결제 내역을 확인한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 수령 완료, 취소 |\n| 연결 Flow | FL-103 매출 통계 조회 · FL-134 매출 상세 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 상태, 주문번호·휴대폰 뒤 4자리 |\n| 열 | 선택, 순번, 주문번호, 시각, 채널, 금액, 결제수단, 상태 |\n| 기본 정렬 | 시각 (최근이 위) |\n| 행 동작 | 주문 상세(ADM-SALE-ORDR)를 띄운다 |\n| 요약 | 결제, 취소, 순매출, 주문 |\n\n**처리**\n\n1. 요약과 채널별, 결제수단별 집계를 위에 둔다. 각 표에 비중을 함께 적는다\n2. 주문 내역을 시각 역순으로 표시한다\n3. 상태와 검색어로 주문 내역을 좁힌다\n4. 행 선택 → ADM-SALE-ORDR\n5. 앞날, 다음날 버튼으로 같은 매장의 다른 날짜로 옮긴다\n6. 목록으로 → ADM-SALE-LIST. 조회 조건을 유지한다\n7. 내려받기 → ADM-COMN-DOWN\n\n**조건**\n\n* 매입 후 취소는 취소 일자에 별도 거래로 기록한다\n* 승인취소는 매출에서 제외하고 목록에도 넣지 않는다\n* 채널별과 결제수단별 비중은 결제 금액 기준이다\n\n**예외**\n\n* 그날 주문이 없으면 요약을 0으로 두고 \"조회 결과가 없습니다.\"를 표시한다\n* 다음날이 오늘보다 뒤면 다음날 버튼을 누를 수 없게 둔다\n\n#### ADM-SALE-ORDR 주문 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 한 주문의 결제와 상태 변경, 알림 발송 결과를 확인한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 상태값 | 수령 완료, 취소 |\n| 연결 Flow | FL-134 매출 상세 · FL-150 주문 상세 |\n\n**표시 항목**\n\n| 묶음 | 항목 |\n| --- | --- |\n| 기본 | 매장, 소속 행사, 주문 시각, 채널, 주문자 |\n| 주문 내역 | 메뉴, 옵션, 수량, 금액 |\n| 결제 | 결제수단, 승인번호, 승인 시각, 결제 금액, 정산 상태 (미정산, 정산 완료, 취소 반영) |\n| 취소 | 취소 구분, 취소 시각, 취소 사유 |\n| 상태 변경 이력 | 시각, 상태, 처리자 |\n| 알림 발송 | 시각, 종류, 결과 |\n\n**처리**\n\n1. 매출 상세의 행에서 연다\n2. 주문 한 건의 결제와 상태 변경, 알림 발송 결과를 한 화면에 표시한다\n3. 대행 접속 → ADM-USER-PROXY. 사유를 받고 그 매장 화면으로 들어간다\n4. 닫기 → 매출 상세로 돌아간다. 목록 위치와 조회 조건을 유지한다\n\n**조건**\n\n* 본사는 조회만 한다. 이 화면에서 주문 상태를 바꾸지 않는다\n* 주문자 휴대폰번호는 가운데를 가려서 표시한다\n* 카드번호는 앞 네 자리와 뒤 네 자리만 표시한다\n* 취소 주문은 취소 구분과 사유, 시각을 결제 묶음에 함께 적는다\n\n**예외**\n\n* 키오스크 주문은 주문자 정보가 없다. \"현장 주문\"으로 표시한다\n* 알림 발송이 실패한 건은 결과에 실패와 사유를 적고 오류 로그로 갈 수 있게 한다\n* 정산이 아직 안 된 주문은 정산 상태를 미정산으로 표시한다\n\n#### ADM-COMN-DOWN 내려받기\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 조회한 자료를 파일로 만든다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-103 매출 통계 조회 · FL-151 자료 내려받기 |\n\n**입력 항목**\n\n| 항목 | 필수 | 설명 |\n| --- | --- | --- |\n| 범위 | 필수 | 화면에 보이는 조건 그대로 또는 기간 전체 |\n| 형식 | 필수 | 엑셀 또는 CSV |\n| 개인정보 항목 포함 | 선택 | 주문자 이름과 휴대폰번호를 넣을지 정한다 |\n\n**처리**\n\n1. 내려받기 버튼을 누르면 열린다. 조회 조건을 위에 그대로 보여준다\n2. 범위와 형식을 고른다. 매출 조회에서 열을 골랐으면 그 구성 그대로 만든다\n3. 내려받기 → 진행 막대와 건수를 표시한다\n4. 창을 닫아도 만들기는 이어진다. 끝나면 파일명과 함께 토스트로 알린다\n\n**조건**\n\n* 개인정보 항목을 포함하면 조작자와 조회 범위를 접속기록에 남긴다\n* 10만 건을 넘으면 파일을 나눠 만든다\n* 매출, 정산, 이력 화면에서 같은 팝업을 쓴다\n\n**예외**\n\n* 만들지 못하면 오류 번호와 함께 실패를 표시하고 다시 시도할 수 있게 한다\n* 같은 오류가 이어지면 오류 로그에서 원인을 확인한다\n\n#### ADM-RECN-LIST 정산 대사\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 결제 원장과 결제대행사 내역을 대조한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 거래, 정산, 입금 |\n| 연결 Flow | FL-141 정산 대사 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 대사 단계, 기준일, 결제대행사 |\n| 열 | 선택, 순번, 기준일, 단계, 일치, 불일치, 동작 |\n| 기본 정렬 | 기준일 (최근이 위) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 대사 실행 → 결과를 요약으로 표시\n2. 불일치 보기 → ADM-RECN-DIFF\n\n**조건**\n\n* 1만 건 초과 시 파일 수신으로 전환한다\n* 결제 키와 주문번호로 연결한다\n\n**예외**\n\n* 조회 건수가 1만 건을 넘으면 \"건수가 많아 파일 수신으로 처리합니다.\" 표시하고 방식을 바꾼다\n* 외부 조회 실패 시 사유를 표시하고 조건 입력 상태로 되돌린다\n\n#### ADM-RECN-DIFF 대사 불일치\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 불일치 건을 유형별로 처리한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 우리에만, 상대에만, 금액 불일치, 매입 지연 |\n| 처리 상태 | 미처리, 처리 완료 |\n| 연결 Flow | FL-142 대사 불일치 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 없음 |\n| 열 | 선택, 순번, 주문번호, 유형, 우리 금액, 상대 금액, 처리 상태 |\n| 기본 정렬 | 등록 순 |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 건 선택 → 좌우 값을 나란히 표시\n2. 처리 기록 → 처리자와 시각, 사유를 남기고 목록을 갱신\n\n**조건**\n\n* 처리자와 사유를 남긴다\n* 매입 지연은 다음 대사로 이월한다\n\n**예외**\n\n* 매입 지연은 다음 대사로 이월하고 완료로 처리하지 않는다\n* 사유 없이 처리할 수 없다\n\n#### ADM-RECN-STOR 매장별 정산\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 매장별로 정산 진행 상태와 미정산 금액을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 미정산, 정산 완료 |\n| 연결 Flow | FL-148 매장별 정산 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 행사, 상권, 정산 상태, 매장명 |\n| 열 | 선택, 순번, 매장, 사업자번호, 거래 금액, 정산 금액, 미정산, 최종 지급일 |\n| 기본 정렬 | 최종 지급일 (최근이 위) |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 기간과 소속, 정산 상태로 매장를 조회한다\n2. 거래 금액, 정산 금액, 미정산 금액, 최종 지급일을 표시한다\n3. 내려받기 → 조회 조건 그대로 파일을 만든다\n\n**조건**\n\n* 결제대행사가 지급한 내역을 그대로 보여준다. 플랫폼이 정산금액을 계산하지 않는다\n* 거래 금액과 정산 금액의 차이는 결제대행사 수수료다. 차감 내역은 결제대행사 자료를 따른다\n* 미수령으로 마감한 주문은 취소가 아니므로 거래 금액에 들어간다\n\n**예외**\n\n* 하위가맹점 심사가 끝나지 않은 매장은 정산 대상에서 제외하고 사유를 표시한다\n* 지급일이 오지 않은 건은 미정산이 아니라 대기로 표시한다\n\n### 시스템\n\n#### ADM-USER-LIST 계정 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 계정과 담당 매장 범위를 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 활성, 잠금 |\n| 연결 Flow | FL-104 계정·권한 운영 · FL-136 계정 목록·등록 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 역할, 상태, 이메일·이름 |\n| 열 | 선택, 순번, 이메일, 이름, 역할, 담당 매장, 상태, 최근 접속 |\n| 기본 정렬 | 최근 접속 (최근이 위) |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 행 선택 → ADM-USER-FORM\n2. 대행 접속 → ADM-USER-PROXY\n3. 잠금 해제 → 사유를 입력받고 실패 횟수를 초기화한다\n4. 비밀번호 초기화 → 등록된 휴대폰번호로 새 초기 비밀번호를 보낸다\n\n**조건**\n\n* 잠긴 계정은 사유와 잠금 시각을 함께 표시한다\n\n**예외**\n\n* 조건에 맞는 계정이 없으면 빈 결과 화면을 표시한다\n* 잠금 해제와 비밀번호 초기화에 실패하면 실패 안내를 띄우고 목록 상태를 바꾸지 않는다\n\n#### ADM-USER-FORM 계정 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 가맹 관리자 계정을 발급하고 담당 매장을 지정한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-104 계정·권한 운영 · FL-136 계정 목록·등록 |\n\n**처리**\n\n1. 중복 확인 → 사용 가능 여부를 즉시 표시\n2. 저장 → 확인 팝업 후 목록으로 이동\n\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 이메일 | 필수 | 이메일 형식 | 로그인 아이디로 쓴다. 전체에서 중복할 수 없다. 등록한 뒤에는 바꿀 수 없다 |\n| 이름 | 필수 | 문자 20자 이내 | - |\n| 휴대폰번호 | 필수 | 숫자 10~11자리 | 형식이 맞아야 한다. 초기 비밀번호와 2차 인증에 쓴다 |\n| 역할 | 필수 | 선택 | 본사 운영자, 가맹 관리자 중 하나 |\n| 담당 범위 | 조건부 | 선택 | 가맹 관리자면 상권 하나를 반드시 고른다. 본사 운영자는 전체다 |\n| 이상 알림 수신 | 선택 | 토글 | 본사 운영자만 보인다. 켜면 단말 미연결 2단계 알림을 받는다 |\n| 초기 비밀번호 | 자동 | - | 저장 시 만들어 휴대폰번호로 보낸다. 첫 로그인에서 바꾸게 한다 |\n**조건**\n\n* 본사 계정은 이상 알림 수신 여부를 함께 지정한다. 수신으로 지정한 계정에만 단말 미연결 2단계 알림을 보낸다\n\n* 이메일 중복 시 저장할 수 없다\n* 역할과 데이터 범위를 따로 지정한다\n\n**예외**\n\n* 이메일이 겹치면 저장을 막는다\n* 이메일은 등록할 때만 입력한다. 수정 화면에서는 읽기 전용으로 둔다\n* 담당자가 바뀌면 계정을 사용 중지하고 새 계정을 발급한다. 이메일을 바꿔 쓰지 않는다\n* 역할과 담당 매장 범위는 따로 지정한다. 역할을 바꿔도 범위는 유지된다\n\n#### ADM-USER-PROXY 대행 접속\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 가맹 어드민 화면을 대신 본다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-104 계정·권한 운영 · FL-137 대행 접속 |\n\n**처리**\n\n1. 대상 계정과 담당 매장을 표시한다\n2. 대행 사유를 입력한다\n3. 접속 시작 → 확인 팝업 → 가맹 어드민을 새 탭으로 연다\n4. 조작자, 대상 계정, 시각, 사유를 접속기록에 남긴다\n5. 대행 중에는 화면 위에 대행 접속 중임을 띄운다\n\n**조건**\n\n* 실제 조작자와 대상 계정을 함께 기록한다\n* 조회만 하고 저장은 막는다\n\n**예외**\n\n* 사유 없이 접속할 수 없다\n* 대행 중에는 저장과 삭제 버튼을 비활성으로 표시한다\n\n#### ADM-APIK-LIST 연동 계정 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 외부 연동 계정을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 사용, 사용 중지 |\n| 상태값 | 사용 |\n| 연결 Flow | FL-140 연동 계정 · FL-501 메뉴 정보 제공 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 상태, 연동처 |\n| 열 | 선택, 순번, 연동처, 접근 키, 허용 매장, 상태, 마지막 사용 |\n| 기본 정렬 | 마지막 사용 (최근이 위) |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 행 선택 → ADM-APIK-FORM\n2. 사용 중지 → 확인 팝업 후 처리\n\n**조건**\n\n* 연동 계정은 본사 운영자만 만들고 사용 중지한다\n* 접근 키는 발급 시점에 한 번만 전체를 보여준다. 이후에는 앞 여덟 자리만 표시한다\n* 사용 중지한 계정의 키는 되살리지 않는다. 다시 쓰려면 새로 발급한다\n\n**예외**\n\n* 접근 키 전체를 목록에 표시하지 않는다\n* 연동 중인 계정을 중지하면 그 연동처의 조회가 즉시 막힌다. 확인 팝업에 연동처명을 함께 적는다\n\n#### ADM-APIK-FORM 연동 계정 등록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 접근 키를 발급하고 매장 범위를 지정한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-140 연동 계정 · FL-501 메뉴 정보 제공 |\n\n**처리**\n\n1. 저장 → 접근 키와 비밀 키를 발급해 한 번만 표시\n2. 복사 → 값을 클립보드에 넣고 토스트로 알린다\n\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 연동처명 | 필수 | 문자 30자 이내 | 전체에서 중복할 수 없다 |\n| 담당자 | 선택 | 문자 20자 이내 | - |\n| 연락처 | 필수 | 숫자 또는 이메일 | 장애 시 연락하는 곳이다 |\n| 허용 범위 | 필수 | 전체, 매장 지정 | 매장 지정이면 매장을 하나 이상 고른다 |\n| 접근 키·비밀 키 | 자동 | 저장 후 표시 | 비밀 키는 저장 직후 한 번만 보이고 다시 볼 수 없다. 잃으면 재발급한다 |\n**조건**\n\n* 비밀 키는 발급 시점에만 보여준다\n* 다시 조회할 수 없다\n\n**예외**\n\n* 비밀 키는 다시 조회할 수 없다. 화면을 벗어나면 재발급해야 한다\n\n#### ADM-ERRL-LIST 오류 로그\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 배치, 알림 발송, 외부 연동에서 발생한 오류를 한 곳에서 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 미확인, 확인 |\n| 연결 Flow | FL-149 오류 로그 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 유형, 확인 상태, 대상·내용 |\n| 열 | 선택, 순번, 발생, 유형, 대상, 내용, 상태, 동작 |\n| 기본 정렬 | 발생 (최근이 위) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 기간, 유형, 확인 상태로 오류를 조회한다\n2. 발생 시각, 유형, 대상, 내용을 표시한다\n3. 확인 → 확인자와 시각을 기록하고 기본 조회에서 뺀다\n\n**조건**\n\n* 유형은 배치, 알림 발송, 외부 연동 셋으로 나눈다\n* 확인 처리한 건은 기본 조회에서 제외한다. 조건을 바꾸면 다시 볼 수 있다\n* 같은 원인으로 반복 발생한 건은 묶어서 발생 횟수로 표시한다\n\n**예외**\n\n* 배치 오류는 재실행 경로를 함께 표시한다\n* 알림 발송 오류는 재발송 경로를 함께 표시한다\n\n#### ADM-BATC-LIST 배치 실행 이력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 배치 실행 결과를 확인하고 다시 실행한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 성공, 실패, 부분 실패 |\n| 연결 Flow | FL-143 배치 실행 이력 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 배치 종류 |\n| 열 | 선택, 순번, 배치명, 실행 시각, 대상, 처리, 결과, 동작 |\n| 기본 정렬 | 실행 시각 (최근이 위) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 재실행 → 대상 범위를 확인 팝업에 표시한 뒤 실행\n2. 처리 내역 보기 → 건별 결과를 레이어로 표시\n\n**조건**\n\n* 다시 실행할 때 이미 처리한 건은 건너뛴다\n\n**예외**\n\n* 재실행 시 이미 처리한 건은 건너뛴다\n* 실행 중인 배치는 재실행 버튼을 비활성으로 둔다\n* 미수령 마감은 매장마다 영업 종료 한 시간 뒤에 돌므로 실행 시각이 매장별로 다르다\n\n#### ADM-ALOG-LIST 접속기록 조회\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 접속과 처리 내역을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-104 계정·권한 운영 · FL-138 접속기록 조회 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 수행업무, 계정 |\n| 열 | 선택, 순번, 시각, 계정, 접속지, 수행업무, 대상 |\n| 기본 정렬 | 시각 (최근이 위) |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 기간, 계정, 수행업무로 조회한다\n2. 시각, 계정, 접속지, 수행업무, 대상을 표시한다\n3. 내려받기 → 조회 조건 그대로 파일을 만든다\n4. 점검 확인 → 월 1회 점검을 기록한다\n\n**조건**\n\n* 1년 이상 보관하고 월 1회 점검한다\n\n**예외**\n\n* 대행 접속은 조작자와 대상 계정을 함께 표시한다\n* 보관 기간이 지난 기록은 조회되지 않는다\n\n#### ADM-ULOG-LIST 계정 변경 이력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 권한과 담당 범위 변경 내역을 조회한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-144 계정 변경 이력 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 변경 항목, 대상 계정 |\n| 열 | 선택, 순번, 시각, 처리자, 대상, 항목, 이전 → 이후 |\n| 기본 정렬 | 시각 (최근이 위) |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 점검 확인 → 점검자와 시각을 기록\n2. 내려받기 → 조회 조건 그대로 파일 생성\n\n**조건**\n\n* 변경 전후 값을 보관한다\n* 권한 상향 건은 점검 대상으로 분류한다\n\n**예외**\n\n* 권한이 올라간 변경은 표시로 구분하고 점검 대상으로 분류한다\n\n#### ADM-PRIV-LIST 개인정보 파기 이력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 보유 기간이 지난 개인정보의 파기 결과를 확인한다 |\n| 대상 | 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 성공 |\n| 연결 Flow | FL-145 개인정보 파기 이력 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일 |\n| 열 | 선택, 순번, 실행 시각, 대상 건수, 파기 건수, 파기 항목, 결과 |\n| 기본 정렬 | 실행 시각 (최근이 위) |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 파기 기준과 다음 실행 시각을 위에 표시한다\n2. 기간으로 실행 이력을 조회한다\n3. 실행 시각, 대상 건수, 파기 건수, 파기 항목, 결과를 표시한다\n4. 부분 실패 건 선택 → 실패 사유와 남은 대상을 표시한다\n\n**조건**\n\n* 일 배치로 실행한다\n* 주문번호와 금액은 남기고 개인 식별 항목만 지운다\n\n**예외**\n\n* 파기 대상이 없어도 실행 기록은 남긴다\n* 다른 법령에 따라 보존해야 하는 정보는 분리 보관하고 파기 대상에서 제외한다\n\n## 2. 가맹 어드민\n\n### 인증\n\n#### STR-AUTH-LOGIN 로그인\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 이메일과 비밀번호로 인증한다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매장 운영 · FL-210 로그인 · FL-908 로그인 실패 |\n\n**처리**\n\n1. 로그인 → 성공 시 STR-AUTH-OTP\n2. 비밀번호 재설정 → STR-AUTH-RESET\n\n**조건**\n\n* 실패 5회 시 계정을 잠근다\n* 회원가입 경로를 두지 않는다\n\n**예외**\n\n* 회원가입 경로를 두지 않는다. 계정은 본사가 발급한다\n* 연속 5회 실패 시 계정을 잠근다. 비밀번호 재설정을 마치면 자동으로 풀린다\n* 재설정 경로까지 막힌 경우 본사가 계정 목록에서 푼다\n\n#### STR-AUTH-OTP 2차 인증\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록 단말로 인증번호를 확인한다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매장 운영 · FL-211 2차 인증·매장 선택 |\n\n**처리**\n\n1. 인증하기 → 담당 매장이 둘 이상이면 STR-STOR-PICK, 하나면 STR-HOME-MAIN\n2. 유효시간이 끝나면 버튼을 재발급으로 바꾸고 입력칸을 비활성으로 둔다\n3. 재발급 → 새 인증번호를 보내고 남은 시간을 초기화한다\n4. 다른 계정으로 로그인하기 → 진행 중이던 인증을 버리고 로그인 화면으로 돌아간다\n\n**조건**\n\n* 인증번호 유효시간 3분\n\n**예외**\n\n* 유효시간 3분 경과 시 시간 초과를 안내한다\n* 등록 단말이 없으면 등록 안내를 표시하고 진행을 막는다\n\n#### STR-AUTH-RESET 비밀번호 재설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록된 휴대폰번호로 본인을 확인하고 비밀번호를 바꾼다 |\n| 대상 | 전체 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-229 비밀번호 재설정 |\n\n**처리**\n\n1. 이메일과 휴대폰번호를 입력한다\n2. 인증번호 받기 → 등록된 번호로 6자리를 보낸다\n3. 인증번호를 입력해 본인을 확인한다\n4. 새 비밀번호를 두 번 입력한다\n5. 변경 → 잠긴 계정이면 함께 푼다 → 로그인으로 이동\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 이메일 | 필수 | 이메일 형식 | 등록된 계정이어야 한다. 없어도 같은 안내를 내어 계정 존재 여부를 노출하지 않는다 |\n| 휴대폰번호 | 필수 | 숫자 10~11자리 | 계정에 등록된 번호와 같아야 한다 |\n| 인증번호 | 필수 | 숫자 6자리 | 유효시간 3분. 5회 틀리면 10분간 재시도를 막는다 |\n| 새 비밀번호 | 필수 | 10자 이상, 영문·숫자·특수문자 조합 | 직전 비밀번호와 같을 수 없다 |\n| 다시 입력 | 필수 | 새 비밀번호와 같은 값 | 같아야 한다 |\n**조건**\n\n* 직전 비밀번호를 다시 쓸 수 없다\n* 실패 횟수 초과 시 일정 시간 차단한다\n\n**예외**\n\n* 등록 정보와 다르면 어느 항목이 틀렸는지 밝히지 않고 확인을 요청한다\n* 작성 규칙에 맞지 않거나 직전 비밀번호와 같으면 해당 항목에 표시하고 저장을 막는다\n* 실패 횟수를 넘기면 일정 시간 차단하고 본사 문의를 안내한다\n\n#### STR-STOR-PICK 매장 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담당 매장 중 작업할 매장을 고른다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매장 운영 · FL-211 2차 인증·매장 선택 |\n\n**처리**\n\n1. 매장 선택 → STR-HOME-MAIN\n2. 상단에 선택한 매장을 계속 표시하고 다른 매장으로 바꿀 수 있게 한다\n\n**조건**\n\n* 담당 매장이 하나면 건너뛴다\n\n**예외**\n\n* 담당 매장이 하나면 이 화면을 건너뛴다\n* 영업 종료와 폐점 매장은 선택할 수 없다\n\n### 매장 홈\n\n#### STR-HOME-MAIN 매장 홈\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 접수 대기 건수와 오늘 매출을 표시한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매장 운영 · FL-212 매장 홈 |\n\n**처리**\n\n1. 접수 → 주문 상태를 접수 완료로 바꾸고 주문서를 출력한다\n2. 거절 → 사유를 고르고 결제 취소를 요청한다\n3. 지표 선택 → 해당 목록으로 이동\n\n**조건**\n\n* 접수 대기가 있으면 소리로 알린다\n\n**예외**\n\n* 접수 대기가 생기면 소리로 알린다\n* 5분 안에 응답하지 않으면 자동 취소하고 목록에서 뺀다\n* 단말 오류가 있으면 알림 영역에 사유와 시각을 표시한다\n* 개설 준비 매장은 주문 영역 대신 개시 전 준비 항목과 심사 상태를 표시한다. 영업 상태 변경 버튼을 두지 않는다\n\n### 주문\n\n#### STR-ORDR-LIST 주문 접수 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 들어온 주문을 수락하고 상태를 바꾼다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 상태값 | 접수 대기, 접수 완료, 조리 중, 조리 완료, 취소 |\n| 상태값 | 접수 대기, 접수 완료, 조리 중, 조리 완료 |\n| 연결 Flow | FL-203 주문 접수 · FL-213 주문 접수 목록 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 채널, 주문번호 |\n| 열 | 선택, 순번, 순번, 주문번호, 시각, 채널, 금액, 상태, 동작 |\n| 기본 정렬 | 순번 (최근이 위) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 접수 → STR-ORDR-ACPT\n2. 거절 → STR-ORDR-RJCT\n3. 취소 → 접수 완료 상태에서만 가능. 남은 시간을 함께 표시\n4. 조리 완료 → 고객 호출을 발송\n\n**조건**\n\n* 접수 대기 행에 남은 시간을 표시한다. 5분에서 줄어들고 1분 남으면 붉게 바꾼다\n* 접수 완료 행에는 매장이 고른 준비 시간을 표시한다\n* 접수 완료 후 1분이 지나면 조리 중으로 자동 전환되어 취소할 수 없다\n\n**예외**\n\n* 5분 안에 응답하지 않으면 자동 취소하고 사유를 미응답으로 남긴다\n* 접수 완료 후 1분이 지나면 조리 중으로 자동 전환되고 취소 버튼이 사라진다\n* 조리 중부터는 취소할 수 없다\n* 조리 완료 뒤 고객이 오지 않으면 영업 종료 한 시간 뒤 배치가 미수령으로 마감한다\n\n#### STR-ORDR-DETAIL 주문 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문 항목과 결제 내역을 확인한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-203 주문 접수 · FL-214 주문 상세 · FL-903 매장 미접수 |\n\n**처리**\n\n1. 상태 변경 → 확인 팝업 후 처리하고 결과를 토스트로 알린다\n2. 주문서 → STR-ORDR-PRNT\n\n**조건**\n\n* 취소는 접수 대기와 접수 완료에서만 할 수 있다\n* 조리 중 이후에는 취소 버튼을 노출하지 않는다\n\n**예외**\n\n* 취소는 접수 대기와 접수 완료에서만 노출한다\n* 개인정보 파기가 끝난 과거 주문은 주문자 정보를 비우고 표시한다\n#### STR-ORDR-ACPT 주문 접수\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 준비 시간을 고르고 주문을 접수한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-203 주문 접수 · FL-213 주문 접수 목록 |\n\n**처리**\n\n1. 주문번호와 순번, 금액을 표시한다\n2. 준비 시간을 고른다\n3. 접수 → 주문 상태를 접수 완료로 바꾸고 고객에게 준비 시간을 알린다\n4. 주문서 출력을 요청한다\n\n**조건**\n\n* 준비 시간은 5, 10, 15, 20, 30분에서 고른다\n* 기본값은 매장 정보의 기본 준비 시간이다\n* 접수 대기 상태에서만 열 수 있다. 5분이 지난 주문은 이미 취소되어 열리지 않는다\n\n**예외**\n\n* 여는 사이에 자동 취소되면 \"이미 취소된 주문입니다.\"를 표시하고 목록을 갱신한다\n* 접수에 실패하면 실패 안내를 띄우고 주문 상태를 바꾸지 않는다\n\n#### STR-ORDR-RJCT 주문 거절\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 거절 사유를 고르고 주문과 결제를 취소한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-203 주문 접수 · FL-213 주문 접수 목록 · FL-903 매장 미접수 |\n\n**처리**\n\n1. 주문번호와 순번, 금액을 표시한다\n2. 거절 사유를 고른다\n3. 사유가 품절이나 재료 소진이면 그 메뉴를 품절로 바꿀지 함께 묻는다\n4. 거절 → 주문을 취소하고 결제 전액 취소를 요청한다\n5. 고객에게 사유를 문구로 바꿔 알린다\n\n**조건**\n\n* 사유는 품절, 재료 소진, 마감, 기타 넷이다\n* 기타를 고르면 사유를 입력받는다\n* 사유는 매장별 통계로 본사가 조회한다\n* 접수 대기와 접수 완료에서만 거절할 수 있다\n\n**예외**\n\n* 사유를 고르지 않으면 칸 아래에 \"거절 사유를 선택해 주세요.\"를 표시한다\n* 결제 취소에 실패하면 취소 대기로 기록하고 재시도한다. 주문은 취소로 둔다\n* 마감을 고르면 영업 상태를 일시중지로 바꿀지 함께 묻는다\n\n#### STR-ORDR-PRNT 주문서 재출력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문서를 다시 출력한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-203 주문 접수 · FL-215 주문서 재출력 |\n\n**처리**\n\n1. 출력할 주문서 종류를 고른다 (주방용, 고객용)\n2. 출력 → 매장 프린터로 보낸다\n3. 출력 실패 → 사유를 표시하고 다시 시도할 수 있게 한다\n4. 닫기 → 주문 상세로 돌아간다\n\n**조건**\n\n* 출력 실패는 화면에 표시하고 주문 처리는 계속한다\n\n**예외**\n\n* 프린터가 연결되지 않으면 출력 버튼을 비활성으로 두고 사유를 표시한다\n* 출력에 실패해도 주문 처리는 계속한다\n\n### 매장 정보\n\n#### STR-INFO-DETAIL 매장 정보\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록된 매장 정보를 확인한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매장 운영 · FL-216 매장 정보 |\n\n**처리**\n\n1. 매장명, 소속 행사, 상권(브랜드), 지점번호, 영업시간, 주문 채널, 기본 준비 시간, 영업 상태를 표시한다\n2. 사업자 정보와 정산계좌를 가려서 표시한다\n3. 최근 변경 이력을 표시한다\n4. 정보 변경 → STR-INFO-FORM\n5. 영업 상태 변경 → STR-OPEN-STATE\n\n**조건**\n\n* 이 화면에서는 조회만 한다. 값은 정보 변경 화면에서 바꾼다\n* 소속 행사, 상권(브랜드), 지점번호, 주문 채널, 기본 준비 시간, 영업 상태를 표시한다\n* 정산계좌와 사업자등록번호는 가려서 표시한다\n\n**예외**\n\n* 바꾼 값이 아직 반영되지 않은 경우는 없다. 저장하면 바로 반영한다\n* 변경 이력은 본사의 상권 상세 히스토리 탭에서 본다\n\n#### STR-INFO-FORM 매장 정보 변경\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 영업시간, 대표 연락처, 기본 준비 시간, 정산계좌를 바꾼다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-201 매장 운영 · FL-217 매장 정보 변경 변경 |\n\n**처리**\n\n1. 바꿀 항목을 체크하고 현재 값 아래에 바꿀 값을 입력한다\n2. 정산계좌를 바꾸면 통장 사본을 첨부한다\n3. 변경 사유를 입력한다\n4. 저장 → 확인 팝업 → 즉시 반영 → 항목마다 변경 전·후와 사유를 이력에 남긴다\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 바꿀 항목 | 필수 | 체크 | 영업시간, 대표 연락처, 기본 준비 시간, 정산계좌 중 하나 이상 |\n| 영업 시작·종료 | 조건부 | 시각 | 종료가 시작보다 늦어야 한다 |\n| 대표 연락처 | 조건부 | 숫자 10~11자리 | 형식이 맞아야 한다 |\n| 기본 준비 시간 | 조건부 | 5, 10, 15, 20, 30분 | 결제 전 고객 안내에 쓴다 |\n| 은행·계좌번호 | 조건부 | 선택, 숫자 | 예금주가 사업자 대표와 같아야 한다. 통장 사본을 첨부한다 |\n| 변경 사유 | 필수 | 문자 100자 이내 | 이력에 남긴다 |\n**조건**\n\n* 저장 전까지 기존 값을 유지한다\n\n**예외**\n\n* 사유 없이 변경할 수 없다\n* 같은 항목의 대기 중 변경이 있으면 새 변경을 막고 기존 변경을 보게 한다\n* 정산계좌 변경은 첨부 없이 변경할 수 없다\n\n#### STR-OPEN-STATE 영업 상태 변경\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 영업을 일시중지하고 재개한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 상태값 | 영업, 일시중지 |\n| 연결 Flow | FL-201 매장 운영 · FL-218 영업 상태 변경 |\n\n**입력 항목**\n\n| 항목 | 필수 | 설명 |\n| --- | --- | --- |\n| 영업 상태 | 필수 | 토글로 영업과 일시중지를 바꾼다 |\n| 재개 시각 | 일시중지일 때 필수 | 지난 시각을 고를 수 없다 |\n| 사유 | 필수 | 재료 소진, 단말 고장, 휴식, 기타 중에서 고른다 |\n\n**처리**\n\n1. 영업 상태 토글을 끈다\n2. 재개 시각과 사유를 입력한다\n3. 변경 → 확인 팝업 → 주문 채널에서 매장을 뺀다\n4. 재개 시각이 되면 자동으로 영업으로 돌린다. 토글을 켜면 즉시 재개한다\n\n**조건**\n\n* 일시중지 시 재개 시각을 입력한다\n* 중지 중에는 주문을 받지 않는다\n* 개설 준비 매장은 이 화면을 열 수 없다. 본사가 개시를 확정해야 영업 상태를 다룬다\n\n**예외**\n\n* 일시중지는 재개 시각 없이 저장할 수 없다\n* 재개 시각이 지나면 자동으로 영업으로 돌아간다\n* 진행 중 주문은 취소되지 않는다\n\n### 메뉴 관리\n\n#### STR-MENU-LIST 메뉴 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록한 메뉴를 조회하고 노출을 관리한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 상태값 | 판매중, 품절, 미노출, 판매 불가 |\n| 표시 정보 상태 | 완료, 미비 |\n| 연결 Flow | FL-202 품절 처리 · FL-219 메뉴 목록 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 카테고리, 검색어 |\n| 열 | 선택, 순번, 메뉴명, 카테고리, 판매가, 표시 정보, 상태, 동작 |\n| 기본 정렬 | 메뉴명 (오름차순) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 수정 → STR-MENU-FORM\n2. 일괄 처리 → 확인 팝업에 대상 건수를 적고 처리\n\n**조건**\n\n* 표시 정보가 없는 메뉴는 판매 불가로 둔다\n\n**예외**\n\n* 표시 정보가 없는 메뉴는 판매 불가로 두고 목록에서 구분해 표시한다\n* 필수 표시 항목이 비어 있는 메뉴는 판매 불가로 표시하고 사유를 함께 적는다\n\n#### STR-MENU-FORM 메뉴 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 메뉴명, 판매가, 이미지, 판매 시간을 등록한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-204 알레르기 정보 등록 · FL-223 메뉴 등록·수정 |\n\n**처리**\n\n1. 저장 → 확인 팝업 후 목록으로 이동\n2. 입력하기 → STR-MENU-ALGN 또는 STR-MENU-ORIG\n\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 메뉴명 | 필수 | 문자 40자 이내 | 같은 매장 안에서 중복할 수 없다 |\n| 카테고리 | 필수 | 선택 | 이 매장의 카테고리 중 하나 |\n| 판매가 | 필수 | 숫자 | 0원보다 커야 한다 |\n| 정렬 순서 | 선택 | 숫자 | 비우면 맨 뒤에 둔다 |\n| 이미지 | 선택 | 1:1 이미지, 2MB 이내 | 없으면 기본 이미지를 쓴다 |\n| 설명 | 선택 | 문자 200자 이내 | - |\n| 판매 시간 | 필수 | 영업시간과 동일, 판매 시간 지정 | 지정이면 시작·종료를 입력한다 |\n| 옵션 그룹 | 선택 | 연결 | 이 매장의 옵션 그룹에서 고른다 |\n| 표시 정보 | 필수 | 알레르기·영양성분, 원산지 | 둘 다 있어야 판매 가능이다. 없으면 저장은 되고 판매 불가로 둔다 |\n**조건**\n\n* 표시 정보 미입력 시 저장은 되고 판매 불가로 둔다\n\n**예외**\n\n* 판매가를 0원 이하로 저장할 수 없다\n* 표시 정보가 없어도 저장은 되지만 판매 불가 상태로 둔다\n* 옵션이 알레르기 유발물질을 바꾸면 STR-MENU-COPY를 안내한다\n\n#### STR-MENU-ALGN 알레르기·영양성분 입력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 법정 18개 품목과 영양성분 5종을 입력한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-204 알레르기 정보 등록 · FL-224 알레르기·영양성분 입력 |\n\n**처리**\n\n1. 법정 18종 중 해당 유발물질을 체크한다. 없으면 해당 없음을 고른다\n2. 기준량을 고른다\n3. 영양성분 5종을 입력한다\n4. 저장 → 메뉴의 표시 정보 상태를 갱신한다 → 원산지도 있으면 판매 가능으로 바꾼다\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 알레르기 유발물질 | 필수 | 법정 18종 체크, 해당 없음 | 하나도 고르지 않으면 저장할 수 없다. 해당 없음도 선택이다 |\n| 기준량 | 필수 | 1회 제공량, 100g, 100ml | - |\n| 열량 | 필수 | 숫자 kcal | 0 이상 |\n| 당류 | 필수 | 숫자 g | 0 이상 |\n| 단백질 | 필수 | 숫자 g | 0 이상 |\n| 포화지방 | 필수 | 숫자 g | 0 이상 |\n| 나트륨 | 필수 | 숫자 mg | 0 이상 |\n**조건**\n\n* 의무 대상 여부와 무관하게 필수 입력한다\n\n**예외**\n\n* 아무것도 고르지 않으면 저장할 수 없다. 없으면 해당 없음을 골라야 한다\n* 영양성분 항목이 비면 해당 항목에 표시하고 저장을 막는다\n\n#### STR-MENU-ORIG 원산지 입력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 표시 대상 품목의 원산지를 입력한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-225 원산지 입력 |\n\n**처리**\n\n1. 메뉴에 쓰는 표시 대상 품목을 체크한다\n2. 품목마다 원산지를 고른다. 쇠고기는 종류를 함께 고른다\n3. 표시 문구 미리보기를 확인한다\n4. 저장 → 메뉴의 표시 정보 상태를 갱신한다 → 알레르기도 있으면 판매 가능으로 바꾼다\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 표시 대상 품목 | 필수 | 30품목 중 체크 | 메뉴에 쓰는 재료를 고른다. 하나도 없으면 해당 없음을 고른다 |\n| 품목별 원산지 | 필수 | 선택 | 고른 품목마다 원산지를 채워야 저장할 수 있다 |\n| 쇠고기 종류 | 조건부 | 한우, 육우, 젖소 | 쇠고기를 고르면 함께 고른다 |\n**조건**\n\n* 표시 대상 30품목은 필수 입력한다\n\n**예외**\n\n* 표시 대상 품목을 쓰는데 원산지를 비우면 저장할 수 없다\n* 쇠고기는 식육 종류를 함께 받는다\n\n#### STR-MENU-COPY 상품 복제\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 옵션 조합별로 메뉴를 나눈다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-204 알레르기 정보 등록 · FL-226 상품 복제 |\n\n**처리**\n\n1. 원 메뉴와 복제 기준 옵션 그룹을 표시한다\n2. 기준 옵션 항목마다 새 메뉴명을 확인한다\n3. 저장 → 옵션 항목 수만큼 메뉴를 만든다 → 표시 정보는 비운 채 판매 불가로 둔다\n4. 복제 관계를 기록한다. 원 메뉴를 바꿔도 복제본은 따라가지 않는다\n\n**조건**\n\n* 옵션이 알레르기 유발물질을 바꾸는 경우에만 쓴다\n* 복제 관계를 기록한다\n\n**예외**\n\n* 복제본의 알레르기를 입력하기 전에는 모두 판매 불가로 둔다\n* 옵션이 알레르기 유발물질을 바꾸지 않으면 이 화면을 쓰지 않는다\n\n#### STR-MENU-IMPT 메뉴 가져오기\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 이전 매장이나 같은 브랜드 매장의 메뉴를 복사한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-230 메뉴 가져오기 |\n\n**처리**\n\n1. 가져올 매장을 고른다 (이전 매장, 같은 브랜드 매장)\n2. 가져올 범위를 체크한다 (카테고리, 메뉴와 옵션, 알레르기와 원산지)\n3. 이름이 같은 메뉴의 처리 방식을 고른다\n4. 가져오기 → 확인 팝업 → 건수를 토스트로 알린다 → 판매가 없는 메뉴는 판매 불가로 둔다\n\n**조건**\n\n* 판매가는 복사하지 않는다\n* 미입력 메뉴는 판매 불가로 저장한다\n\n**예외**\n\n* 판매가는 복사하지 않는다. 입력 전까지 판매 불가로 저장한다\n* 가져올 대상 매장이 없으면 \"가져올 매장이 없습니다.\" 표시하고 진행을 막는다\n\n#### STR-CATG-LIST 카테고리 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카테고리와 정렬 순서를 관리한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 상태값 | 미노출 |\n| 연결 Flow | FL-101 매장 개설 · FL-222 카테고리 목록·등록 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 없음 |\n| 열 | 선택, 순번, 순서, 카테고리명, 메뉴 수, 노출, 동작 |\n| 기본 정렬 | 순서 (오름차순) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 순서 변경 → 끌어 놓으면 바로 저장하고 토스트로 알린다\n2. 수정 → STR-CATG-FORM\n\n**조건**\n\n* 메뉴가 있는 카테고리는 삭제할 수 없다\n\n**예외**\n\n* 메뉴가 있는 카테고리는 삭제할 수 없다. 삭제 버튼을 비활성으로 두고 사유를 표시한다\n\n#### STR-CATG-FORM 카테고리 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카테고리명과 순서를 등록한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-222 카테고리 목록·등록 |\n\n**입력 항목**\n\n| 항목 | 필수 | 설명 |\n| --- | --- | --- |\n| 카테고리명 | 필수 | 같은 브랜드 안에서 중복할 수 없다 |\n| 노출 | 필수 | 토글로 켜고 끈다. 기본값은 노출이다 |\n| 정렬 순서 | 선택 | 비우면 마지막에 붙인다 |\n\n**처리**\n\n1. 카테고리명을 입력한다\n2. 노출 토글과 정렬 순서를 정한다\n3. 저장 → 같은 매장 안 중복을 확인한다 → 목록을 갱신한다\n\n**조건**\n\n* 같은 매장 안에서 이름이 겹칠 수 없다\n\n**예외**\n\n* 같은 매장 안에서 이름이 겹치면 저장을 막는다\n\n#### STR-OPTG-LIST 옵션 그룹 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 옵션 그룹을 조회한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-101 매장 개설 · FL-227 옵션 그룹 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 없음 |\n| 열 | 선택, 순번, 그룹명, 필수, 선택 수, 항목 수, 연결 메뉴, 동작 |\n| 기본 정렬 | 그룹명 (오름차순) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 수정 → STR-OPTG-FORM\n2. 연결 메뉴 수 선택 → 연결된 메뉴 목록을 레이어로 표시\n\n**조건**\n\n* 메뉴에 연결된 그룹은 삭제할 수 없다\n\n**예외**\n\n* 메뉴에 연결된 그룹은 삭제할 수 없다. 사유를 표시한다\n\n#### STR-OPTG-FORM 옵션 그룹 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 선택지와 필수 여부, 선택 수를 등록한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-227 옵션 그룹 |\n\n**처리**\n\n1. 항목 추가 → 행을 늘린다\n2. 저장 → 확인 팝업 후 목록으로 이동\n\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 그룹명 | 필수 | 문자 30자 이내 | 같은 매장 안에서 중복할 수 없다 |\n| 선택 방식 | 필수 | 필수, 선택 | - |\n| 최소·최대 선택 수 | 조건부 | 숫자 | 선택 방식이 선택일 때 쓴다. 최소는 최대를 넘을 수 없다 |\n| 옵션 항목 | 필수 | 항목명, 추가금, 품절 | 하나 이상. 추가금은 0 이상. 항목명은 그룹 안에서 중복할 수 없다 |\n**조건**\n\n* 최소 선택 수는 최대 선택 수를 넘을 수 없다\n\n**예외**\n\n* 최소 선택 수가 최대 선택 수보다 크면 저장을 막는다\n* 필수 그룹인데 항목이 하나도 없으면 저장을 막는다\n\n#### STR-PRIC-FORM 판매가 설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 메뉴별 판매가를 정한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-101 매장 개설 · FL-228 매장별 가격 |\n\n**입력 항목**\n\n| 항목 | 필수 | 설명 |\n| --- | --- | --- |\n| 카테고리 | 선택 | 고르면 그 카테고리의 메뉴만 표에 남는다 |\n| 바꿀 판매가 | 선택 | 비우면 현재 판매가를 그대로 둔다 |\n\n**처리**\n\n1. 카테고리로 메뉴를 좁힌다\n2. 메뉴마다 판매가를 입력한다. 미입력은 판매 불가 표시가 붙는다\n3. 저장 → 0원 이하가 있으면 그 행에 오류를 표시한다 → 반영된 메뉴는 주문 채널에 바로 나온다\n\n**조건**\n\n* 0원 이하로 저장할 수 없다\n\n**예외**\n\n* 0원 이하는 저장할 수 없다\n* 판매가가 없는 메뉴는 판매 불가로 둔다\n* 영업 중 변경 시 진행 중 주문이 있으면 경고를 표시한다\n\n#### STR-SOUT-FORM 품절 설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 메뉴 판매를 멈추고 재개 시각을 지정한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 상태값 | 판매중, 품절 |\n| 연결 Flow | FL-202 품절 처리 · FL-220 품절 설정 |\n\n**처리**\n\n1. 대상 메뉴를 표시한다\n2. 처리(품절, 판매 재개)를 고른다\n3. 품절이면 재개 시각을 입력한다. 비우면 수동 해제까지 유지한다\n4. 적용 → 주문 채널 목록에서 즉시 빼거나 되돌린다\n\n**조건**\n\n* 재개 시각을 비우면 수동 해제까지 유지한다\n* 품절 메뉴는 주문 채널 목록에서 제외한다\n\n**예외**\n\n* 재개 시각이 지나면 자동으로 판매중으로 돌아간다\n* 키오스크에서 바꾼 값과 겹치면 마지막 값을 적용하고 처리자를 기록한다\n#### STR-NOTI-LIST 알림 발송 이력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 알림 발송 결과를 확인하고 다시 보낸다 |\n| 대상 | 가맹 관리자, 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 성공, 실패, 대체 발송 |\n| 연결 Flow | FL-231 알림 발송 이력 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일, 결과, 주문번호 |\n| 열 | 선택, 순번, 시각, 주문번호, 경로, 수신번호, 결과, 동작 |\n| 기본 정렬 | 시각 (최근이 위) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 재발송 → 경로를 고르고 발송한다. 기록에 재발송으로 남는다\n2. 주문번호 선택 → STR-ORDR-DETAIL\n\n**조건**\n\n* 매장은 담당 매장, 본사는 전체를 본다\n* 재발송은 발송 기록에 재발송으로 남긴다\n\n**예외**\n\n* 수신번호는 가려서 표시한다\n* 알림톡 실패 시 문자로 대체 발송한 기록을 함께 보여준다\n\n### 설정\n\n#### STR-STOR-LIST 매장 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담당 상권의 매장을 조회하고 폐점 처리한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 상태값 | 개설 준비, 영업, 일시중지, 폐점 |\n| 연결 Flow | FL-201 매장 운영 · FL-234 매장 등록·관리 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 소속 행사, 상태, 매장명 |\n| 열 | 선택, 순번, 지점번호, 매장명, 소속 행사, 상태, 주문 채널, 등록일, 동작 |\n| 기본 정렬 | 등록일 (최근이 위) |\n| 행 동작 | 동작 열에 둔다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 매장 등록 → STR-STOR-FORM\n2. 수정 → STR-STOR-FORM (수정)\n3. 폐점 → 확인 팝업에 진행 중 주문 수와 연결 단말 수를 적은 뒤 처리\n\n**조건**\n\n* 담당 상권의 매장만 본다. 다른 상권은 조회할 수 없다\n* 등록하면 개설 준비다. 본사가 하위가맹점 심사 결과로 개시를 확정해야 영업이 된다\n* 개설 준비 매장은 주문 채널에 나오지 않고 정산에 들어가지 않는다. 메뉴와 단말은 미리 갖출 수 있다\n* 지점번호는 브랜드 안에서 1부터 자동으로 붙는다. 사람이 입력하지 않는다\n* 폐점은 되돌릴 수 없다. 폐점한 지점번호는 다시 쓰지 않는다\n* 폐점하면 연결된 단말은 사용 중지로 바뀌고 주문 채널에서 빠진다\n\n**예외**\n\n* 진행 중 주문이 있으면 폐점할 수 없다. \"진행 중인 주문 N건을 먼저 처리해 주세요.\"를 표시한다\n* 조회 결과가 없으면 빈 결과 화면에 매장 등록을 안내한다\n\n#### STR-STOR-FORM 매장 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 매장을 만들고 소속 행사와 영업 정보를 정한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-234 매장 등록·관리 |\n\n**처리**\n\n1. 브랜드는 담당 상권의 것으로 고정해 표시한다\n2. 소속 행사, 위치, 영업시간, 대표 연락처, 기본 준비 시간, 주문 채널을 입력한다\n3. 위치 선택 → ADM-ADDR-FIND\n4. 저장 → 지점번호를 부여하고 매장명을 만든다 → 확인 팝업 → 목록 갱신\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 소속 행사 | 필수 | 선택 | 상권의 참여 행사 중 진행 전·진행 중인 것만 고른다 |\n| 위치 | 필수 | 주소 | 주소 검색으로만 입력한다 |\n| 영업 시작·종료 | 필수 | 시각 | 종료가 시작보다 늦어야 한다 |\n| 대표 연락처 | 필수 | 숫자 10~11자리 | 형식이 맞아야 한다 |\n| 기본 준비 시간 | 필수 | 5, 10, 15, 20, 30분 | 기본값 10분. 결제 전 고객 안내에 쓴다 |\n| 주문 채널 | 필수 | 웹앱, 키오스크 중 하나 이상 | 하나도 고르지 않으면 저장할 수 없다 |\n| 관리자 메모 | 선택 | 문자 200자 이내 | - |\n\n**조건**\n\n* 매장명은 브랜드명과 지점번호로 만든다. 따로 입력받지 않는다\n* 정산계좌와 사업자 정보는 상권의 것을 그대로 쓴다. 매장 정보 변경에서 매장별로 바꿀 수 있다\n* 개설 준비 동안은 소속 행사를 바꿀 수 있다. 개시가 확정되면 읽기 전용으로 둔다\n* 소속 행사를 고르면 그 행사가 끝날 때까지 상권은 그 행사를 뗄 수 없다\n\n**예외**\n\n* 상권에 참여 행사가 없으면 \"상권에 참여 행사가 없습니다. 본사에 요청해 주세요.\"를 표시하고 저장할 수 없다\n* 저장에 실패하면 실패 안내를 띄우고 입력값을 유지한다\n\n#### STR-DEVC-LIST 단말 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 등록한 단말의 상태와 마지막 통신 시각을 확인한다 |\n| 대상 | 가맹 관리자, 본사 운영자 |\n| 유형 | 페이지 |\n| 상태값 | 연결, 연결 끊김, 사용 중지 |\n| 연결 Flow | FL-232 단말 목록 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 종류, 상태, 행사, 상권, 매장 |\n| 열 | 선택, 순번, 단말명, 종류, 설치 위치, 상태, 마지막 통신 |\n| 기본 정렬 | 마지막 통신 (최근이 위) |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 등록과 수정 → 매장만 할 수 있다. 본사 접속 시 버튼을 두지 않는다\n2. 사용 중지 → 양쪽 다 할 수 있다. 사유를 받고 처리한다\n3. 사용 재개 → 자기가 중지한 단말만 고를 수 있다\n\n**조건**\n\n* 매장은 담당 매장, 본사는 전체를 본다\n* 등록과 수정, 삭제는 매장만 한다\n* 사용 중지는 양쪽 다 하고 중지한 쪽이 재개한다\n\n**예외**\n\n* 연결 끊김 단말은 경과 시간을 함께 표시한다\n* 폐점한 매장의 단말은 사용 중지로 바뀌고 재개할 수 없다. 목록에는 폐점 매장 표시를 붙인다\n* 본사가 중지하면 매장에 통지하고, 매장은 재개할 수 없다\n* 본사 접속 시 조작자와 대상 매장을 함께 기록한다\n\n#### STR-DEVC-FORM 단말 등록·수정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 단말 종류와 설치 위치를 등록한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-233 단말 연결 |\n\n**처리**\n\n1. 종류를 고른다\n2. 단말명과 설치 위치, 비고를 입력한다\n3. 다음 → 저장하고 STR-DEVC-PAIR로 간다\n4. 수정에서는 종류를 바꿀 수 없다\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 종류 | 필수 | 키오스크, 카드 단말, 주문서 프린터 | - |\n| 단말명 | 필수 | 문자 20자 이내 | 같은 매장 안에서 중복할 수 없다 |\n| 설치 위치 | 선택 | 문자 50자 이내 | - |\n| 비고 | 선택 | 문자 100자 이내 | - |\n**조건**\n\n* 종류는 키오스크, 카드 단말, 주문서 프린터 셋으로 한정한다\n\n**예외**\n\n* 종류는 세 가지로 한정한다\n* 같은 매장 안에서 단말명이 겹치면 저장을 막는다\n\n#### STR-DEVC-PAIR 단말 연결\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 연결 코드를 발급해 단말과 매장을 잇는다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-233 단말 연결 |\n\n**처리**\n\n1. 단말에서 코드를 입력하면 연결하고 시험 동작을 실행한다\n2. 코드 다시 받기 → 새 코드를 발급하고 시간을 초기화한다\n\n**조건**\n\n* 연결 코드 유효시간 10분. 시험 동작에 실패하면 연결 끊김으로 둔다\n\n**예외**\n\n* 유효시간 10분이 지나면 \"코드가 만료되었습니다.\" 표시하고 다시 받게 한다\n* 시험 동작에 실패하면 사유를 표시하고 상태를 연결 끊김으로 둔다\n* 종류별 시험 동작은 다르다. 키오스크는 메뉴 내려받기, 카드 단말은 승인 경로 확인, 프린터는 시험 출력이다\n\n### 매출\n\n#### STR-SALE-LIST 매출 조회\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담당 매장의 매출을 조회한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-201 매장 운영 · FL-221 매출 조회 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 조회 조건 | 시작일, 종료일 |\n| 열 | 선택, 순번, 일자, 주문, 결제, 취소, 순매출, 객단가 |\n| 기본 정렬 | 일자 (최근이 위) |\n| 행 동작 | 행을 선택하면 상세로 간다 |\n| 선택 처리 | 행을 고르면 표 위에 건수와 처리 버튼을 띄운다 |\n\n**처리**\n\n1. 일자 선택 → 해당 일자의 주문 목록으로 이동\n2. 내려받기 → 조회 조건 그대로 파일 생성\n\n**조건**\n\n* 담당 매장 범위 밖은 조회할 수 없다\n\n**예외**\n\n* 당일 구간은 집계 시점을 함께 표시한다\n#### WEB-STOR-ENTRY 매장 진입\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | QR에 담긴 매장으로 바로 들어간다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-310 매장 진입 |\n\n**처리**\n\n1. 주문 시작 → 수령 방식이 둘이면 WEB-ORDR-TYPE, 하나면 WEB-MENU-LIST\n2. 주문 조회 → WEB-ORDR-FIND\n\n**조건**\n\n* 매장 선택 단계를 두지 않는다\n* 회원가입과 로그인을 요구하지 않는다\n* 주문 가능 반경은 단말에서 판정한다. 좌표를 서버로 보내지 않고 저장하지 않는다\n* 위치 권한을 거부해도 주문할 수 있다. 반경 확인만 건너뛴다\n* 위치기반서비스 이용약관 전문을 이 화면에서 열 수 있게 한다. 위치정보법 제19조에 따른 명시다\n\n**예외**\n\n* QR에 담긴 매장으로 바로 들어간다. 매장을 고르는 단계를 두지 않는다\n* 주문할 수 없는 상태면 WEB-STOR-BLOCK\n#### WEB-INFO-SELL 판매자 정보\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문하는 매장의 신원정보를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-310 매장 진입 |\n\n**처리**\n\n1. 매장 진입 화면에서 판매자 정보를 선택한다\n2. 상호, 대표자, 사업자등록번호, 통신판매업 신고번호, 주소, 연락처를 표시한다\n\n**조건**\n\n* 전자상거래법 제13조 제1항에 따른 표시다\n* 판매자는 매장이다. 본사는 주문을 잇는 역할만 하며 판매자로 표시하지 않는다\n* 값은 상권 등록의 본사 정보에서 가져온다\n* 이용약관과 개인정보 처리방침을 함께 둔다. 이 둘은 아이오더가 정하고 전 매장에 같게 적용한다\n* 아이오더가 거래 당사자가 아니라는 사실을 함께 적는다. 전자상거래법 제20조 제1항\n\n**예외**\n\n* 통신판매업 신고번호가 없는 매장은 그 항목을 \"확인 중\"으로 표시하고 본사에 알린다\n* 값이 비어 있으면 주문을 막지 않는다. 표시만 비운다\n\n#### WEB-INFO-POLI 서비스 정책\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 이용약관, 개인정보 처리방침, 위치기반서비스 이용약관 전문을 표시한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-310 매장 진입 |\n\n**문서 구성**\n\n| 문서 | 근거 | 담는 내용 |\n| --- | --- | --- |\n| 이용약관 | 전자상거래 표준약관 제10023호, 전자상거래법 제13조 제2항 | 계약의 성립, 취소, 매장의 거절, 청약철회, 미수령, 중개자의 지위 |\n| 개인정보 처리방침 | 개인정보 보호법 제30조, 시행령 제31조 | 처리 목적부터 권익침해 구제까지 11개 항 |\n| 위치기반서비스 이용약관 | 위치정보법 제19조 | 서비스 내용, 보유 목적과 기간, 제3자 제공, 이용자의 권리, 관리책임자 |\n\n**처리**\n\n1. 판매자 정보에서 문서를 선택한다\n2. 고른 문서를 탭으로 열고 전문을 표시한다\n3. 이전 판 보기 → 지난 판을 시행일과 함께 표시한다\n\n**조건**\n\n* 세 문서는 아이오더가 정하고 전 매장에 같게 적용한다\n* 시행일을 문서 위에 적는다. 시행일 7일 전에 게시한다\n* 약관을 바꾸면 시행일 7일 전에 알린다. 고객에게 불리한 변경은 30일 전에 알리고 개별 통지한다\n* 이전 판을 지우지 않고 시행일과 함께 남긴다\n* 위치기반서비스 이용약관은 이용약관과 분리해 둔다. 위치정보 동의를 따로 받기 때문이다\n\n**예외**\n\n* 문서를 불러오지 못하면 다시 시도할 수 있게 하고 주문은 막지 않는다\n\n#### WEB-STOR-BLOCK 주문 불가 안내\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문할 수 없는 사유를 안내한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 상태값 | 영업시간 외, 일시중지, 반경 밖 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-312 주문 불가 안내 |\n\n**처리**\n\n1. 불가 사유를 표시한다 (영업시간 외, 일시중지, 영업 종료, 반경 밖)\n2. 재개 시각이 있으면 함께 표시한다\n3. 매장 위치와 문의 연락처를 표시한다\n4. 주문 조회하기 → WEB-ORDR-FIND\n\n**조건**\n\n* 재개 시각이 있으면 함께 표시한다\n\n**예외**\n\n* 영업시간 외: \"영업시간이 아닙니다.\" 와 다음 영업 시각\n* 일시중지: 재개 시각이 있으면 함께 표시\n* 매장 반경 밖: \"매장에서 주문해 주세요.\"\n\n### 주문\n\n#### WEB-ORDR-TYPE 수령 방식 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 수령 방식을 고른다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 상태값 | 매장 식사, 포장 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-313 수령 방식 선택 |\n\n**처리**\n\n1. 매장이 운영하는 취식유형을 표시한다 (매장 식사, 포장)\n2. 하나를 고르면 WEB-MENU-LIST로 간다\n3. 유형이 하나면 이 화면을 건너뛴다\n\n**조건**\n\n* 매장이 한 방식만 운영하면 건너뛴다\n\n**예외**\n\n* 매장이 한 방식만 운영하면 이 화면을 건너뛴다\n\n#### WEB-MENU-LIST 메뉴 목록\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카테고리별로 메뉴를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-314 메뉴 목록 |\n\n**처리**\n\n1. 메뉴 선택 → WEB-MENU-DETAIL\n2. 장바구니 → WEB-CART-LIST\n\n**조건**\n\n* 품절과 미노출 메뉴는 목록에서 제외한다\n\n**예외**\n\n* 판매 시간이 아닌 메뉴는 표시하지 않는다\n* 장바구니가 비면 하단 버튼을 숨긴다\n#### WEB-MENU-DETAIL 메뉴 상세·옵션 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 옵션과 수량을 정하고 장바구니 담기 또는 바로 결제를 고른다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-315 메뉴 상세·옵션 선택 |\n\n**처리**\n\n1. 장바구니 담기 → 담고 메뉴 목록으로 돌아간다. 하단 토스트로 알린다\n2. 바로 결제 → 이 메뉴 하나로 WEB-ORDR-FORM\n\n**조건**\n\n* 필수 옵션을 고르지 않으면 담을 수 없다\n* 바로 결제는 장바구니를 거치지 않는다\n* 알레르기와 원산지를 함께 표시한다\n\n**예외**\n\n* 필수 옵션을 고르지 않으면 두 버튼을 비활성으로 두고 미선택 그룹을 표시한다\n* 최대 선택 수를 넘기면 초과 안내를 표시한다\n* 장바구니에 담긴 항목이 있는데 바로 결제를 고르면 함께 결제할지 묻는다\n* 원산지 글자 크기는 메뉴 이름과 같거나 크게 표시한다\n\n#### WEB-CART-LIST 장바구니\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담은 항목과 금액을 확인한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-316 장바구니 |\n\n**처리**\n\n1. 수량 변경 → 금액이 바로 바뀐다\n2. 삭제 → 확인 팝업 후 처리하고 토스트로 알린다\n3. 결제하기 → WEB-ORDR-FORM\n\n**조건**\n\n* 다른 매장 항목이 있으면 초기화 여부를 확인한다\n\n**예외**\n\n* 다른 매장 항목이 있으면 초기화 여부를 묻고 확인 시 비운다\n* 담는 사이 품절로 바뀐 항목은 표시하고 결제 대상에서 뺀다\n* 장바구니가 비면 메뉴 목록으로 돌려보낸다\n* 최소 주문 금액에 못 미치면 부족 금액을 표시하고 결제 버튼을 비활성으로 둔다\n\n#### WEB-ORDR-FORM 결제 상세\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문 내역과 결제 금액을 확인하고 주문자 정보를 입력한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-317 결제 상세 |\n\n**처리**\n\n1. 주문 내역과 합계를 표시한다\n2. 예상 준비 시간과 취소 가능 구간을 안내한다\n3. 이름, 휴대폰번호, 요청사항을 입력한다\n4. 개인정보 동의를 받는다. 보기로 전문을 연다\n5. 결제하기 → 검증 → 결제대행사 결제창 → WEB-PAY-WAIT\n\n**입력 항목**\n\n| 항목 | 필수 | 형식 | 검증 |\n| --- | --- | --- | --- |\n| 이름 | 필수 | 문자 20자 이내 | - |\n| 휴대폰번호 | 필수 | 숫자 10~11자리 | 형식이 맞아야 한다. 주문 상태 안내와 조회에 쓴다 |\n| 요청사항 | 선택 | 문자 100자 이내 | 매장에 그대로 전달한다 |\n| 개인정보 수집·이용 동의 | 필수 | 체크 | 목적, 항목, 보유 기간, 거부권을 보기로 보인다. 동의 없이 결제할 수 없다 |\n**조건**\n\n* 장바구니와 바로 결제 두 경로로 들어온다\n* 개인정보 수집 동의 없이 진행할 수 없다\n* 동의 항목은 목적, 항목, 보유 기간, 거부권을 함께 보인다. 체크박스만 두지 않는다\n* 결제 버튼 위에 취소 가능 구간과 예상 준비 시간을 적는다\n* 휴대폰번호 형식을 검사한다\n\n**예외**\n\n* 장바구니와 바로 결제 두 경로로 들어온다. 대상 항목이 다르다\n* 휴대폰번호 형식이 맞지 않으면 해당 항목에 표시하고 진행을 막는다\n* 필수 동의 없이 진행할 수 없다\n* 서버 재계산 금액과 다르면 진행을 멈추고 다시 확인하게 한다\n* 별도 확인 팝업을 두지 않는다. 이 화면이 확인 단계다\n\n#### WEB-PAY-WAIT 결제 진행\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 결제대행사 결제창을 호출하고 결과를 기다린다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-318 결제 진행 · FL-901 결제 결과 유실 · FL-902 금액 검증 실패 |\n\n**처리**\n\n1. 결제대행사 결제창을 호출하고 결과를 기다린다\n2. 성공 시 WEB-ORDR-DONE\n\n**조건**\n\n* 복귀가 없으면 서버 조회로 결과를 확정한다\n* 금액이 다르면 승인하지 않는다\n\n**예외**\n\n* 결제창에서 돌아오지 않으면 서버 조회로 결과를 확정한다\n* 저장 금액과 다르면 승인하지 않고 안내를 표시한다\n* 승인 실패 시 사유를 표시하고 결제 상세로 되돌린다\n* 결과를 알 수 없으면 \"확인 중\"으로 두고 이중 결제를 막는다\n\n#### WEB-ORDR-DONE 결제 완료\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 호출 순번과 주문서를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-301 웹앱 주문·결제 · FL-319 결제 완료 · FL-901 결제 결과 유실 |\n\n**처리**\n\n1. 주문 상태 보기 → WEB-ORDR-STAT\n2. 주문서 저장 → 화면 이미지로 저장\n3. 추가 주문 → WEB-MENU-LIST\n\n**조건**\n\n* 순번은 매장별로 매일 1번부터 채번한다\n* 화면에서 순번을 가장 크게 둔다\n* 조회와 대사에는 주문번호를 쓴다\n\n**예외**\n\n* 호출 번호는 매장별로 매일 1번부터 채번한다\n* 조회와 문의에는 주문번호를 쓴다. 두 값을 섞지 않는다\n\n### 주문 조회\n\n#### WEB-ORDR-FIND 주문 조회\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문번호와 휴대폰번호로 주문을 찾는다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 연결 Flow | FL-302 주문 상태 확인·픽업 · FL-303 주문 취소 · FL-320 주문 조회 |\n\n**처리**\n\n1. 주문번호와 휴대폰번호를 입력한다\n2. 조회 → 둘 다 맞으면 WEB-ORDR-STAT\n3. 맞지 않으면 어느 항목이 틀렸는지 밝히지 않고 안내한다\n\n**조건**\n\n* 둘이 모두 맞아야 조회할 수 있다\n\n**예외**\n\n* 맞지 않으면 \"주문을 찾을 수 없습니다. 입력한 내용을 확인해 주세요.\" 표시. 어느 항목이 틀렸는지 밝히지 않는다\n* 개인정보 파기가 끝난 주문은 조회할 수 없다\n\n#### WEB-ORDR-STAT 주문 상태\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 현재 주문 상태를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 페이지 |\n| 상태값 | 접수 대기, 접수 완료, 조리 중, 조리 완료, 취소 |\n| 연결 Flow | FL-302 주문 상태 확인·픽업 · FL-303 주문 취소 · FL-321 주문 상태 · FL-903 매장 미접수 |\n\n**처리**\n\n1. 상태가 바뀌면 화면을 갱신한다\n2. 주문 취소 → WEB-ORDR-CNCL\n\n**조건**\n\n* 접수 대기에는 매장의 남은 응답 시간을, 접수 완료에는 매장이 고른 준비 시간과 예상 완료 시각을 표시한다\n* 취소 버튼은 접수 완료 후 1분까지만 노출하고 남은 시간을 함께 표시한다\n* 수령 완료 중 미수령으로 마감된 건은 그렇게 표시한다\n\n**예외**\n\n* 조리 중부터는 버튼을 숨기고 \"조리가 시작되어 취소할 수 없습니다.\"를 표시한다\n* 취소된 주문은 사유와 환불 안내를 표시한다\n#### WEB-ORDR-CNCL 주문 취소\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문을 취소하고 결제 취소를 요청한다 |\n| 대상 | 고객 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-303 주문 취소 · FL-322 주문 취소 |\n\n**처리**\n\n1. 취소 사유를 고른다\n2. 취소하기 → 확인 팝업 → 주문 취소와 결제 취소를 함께 요청한다\n3. 취소 결과를 토스트로 알리고 WEB-ORDR-STAT로 돌아간다\n4. 접수 완료 후 1분이 지나면 이 화면을 열 수 없다\n\n**조건**\n\n* 조리 중으로 넘어간 주문은 취소할 수 없다\n* 이 경우 매장에 문의하도록 안내한다\n\n**예외**\n\n* 사유를 고르지 않으면 진행할 수 없다\n* 여는 사이 조리 중으로 바뀌면 \"조리가 시작되어 취소할 수 없습니다. 매장에 문의해 주세요.\" 표시하고 닫는다\n* 결제 취소에 실패하면 사유를 표시하고 주문 상태로 되돌린다\n\n## 4. 키오스크\n\n### 대기\n\n#### KSK-IDLE-MAIN 대기화면\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문 시작을 안내하고 유휴 시 메뉴를 받는다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-402 메뉴 마스터 수신 · FL-410 대기화면 |\n\n**처리**\n\n1. 주문 시작 → KSK-ORDR-TYPE 또는 KSK-MENU-LIST\n2. 음성 안내 → KSK-IDLE-ACCS\n3. 관리자 → KSK-ADMN-AUTH\n\n**조건**\n\n* 주문 중에는 메뉴를 바꾸지 않는다\n\n**예외**\n\n* 유휴 상태에서 메뉴를 확인하고 받아온다. 주문 중에는 바꾸지 않는다\n* 매장이 영업 중이 아니면 사유와 재개 시각을 표시하고 주문 시작을 막는다\n* 관리자 진입 경로는 눈에 띄지 않게 두되 감추지는 않는다\n\n#### KSK-INFO-SELL 판매자 정보\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 주문하는 매장의 신원정보를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-410 대기화면 |\n\n**처리**\n\n1. 대기화면에서 판매자 정보를 선택한다\n2. 웹앱과 같은 항목을 표시한다\n3. 닫기 → 대기화면으로 돌아간다\n\n**조건**\n\n* 웹앱 판매자 정보와 같은 항목을 같은 순서로 둔다\n* 대기화면에서만 연다. 주문 도중에는 열지 않는다\n\n**예외**\n\n* 값이 비어 있으면 그 줄을 \"확인 중\"으로 표시한다\n\n#### KSK-IDLE-ACCS 접근성 안내\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 단말 위치와 사용 방법을 음성으로 안내한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-410 대기화면 |\n\n**처리**\n\n1. 조절 선택 → 주문이 끝날 때까지 설정을 유지한다\n2. 주문 시작 → 음성 안내를 켠 채로 주문에 들어간다\n\n**조건**\n\n* 검증기준을 준수한 단말을 쓴다\n* 개인정보는 음성으로 읽지 않는다\n\n**예외**\n\n* 검증기준을 준수한 단말을 전제로 한다\n* 개인정보는 음성으로 읽지 않는다. 개인청취 장치를 연결한 경우만 예외로 둔다\n* 단말 위치는 소리로도 안내한다\n\n### 주문\n\n#### KSK-ORDR-TYPE 취식유형 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 취식유형을 고른다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 상태값 | 매장 식사, 포장 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-411 취식유형 선택 |\n\n**처리**\n\n1. 취식유형을 크게 두 개로 표시한다\n2. 하나를 고르면 KSK-MENU-LIST로 간다\n3. 유형이 하나면 건너뛴다\n4. 처음으로 → 대기화면\n\n**조건**\n\n* 매장이 한 유형만 운영하면 건너뛴다\n\n**예외**\n\n* 매장이 한 유형만 운영하면 이 화면을 건너뛴다\n* 무입력 시간이 지나면 대기화면으로 돌아간다. 만료 20초 전에 알리고 연장할 수 있게 한다\n\n#### KSK-MENU-LIST 메뉴 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카테고리별로 메뉴를 표시한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-412 메뉴 선택 |\n\n**처리**\n\n1. 메뉴 선택 → 옵션이 있으면 KSK-MENU-OPTN, 없으면 바로 담는다\n2. 주문 내역 확인 → KSK-CART-LIST\n\n**조건**\n\n* 품절 메뉴는 목록에서 제외한다\n\n**예외**\n\n* 담은 항목이 없으면 주문 내역 확인 버튼을 비활성으로 둔다\n* 담긴 사이 품절로 바뀌면 다음 화면에서 알린다\n#### KSK-MENU-OPTN 옵션 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 옵션과 수량을 고른다 |\n| 대상 | 고객 |\n| 유형 | 레이어팝업 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-413 옵션 선택 |\n\n**처리**\n\n1. 필수 옵션과 선택 옵션을 그룹별로 표시한다\n2. 수량을 정한다\n3. 담기 → 필수 옵션이 비었으면 막는다 → 장바구니에 담고 팝업을 닫는다\n4. 취소 → 메뉴 선택으로 돌아간다\n\n**조건**\n\n* 필수 옵션을 고르지 않으면 진행할 수 없다\n\n**예외**\n\n* 필수 옵션을 고르지 않으면 담기를 비활성으로 두고 미선택 그룹을 표시한다\n* 최대 선택 수를 넘기면 더 고를 수 없게 한다\n\n#### KSK-CART-LIST 주문 내역 확인\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 담은 항목과 결제 금액을 확인한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-414 주문 내역 확인 |\n\n**목록 구성**\n\n| 구분 | 내용 |\n| --- | --- |\n| 열 | 메뉴, 옵션, 수량, 금액, 동작 |\n| 기본 정렬 | 담은 순서 |\n| 행 동작 | 삭제 |\n| 합계 | 표 아래에 주문 금액을 적는다 |\n\n**처리**\n\n1. 삭제 → 확인 팝업 후 처리하고 목록을 다시 그린다\n2. 결제하기 → KSK-PAY-TYPE\n\n**조건**\n\n* 무입력 대기 만료 20초 전에 알리고 연장 수단을 준다\n* 결제 버튼 위에 결제하면 바로 조리가 시작되어 취소할 수 없다는 것을 적는다. 전자상거래법 제17조 제3항\n\n**예외**\n\n* 담는 사이 품절로 바뀐 항목은 표시하고 결제 대상에서 뺀다\n* 항목이 모두 빠지면 메뉴 선택으로 돌려보낸다\n* 무입력 만료 20초 전에 알리고 연장할 수 있게 한다\n\n#### KSK-PAY-TYPE 결제수단 선택\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 결제수단을 고른다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-415 결제수단 선택 |\n\n**처리**\n\n1. 결제수단을 표시한다 (카드, 간편결제)\n2. 고르면 KSK-PAY-PROC로 간다\n3. 이전 → 주문 내역 확인으로 돌아간다\n\n**조건**\n\n* 카드와 간편결제만 노출한다\n* 현금은 받지 않는다\n* 단말 상태가 정상이 아닌 수단은 비활성으로 표시한다\n\n**예외**\n\n* 매장이 설정한 수단만 노출한다\n* 현금은 받지 않는다. 현금 버튼을 두지 않는다\n* 단말 상태가 정상이 아닌 수단은 비활성으로 두고 사유를 표시한다\n\n#### KSK-PAY-PROC 결제 진행\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 카드 단말로 승인을 요청한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-417 결제 진행 · FL-904 VAN 망취소 · FL-905 키오스크 네트워크 단절 |\n\n**처리**\n\n1. 카드 단말로 승인을 요청하고 결과를 기다린다\n2. 성공 시 KSK-CALL-FORM 또는 KSK-ORDR-DONE\n\n**조건**\n\n* 5만원 이상은 서명을 받는다\n* 통신이 끊기면 망취소를 시도한다\n\n**예외**\n\n* 통신이 끊기면 망취소를 시도하고 결과를 화면에 표시한다\n* 승인 결과를 알 수 없으면 \"확인 중\"으로 두고 매장 직원 호출을 안내한다. 재결제를 유도하지 않는다\n* 승인 거절 시 사유를 표시하고 결제수단 선택으로 되돌린다\n#### KSK-CALL-FORM 고객 호출 정보 입력\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 호출용 휴대폰번호를 입력한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-418 고객 호출 정보 입력 |\n\n**처리**\n\n1. 확인 → KSK-ORDR-DONE\n2. 건너뛰기 → 번호 없이 진행하고 호출 번호로만 부른다\n\n**조건**\n\n* 휴대폰번호 방식일 때만 표시한다\n* 입력값을 음성으로 읽지 않는다\n\n**예외**\n\n* 입력값을 음성으로 읽지 않는다. 개인청취 장치를 연결한 경우만 예외로 둔다\n* 형식이 맞지 않으면 확인을 비활성으로 둔다\n#### KSK-ORDR-DONE 주문 완료\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 호출 순번과 주문번호, 예상 준비 시간을 표시하고 주문서를 출력한다 |\n| 대상 | 고객 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-401 키오스크 주문·결제 · FL-419 주문 완료 · FL-905 키오스크 네트워크 단절 |\n\n**처리**\n\n1. 호출 순번을 크게, 주문번호와 예상 준비 시간을 함께 표시한다\n2. 주문서를 출력한다\n3. 호출 방식이 휴대폰번호면 KSK-CALL-FORM으로 간다\n4. 일정 시간 뒤 대기화면으로 돌아간다\n\n**조건**\n\n* 예상 준비 시간은 매장의 기본 준비 시간이다. 키오스크 주문은 매장이 따로 고르지 않는다\n* 순번 채번 기준은 웹앱과 같다\n* 출력에 실패해도 주문은 접수된 것으로 처리한다\n\n**예외**\n\n* 호출 번호 채번 기준은 웹앱과 같다. 매장별로 매일 1번부터 시작한다\n* 주문서 출력에 실패해도 주문은 접수된 것으로 처리하고 사유를 표시한다\n* 카드 매출전표는 카드 단말이 낸다. 키오스크는 주문서만 낸다\n* 찾아가지 않으면 영업 종료 한 시간 뒤 배치가 미수령으로 마감한다 (FL-146)\n\n### 관리자\n\n#### KSK-ADMN-AUTH 관리자 인증\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 관리자 모드로 들어간다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-403 키오스크 관리자 처리 · FL-420 관리자 인증 |\n\n**처리**\n\n1. 관리자 번호를 화면 키패드로 입력한다\n2. 인증 → 맞으면 KSK-ADMN-MAIN\n3. 5회 틀리면 10분간 진입을 막고 대기화면으로 돌아간다\n4. 진입 기록을 남긴다\n\n**조건**\n\n* 고객 화면에 진입 경로를 노출하지 않는다\n\n**예외**\n\n* 실패 횟수를 제한하고 초과하면 일정 시간 차단한다\n* 입력값을 음성으로 읽지 않는다\n\n#### KSK-ADMN-MAIN 관리자 메뉴\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 관리자 기능을 고른다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-403 키오스크 관리자 처리 · FL-421 관리자 메뉴 |\n\n**처리**\n\n1. 각 버튼 → 해당 화면으로 이동\n2. 나가기 → 대기화면으로 복귀\n\n**조건**\n\n* 관리자 인증을 마친 뒤에만 들어온다\n* 주문을 받는 중에도 들어올 수 있다. 진행 중인 주문은 그대로 둔다\n* 일정 시간 조작이 없으면 대기화면으로 돌아간다\n\n**예외**\n\n* 단말 오류가 있으면 요약 영역에 사유를 표시한다\n\n#### KSK-ADMN-SYNC 메뉴 갱신\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | ERP의 최신 메뉴를 단말로 받아온다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 연결 Flow | FL-425 메뉴 갱신 |\n\n**처리**\n\n1. 마지막 동기화 시각과 대기 중인 변경 수를 표시한다\n2. 동기화 → 확인 팝업 → 메뉴 마스터를 다시 받는다\n3. 결과(반영 건수, 실패 건수)를 화면에 표시한다\n4. 실패하면 이전 마스터를 유지한다\n\n**조건**\n\n* 마지막 갱신 시각 이후 변경분만 받는다\n* 주문 진행 중에는 갱신하지 않는다\n\n**예외**\n\n* 주문이 진행 중이면 갱신하지 않는다. 끝난 뒤 하도록 안내한다\n* 바뀐 내용이 없으면 \"최신 상태입니다.\" 표시한다\n* 반영에 실패하면 사유를 표시하고 기존 메뉴를 유지한다\n#### KSK-ADMN-OPEN 판매 메뉴 설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 그날 판매할 메뉴를 연다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 상태값 | 노출, 미노출 |\n| 연결 Flow | FL-426 판매 메뉴 설정 |\n\n**처리**\n\n1. 저장 → 확인 팝업에 여는 수와 닫는 수를 적고 처리한다\n2. 저장하면 매장별 메뉴 설정의 노출 여부가 바뀐다\n\n**조건**\n\n* 매장별 메뉴 설정의 노출 여부를 바꾼다\n* 웹앱과 외부 POS에도 함께 적용한다\n* 노출 메뉴가 하나도 없으면 저장할 수 없다\n\n**예외**\n\n* 품절 메뉴는 노출로 바꿔도 주문 화면에 나오지 않는다. 품절 해제를 함께 안내한다\n* 반영에 실패하면 이전 상태를 유지하고 사유를 표시한다\n#### KSK-ADMN-SOUT 품절 설정\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 단말에서 품절을 설정하고 ERP로 올린다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 상태값 | 판매중, 품절 |\n| 연결 Flow | FL-403 키오스크 관리자 처리 · FL-423 품절 설정 |\n\n**처리**\n\n1. 품절 → 재개 시각을 고르고 처리한다. 비우면 수동 해제까지 유지한다\n2. 판매 재개 → 확인 팝업 후 처리한다\n\n**조건**\n\n* 단말에만 남기지 않는다\n* 네트워크가 끊기면 단말에 두었다가 복구 시 전송한다\n\n**예외**\n\n* 단말에만 남기지 않는다. 서버로 올려 다른 채널에 함께 적용한다\n* 네트워크가 끊기면 단말에 두고 미전송으로 표시한 뒤 복구 시 보낸다\n* 가맹 어드민에서 이미 바꿨으면 마지막 값을 적용하고 처리자를 기록한다\n\n#### KSK-ADMN-DEVC 단말 상태 확인\n\n| 구분 | 내용 |\n| --- | --- |\n| 목적 | 프린터, 카드 단말, 네트워크 상태를 확인한다 |\n| 대상 | 가맹 관리자 |\n| 유형 | 전체화면 |\n| 상태값 | 정상, 오류 |\n| 연결 Flow | FL-403 키오스크 관리자 처리 · FL-424 단말 상태 확인 |\n\n**처리**\n\n1. 다시 확인 → 상태를 새로 읽어 표시한다\n2. 시험 결제 → 소액 승인과 즉시 취소로 경로를 확인한다\n\n**조건**\n\n* 오류가 있으면 사유와 마지막 통신 시각을 표시한다\n\n**예외**\n\n* 오류가 있으면 사유와 마지막 통신 시각을 함께 표시한다\n* 프린터 오류 상태에서도 주문은 받는다. 주문서는 화면으로 확인하게 한다\n"}, {"no": 8, "id": "DOC-08", "title": "검토 결과", "file": "docs/08_검토결과.md", "category": "검토", "status": "확정", "progress": 100, "eta": "", "version": "2.7", "updated": "2026-09-08", "inherits_titles": ["Flow Chart", "IA", "Wireframe", "기능 명세"], "content": "# 08. 검토 결과\n\n검토일 2026-09-08. 01부터 07까지를 대상으로 한다.\n\n조치가 끝난 항목은 이 문서에 남기지 않는다. 처리 이력은 `_data/changes.yaml`에 있다. 아래는 현재 시점에 열려 있는 검토 내용만 적는다.\n\n## 1. 현재 상태\n\n| 구분 | 건수 |\n| --- | --- |\n| 요구사항 | 46 |\n| 비기능 요구사항 | 56 |\n| 의사결정 | 16 |\n| 기능 | 63 |\n| 화면 | 92 |\n| Wireframe | 196 |\n| 기능 명세 | 92 |\n| Flow | 106 |\n\n화면 92건이 모두 어느 Flow에든 나오고 화면마다 기능 명세가 있다. 요구사항에서 기능, 기능에서 화면과 Flow로 이어지는 경로에 끊긴 곳이 없다.\n\nWireframe 196건은 화면 92건의 기본 상태와 상태별 변형을 합한 수다. 목록의 결과 없음, 등록·수정의 검증 오류, 처리 결과 안내가 모두 포함된다.\n\n## 2. 검토 사항\n\n### R-1 연계 규격이 문서에 없다\n\n07 기능 명세를 화면 단위로 작성했다. 목적, 대상, 처리, 조건, 예외, 연결 Flow를 갖췄다.\n\n외부 연계 규격은 아직 없다. 결제대행사와 VAN사, 알림톡, 외부 POS의 요청과 응답 항목이 정의되지 않았다. 계약 후 상대가 제공하는 규격에 맞춰야 하므로 지금 확정할 수 없다. 계약 시 확인할 항목은 02 문서 2.7과 2.22에 있다.\n\n### R-2 계정 발급 경로가 둘이다\n\n상권을 등록하면서 담당 계정을 함께 발급한다. 시스템 > 관리자에서도 계정을 발급한다.\n\n두 경로가 만드는 계정은 같다. 상권 등록에서는 역할이 가맹 관리자, 담당 범위가 그 상권으로 고정되고, 관리자 메뉴에서는 둘 다 고를 수 있다.\n\n계정 정보 수정과 비밀번호 재설정, 사용 중지는 관리자 메뉴에서만 한다. 상권 화면에서는 읽기만 한다. 발급 경로는 둘이지만 관리 경로는 하나다.\n\n상권 담당자가 여러 명인 경우는 관리자 메뉴에서 계정을 추가한다. 상권 등록에서 계정을 여러 개 만드는 화면은 두지 않는다. 상권 등록은 첫 담당자 한 명을 만드는 자리이고, 그 뒤의 증감은 계정 관리에서 다룬다.\n\n### R-3 주문 흐름을 유사 서비스와 대조하고 반영했다\n\n스타벅스 사이렌 오더, 토스오더 픽업주문, 배민스토어 픽업과 상태 흐름을 대조했다.\n결제 승인 → 매장 접수 → 준비 → 완료 알림 → 수령의 뼈대와 접수 전에만 고객이 취소할 수 있는 규칙은 같다.\n키오스크 주문을 결제와 동시에 접수 완료로 넣는 것도 맞다.\n\n네 가지가 다르거나 빠져 있다.\n\n| 항목 | 이전 | 확인된 기준 | 반영 |\n| --- | --- | --- | --- |\n| 미응답 제한 시간 | 1분 | 토스오더 5분, 배민스토어 15분 | 5분. 남은 시간을 행에 표시하고 1분 남으면 붉게 바꾼다 |\n| 예상 준비 시간 | 화면에 표시만 있고 정하는 주체가 없다 | 스타벅스는 결제 전 안내, 배민은 접수 시 5~60분 지정 | 매장 정보의 기본값을 결제 전에 안내하고, 접수할 때 매장이 다시 고른다 |\n| 미수령 주문 | 정의 없음 | 배민은 결제 24시간 뒤 자동 픽업완료 | 영업 종료 한 시간 뒤 배치가 수령 완료로 바꾸고 미수령으로 남긴다 (FL-146) |\n| 거절 사유 | 받지 않는다 | 배민은 사유 선택, 품절이면 재고 0 연동 | 품절·재료 소진·마감·기타. 품절이면 그 메뉴를 품절로 바꾼다 (STR-ORDR-RJCT) |\n\n스타벅스는 전 매장이 직영이라 거절이 없고 결제가 곧 접수다. 본 서비스는 행사장 가맹 매장이 운영해\n재료 소진과 조기 마감이 잦다. 매장 수락 단계는 유지한다. 가져온 것은 시간을 다루는 방식이다.\n\n접수 완료 후 1분간 고객이 취소할 수 있게 두는 것은 두 서비스와 다르다. 둘은 접수와 동시에 취소를 막는다.\n본 서비스는 결제가 선불이고 행사장에서 급히 누르는 주문이 많아 되돌릴 여지를 둔다. 근거는 02 문서 2.10에 적었다.\n\n화면 두 건(주문 접수, 주문 거절)과 Flow 한 건(미수령 주문 마감)이 늘었다.\n근거는 `research/주문흐름_대조.md`에 있다. IS-043~IS-046은 해결로 닫았다.\n\n### R-4 고객 화면에 넣어야 할 법정 항목을 확인했다\n\n메뉴 표시 의무(원산지·알레르기·영양성분) 밖에 빠진 것이 있는지 확인했다. 세 가지가 빠져 있었다.\n\n| 항목 | 근거 | 처분 | 반영 |\n| --- | --- | --- | --- |\n| 판매자 신원정보 | 전자상거래법 제13조 제1항 | 시정조치, 과태료 | 판매자 정보 화면을 웹앱과 키오스크에 둔다. 상권 등록에 통신판매업 신고번호를 받는다 |\n| 개인정보 동의 고지 | 개인정보 보호법 제15조 제2항, 제22조 제1항 | 1천만원 이하 과태료 | 목적, 항목, 보유 기간, 거부권을 함께 보인다. 체크박스만 두지 않는다 |\n| 취소 가능 구간 사전 고지 | 전자상거래법 제17조 제3항 | 청약철회 제한이 인정되지 않는다 | 결제 버튼 위에 취소 가능 구간을 적는다 |\n\n판매자는 매장이다. 본사는 주문을 잇는 역할만 하므로 판매자로 표시하지 않는다.\n값은 대부분 상권 등록의 본사 정보에 이미 있고 통신판매업 신고번호만 새로 받는다.\n\n개인정보는 이름과 휴대폰번호 둘뿐이고 모두 주문 처리에 필요한 필수 항목이다.\n선택 항목과 마케팅 동의는 두지 않는다. 두면 별도로 받아야 하고 거부해도 주문할 수 있어야 한다.\n\n결제 상세 화면이 전자상거래법 제14조 제2항의 청약 확인 절차에 해당한다는 것을 05 문서에 적었다.\n신용카드 매출전표는 결제대행사와 카드 단말이 발급하므로 본 서비스가 만들지 않는다.\n주문 완료 화면의 주문서는 영수증이 아니다. 문서에서 '영수증'이라는 말을 쓰지 않는다.\n\n근거는 `research/화면표시항목_조사.md`에 있다.\n\n### R-5 서비스를 열기 전에 갖출 정책을 정리했다\n\n법으로 갖춰야 하는 것 네 가지를 확인했다. 셋은 아직 문구가 없다.\n\n| 항목 | 근거 | 상태 |\n| --- | --- | --- |\n| 개인정보 처리방침 | 개인정보 보호법 제30조 | 담을 항목만 정했다 (IS-047) |\n| 이용약관 | 전자상거래법 제13조 제2항 | 거래조건 항목만 정했다 (IS-048) |\n| 통신판매업 신고 | 전자상거래법 제12조 | 신고번호를 상권 등록에서 받는다 |\n| 위치기반서비스사업 신고 | 위치정보법 제9조 | 신고 대상으로 보고 갖춘다 (IS-049) |\n\n**위치기반서비스사업은 신고 대상으로 보고 갖춘다.** 면제 여부를 다투지 않는다.\n판단이 갈리는 상태로 열면 동의 없이 위치정보를 수집·이용한 것이 되어\n5년 이하 징역 또는 5천만원 이하 벌금까지 갈 수 있다. 갖추는 비용이 그 위험보다 작다.\n\n동시에 **반경 판정은 단말에서 한다.** 신고를 하더라도 좌표를 서버로 보낼 이유가 없다.\n보관하는 위치정보가 없으면 유출 위험도 없고 이용·제공 사실 확인자료도 남지 않는다.\n위치 권한을 요청하기 전에 위치정보 이용 동의를 개인정보 동의와 따로 받는다.\n선택 동의이므로 거부해도 주문할 수 있게 두고 반경 확인만 건너뛴다.\n\n이용약관과 개인정보 처리방침을 볼 수 있는 경로를 판매자 정보 화면에 두었다.\n이 둘은 아이오더가 정하고 전 매장에 같게 적용한다. 판매자 신원정보는 매장마다 다르다.\n\n근거는 `research/필수정책_조사.md`에 있다.\n\n### R-6 요구사항 문장을 표준 기준으로 점검했다\n\nISO/IEC/IEEE 29148 5.2.4와 5.2.7을 기준으로 요구사항, 화면 정책, 기능 명세의 조건과 예외를\n자동으로 대조했다. `python tools/check_wording.py`로 다시 확인할 수 있다.\n\n점검한 문장 639개에서 지적 0건이다. 최상급, 주관적 표현, 모호한 지시어, 개방형 표현,\n빠져나갈 구멍, 전체성 함의, 권장 표현을 쓴 곳이 없다.\n\n### R-7 상권을 여러 행사에 붙이면서 드러난 것\n\n상권이 행사 여러 개에 참여할 수 있게 하면서 관계를 다시 봤다. 두 가지가 걸렸다.\n\n**주문의 행사 귀속이 정해지지 않는다.** 상권이 세 행사에 참여하면 그 상권의 주문이\n어느 행사 매출인지 상권만으로는 알 수 없다. 매장이 행사 하나에 속하도록 하고\n매장을 등록할 때 상권의 참여 행사 중에서 고르기로 정했다.\n행사 : 상권은 N:M, 행사 : 매장은 1:N이다. 이러면 주문 → 매장 → 행사가 하나로 정해진다 (IS-053).\n\n**매장을 등록하는 화면이 없다.** FN-104 매장 등록에 대응하는 화면이 사라졌다.\n확인해 보니 세 문서가 서로 어긋나 있었다.\n\n| 문서 | 적혀 있던 것 |\n| --- | --- |\n| 01 REQ-004 | 본사 운영자가 상권에 매장을 등록한다 |\n| 05 4.1 머리말 | 매장 등록은 가맹 어드민에서 한다 |\n| 05 4.2 화면 목록 | 매장 등록 화면이 없다 |\n\nREQ-004와 FN-104의 주체를 가맹 관리자로 맞추고, 가맹 어드민 설정 > 매장에 매장 목록과 매장 등록·수정 화면을 두었다.\n등록할 때 상권의 참여 행사 중에서 소속 행사를 고른다. 폐점은 되돌릴 수 없고 연결 단말은 사용 중지로 바뀐다 (IS-052, IS-053 해결).\n\n## 3. 확인한 것\n\n아래는 검토 결과 문제가 없었다.\n\n| 항목 | 결과 |\n| --- | --- |\n| 추적성 | 요구사항부터 화면까지 끊긴 곳이 없다 |\n| 기능과 Flow 일치 | 기능이 모두 어느 Flow에든 나온다 |\n| 화면과 Flow 일치 | 화면 92건이 모두 어느 Flow에든 나온다 |\n| 화면과 명세 일치 | 화면 92건에 기능 명세가 모두 있다 |\n| 연결 점검 | 요구사항, 기능, Flow, 화면, 명세 사이에 끊긴 연결이 없다. 점검 결과 0건 |\n| 비기능 요구사항 | 56건 모두 판정 기준과 근거를 갖췄다. trace.yaml에 등록해 점검 대상에 넣었다 |\n| 명세 구성 | 화면 92건의 명세가 목적, 대상, 유형, 연결 Flow, 처리, 조건, 예외를 갖췄다 |\n| 조사 근거 | 조사 원본 16건이 모두 본문에서 참조된다 |\n| 식별자 | 중복과 재사용이 없다. 삭제한 항목의 번호를 다시 쓰지 않는다 |\n| 화면 상태 | 목록의 결과 없음, 등록·수정의 검증 오류, 처리 결과 안내가 모든 해당 화면에 있다 |\n| 입력 요소 | 상태가 바뀌어도 드롭다운, 날짜, 검색 입력의 종류 표시가 유지된다 |\n| 예외 처리 | 결제 유실, 금액 불일치, 미접수, 망취소, 네트워크 단절, 로그인 실패 여섯 가지를 별도 Flow로 둔다 |\n| 권한 경계 | 본사와 매장이 다루는 대상이 겹치지 않는다. 본사는 기준정보 등록과 계정 발급, 매장은 운영을 맡는다 |\n| 화면 표기 기준 | 필수·선택 표기, 강조 버튼 수, 표 정렬, 오류 문구를 KRDS 기준으로 맞췄다. 한 화면에 두 표기를 섞은 곳 0건 |\n| 표 데이터 | 금액의 천 단위 구분과 셀 구분이 섞여 열이 밀린 행 11건을 고쳤다. 머리글과 본문의 칸 수가 모두 맞는다 |\n| 조작 영역 | 키오스크와 모바일 화면의 버튼, 입력 칸, 탭, 표 행을 44px 이상으로 둔다 |\n| 입력 라벨 | 모든 입력 칸에 라벨이 있다. 안내 문구만 두고 라벨이 없던 웹앱·키오스크 6곳을 보완했다 |\n| 명세 구성 중복 | 조건과 예외에 같은 문장을 겹쳐 적은 화면 13건을 정리했다 |\n| 겹침 요소 정리 | 화면 92건에 어떤 드롭다운, 달력, 팝업, 토스트가 붙는지 05 문서 8절에 적었다. 동작은 04 문서 FL-601~607에 있다 |\n| 문서 구성 | 04 문서에 빠져 있던 절 제목 두 개를 넣었다. 가맹 어드민 Flow가 내부 어드민 절에 묻혀 있었다 |\n| 선택 요소 | 켜고 끄는 값은 토글, 값이 둘이나 셋인 배타 선택은 세그먼트로 바꿨다. 15곳에 적용 |\n| 문장 점검 | 요구사항과 화면 정책, 명세의 조건·예외 639개를 ISO/IEC/IEEE 29148 기준으로 대조한다. `python tools/check_wording.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| 화면 규칙 점검 | 05 문서 공통 화면 규칙을 화면 196건에 자동으로 대조한다. `python tools/check_screens.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| 문서 정합 점검 | 화면 목록과 Wireframe, 기능 명세, 추적표의 화면 집합과 이름, 유형, 상태값, Flow 참조를 서로 대조한다. 표의 열 수와 뷰어가 지원하는 표기도 함께 본다. `python tools/check_docs.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| Flow 연결 점검 | Flow 108건이 서로 이어지는지 자동으로 대조한다. `python tools/check_flows.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| 용어 점검 | 용어 사전(`_data/terms.yaml`)의 용어 24개와 띄어쓰기 규칙 22개를 문서에 대조한다. `python tools/check_terms.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| 식별자 점검 | 식별자 형식과 중복, 정의 없는 참조, 쓰이지 않는 식별자를 본다. `python tools/check_ids.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| 데이터 점검 | 문서 목록과 변경 이력, 이슈의 필수 항목과 값, 문서 표기와 이슈 등록이 맞는지 본다. `python tools/check_data.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| 참조 점검 | 조사 파일과 문서, 절 번호, 도구 참조가 실제로 있는지 본다. `python tools/check_links.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| 순서도 점검 | ISO 5807에 따라 판단과 분기, 조건 값 표기를 본다. `python tools/check_flow_chart.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| 누락 점검 | 정의만 하고 화면에 없는 상태, 확인 팝업이 없는 되돌릴 수 없는 동작, 명세의 구성 표, 추적 고리, 법정 표시 항목을 본다. `python tools/check_missing.py`로 다시 확인할 수 있다. 현재 지적 0건 |\n| Flow 진입 경로 | 어디에서도 가리키지 않던 Flow 7건을 이었다. 화면 조작 Flow는 05 문서 8.1 표에서, 이상 알림은 단말 목록 Flow에서 가리킨다 |\n| Flow 이탈 경로 | 로그인에서 비밀번호 재설정으로, 키오스크 대기화면에서 관리자 인증으로 가는 길이 빠져 있었다. 두 곳을 이었다 |\n| 목록 구성 | 쪽 넘김이 빠진 목록 12건, 기본 정렬 표시가 빠진 목록 22건, 조회 건수가 빠진 목록 5건을 채웠다 |\n| 화면 머리말 | 용도 설명이 없던 어드민 화면 12건에 한 줄 설명을 넣었다 |\n| 변경 추적 | 본사와 매장이 바꾼 값을 모두 이력에 남기고 상권 상세의 히스토리 탭에서 본다 |\n| 기준 데이터 | 각 데이터의 원본 도메인이 정해져 있다 |\n| 법정 표시 | 알레르기, 영양성분, 원산지의 대상 판정과 화면 표시 기준이 법령 근거와 함께 있다 |\n| 규제 | 결제와 정산 구조가 등록 의무를 피하는 근거와 함께 정해져 있다 |\n| 접근성 | 키오스크 기술 기준 16개 항목이 01 문서 8.7에 있다 |\n| 표시 책임 | 원산지와 알레르기 표시 의무자가 매장임을 법령 근거로 확인했다. 플랫폼에 남는 의무는 전자상거래법상 고지와 연대 배상뿐이다 |\n| 매장 조회 경로 | 상권을 모르는 상태에서 매장을 찾는 경로를 매출 조회 하나로 정했다 |\n\n### R-8 변경 로그를 따라 네 채널의 파급을 다시 봤다\n\n주문 흐름, 정책, 다중 행사, 목록 구성 변경(CH-258 이후)이 다른 곳에 남긴 옛 표현을 찾아 고쳤다.\n\n| 채널 | 고친 것 |\n| --- | --- |\n| 내부 어드민 | 상권 목록의 \"행사 하나에만 속한다\" 조건, 행사 삭제 시 붙은 상권 처리, 상권 삭제 조건, 정산에 미수령 포함 |\n| 가맹 어드민 | 매장 정보 변경 Flow가 아직 \"본사 확정 대기\"였다 → 즉시 반영과 이력으로 다시 씀. 매장 정보에 소속 행사·준비 시간 표시, 단말 목록의 폐점 매장 처리 |\n| 하이브리드 웹앱 | 주문 상태에 준비 시간과 예상 완료 시각, 미수령 표시 |\n| 키오스크 | \"영수증 출력\"을 \"주문서 출력\"으로 통일. 카드 매출전표는 단말이 낸다. 주문 완료에 예상 준비 시간, 결제 전 취소 불가 고지, 미수령 마감 |\n\n명세의 깊이도 맞췄다. 목록 화면 24건에 조회 조건·열·기본 정렬·행 동작을 적은 목록 구성 표를,\n입력 화면 10건에 필수·형식·검증을 적은 입력 항목 표를 넣었다. 처리가 한 줄뿐이던 명세 28건을 여러 단계로 풀었다.\n\n### R-9 매장 개설 절차를 정했다\n\n누가 매장을 만들고 누가 여는지가 02, 03, 05 문서에서 서로 달랐다. 배달앱 입점, 프랜차이즈 개설, 축제 부스 선정 사례를 대조해 정했다. 근거는 `research/매장개설_조사.md`에 있다.\n\n| 항목 | 결정 |\n| --- | --- |\n| 등록 | 가맹 관리자가 설정 > 매장에서 만든다. 저장하면 개설 준비다 |\n| 확정 | 본사가 결제대행사 하위가맹점 심사 결과로 개시를 확정한다. 결과가 자동으로 오면 사람이 누르지 않는다 |\n| 확정 전 | 주문 채널에 나오지 않고 정산에 들어가지 않는다. 소속 행사를 바꿀 수 있다. 메뉴와 단말은 미리 갖춘다 |\n| 확정 후 | 영업이 되고 소속 행사가 잠긴다 |\n\n본사 화면은 대시보드 개시 준비의 심사 열에서 여는 개시 확정 팝업 하나만 늘렸다. 확정 근거가 결제대행사 심사라 본사의 자의가 끼지 않고, 확정 전에는 정산에 들어가지 않아 매출 귀속 다툼이 없다.\n\n### R-10 문서 사이 정합을 다시 맞췄다\n\n화면, 요구사항, 기능, 추적표를 서로 대조해 어긋난 곳을 고쳤다.\n\n| 지적 | 조치 |\n| --- | --- |\n| 상권 붙이기 화면이 IA 화면 목록에 빠져 있었다. 표 행이 키오스크 표 끝에 붙어 있었다 | 행사 화면 목록으로 옮기고 겹침 요소 표에도 올렸다 |\n| 키오스크 접근성 지원, 판매 메뉴 설정이 기능 목록에 없었다. 요구사항과 추적표는 이미 쓰고 있었다 | 03 기능 목록에 추가했다 |\n| 추적표의 요구사항 세 건이 옛 문장을 그대로 갖고 있었다. 상권·행사 관계와 매장 등록 주체, 키오스크 관리자 모드가 바뀐 뒤 반영되지 않았다 | 01 문서 문장으로 맞췄다 |\n| 연동 계정 목록과 주문 접수 목록의 명세에 상태값 행이 없었다 | IA와 같은 값으로 채웠다 |\n| 개설 준비 매장의 매장 홈과 영업 상태 변경 규칙이 없었다 | 매장 홈에 개시 전 준비 화면을 두고, 영업 상태 변경은 개시 확정 뒤에 열도록 정했다 |\n\n화면 92건, Wireframe 196건, 기능 명세 92건이 서로 같은 이름과 유형, 상태값을 쓴다. 요구사항 47건과 기능 64건이 추적표와 일치한다.\n\n### R-11 정책 문서를 표준 서식으로 확정했다\n\n확인 필요로 남아 있던 세 건을 표준 서식과 법정 기재사항으로 확정했다. 근거는 `research/정책문서표준_조사.md`에 있다.\n\n| 문서 | 기준 | 확정한 것 |\n| --- | --- | --- |\n| 이용약관 | 전자상거래 표준약관 제10023호 | 24개 조 중 그대로 쓸 조와 고칠 조, 뺄 조를 나눴다. 회원 제도와 배송, 연결몰 조항 다섯을 빼고 중개자 지위와 매장의 거절, 준비 시간, 미수령 조항을 더한다 |\n| 개인정보 처리방침 | 개인정보 보호법 제30조, 시행령 제31조, 작성지침(2025.4.) | 11개 항의 목차와 순서를 정했다. 수탁자에 클라우드 사업자를 넣고, 보호책임자는 부서와 대표 연락처로 적는다 |\n| 위치기반서비스 이용약관 | 위치정보법 제19조 | 이용약관에서 분리해 별도 문서로 둔다. 위치정보 동의를 따로 받기 때문이다 |\n| 알림톡 템플릿 | 카카오 알림톡 심사 가이드 | 기본형에 웹링크 버튼 하나. 변수마다 예시를 등록하고 버튼명에 변수를 넣지 않는다. 행사 개시 10영업일 전까지 심사에 넣는다 |\n\n세 문서의 시행일은 서비스 개시일이고 시행일 7일 전에 게시한다. 개정은 7일 전 공지, 고객에게 불리한 개정은 30일 전 공지와 개별 통지다.\n\n청약철회 제한과 미수령 미환불은 약관에 적는 것만으로 효력이 생기지 않는다. 전자상거래법 제17조 제6항이 소비자가 쉽게 알 수 있는 곳에 표시하도록 정하므로 결제 전 화면에도 적는다.\n\n서비스 정책 화면은 탭 세 개로 바꿨다. 위치정보 동의 팝업에서도 위치기반서비스 이용약관 전문을 열 수 있다.\n\n문서 본문에 남아 있던 확인 필요와 가정 표기가 없다.\n\n### R-12 용어와 누락을 점검하는 도구를 만들고 어긋난 곳을 고쳤다\n\n용어 사전을 `_data/terms.yaml`에 두고 문서와 대조하는 도구, 빠지기 쉬운 항목을 찾는 도구를 만들었다.\n\n| 지적 | 조치 |\n| --- | --- |\n| 같은 대상을 매장과 `매점`, 매장과 `업체`로 나눠 불렀다 | 매장으로 통일했다. 가맹 어드민의 `매점 홈`은 매장 홈이 되고 `업체별 정산`은 매장별 정산이 됐다 |\n| 단말과 `단말기`를 섞어 썼다 | 단말로 통일했다. 법령 용어인 무인정보단말기는 그대로 둔다 |\n| 주문서와 `주문표`를 섞어 썼다 | 주문서로 통일했다. 카드 매출전표는 별개 출력물이라 그대로 둔다 |\n| 취식유형을 화면은 `먹고가기`, 명세는 매장 식사로 적었다 | 매장 식사로 통일했다 |\n| 안내 문구의 띄어쓰기가 갈렸다 | KRDS가 쓰는 형태에 맞춰 입력해 주세요, 선택해 주세요로 통일했다 |\n| 매장 정보 변경 명세에 본사 확정 시절의 상태값이 남아 있었다 | 상태값 행을 뺐다 |\n| 정의만 하고 화면에 없던 상태가 열두 가지였다 | 매출 집계의 잠정·확정, 정산 대사 세 단계, 연동 계정 사용 중지, 매장 일시중지, 주문 불가 사유 세 가지를 화면에 그렸다 |\n| 되돌릴 수 없는 동작 아홉 곳에 어떤 확인 팝업이 뜨는지 적지 않았다 | 05 문서 8절에 확인 팝업을 함께 적었다 |\n| 명세 다섯 건에 목록 구성 표나 입력 항목 표가 없었다 | 채웠다 |\n| 화면 세 개가 Flow 본문에 나오지 않았다 | FL-203과 FL-310 제목에 화면을 적었다 |\n\n점검 여섯 가지가 모두 지적 0건이다.\n\n### R-13 점검을 열 가지로 늘리고 매출 화면을 다시 짰다\n\n점검 도구를 넷 더 만들고 `python tools/check_all.py` 하나로 묶었다.\n\n| 도구 | 찾은 것 | 조치 |\n| --- | --- | --- |\n| check_ids | 의사결정 기록 DC-015가 통째로 두 번 들어가 있었다 | 한 벌을 지우고 DC-006 뒤로 옮겼다 |\n| check_data | 변경 이력 12건이 문서가 아닌 대상(상황판, README)을 가리켰다 | 폴더 공통을 뜻하는 DOC-00으로 맞췄다 |\n| check_data | 해결한 이슈 11건에 해결일이 없었다 | 같은 날 처리한 건이라 해결일을 채웠다 |\n| check_links | 어드민 화면 표준 조사 파일을 어느 문서도 가리키지 않았다 | 02 조사 색인에 올렸다 |\n| check_flow_chart | 순서도 표기는 어긋난 곳이 없었다 | - |\n\n매출 세 화면은 조회 조건과 겹침 요소까지 다시 짰다.\n\n| 화면 | 더한 것 |\n| --- | --- |\n| 행사·상권 비교 | 비교 기준에 따라 열이 바뀌는 구조, 일평균으로 보기 토글, 표시 개수 드롭다운, 전기 대비, 기간 프리셋 |\n| 매출 조회 | 집계 단위 세그먼트(일자별·매장별·매장·일자별), 열 고르기 드롭다운, 소속 기준 변경 안내 토스트 |\n| 매출 상세 | 결제수단별 집계, 앞날·다음날 이동, 상태와 주문번호·휴대폰 뒤 4자리 검색 |\n| 주문 상세 (신설) | 결제와 승인번호, 상태 변경 이력, 알림 발송 결과를 한 팝업에. 본사는 조회만 하고 고치려면 대행 접속 |\n| 내려받기 (신설) | 매출·정산·이력 화면 공통 팝업. 범위와 형식, 개인정보 포함 여부, 진행 막대와 완료 토스트, 실패 시 오류 번호 |\n\n화면에 남아 있던 문서체 설명문 여덟 줄을 지웠다. 판매자 정보의 중개자 고지는 법으로 표시해야 하므로 말투만 고쳤다.\n상권 화면에서는 참여 행사를 다루지 않는다. 붙이고 떼는 일은 행사 등록·수정의 상권 탭에서만 한다.\n\n## 5. 서비스를 열기 전에 끝낼 것\n\n정책에 담을 내용은 02 문서 2.10.3~2.10.5에 정했다. 남은 것은 문구 확정과 대외 절차다.\n\n| 항목 | 남은 일 | 담당 |\n| --- | --- | --- |\n| 이용약관 | 조항 열한 가지를 문구로 옮기고 시행일을 정한다 | 법률 검토 |\n| 개인정보 처리방침 | 항목별 내용을 문구로 옮기고 보호책임자를 지정한다 | 법률 검토 |\n| 알림톡 템플릿 | 정한 문구 네 가지로 카카오 심사를 받는다 | 본사 |\n| 통신판매업 신고 | 매장마다 신고하고 신고번호를 상권 등록에 넣는다 | 매장 |\n| 위치기반서비스사업 신고 | 방송통신위원회에 신고하고 위치정보관리책임자를 지정한다 | 본사 |\n\n기획에서 정할 것은 모두 정했다. 미해결 항목이 없다.\n남은 것은 문구 확정과 신고 접수 같은 대외 절차이므로 개발과 병행한다.\n"}], "changes": [{"id": "CH-354", "date": "2026-09-09", "type": "추가", "source": "사용자 요청", "document": "DOC-05", "summary": "주문 상세(ADM-SALE-ORDR)와 내려받기(ADM-COMN-DOWN) 화면을 둔다. 주문 상세는 결제와 상태 이력, 알림 결과를 보여주고 본사는 조회만 한다. 내려받기는 매출·정산·이력 공통 팝업이다", "affects": ["DOC-04", "DOC-06", "DOC-07"], "status": "완료", "requested_by": "기획 담당", "document_title": "IA", "affects_titles": ["Flow Chart", "Wireframe", "기능 명세"]}, {"id": "CH-353", "date": "2026-09-09", "type": "수정", "source": "사용자 요청", "document": "DOC-06", "summary": "매출 세 화면을 다시 짠다. 비교는 일평균 토글과 표시 개수, 전기 대비를 두고, 조회는 집계 단위와 열 고르기를 두며, 상세는 결제수단별 집계와 날짜 이동을 둔다", "affects": ["DOC-04", "DOC-05", "DOC-07"], "status": "완료", "requested_by": "기획 담당", "document_title": "Wireframe", "affects_titles": ["Flow Chart", "IA", "기능 명세"]}, {"id": "CH-352", "date": "2026-09-09" e": "Flow Chart", "affects_titles": []}, {"id": "CH-051", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "크게 보기 화면이 빈 화면으로 뜨던 문제 수정. 앞선 스타일 교체 작업에서 모달 스타일이 함께 지워진 것이 원인이며 흰색 기준으로 다시 정의함", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-050", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "정의된 처리 도형에 이동 표시를 넣고 마우스를 올리면 누를 수 있음을 알린다. 작도 중 오류가 나도 해당 Flow만 표시가 멈추고 문서는 계속 열린다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-049", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "Flow 작도를 2차원 배치로 다시 씀. 분기는 판단 도형 오른쪽으로 나가 도형이 이어지고, 조건은 연결선 위에 적는다. 되돌아가는 경로는 직각으로 꺾어 대상 도형 왼쪽으로 들어간다", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-048", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "정의된 처리 도형에 번호만 나오던 것을 Flow 이름과 함께 표시", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-047", "date": "2026-09-04", "type": "수정", "source": "사용자 요청", "document": "DOC-00", "summary": "분기 안의 단계를 글자가 아니라 도형으로 작도. 행사에서 상권, 매장으로 이어지는 순서를 화살표로 연결해 표시", "affects": [], "status": "완료", "requested_by": "기획 담당", "document_title": "구조·기준", "affects_titles": []}, {"id": "CH-046", "date": "2026-09-04", "type": "추가", "source": "내부 정리", "document": "DOC-05", "summary": "채널별 화면 전환 경로를 표로 정리하고 IA를 확정", "affects": ["DOC-06"], "status": "완료", "requested_by": "기획 담당", "document_title": "IA", "affects_titles": ["Wireframe"]}, {"id": "CH-045", "date": "2026-09-04", "type": "추가", "source": "사용자 요청", "document": "DOC-04", "summary": "Flow를 세 단계로 나눠 작성. 전체 Flow 5건, 화면별 Flow 71건을 더해 24건에서 100건이 됨", "affects": ["DOC-05"], "status": "완료", "requested_by": "기획 담당", "document_title": "Flow C
