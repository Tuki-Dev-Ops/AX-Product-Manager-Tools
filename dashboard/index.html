의 단말 연결 상태를 확인하고, 장애 단말을 사용 중지하거나 재개한다 |\n| FN-129 | 매장 개시 확정 | UT-01 | 하위가맹점 심사 결과를 반영하고 매장을 영업으로 바꾼다. 확정한 매장은 주문 채널에 노출하고 정산 대상에 넣는다 |\n| FN-128 | 행사 준비 현황 | UT-01 | 행사에 속한 상권과 매장, 개시 준비 상태를 한 화면에서 확인하고 미완료 매장에 안내를 보낸다 |\n| FN-126 | 매장별 정산 조회 | UT-01 | 결제대행사 지급 내역을 매장 단위로 조회한다. 플랫폼이 정산금액을 계산하지 않는다 |\n| FN-127 | 오류 로그 조회 | UT-01 | 배치와 알림 발송과 외부 연동 오류를 한 곳에서 조회하고 확인 처리한다 |\n| FN-125 | 이상 알림 발송 | UT-01 | 단말 미연결이 30분을 넘기면 매장에, 60분을 넘기면 본사에 알린다. 같은 행사에서 여러 건이 겹치면 묶어서 보낸다 |\n| FN-410 | 메뉴 수신 | UT-03 | 매장이 등록한 메뉴를 단말에 반영한다 |\n| FN-412 | 판매 메뉴 설정 | UT-02 | 그날 판매할 메뉴를 단말에서 열고 닫는다. 매장별 메뉴 설정의 노출 여부를 바꿔 다른 채널에도 함께 적용한다 |\n| FN-411 | 키오스크 접근성 지원 | UT-03 | 검증기준을 준수한 단말을 쓰고 위치를 음성으로 안내한다 |\n\n### 외부 POS 연동 (3단계와 병행)\n\n| ID | 기능 | 사용자 | 설명 |\n| --- | --- | --- | --- |\n| FN-501 | 매장·메뉴 제공 | 외부 POS | 매장과 메뉴 정보를 조회로 제공한다 |\n| FN-502 | 변경 통지 | 외부 POS | 변경 발생 시 매장 식별자와 변경 시각을 통지한다 |\n| FN-503 | 연동 계정 관리 | UT-01 | 연동 대상별 접근 키와 매장 범위를 관리한다 |\n\n## 6. 서비스 아키텍처\n\n### 6.1 시스템 구성\n\n```arch\n== 운영 주체 ==\n[본사]\n담당: 본사 운영자\n[매장]\n담당: 가맹 관리자\n[고객]\n이용: 웹앱 이용자, 키오스크 이용자\n== 채널 ==\n[운영 화면]\n어드민: 내부 어드민, 가맹 어드민\n[주문 화면]\n자사: 하이브리드 웹앱, 키오스크\n== 업무 도메인 ==\n[기준정보]\n관리: 행사, 상권, 브랜드, 매장\n[상품]\n관리: 카테고리, 메뉴, 옵션, 표시 정보, 매장별 가격, 품절\n[주문]\n관리: 주문 생성, 상태 전이, 접수, 취소\n[결제]\n관리: 승인, 취소, 결제 원장, 대사\n[매출]\n관리: 집계, 행사와 상권 비교\n== 외부 ==\n[결제 연계]\n외부: 결제대행사, 카드 단말\n[알림 연계]\n외부: 알림톡\n[채널 연계]\n외부: 외부 POS\n@ 본사 -> 운영 화면 : 기준정보와 상품 관리\n@ 매장 -> 운영 화면 : 매장 운영과 주문 접수\n@ 고객 -> 주문 화면 : 주문 요청\n@ 운영 화면 -> 기준정보 : 등록과 수정\n@ 운영 화면 -> 상품 : 등록과 수정\n@ 주문 화면 -> 주문 : 주문 생성 요청\n@ 기준정보 => 상품 : 소속 관계 참조\n@ 상품 -> 주문 화면 : 메뉴와 가격\n@ 상품 -> 채널 연계 : 변경 통지\n@ 주문 -> 결제 : 승인과 취소 요청\n@ 결제 -> 결제 연계 : 승인 요청\n@ 결제 -> 주문 : 승인 결과\n@ 주문 => 매출 : 집계 원본\n@ 결제 => 매출 : 집계 원본\n@ 매출 -> 운영 화면 : 조회 결과\n@ 주문 -> 알림 연계 : 상태 알림\n!도메인은 여섯 개로 묶었다. 품절, 카테고리, 행사를 각각 독립 시스템으로 두지 않는다. 변경 주기와 관리 주체가 같으면 한 도메인 안에 둔다.\n!점선은 데이터 참조와 동기화다. 실선은 업무 요청과 결과 전달이다.\n!배포 도메인을 두지 않는다. 매장이 원본을 가지므로 내려보낼 것이 없다.\n!결제를 주문에서 분리한 근거는 셋이다. 외부 응답에 좌우되고, 실패 경로가 주문과 다르며, 보관 기간과 접근 통제 기준이 다르다.\n!매출은 파생 도메인이다. 주문과 결제를 원본으로 삼고 자체 원본을 갖지 않는다.\n!외부 POS는 채널이 아니라 외부 시스템이다. 우리가 만들지 않으며 화면과 주문 처리를 통제하지 않는다.\n```\n\n### 6.2 내부 어드민\n\n본사 운영자가 쓴다. 기준정보를 만들고, 가맹 관리자 계정을 발급하고, 전체 매장의 결제 실적을 본다.\n\n메뉴는 만들지 않는다. 매장이 등록한다. 내려보낼 것이 없으므로 배포 화면도 두지 않는다.\n\n가맹 관리자 계정은 여기서만 만든다. 가맹 어드민에 회원가입이 없다. 계정을 만들 때 담당 매장 범위를 함께 지정한다.\n\n```arch\n== 이용자 ==\n[본사 운영자]\n권한: 전체 매장\n== 화면 ==\n[기준정보 화면]\n메뉴: 대시보드, 행사, 상권, 매출, 정산, 시스템\n[매출 화면]\n메뉴: 매출 조회, 행사와 상권 비교\n[시스템 화면]\n메뉴: 계정 관리, 접속기록, 단말 상태, 연동 계정\n== 도메인 ==\n[기준정보]\n원본: 행사, 상권, 브랜드, 매장\n[매출]\n파생: 집계 테이블\n[인증과 권한]\n원본: 계정, 역할, 담당 매장 범위\n@ 본사 운영자 -> 기준정보 화면 : 등록과 수정\n@ 본사 운영자 -> 매출 화면 : 실적 조회\n@ 본사 운영자 -> 시스템 화면 : 계정 발급과 점검\n@ 기준정보 화면 -> 기준정보 : 저장\n@ 매출 화면 => 매출 : 조회\n@ 시스템 화면 -> 인증과 권한 : 계정과 범위 지정\n!본사는 메뉴를 만들지 않는다. 배포 화면을 두지 않는다.\n!가맹 관리자 계정은 본사가 발급한다. 가맹 어드민에 회원가입 절차를 두지 않는다.\n!매출 화면은 원본을 직접 읽지 않는다. 집계 테이블을 읽는다.\n```\n\n### 6.3 가맹 어드민\n\n가맹 관리자가 쓴다. 담당 매장의 메뉴를 만들고 주문을 받는다.\n\n메뉴, 카테고리, 옵션, 판매가, 표시 정보, 품절이 모두 여기에 있다. 저장하면 그 매장의 주문 채널에 반영된다. 발행 절차가 없다.\n\n표시 정보를 입력하지 않은 메뉴는 판매 불가 상태로 남는다. 누락이 운영으로 넘어가지 않게 막는다.\n\n```arch\n== 이용자 ==\n[가맹 관리자]\n권한: 담당 매장\n== 화면 ==\n[매장 홈]\n메뉴: 접수 대기 현황, 단말 설정\n[메뉴 관리 화면]\n메뉴: 메뉴 목록, 등록과 수정, 표시 정보\n분류: 카테고리, 옵션 그룹, 판매가, 품절\n[주문 화면]\n메뉴: 주문 접수, 주문 상세, 주문서 출력\n[매장 정보 화면]\n메뉴: 정보 조회, 정보 변경, 영업 상태\n[매출 화면]\n메뉴: 담당 매장 매출\n== 도메인 ==\n[상품]\n원본: 카테고리, 메뉴, 옵션, 표시 정보, 판매가, 품절\n[주문]\n원본: 주문, 주문 상태\n[기준정보]\n조회: 매장 정보\n[매출]\n파생: 담당 매장 집계\n@ 가맹 관리자 -> 매장 홈 : 현황 확인\n@ 가맹 관리자 -> 메뉴 관리 화면 : 등록과 수정\n@ 가맹 관리자 -> 주문 화면 : 접수와 상태 변경\n@ 가맹 관리자 -> 매장 정보 화면 : 정보 변경\n@ 가맹 관리자 -> 매출 화면 : 실적 조회\n@ 메뉴 관리 화면 -> 상품 : 저장\n@ 주문 화면 -> 주문 : 상태 전이\n@ 매장 정보 화면 => 기준정보 : 정보 변경과 이력 기록\n@ 매출 화면 => 매출 : 담당 범위 조회\n!메뉴의 원본은 매장이다. 본사가 만들지 않는다.\n!저장과 반영을 분리하지 않는다. 저장하면 주문 채널에 반영된다.\n!표시 정보 미입력 메뉴는 판매 불가 상태로 둔다.\n!매장 정보는 매장이 바로 바꾼다. 본사 확정을 두지 않고 변경 이력만 남긴다.\n!조회 범위는 담당 매장으로 제한한다.\n```\n\n### 6.4 하이브리드 웹앱\n\n고객이 쓴다. 회원가입이 없다. 주문번호와 휴대폰번호로 주문을 조회한다.\n\n매장 선택 화면을 두지 않는다. QR에 담긴 매장으로 바로 들어간다. 매장을 고르는 절차가 없으므로 잘못된 매장에 주문하는 일이 생기지 않는다.\n\n앱스토어에 등록하지 않으므로 결제 앱에서 돌아올 때 상점 앱으로 복귀하는 경로가 없다. 결과를 리다이렉트로 확정하지 않는다.\n\n```arch\n== 이용자 ==\n[고객]\n접근: QR, 링크\n== 화면 ==\n[진입 화면]\n메뉴: QR 진입, 수령 방식\n[주문 화면]\n메뉴: 메뉴 목록, 메뉴 상세, 장바구니\n[결제 화면]\n메뉴: 주문서, 결제 진행, 주문 완료\n[조회 화면]\n메뉴: 주문 조회, 주문 상태, 주문 취소\n== 도메인 ==\n[상품]\n조회: 매장 메뉴와 가격\n[주문]\n원본: 주문, 주문 상태\n[결제]\n원본: 승인, 취소, 결제 원장\n== 외부 ==\n[결제대행사]\n처리: 인증, 승인, 취소\n[알림톡]\n처리: 상태 통지\n@ 고객 -> 진입 화면 : QR 스캔\n@ 고객 -> 주문 화면 : 메뉴 선택\n@ 고객 -> 결제 화면 : 주문서 작성과 결제\n@ 고객 -> 조회 화면 : 주문번호와 휴대폰번호\n@ 상품 => 주문 화면 : 메뉴와 가격\n@ 결제 화면 -> 주문 : 주문 생성 요청\n@ 주문 -> 결제 : 승인 요청\n@ 결제 -> 결제대행사 : 승인과 취소\n@ 결제대행사 => 결제 : 승인 결과 웹훅\n@ 주문 -> 알림톡 : 접수와 완료 통지\n!결제 결과를 리다이렉트로 확정하지 않는다. 서버 승인과 웹훅, 조회를 함께 둔다.\n!승인에 성공해야 주문을 만든다. 실패하면 주문이 남지 않는다.\n!회원 개념이 없다. 주문번호와 휴대폰번호로만 조회한다.\n!매장 선택 화면이 없다. QR에 매장이 담겨 있지 않으면 진입하지 않는다.\n```\n\n### 6.5 키오스크\n\n매장에 설치한다. 고객이 주문하고 가맹 관리자가 관리자 모드로 들어온다.\n\n카드 승인은 단말이 처리한다. 플랫폼은 결과만 받는다. 네트워크가 끊겨도 마지막으로 받은 메뉴로 화면을 유지한다.\n\n```arch\n== 이용자 ==\n[고객]\n행위: 현장 주문\n[가맹 관리자]\n행위: 관리자 모드\n== 화면 ==\n[주문 화면]\n메뉴: 대기, 취식유형, 메뉴 선택, 장바구니\n[결제 화면]\n메뉴: 결제수단, 단말 승인, 완료\n[관리자 화면]\n메뉴: 메뉴 갱신, 판매 메뉴 설정, 품절 설정, 단말 상태\n== 단말 ==\n[키오스크 단말]\n보관: 메뉴 마스터 사본\n처리: 화면 표시, 주문서 출력\n== 도메인 ==\n[상품]\n조회: 매장 메뉴\n[주문]\n원본: 주문, 주문번호\n[결제]\n원본: 승인 결과, 거래 기록\n== 외부 ==\n[카드 단말]\n처리: 현장 승인, 망취소\n@ 고객 -> 주문 화면 : 메뉴 선택\n@ 고객 -> 결제 화면 : 결제 진행\n@ 가맹 관리자 -> 관리자 화면 : 인증 후 진입\n@ 상품 => 키오스크 단말 : 유휴와 결제 완료 시점에 수신\n@ 키오스크 단말 -> 주문 화면 : 로컬 사본으로 표시\n@ 결제 화면 -> 카드 단말 : 승인 요청\n@ 카드 단말 -> 결제 : 승인 결과\n@ 결제 -> 주문 : 주문 생성\n@ 관리자 화면 -> 결제 : 거래 조회와 환불\n!카드 승인은 단말과 카드사 사이에서 처리한다. 플랫폼은 결과만 받는다.\n!네트워크가 끊기면 마지막으로 받은 메뉴로 화면을 유지한다. 주문 접수는 복구 후 처리한다.\n!메뉴 마스터는 주문 중에 바뀌지 않는다. 유휴 시점과 결제 완료 시점에만 받는다.\n```\n\n### 6.6 결제와 정산\n\n주문에서 분리한 영역이다. 외부 응답에 좌우되고 실패 경로가 주문과 다르다.\n\n플랫폼은 대금을 수취하지 않는다. 결제대행사가 매장에 직접 정산하고 우리는 대사만 한다.\n\n```arch\n== 요청 ==\n[주문]\n요청: 승인, 취소\n== 처리 ==\n[결제]\n관리: 금액 검증, 승인, 취소, 결제 원장\n대사: 거래대사, 정산 대사, 입금대사\n== 외부 ==\n[결제대행사]\n처리: 승인 중계, 매장 정산\n[카드 단말]\n처리: 현장 승인\n[카드사]\n처리: 매입, 대금 지급\n@ 주문 -> 결제 : 승인과 취소 요청\n@ 결제 -> 결제대행사 : 승인 요청. 웹앱\n@ 결제 -> 카드 단말 : 승인 요청. 키오스크\n@ 결제대행사 -> 카드사 : 매입 요청\n@ 카드사 -> 결제대행사 : 대금 입금\n@ 결제대행사 => 결제 : 승인 결과와 정산 내역\n@ 결제 -> 주문 : 승인과 취소 결과\n!플랫폼은 자금 경로에 없다. 결제대행사가 매장에 직접 정산한다.\n!정산 내역은 대사에만 쓴다. 매장별 정산금액을 계산하지 않는다.\n!대사는 거래, 정산, 입금 세 단계로 나눈다. 조회 기준일과 취소 상계 여부를 단계마다 정한다.\n```\n\n### 6.7 시스템별 책임\n\n| 도메인 | 존재 이유 | 관리 데이터 | 주요 연계 |\n| --- | --- | --- | --- |\n| 기준정보 | 다른 모든 도메인이 참조하는 조직과 장소를 한 곳에서 정한다 | 행사, 상권, 브랜드, 매장, 소속 관계 | 상품, 주문, 매출, 외부 POS |\n| 상품 | 매장이 무엇을 얼마에 파는지 정한다 | 카테고리, 메뉴, 옵션, 알레르기와 원산지, 판매가, 품절 상태 | 주문, 외부 POS |\n| 주문 | 주문의 생성과 상태를 관리한다 | 주문, 주문 항목, 주문 상태, 취소 사유 | 결제, 매출, 매장 화면 |\n| 결제 | 승인과 취소를 처리하고 거래 기록을 보관한다 | 결제 원장, 승인번호, 매입 상태, 취소 이력, 대사 결과 | 주문, 매출, 결제 연계 |\n| 매출 | 주문과 결제를 집계해 비교 가능한 형태로 만든다 | 집계 테이블, 잠정과 확정 구분 | 운영 화면 |\n| 인증과 권한 | 누가 무엇에 접근하는지 판정한다 | 계정, 역할, 담당 범위 | 모든 도메인 |\n| 기록 | 누가 무엇을 했는지 남긴다 | 접속기록, 작업 이력, 단말 상태 | 운영 화면 |\n| 전달 | 외부로 나가는 알림과 파일을 처리한다 | 발송 이력, 이미지 | 알림 연계 |\n\n### 6.8 기준 데이터\n\n각 데이터의 원본이 되는 도메인을 정한다. 원본이 아닌 곳에서는 복사본을 참조만 한다.\n\n| 데이터 | 기준 도메인 | 참조하는 곳 |\n| --- | --- | --- |\n| 행사, 상권, 브랜드, 매장 | 기준정보 | 상품, 주문, 매출, 외부 POS |\n| 카테고리, 메뉴, 옵션, 표시 정보 | 상품 | 주문, 외부 POS |\n| 판매가 | 상품 | 주문, 외부 POS |\n| 품절 상태 | 상품 | 주문, 외부 POS |\n| 주문과 주문 상태 | 주문 | 매장 화면, 매출 |\n| 결제 승인, 취소, 매입 상태 | 결제 | 주문, 매출 |\n| 정산 내역 | 외부 결제대행사 | 결제. 대사에만 쓴다 |\n| 매출 집계 | 매출 | 운영 화면 |\n\n두 가지를 명시한다.\n\n정산 내역은 우리가 원본이 아니다. 결제대행사가 산출하고 우리는 대조만 한다. 플랫폼이 정산금액을 계산하면 전자지급결제대행업 등록 대상이 된다.\n\n매출은 결제 승인 금액을 기준으로 집계한다. 주문 금액은 참조값이다. 부분취소가 있으면 두 값이 달라진다.\n\n### 6.9 주요 흐름\n\n#### 매장 개설\n\n```text\n[본사] 기준정보에 행사, 상권, 브랜드, 매장 등록\n ↓\n[본사] 가맹 관리자 계정 발급\n ↓\n[매장] 카테고리, 메뉴, 옵션, 표시 정보 등록\n ↓\n표시 정보 입력 완료?\n ├─ 아니오 → 판매 불가 상태로 저장\n └─ 예 → 다음\n ↓\n주문 화면과 외부 POS가 반영\n```\n\n#### 주문과 결제\n\n```text\n고객이 주문 화면에서 장바구니 확정\n ↓\n주문이 금액을 서버에서 재계산\n ↓\n금액 일치?\n ├─ 아니오 → 승인을 요청하지 않는다\n └─ 예 → 다음\n ↓\n결제가 승인 요청\n ↓\n승인 성공?\n ├─ 아니오 → 주문을 만들지 않는다\n └─ 예 → 다음\n ↓\n주문 생성. 상태는 접수 대기\n ↓\n매장 화면에 전달\n ↓\n매장이 접수. 상태 전이\n ↓\n수령 완료\n ↓\n매출이 결제 원장을 읽어 집계\n```\n\n#### 취소\n\n```text\n고객 또는 매장이 취소 요청\n ↓\n주문이 취소 가능 여부 판정\n ↓\n조리 시작 전?\n ├─ 아니오 → 매장 문의로 안내\n └─ 예 → 다음\n ↓\n결제가 취소 요청\n ↓\n취소 성공?\n ├─ 아니오 → 주문 상태를 바꾸지 않는다\n └─ 예 → 주문 상태 = 취소\n ↓\n매출이 취소 일자에 차감\n```\n\n주문을 만들기 전에 결제를 승인한다. 승인에 실패하면 주문이 남지 않는다. 취소는 반대로 결제 취소가 성공해야 주문 상태를 바꾼다. 두 쪽 모두 결제가 확정된 뒤에 주문이 움직인다.\n\n### 6.10 연결의 성격\n\n| 구간 | 성격 | 오가는 것 |\n| --- | --- | --- |\n| 기준정보 → 상품 | 데이터 참조 | 브랜드와 매장의 소속 관계 |\n| 상품 → 주문 화면 | 데이터 제공 | 메뉴와 가격 |\n| 상품 → 외부 POS | 이벤트 전달 | 변경 통지. 상대가 조회해 간다 |\n| 주문 화면 → 주문 | 업무 요청 | 주문 생성 요청 |\n| 주문 → 결제 | 업무 요청 | 승인 요청과 취소 요청 |\n| 결제 → 결제 연계 | API 연계 | 승인, 취소, 대사 조회 |\n| 결제 연계 → 결제 | 이벤트 전달 | 승인 결과 웹훅 |\n| 결제 → 주문 | 상태 변경 | 승인과 취소 결과 |\n| 주문 → 매장 화면 | 이벤트 전달 | 신규 주문 알림 |\n| 주문, 결제 → 매출 | 데이터 동기화 | 집계 원본 |\n| 전달 → 알림 연계 | API 연계 | 발송 요청 |\n\n### 6.11 설계 결정이 필요한 사항\n\n| 항목 | 결정할 것 | 정해지지 않으면 |\n| --- | --- | --- |\n| 접수 실패 시 취소 주체 | 매장이 접수하지 않아 자동 취소될 때 결제 취소를 주문이 요청하는가, 매장 화면이 요청하는가 | 취소 실패 시 책임 지점이 불분명해진다 |\n| 매출 확정 기준 | 승인 완료를 기준으로 볼지 매입 완료를 기준으로 볼지 | 매입 지연 건의 매출 계상 시점이 달라진다 |\n| 외부 POS의 역할 범위 | 조회 제공까지인지 주문 유입까지인지 | 주문 유입이 생기면 주문 도메인의 경계가 바뀐다 |\n\n### 6.12 기술 구성\n\n업무 도메인을 실행 단위와 저장소에 배치한 결과다.\n\n```arch\n== 접점 ==\n[고객 채널]\n자사: 하이브리드 웹앱, 키오스크\n[운영 채널]\n어드민: 내부 어드민, 가맹 어드민\n[외부 채널]\n연동: 외부 POS\n== 처리 ==\n[진입]\n공통: 로드밸런서, 정적 자원 배포\n[동기 실행]\n서비스: 주문 API, 어드민 API\n[비동기 실행]\n작업: 집계 배치, 알림 워커\n== 보관 ==\n[운영 데이터]\n원본: 기준정보, 상품, 주문, 결제\n보조: 캐시, 이미지 저장소\n[분석 데이터]\n파생: 매출 집계 테이블\n기록: 접속기록, 작업 이력, 단말 상태\n== 외부 ==\n[결제]\n연동: 결제대행사, 카드 단말\n[알림]\n발송: 알림톡\n@ 고객 채널 -> 진입 : 주문과 결제 요청\n@ 운영 채널 -> 진입 : 관리 요청\n@ 외부 채널 -> 진입 : 조회 요청\n@ 진입 -> 동기 실행 : 인증과 권한 확인 후 전달\n@ 동기 실행 -> 운영 데이터 : 읽기와 쓰기\n@ 동기 실행 -> 비동기 실행 : 작업 등록\n@ 비동기 실행 -> 운영 데이터 : 읽기\n@ 비동기 실행 -> 분석 데이터 : 집계 결과 적재\n@ 비동기 실행 -> 알림 : 발송 요청\n@ 동기 실행 -> 결제 : 승인과 취소\n@ 분석 데이터 => 동기 실행 : 조회 응답\n!어드민 접속은 IP 제한과 안전한 인증수단을 적용한다. 계정과 비밀번호만으로는 요건을 충족하지 않는다.\n!집계 배치는 주문 API와 다른 실행 단위로 배포한다. 같은 프로세스에 두면 대량 작업이 주문 처리 자원을 잠식한다.\n!카드 단말 승인은 매장 키오스크와 단말 사이에서 처리한다. 플랫폼은 승인 결과만 받는다.\n!개인정보는 서울 리전 밖으로 내보내지 않는다. 국외이전 절차를 피할 수 있다.\n!메시지 큐는 키오스크 단계에서 도입한다. 그 전에는 커밋 후 발행과 실패 로그로 처리한다.\n```\n\n## 7. 시스템 연계 구조\n\n### 본사 운영자\n\n본사 운영자는 기준정보를 등록하고, 매장 계정을 발급하며, 전체 매출과 정산 대사를 확인한다.\n\n```arch\n== 이용자 ==\n[본사 운영자]\n업무: 기준정보 등록, 계정 발급, 매출 확인, 정산 대사\n== 운영 화면 ==\n[내부 어드민]\n기준정보: 행사, 상권, 브랜드, 매장\n운영: 계정 발급, 매출 통계, 정산 대사\n[가맹 어드민]\n발급 결과: 매장 계정\n== 데이터 ==\n[플랫폼 데이터]\n원본: 기준정보, 주문, 결제\n파생: 매출 집계\n== 외부 시스템 ==\n[결제대행사]\n제공: 거래 내역, 정산 내역\n@ 본사 운영자 -> 내부 어드민 : 등록과 조회\n@ 내부 어드민 -> 가맹 어드민 : 계정 발급\n@ 내부 어드민 -> 플랫폼 데이터 : 기준정보 저장\n@ 플랫폼 데이터 => 내부 어드민 : 매출과 결제 내역\n@ 결제대행사 => 내부 어드민 : 대사 대상 내역\n!본사는 메뉴와 판매가를 직접 다루지 않는다. 상품 정보의 주체는 매장이다.\n!정산 내역은 대사에만 쓴다. 플랫폼이 정산금액을 계산하지 않는다.\n```\n\n### 가맹 관리자\n\n매장은 메뉴와 판매가를 등록하고 주문을 접수한다. 저장한 내용은 플랫폼 데이터를 거쳐 주문 채널과 외부 시스템에 반영된다.\n\n```arch\n== 이용자 ==\n[가맹 관리자]\n업무: 메뉴 등록, 주문 접수, 매출 확인\n== 운영 화면 ==\n[가맹 어드민]\n상품: 카테고리, 메뉴, 옵션, 판매가\n운영: 주문 접수, 품절, 매장 정보\n== 데이터 ==\n[플랫폼 데이터]\n원본: 상품, 주문, 결제\n파생: 매출 집계\n== 반영 대상 ==\n[하이브리드 웹앱]\n반영: 메뉴, 가격, 품절\n[키오스크]\n반영: 메뉴, 가격, 품절\n[외부 POS]\n반영: 변경 통지 후 조회\n[알림톡]\n반영: 주문 상태 통지\n@ 가맹 관리자 -> 가맹 어드민 : 등록과 접수\n@ 가맹 어드민 -> 플랫폼 데이터 : 메뉴와 주문 상태 저장\n@ 플랫폼 데이터 => 가맹 어드민 : 주문과 매출 조회\n@ 플랫폼 데이터 -> 하이브리드 웹앱 : 메뉴와 가격\n@ 플랫폼 데이터 -> 키오스크 : 메뉴와 가격\n@ 플랫폼 데이터 -> 외부 POS : 변경 통지\n@ 플랫폼 데이터 -> 알림톡 : 주문 상태 통지\n!외부 POS는 우리가 만들지 않는다. 변경 통지로 매장 식별자와 변경 시각만 보내고 상대가 조회해 간다.\n!키오스크는 유휴 시점과 결제 완료 시점에 메뉴를 확인한다. 주문 중에는 화면이 바뀌지 않는다.\n```\n\n### 고객\n\n고객은 주문 채널에서 주문하고 결제한다. 결제 승인 경로는 채널에 따라 나뉜다.\n\n```arch\n== 이용자 ==\n[고객]\n업무: 메뉴 선택, 주문, 결제\n== 주문 채널 ==\n[하이브리드 웹앱]\n처리: QR 진입, 비회원 주문, 결제대행사 결제\n[키오스크]\n처리: 현장 주문, 카드 단말 결제\n== 데이터 ==\n[플랫폼 데이터]\n원본: 주문, 주문 항목, 결제\n== 외부 시스템 ==\n[결제대행사]\n처리: 승인, 취소\n[카드 단말]\n처리: 현장 승인\n[알림톡]\n처리: 고객 통지\n@ 고객 -> 하이브리드 웹앱 : QR 진입 후 주문\n@ 고객 -> 키오스크 : 현장 주문\n@ 하이브리드 웹앱 -> 플랫폼 데이터 : 주문 저장\n@ 키오스크 -> 플랫폼 데이터 : 주문 저장\n@ 플랫폼 데이터 -> 결제대행사 : 승인 요청\n@ 플랫폼 데이터 -> 카드 단말 : 승인 요청\n@ 결제대행사 => 플랫폼 데이터 : 승인 결과\n@ 카드 단말 => 플랫폼 데이터 : 승인 결과\n@ 플랫폼 데이터 -> 알림톡 : 주문 상태 통지\n!웹앱은 결제대행사, 키오스크는 카드 단말을 쓴다. 두 경로의 결제 원장은 하나로 합친다.\n!점선은 결과 수신이다. 실선은 요청과 통지다.\n```\n\n### 연계 상세\n\n| 연계 대상 | 방향 | 내용 | 방식 | 갱신 시점 |\n| --- | --- | --- | --- | --- |\n| PG | 양방향 | 결제 인증, 승인, 취소 | 결제창 호출과 서버 승인 | 결제 시점 |\n| PG | 수신 | 결제 상태 변경 | 웹훅 | 상태 변경 시 |\n| VAN | 양방향 | 카드 승인, 취소, 망취소 | 단말 에이전트 | 결제 시점 |\n| 카카오 알림톡 | 발신 | 주문 접수, 준비 완료 | 발송 요청 | 상태 변경 시 |\n| 외부 POS | 발신 | 변경 통지 | 웹훅. 매장 식별자와 변경 시각만 전송 | 변경 즉시 |\n| 외부 POS | 수신 | 매장·메뉴 조회 | 조회 요청 | 통지 수신 시, 백업 폴링 30분 |\n| 외부 POS | 발신 | 품절과 일시중지 | 항목 단위 별도 경로 | 실시간 |\n| 키오스크 | 발신 | 메뉴 마스터 | 조회 | 유휴 시점과 결제 완료 시점 |\n| 키오스크 | 수신 | 주문과 승인 결과 | 전송. 단절 시 대기 후 재전송 | 실시간 |\n| 매장 프린터 | 발신 | 주문서 | 출력 요청. 실패 시 화면에 표시 | 주문 수락 시 |\n\n### 결제 데이터 관리\n\n플랫폼 자체 결제 식별자를 최상위 키로 두고 채널별 식별자를 덧붙인다. 승인번호는 PG와 VAN 공통이다. 취소 시 원거래 참조 키는 채널마다 다르다.\n\n매출은 채널을 통합해 집계한다. 정산은 통합하지 않는다. VAN 대금은 카드사가 가맹점에 직접 지급하고 플랫폼을 거치지 않는다.\n\n## 8. 화면 분류 기준\n\n화면을 사용자로 나누지 않는다. 그 화면이 다루는 업무 영역과 그 업무의 주체로 나눈다.\n\n사용자로 나누면 같은 업무를 두 번 정의하게 된다. 본사와 매장이 같은 데이터를 보는 화면이 각각 생기고, 규칙이 갈라진다.\n\n| 기준 | 내용 |\n| --- | --- |\n| 1차 분류 | 업무 영역으로 나눈다. 기준정보, 상품, 주문, 매출, 정산, 단말, 알림, 계정과 보안, 운영 아홉 개다 |\n| 2차 분류 | 그 업무를 실행하는 주체가 있는 쪽에 화면을 둔다. 본사가 실행하면 내부 어드민, 매장이 실행하면 가맹 어드민이다 |\n| 상대의 접근 | 반대쪽이 그 화면을 볼 필요가 있으면 화면을 새로 만들지 않는다. 같은 화면에 데이터 범위와 동작 권한을 다르게 준다 |\n| 화면을 나누는 경우 | 같은 데이터를 보더라도 답하려는 질문이 다르면 화면을 나눈다 |\n| 화면ID | 앞자리는 최초 정의 위치다. 소속이 바뀌어도 식별자는 바꾸지 않는다 |\n\n업무 영역별 주체와 상대의 접근 범위는 다음과 같다.\n\n| 업무 영역 | 실행 주체 | 화면 위치 | 상대의 접근 |\n| --- | --- | --- | --- |\n| 기준정보 | 본사 | 내부 어드민 | 매장은 자기 매장 정보를 조회하고 변경을 요청한다 |\n| 상품 | 매장 | 가맹 어드민 | 본사는 관여하지 않는다. 시스템이 필수 항목 누락만 막는다 |\n| 주문 | 매장 | 가맹 어드민 | 본사는 매장 상세의 주문 탭에서 조회한다 |\n| 매출 | 본사와 매장 | 양쪽 | 질문이 달라 화면을 나눈다. 아래에 근거를 적는다 |\n| 정산 | 본사 | 내부 어드민 | 매장은 접근하지 않는다 |\n| 단말 | 매장 | 가맹 어드민 | 본사는 같은 화면을 전체 범위로 보고 장애 시 사용 중지한다 |\n| 알림 | 매장 | 가맹 어드민 | 본사는 같은 화면을 전체 범위로 조회한다 |\n| 계정과 보안 | 본사 | 내부 어드민 | 매장은 자기 비밀번호만 바꾼다 |\n| 운영 | 본사 | 내부 어드민 | 매장은 접근하지 않는다 |\n\n매출만 화면을 둘로 나눈다. 본사는 매장 간 비교로 어느 매장과 상권이 잘 되는지를 묻고, 매장은 시간과 메뉴로 무엇이 얼마나 팔렸는지를 묻는다. 같은 원본을 보지만 축이 다르다. 한 화면에 두 축을 넣으면 양쪽 모두 쓰기 어려워진다.\n\n단말과 알림은 화면을 하나만 둔다. 두 주체가 같은 질문을 하고 같은 값을 본다. 범위와 할 수 있는 동작만 다르다.\n\n## 9. 권한\n\n역할과 데이터 범위를 분리한다. 역할은 무엇을 할 수 있는지만 정하고, 어느 매장이 보이는지는 조직 계층으로 판정한다.\n\n| 역할 | 데이터 범위 | 주요 권한 |\n| --- | --- | --- |\n| 본사 운영자 | 전체 | 행사·상권·브랜드·매장 등록, 가맹 관리자 계정 발급, 전체 매출 조회, 정산 대사, 배치 실행 관리, 접속기록과 계정 변경 이력 점검, 개인정보 파기, 대행 접속, 연동 계정 관리 |\n| 가맹 관리자 | 담당 매장 | 매장 정보 조회와 변경, 영업 상태 변경, 메뉴와 카테고리와 옵션과 판매가 관리, 표시 정보 입력, 품절 설정, 메뉴 가져오기, 주문 접수, 알림 발송 이력 확인, 담당 매장 매출 조회 |\n| 고객 | 자기 주문 | 메뉴 조회, 주문, 결제, 주문번호와 휴대폰번호로 조회 |\n| 외부 POS | 허용된 매장 | 매장·메뉴 조회 |\n\n권한이 있다는 것과 특정 매장이 보인다는 것은 별개 통제다. 매장이 늘어날 때마다 권한 정의를 고치지 않도록 데이터 범위는 조직 계층으로 판정한다.\n\n메뉴와 카테고리 생성은 매장이 한다. 본사는 메뉴를 만들지 않는다. 가맹 관리자 계정은 본사가 발급하고 담당 매장 범위를 지정한다.\n\n## 10. 용어 정의\n\n문서 전체에서 같은 뜻으로 쓴다. 용어와 쓰지 않는 표기는 `_data/terms.yaml`에 있고\n`python tools/check_terms.py`로 문서와 대조한다.\n\n| 용어 | 정의 |\n| --- | --- |\n| 행사 | 시작일과 종료일을 가진 운영 단위. 상설 매장은 종료일 없는 상시 행사에 속한다 |\n| 상권 | 행사 안에서 매장을 묶는 지역 구분 단위 |\n| 브랜드 | 카테고리와 메뉴를 소유하는 단위 |\n| 매장 | 실제 판매가 일어나는 장소. 브랜드 하나에 속하고 지점번호를 갖는다 |\n| 지점번호 | 브랜드 안에서 매장을 구분하는 일련번호 |\n| 단말 | 주문과 결제에 쓰는 장치. 키오스크, 카드 단말, 주문서 프린터를 아우른다 |\n| 본사 운영자 | 내부 어드민을 쓰는 아이오더 직원 |\n| 가맹 관리자 | 가맹 어드민을 쓰는 매장 운영자 |\n| 고객 | 웹앱이나 키오스크로 주문하는 사람 |\n| 매장별 메뉴 설정 | 매장과 메뉴를 잇는 연결 객체. 판매가, 노출 여부, 품절 상태를 담는다 |\n| 본사 통제 | 매장에서 메뉴 설정을 바꿀 수 없는 상태 |\n| 매장 통제 | 매장이 자기 매장의 판매가, 노출 여부, 품절 상태를 바꿀 수 있는 상태 |\n| 카테고리 | 메뉴를 묶는 관리용 분류 |\n| 메뉴 | 판매 단위. 원산지와 알레르기 정보를 속성으로 갖는다 |\n| 옵션 그룹 | 메뉴에 연결하는 선택 묶음 |\n| 옵션 항목 | 옵션 그룹 안의 개별 선택지 |\n| 망취소 | 승인 결과를 판단할 수 없을 때 원 승인을 되돌리는 처리 |\n| 주문서 | 매장 프린터로 출력하는 조리용 출력물 |\n| 정산계좌 | 결제대행사가 대금을 보내는 계좌 |\n| 결제대행사 | 결제 승인과 정산을 맡는 외부 사업자 |\n| 확인 팝업 | 되돌릴 수 없는 처리 전에 한 번 더 묻는 팝업 |\n| 결과 없음 | 조회 결과가 하나도 없을 때 목록 자리에 표시하는 화면 |\n| 개설 준비 | 가맹 관리자가 매장을 등록한 뒤 본사가 개시를 확정하기 전까지의 상태 |\n| 대행 접속 | 본사가 가맹 어드민 화면에 대신 접속하는 것 |\n\n주문 상태값은 접수 대기, 접수 완료, 조리 중, 조리 완료, 수령 완료, 취소를 쓴다. 취소는 접수 대기와 접수 완료에서만 가능하며, 접수 완료 후 1분이 지나면 조리 중으로 자동 전환되어 취소할 수 없다. 매장 상태값은 개설 준비, 영업, 일시중지, 종료, 폐점을 쓴다. 개설 준비는 가맹 관리자가 등록한 뒤 본사가 개시를 확정하기 전까지다. 종료는 재배치할 수 있고 폐점은 하지 않는다.\n\n## 11. 제약\n\n| 구분 | 내용 |\n| --- | --- |\n| 어드민 인증 | 외부에서 접속하는 모든 어드민 사용자에게 안전한 인증수단을 적용한다. 계정과 비밀번호만으로는 요건을 충족하지 않는다 |\n| 접속기록 | 계정, 일시, 접속지, 처리한 정보주체, 수행업무를 남기고 1년 이상 보관하며 월 1회 점검한다. 대행 접속은 실제 조작자와 대상 계정을 함께 기록한다 |\n| 거래기록 | 대금결제와 재화 공급 기록을 5년간 보존한다 |\n| 원산지 표시 | 모든 메뉴판에 표시한다. 모바일 메뉴판과 키오스크 화면도 대상으로 본다. 글자 크기는 메뉴 이름과 같거나 커야 한다 |\n| 알레르기·영양성분 | 메뉴 단위로 등록하며 필수 입력이다. 법정 표시 의무는 브랜드의 직영과 가맹 합산 50개 이상일 때 발생하나 그와 무관하게 항상 받는다. 영양성분 의무 항목은 열량, 당류, 단백질, 포화지방, 나트륨 5종이다. 매장 메뉴판에서 열량은 식품명 또는 가격 활자 크기의 80퍼센트 이상으로 표시한다 |\n| 키오스크 접근성 | 접근성 의무가 시행 중이다. 검증기준 준수 단말과 음성안내장치가 원칙이다 |\n| 오프라인 결제 | 설계하지 않는다. 국내 VAN 승인은 온라인 실시간이 전제다 |\n| 카드정보 | 저장하지 않는다. PG 인증결제와 서버 승인 구조를 쓴다 |\n| 대금 수취 | 플랫폼이 대금을 수취하지 않는다. 카드 대금은 결제대행사와 카드사가 가맹점에 직접 지급한다 |\n| 선불충전 | 도입하지 않는다. 포인트와 기프트 기능을 두지 않는다 |\n| 회원 | 하이브리드 웹앱에 회원 개념을 두지 않는다. 모든 주문은 비회원 주문이다 |\n| 주문자 개인정보 | 이름과 휴대폰번호를 주문 처리 목적으로만 쓴다. 수집 시 이용 목적과 보유 기간을 안내하고 동의를 받는다 |\n| 메뉴 관리 | 매장이 자기 메뉴를 등록하고 관리한다. 본사는 메뉴를 만들지 않으며 배포 절차를 두지 않는다 |\n"}, {"no": 4, "id": "DOC-04", "title": "Flow Chart", "file": "docs/04_Flow.md", "category": "설계", "status": "확정", "progress": 100, "eta": "", "version": "3.4", "updated": "2026-09-08", "inherits_titles": ["서비스 구조"], "content": "# 04. Flow Chart\n\n## 1. 전체 Flow\n\n### FL-001 서비스 전체 흐름\n\n기준정보를 만들어 주문 채널로 내보내고, 고객 주문을 받아 매출로 집계하기까지의 전체 순서다. 네 채널이 하나의 업무로 이어지는 모습을 본다.\n\n```text\n서비스 개시\n ↓\n[본사] FL-101\n ↓\n[본사] 기준정보 확정\n ├─ 행사 → 상권 → 매장\n └─ 브랜드 → 매장 소속\n ↓\n[매장] 메뉴 등록\n ↓\n표시 정보 입력 완료?\n ├─ 아니오 → 판매 불가 상태로 둔다\n └─ 예 → 다음\n ↓\n주문 채널 개시\n ├─ 하이브리드 웹앱\n ├─ 키오스크\n └─ 외부 POS\n ↓\n고객 진입 경로?\n ├─ 웹앱 → FL-301\n ├─ 키오스크 → FL-401\n └─ 외부 POS → FL-501\n ↓\n주문 생성\n ↓\n[가맹] FL-203\n ↓\n매장 접수?\n ├─ 아니오 → FL-903\n └─ 예 → 다음\n ↓\n조리 → 수령\n ↓\n주문 종결\n ↓\n[본사] 매출 집계\n ↓\n[본사] FL-103\n ↓\n운영 판단\n ├─ 행사·상권별 실적 비교\n └─ 차기 행사 구성에 반영\n ↓\n종료\n```\n\n### FL-002 주문 처리 전체 흐름\n\n채널이 달라도 주문은 같은 상태를 지난다. 채널별로 갈라지는 지점과 다시 합쳐지는 지점을 본다.\n\n```text\n주문 시작\n ↓\n채널 구분?\n ├─ 웹앱 → 비회원 주문, PG 결제\n ├─ 키오스크 → 현장 주문, VAN 결제\n └─ 외부 POS → 매장 자체 처리\n ↓\n장바구니 구성\n ↓\n주문 금액 확정\n ↓\n결제수단 확정\n ↓\n결제 방식?\n ├─ PG → FL-301\n └─ VAN → FL-401\n ↓\n결제 승인 성공?\n ├─ 아니오 → 주문 미생성 상태로 종료\n └─ 예 → 다음\n ↓\n주문번호 발번\n ↓\n주문 상태 = 접수 대기\n ↓\n매장 알림 발송\n ↓\n5분 내 접수?\n ├─ 아니오 → FL-903\n └─ 예 → 주문 상태 = 접수 완료\n ↓\n조리 착수\n ↓\n주문 상태 = 조리 완료\n ↓\n수령 방식?\n ├─ 매장 식사 → 호출 후 전달\n └─ 포장 → 픽업대 전달\n ↓\n주문 상태 = 수령 완료\n ↓\n매출 확정\n ↓\n종료\n```\n\n### FL-003 메뉴 등록과 반영 전체 흐름\n\n매장이 등록한 메뉴가 각 채널에 반영되기까지의 경로다. 본사를 거치지 않는다.\n\n```text\n메뉴 변경 발생\n ↓\n[매장] 변경 유형?\n ├─ 신규 등록 → 표시 정보 필수 입력 대상\n ├─ 가격 변경 → 진행 중 주문 영향 확인\n └─ 판매 중지 → 목록에서 제외\n ↓\n[매장] FL-224\n ↓\n[매장] FL-225\n ↓\n표시 정보 입력 완료?\n ├─ 아니오 → 판매 불가 상태로 저장\n └─ 예 → 다음\n ↓\n[매장] 저장\n ↓\n채널별 반영 방식?\n ├─ 웹앱 → 다음 진입 시 즉시 반영\n ├─ 키오스크 → FL-402\n └─ 외부 POS → FL-501\n ↓\n변경 이력 기록\n ├─ 변경 시각, 처리자\n └─ 변경 항목\n ↓\n종료\n```\n\n### FL-004 결제·정산 전체 흐름\n\n결제 승인부터 매장 정산까지의 경로다. 정산은 외부 결제대행사가 수행하고 본사는 대사만 한다.\n\n```text\n결제 요청\n ↓\n결제 방식?\n ├─ PG → 인증 후 서버에서 승인 요청\n └─ VAN → 단말에서 직접 승인\n ↓\n서버 금액 검증\n ↓\n금액 일치?\n ├─ 아니오 → FL-902\n └─ 예 → 다음\n ↓\n승인 요청 발송\n ↓\n승인 결과 수신\n ├─ 성공 → 거래번호 기록\n └─ 실패 → 사유 기록 후 종료\n ↓\n결과 유실 여부?\n ├─ 예 → FL-901\n └─ 아니오 → 다음\n ↓\n매출 원장 기록\n ├─ 매장, 주문번호, 결제수단\n ├─ 승인금액, 승인시각, 거래번호\n └─ 취소 시 원거래 연결\n ↓\n[결제대행사] 대금 정산\n ├─ 정산 주기에 따라 매장 계좌로 지급\n └─ 정산 명세 생성\n ↓\n[본사] 정산 대사\n ↓\n금액 불일치?\n ├─ 예 → 차이 내역 기록 후 결제대행사에 확인 요청\n └─ 아니오 → 대사 완료\n ↓\n종료\n```\n\n### FL-005 매출 집계·통계 전체 흐름\n\n주문 데이터가 행사와 상권 단위 통계로 올라가는 경로다. 어떤 행사의 어떤 상권이 잘 팔리는지 보기 위한 흐름이다.\n\n```text\n주문 종결\n ↓\n매출 원장 적재\n ↓\n집계 단위 산정\n ├─ 매장 단위 일 매출\n ├─ 브랜드 단위 합산\n ├─ 상권 단위 합산\n └─ 행사 단위 합산\n ↓\n집계 시점?\n ├─ 당일 → 집계 시점 표시 후 잠정치 제공\n └─ 전일 이전 → 확정치 제공\n ↓\n취소·환불 반영\n ├─ 원거래 차감\n └─ 취소 사유 분류\n ↓\n[본사] FL-103\n ↓\n[본사] FL-135\n ↓\n비교 기준?\n ├─ 행사 간 비교 → 동일 기간 환산\n ├─ 상권 간 비교 → 매장 수로 나눈 평균\n └─ 브랜드 간 비교 → 메뉴 구성 차이 표시\n ↓\n[가맹] FL-221\n ↓\n종료\n```\n\n## 2. 내부 어드민\n\n\n### FL-101 매장 개설\n\n본사 운영자가 행사와 상권을 만들고 그 아래 매장을 등록한다. 메뉴는 매장이 직접 등록한다. 매장을 처음 열 때 한 번 수행한다.\n\n```text\n로그인 화면\n ↓\n계정·비밀번호 입력\n ↓\n2차 인증 입력\n ↓\n인증 성공?\n ├─ 아니오 → FL-908\n └─ 예 → 다음\n ↓\n행사 관리 화면\n ↓\n행사 신규 등록?\n ├─ 예   → 행사명, 시작일, 종료일 입력 → 저장\n └─ 아니오 → 목록에서 행사 선택\n ↓\n상권 관리 화면\n ↓\n상권 신규 등록?\n ├─ 예   → 브랜드명과 본사 정보 입력 → 저장\n └─ 아니오 → 목록에서 상권 선택\n ↓\n브랜드 관리 화면\n ↓\n브랜드 신규 등록?\n ├─ 예   → 브랜드명 입력 → 저장\n └─ 아니오 → 목록에서 브랜드 선택\n ↓\n매장 등록 화면\n ↓\n매장 정보 입력\n ├─ 사업자 정보 (상호, 사업자번호, 대표자, 연락처)\n ├─ 주소·좌표\n ├─ 영업시간·휴무일\n ├─ 브랜드 선택, 지점번호 입력\n └─ 채널 사용 여부 (웹앱 / 키오스크 / 외부 POS)\n ↓\n사업자 상태 확인\n ↓\n폐업 상태?\n ├─ 예   → 확인 안내 표시 → 매장 정보 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n매장 저장\n ↓\n가맹 관리자 계정 발급\n ├─ 이메일과 초기 비밀번호\n └─ 담당 매장 범위 지정\n ↓\n매장이 메뉴를 등록할 수 있는 상태\n ↓\n종료\n```\n\n### FL-103 매출 통계 조회\n\n기간과 축을 골라 매출을 조회한다. 행사와 상권을 축으로 비교해 어느 구간이 잘 팔리는지 확인한다.\n\n```text\n매출 화면 진입\n ↓\n조회 조건 입력\n ├─ 기간\n ├─ 축 선택 (행사 / 상권 / 매장 / 채널 / 결제수단)\n └─ 비교 대상 선택\n ↓\n조회 권한 있음?\n ├─ 아니오 → \"조회 권한이 없습니다.\" 표시 → 종료\n └─ 예 → 다음\n ↓\n집계 완료 구간?\n ├─ 예   → 집계 테이블 조회\n └─ 아니오 → 운영 데이터 조회, 집계 시점 표시\n ↓\n조회 결과 있음?\n ├─ 아니오 → \"조회 결과가 없습니다.\" 표시\n └─ 예 → 목록·비교 표시\n ↓\n상세 조회\n```\n\n### FL-104 계정·권한 운영\n\n계정을 만들고 역할과 접근 범위를 부여한다. 본사가 가맹 화면을 대신 보는 대행 접속과, 접속기록 점검을 함께 다룬다.\n\n```text\n계정 목록 화면\n ↓\n계정 등록\n ├─ 계정 정보 입력 (이름, 이메일, 연락처)\n ├─ 역할 지정\n └─ 접근 범위 지정 (행사 / 상권 / 매장)\n ↓\n이메일 중복?\n ├─ 예   → \"이미 사용 중인 이메일입니다.\" 표시 → 계정 등록으로 복귀\n └─ 아니오 → 저장\n ↓\n계정 등록 완료\n\n[별도 경로] 대행 접속\n대상 매장 선택\n ↓\n대행 접속 권한 있음?\n ├─ 아니오 → \"권한이 없습니다.\" 표시 → 종료\n └─ 예 → 대행 접속 실행\n ↓\n가맹 어드민 화면 진입\n └─ 실제 조작자와 대상 계정을 함께 기록한다\n ↓\n대행 종료 → 본래 계정으로 복귀\n\n[별도 경로] 접속기록 점검\n조회 조건 입력 (기간, 계정, 접속지)\n ↓\n조회\n ↓\n이상 징후 있음?\n ├─ 예   → 확인 대상으로 지정\n └─ 아니오 → 점검 완료 기록\n```\n\n## 3. 가맹 어드민\n\n### FL-201 매장 운영\n\n가맹 관리자가 로그인해 담당 매장의 정보와 영업 상태를 관리한다. 정보를 바꾸면 바로 반영되고 변경 이력에 남는다.\n\n```text\n로그인 화면\n ↓\n계정·비밀번호 입력\n ↓\n2차 인증 입력\n ↓\n인증 성공?\n ├─ 아니오 → FL-908\n └─ 예 → 담당 매장 확인\n ↓\n담당 매장이 하나인가?\n ├─ 예   → 해당 매장으로 진입\n └─ 아니오 → 매장 선택 화면 → 매장 선택\n ↓\n매장 홈\n ↓\n처리 선택\n ├─ 매장 정보 조회 → 수정 항목 입력\n ├─ 영업 상태 변경 (일시중지 / 재개)\n └─ 매출 조회 → 담당 매장 범위로 제한\n ↓\n직접 수정 가능 항목인가?\n ├─ 예   → 저장 → 즉시 반영\n └─ 아니오 → 저장 → 바로 반영 → 변경 이력 기록\n```\n\n### FL-202 품절 처리\n\n매장에서 특정 메뉴의 판매를 중지한다. 재개 시각을 함께 받아 지정 시각에 자동으로 되돌린다.\n\n```text\n메뉴 목록 화면\n ↓\n메뉴 선택\n ↓\n판매 중지\n ↓\n재개 시각 지정?\n ├─ 예   → 재개 시각 입력 → 해당 시각에 자동 재개\n └─ 아니오 → 수동 재개까지 유지\n ↓\n채널 반영\n ├─ 웹앱      → 즉시. 담기 차단\n ├─ 키오스크   → 즉시. 목록에서 제외\n └─ 외부 POS  → 항목 단위 통지\n ↓\n장바구니에 담긴 건 존재?\n ├─ 예   → 처리자와 시각을 기록하고 마지막 값을 적용\n └─ 아니오 → 품절 처리 완료\n```\n\n### FL-203 주문 접수 (STR-ORDR-LIST / STR-ORDR-ACPT / STR-ORDR-RJCT)\n\n매장이 들어온 주문을 수락하고 수령까지 진행한다. 수락할 때 준비 시간을 고르고, 수락하면 매장 프린터로 주문서를 출력한다.\n거절하거나 5분 내 응답하지 않으면 주문이 취소된다. 접수 완료 후 1분이 지나면 조리 중으로 자동 전환되고 그때부터 취소할 수 없다.\n\n```text\n주문 알림 수신\n ↓\n주문 내용 확인   ← 남은 응답 시간을 함께 표시한다. 1분 남으면 색을 바꾼다\n ↓\n5분 내 응답?\n ├─ 아니오 → FL-903 (사유 = 미응답)\n └─ 예 → 다음\n ↓\n주문 수락?\n ├─ 아니오 → 거절 사유 선택 → FL-903\n │            ├─ 품절     → 해당 메뉴를 품절로 바꾼다\n │            ├─ 재료 소진 → 해당 메뉴를 품절로 바꾼다\n │            ├─ 마감     → 영업 상태를 일시중지로 바꿀지 묻는다\n │            └─ 기타     → 사유를 입력받는다\n └─ 예 → 다음\n ↓\n준비 시간 선택 (5, 10, 15, 20, 30분)\n ↓\n주문 상태 = 접수 완료\n ↓\n고객 알림 발송   ← 접수 안내와 고른 준비 시간을 함께 보낸다\n ↓\n주문서 출력 요청\n ↓\n프린터 출력 성공?\n ├─ 아니오 → 화면에 출력 실패 표시 → 재출력 또는 화면 확인\n └─ 예 → 주방이 주문서로 확인\n ↓\n[서버] 접수 완료 후 1분 경과\n ↓\n고객 취소 있었음?\n ├─ 예 → 취소 처리 후 종료\n └─ 아니오 → 주문 상태 = 조리 중\n ↓\n조리 완료 처리\n ↓\n고객 호출 발송\n ↓\n고객이 수령했는가?\n ├─ 예   → 수령 완료 처리\n └─ 아니오 → 조리 완료로 유지 → FL-146\n```\n\n### FL-204 알레르기 정보 등록\n\n알레르기 정보는 메뉴 단위로 등록하며 필수 입력이다. 법정 표시 의무 대상 여부와 무관하게 항상 받는다. 옵션 단위 등록은 두지 않는다. 옵션 선택에 따라 알레르기 유발물질이 달라지는 메뉴는 조합별로 상품을 복제해 각각 등록한다.\n\n```text\n메뉴 선택\n ↓\n알레르기 유발물질 선택 (법정 18개 품목)\n ↓\n영양성분 입력 (열량, 당류, 단백질, 포화지방, 나트륨)\n ↓\n옵션이 알레르기 유발물질을 바꾸는가?\n ├─ 아니오 → 옵션으로 유지\n └─ 예 → 상품 복제\n ↓\n상품 복제 처리\n ├─ 조합별 메뉴 생성\n ├─ 조합별 알레르기 정보 입력\n ├─ 원 메뉴에서 해당 옵션 제거\n └─ 복제 관계 기록   ← 원 메뉴 수정 시 복제본을 확인 대상으로 표시\n ↓\n필수 항목 모두 입력?\n ├─ 아니오 → 저장 차단, 미입력 항목 표시 → 알레르기 유발물질 선택으로 복귀\n └─ 예 → 저장\n ↓\n채널 반영 → 메뉴 정보와 함께 제공\n```\n\n## 4. 하이브리드 웹앱\n\n\n### FL-301 웹앱 주문·결제\n\n고객이 QR이나 링크로 매장에 들어와 메뉴를 담고 결제까지 마친다. 회원가입과 로그인은 없다. 결제는 인증과 승인이 분리되며, 그 사이에 서버가 주문 금액을 검증한다.\n\n```text\nQR 촬영 또는 링크 진입\n ↓\nQR에 매장·테이블 포함?\n ├─ 예   → 매장 자동 확정\n └─ 아니오 → 매장 목록 → 매장 선택\n ↓\n주문 가능한 매장?\n ├─ 영업시간 외   → \"영업시간이 아닙니다.\" 표시, 메뉴 열람만 허용 → 종료\n ├─ 영업 일시중지  → 준비중 표시, 재개 시각 안내 → 종료\n ├─ 매장 반경 밖   → \"매장에서 주문해 주세요.\" 표시 → 종료\n └─ 정상         → 다음\n ↓\n수령 방식 선택 (매장 식사 / 포장)\n ↓\n메뉴 조회\n ├─ 판매 시간 외 메뉴 → 미노출\n ├─ 품절 메뉴        → 목록에서 제외\n └─ 원산지·알레르기 표시\n ↓\n메뉴 선택\n ↓\n옵션 선택\n ↓\n필수 옵션 선택 완료?\n ├─ 아니오 → \"필수 옵션을 선택해 주세요.\" 표시 → 옵션 선택으로 복귀\n └─ 예 → 수량 지정\n ↓\n담기 방식?\n ├─ 장바구니에 담기 → 장바구니 → 메뉴를 더 고르거나 주문하기\n └─ 바로 결제      → 장바구니를 거치지 않고 결제 상세로 이동\n ↓\n다른 매장 항목 존재?\n ├─ 예   → 초기화 확인 → 초기화\n └─ 아니오 → 다음\n ↓\n결제 상세 작성\n ├─ 이름 입력\n ├─ 휴대폰번호 입력      ← 알림톡 발송과 주문 조회에 쓴다\n ├─ 개인정보 수집 동의\n ├─ 요청사항 입력\n └─ 최종 금액 확정\n ↓\n주문 생성\n └─ 서버에 주문번호와 최종 금액 저장   ← 위변조 검증 기준값\n ↓\n결제창 호출\n ↓\n결제수단 인증\n ↓\n인증 성공?\n ├─ 아니오 → \"결제수단 인증에 실패했습니다.\" 표시 → 결제수단 선택으로 복귀\n └─ 예 → 다음\n ↓\n인증 결과 수신 성공?\n ├─ 아니오 → FL-901\n └─ 예 → 다음\n ↓\n저장 금액과 일치?\n ├─ 아니오 → FL-902\n └─ 예 → 다음\n ↓\n승인 요청 (멱등키 부여)\n ↓\n승인 성공?\n ├─ 실패    → \"결제에 실패했습니다.\" 표시, 주문 미확정 → 결제수단 선택으로 복귀\n ├─ 응답 없음 → FL-901\n └─ 예 → 다음\n ↓\n주문 확정\n ↓\n매장 전달 → FL-203\n ↓\n접수 알림톡 발송\n ↓\n주문 완료 화면\n```\n\n### FL-302 주문 상태 확인·픽업\n\n고객이 접수와 준비 상태를 확인하고 매장에서 주문을 수령한다. 회원 계정이 없으므로 주문번호와 휴대폰번호로 조회한다. 상태는 서버에서 조회한다.\n\n```text\n주문 완료 화면 또는 알림톡 링크\n ↓\n주문번호와 휴대폰번호로 조회\n ↓\n주문 확인?\n ├─ 아니오 → \"주문을 찾을 수 없습니다.\" 표시 → 종료\n └─ 예 → 다음\n ↓\n주문 상태 조회\n ↓\n현재 상태?\n ├─ 접수 대기 → 대기 안내 표시\n ├─ 접수 완료  → 준비 중 표시\n ├─ 취소     → 취소 사유 표시 → 종료\n └─ 조리 완료 → 준비 완료 알림톡 발송\n ↓\n매장 방문\n ↓\n주문번호 확인\n ↓\n수령 완료 (수령 구분: 수령, 미수령)\n```\n\n### FL-303 주문 취소\n\n고객이 접수 완료 후 1분 안에 주문을 취소한다. 그 시간이 지나면 조리 중으로 자동 전환되어 취소할 수 없다. 주문 취소와 결제 취소를 함께 처리한다.\n\n```text\n주문번호와 휴대폰번호로 조회\n ↓\n주문 선택\n ↓\n주문 상태가 접수 대기 또는 접수 완료?\n ├─ 아니오 → \"조리가 시작되어 취소할 수 없습니다. 매장에 문의해 주세요.\" 표시 → 종료\n └─ 예 → 다음\n ↓\n취소 확인\n ↓\n결제 취소 요청 (멱등키 부여)\n ↓\n취소 성공?\n ├─ 아니오 → 취소 대기 상태로 기록 → 재시도\n └─ 예 → 주문 상태 취소로 변경\n ↓\n취소 알림 발송\n```\n\n## 5. 키오스크\n\n\n### FL-401 키오스크 주문·결제\n\n고객이 매장 키오스크에서 직접 주문하고 카드 단말로 결제한다. 결제가 끝나면 주문번호를 발행하고 주방에 전달한다.\n\n```text\n대기화면\n ↓\n화면 터치\n ↓\n두 취식유형을 운영?\n ├─ 아니오 → 자동 확정\n └─ 예 → 취식유형 선택 (매장 식사 / 포장)\n ↓\n카테고리·메뉴 선택\n ├─ 품절 메뉴        → 목록에서 제외\n ├─ 판매 시간 외 메뉴 → 미노출\n └─ 원산지·알레르기 표시\n ↓\n옵션 선택\n ↓\n필수 옵션 선택 완료?\n ├─ 아니오 → 진행 불가 안내 → 옵션 선택으로 복귀\n └─ 예 → 수량 지정 → 장바구니에 담기\n ↓\n주문 내역 확인\n ↓\n결제수단 선택\n ├─ 카드\n └─ 간편결제 → 바코드·QR 스캔\n ↓\n결제 금액 5만원 초과?\n ├─ 예   → 할부 개월 입력\n └─ 아니오 → 다음\n ↓\n단말 승인 요청 전송\n ↓\n승인 성공?\n ├─ 거절     → 오류 표시 → 결제수단 선택으로 복귀\n ├─ 응답 없음  → FL-904\n ├─ 판단 불가  → FL-904\n └─ 예 → 다음\n ↓\n결제 금액 5만원 이상?\n ├─ 예   → 사인패드 서명\n └─ 아니오 → 서명 생략\n ↓\n주문 서버 전송\n ↓\n전송 성공?\n ├─ 아니오 → FL-905\n └─ 예 → 다음\n ↓\n주문번호 발행\n ↓\n주문서 출력   ← 카드 매출전표는 카드 단말이 따로 낸다\n ↓\n주방 전달 → 접수 완료 (준비 시간은 매장의 기본 준비 시간)\n ↓\n고객 호출 방식?\n ├─ 주문번호   → 화면 표시\n └─ 휴대폰번호 → 번호 입력 → 알림톡 발송\n ↓\n대기화면 복귀\n```\n\n### FL-402 메뉴 마스터 수신\n\n단말이 유휴 상태에 들어갈 때 변경된 메뉴를 내려받아 반영한다. 주문 중에는 화면이 바뀌지 않는다.\n\n```text\n단말 유휴 상태 진입\n ├─ 대기화면 무조작 지속\n └─ 결제 완료 후 대기화면 전환\n ↓\n서버에 최종 변경 시각 조회\n ↓\n변경 있음?\n ├─ 아니오 → 종료\n └─ 예 → 변경분 수신\n ↓\n단말 반영\n ↓\n반영 성공?\n ├─ 아니오 → 직전 상태 유지, 오류 보고\n └─ 예 → 반영 시각 기록\n```\n\n### FL-403 키오스크 관리자 처리\n\n매장 담당자가 인증 후 키오스크 설정에 들어간다. 품절 처리, 환불, 단말 상태 확인을 다룬다.\n\n```text\n관리자 인증 입력\n ↓\n인증 성공?\n ├─ 아니오 → 주문 화면 복귀\n └─ 예 → 관리자 화면\n ↓\n처리 선택\n ├─ 품절 설정    → 메뉴 선택 → 판매 중지·재개\n ├─ 거래 내역 조회 → 건 선택 → 환불 → 원 결제수단 확인 → 취소 처리\n └─ 단말 상태 확인 → 프린터·단말·네트워크 상태 표시\n ↓\n종료 → 대기화면 복귀\n```\n\n## 6. 외부 POS 연동\n\n\n### FL-501 메뉴 정보 제공\n\nERP가 매장과 메뉴 정보를 외부 POS에 제공한다. 변경이 생기면 통지를 보내고, 상대가 조회해 가져간다.\n\n```text\n[사전] 연동 계정 등록\n접근 키 발급\n ↓\n매장 범위 지정\n ↓\n연동 활성화\n\n[ERP] 메뉴 또는 매장 정보 변경 확정\n ↓\n변경 통지 발송   ← 매장 식별자와 변경 시각만 전송\n ↓\n2xx 응답 수신?\n ├─ 아니오 → 재전송 → 반복 실패 시 전송 중단\n └─ 예 → 다음\n ↓\n[외부 POS] 매장·메뉴 조회\n ↓\n[외부 POS] 자체 반영\n\n[별도 경로] 백업 폴링\n[외부 POS] 최종 변경 시각 조회   … 30분 주기\n ↓\n변경 있음?\n ├─ 아니오 → 종료\n └─ 예 → 조회 후 반영\n\n[별도 경로] 품절·일시중지\n[ERP] 상태 변경 → 항목 단위 통지   … 실시간\n```\n\n## 7. 내부 어드민 화면별 Flow\n\n화면 하나에 들어와서 나갈 때까지의 흐름이다. 화면ID는 05 IA의 화면 목록을 따른다.\n\n### FL-110 로그인 (ADM-AUTH-LOGIN)\n\n```text\n로그인 화면 진입\n ↓\n계정·비밀번호 입력\n ↓\n입력값 있음?\n ├─ 아니오 → 안내 문구 표시 → 계정·비밀번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n계정 상태 확인\n ↓\n계정 잠금 상태?\n ├─ 예 → 관리자 문의 안내 표시 → 종료\n └─ 아니오 → 다음\n ↓\n비밀번호 일치?\n ├─ 아니오 → FL-908\n └─ 예 → 다음\n ↓\n비밀번호 변경 필요?\n ├─ 예 → 비밀번호 변경 화면으로 이동 → 변경 후 다음\n └─ 아니오 → 다음\n ↓\n2차 인증 화면으로 이동\n```\n\n### FL-111 2차 인증 (ADM-AUTH-OTP)\n\n```text\n2차 인증 화면 진입\n ↓\n등록 단말 있음?\n ├─ 아니오 → 단말 등록 안내 표시 → 등록 후 다음\n └─ 예 → 다음\n ↓\n인증번호 발송\n ↓\n인증번호 입력\n ↓\n유효시간 내 입력?\n ├─ 아니오 → 시간 초과 안내 표시 → 인증번호 발송으로 복귀\n └─ 예 → 다음\n ↓\n인증번호 일치?\n ├─ 아니오 → 실패 횟수 누적 → 인증번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n접속기록 기록\n ├─ 계정, 접속 시각, 접속 주소\n └─ 인증 수단\n ↓\n대시보드로 이동\n```\n\n### FL-112 대시보드 (ADM-HOME-MAIN / ADM-HOME-EXAM)\n\n대시보드는 조치할 항목을 먼저 보여준다. 추세와 비교는 매출 화면에서 본다.\n\n```text\n대시보드 진입\n ↓\n[서버] 이상 항목 판정\n ├─ 단말 미연결   ← 마지막 통신 30분 경과\n ├─ 접수 지연     ← 접수 대기가 30초를 넘긴 주문\n ├─ 매출 급락     ← 최근 1시간 주문이 같은 요일 같은 시간대 평균의 30% 미만\n └─ 품절 급증     ← 판매 메뉴의 30% 이상이 품절\n ↓\n이상 항목 있음?\n ├─ 예 → 지금 확인할 것 영역에 표시. 발생 시각 순으로 정렬\n └─ 아니오 → \"확인할 항목이 없습니다.\" 표시\n ↓\n[서버] 오늘 실적 조회\n └─ 집계 시점을 함께 표시한다. 당일은 잠정치다\n ↓\n[서버] 처리 대기 조회\n ↓\n[서버] 정산 상태 조회\n └─ 최근 대사 기준일별 완료 여부, 불일치, 미정산\n ↓\n[서버] 개시 준비 조회\n ↓\n개시 7일 이내 행사 있음?\n ├─ 예 → 매장·메뉴·표시 정보·심사 완료 수를 표시\n └─ 아니오 → 개시 준비 영역을 숨긴다\n ↓\n항목 선택?\n ├─ 단말 미연결 → FL-232\n ├─ 접수 지연   → 해당 매장의 주문으로 이동\n ├─ 매출 급락   → FL-116\n ├─ 품절 급증   → 해당 매장 상세로 이동\n ├─ 대사 보기   → FL-141\n ├─ 개시 준비   → FL-116\n └─ 선택 없음   → 대시보드 유지\n ↓\n종료\n```\n\n이상 항목의 판정 기준은 고정값이다. 매장마다 다르게 두지 않는다. 기준을 매장별로 두면 어느 매장이 왜 걸렸는지 설명할 수 없다.\n\n개시 준비 표의 심사 열을 선택하면 개시 확정 팝업(ADM-HOME-EXAM)이 열린다.\n결제대행사 심사가 끝난 매장을 골라 확정하면 상태가 영업으로 바뀌고 주문 채널에 노출된다.\n심사 결과가 자동으로 오는 매장은 사람이 누르지 않아도 같은 처리를 거친다.\n\n\n### FL-113 행사 목록·등록 (ADM-EVNT-LIST / ADM-EVNT-FORM / ADM-EVNT-ZONE / ADM-ADDR-FIND)\n\n```text\n행사 목록 진입\n ↓\n검색 조건 입력\n ├─ 행사명\n └─ 진행 상태 (진행 전, 진행 중, 종료)\n ↓\n목록 표시\n ↓\n동작 선택?\n ├─ 신규 등록 → 행사 등록 화면\n ├─ 행 선택 → 행사 수정 화면\n └─ 없음 → 종료\n ↓\n행사 정보 입력\n ├─ 행사명, 시작일, 종료일\n ├─ 장소 → 주소 검색 → 주소 선택 → 상세주소 입력 → 적용\n └─ 관리자 메모\n ↓\n종료된 행사?\n ├─ 예 → 수정 불가 안내 표시 → 행사 목록으로 복귀\n └─ 아니오 → 다음\n ↓\n시작일이 종료일보다 늦음?\n ├─ 예 → 기간 확인 안내 표시 → 행사 정보 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n상권 탭에서 참여할 상권을 붙인다\n ├─ 상권 붙이기 → ADM-EVNT-ZONE → 브랜드명으로 조회 → 여러 건 선택 → 붙이기\n ├─ 떼기 → 그 행사에서만 뺀다. 상권은 지워지지 않는다\n ├─ 매장이 속한 행사는 뗄 수 없다\n └─ 비워 두고 저장할 수 있다. 나중에 붙여도 된다\n ↓\n저장\n ↓\n행사 목록으로 복귀\n```\n\n상권 하나가 여러 행사에 붙을 수 있다. 붙이고 떼는 일은 행사 등록·수정의 상권 탭에서만 한다.\n매출은 주문 시점의 참여 행사로 집계한다.\n\n\n\n### FL-114 상권 목록·등록 (ADM-ZONE-LIST / ADM-ZONE-FORM)\n\n```text\n상권 목록 진입\n ↓\n ↓\n목록 표시\n ↓\n동작 선택?\n ├─ 신규 등록 → 상권 등록 화면\n ├─ 행 선택 → 상권 수정 화면\n ├─ 매장 수 선택 → 매출 조회 (그 상권으로 조건을 걸어 연다)\n └─ 없음 → 종료\n ↓\n상권 정보 입력\n ├─ 브랜드명\n └─ 위치\n ↓\n같은 브랜드명 있음?\n ├─ 예 → 중복 안내 표시 → 상권 정보 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n담당 계정 정보 입력\n ├─ 이메일\n ├─ 이름\n ├─ 휴대폰번호\n └─ 비밀번호 · 비밀번호 재확인\n ↓\n이메일 중복?\n ├─ 예 → 중복 안내 표시 → 이메일 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n저장\n ├─ 상권 생성\n └─ 계정 발급 · 초기 비밀번호 문자 발송\n ↓\n상권 목록으로 복귀\n```\n\n### FL-116 상권 변경 이력 (ADM-ZONE-FORM)\n\n```text\n상권 목록에서 행 선택\n ↓\n상권 등록·수정 진입\n ↓\n히스토리 탭 선택\n ↓\n조회 조건 선택\n ├─ 기간\n └─ 대상 (브랜드, 매장)\n ↓\n변경 내역 표시\n ├─ 변경일시, 대상, 항목\n ├─ 변경 전과 변경 후\n └─ 변경자 (소속을 함께 적는다)\n ↓\n결과 있음?\n ├─ 아니오 → 바뀐 내역이 없음을 표시\n └─ 예 → 목록 표시\n ↓\n종료\n```\n\n본사와 매장이 바꾼 값을 모두 남긴다. 지우지 않고 매장이 폐점해도 남긴다.\n이 브랜드의 매장 목록은 매출 조회에서 상권 조건을 걸어 본다.\n### FL-133 매출 조회 (ADM-SALE-LIST)\n\n상권을 모르는 상태에서 매장을 찾는 경로는 이 화면 하나다. 그래서 매장은 드롭다운이 아니라 검색으로 찾는다.\n\n```text\n매출 조회 진입\n ↓\n조회 조건 입력\n ├─ 기간 (달력 또는 오늘 / 7일 / 30일 버튼)\n ├─ 행사, 상권, 브랜드 드롭다운\n └─ 매장명·사업자번호 검색\n ↓\n집계 단위 선택\n ├─ 일자별       → 일자, 합계\n ├─ 매장별       → 매장, 기간 합계\n └─ 매장·일자별   → 일자와 매장을 함께 본다\n ↓\n소속 기준 선택\n ├─ 주문 시점 소속 (기본)\n └─ 현재 소속 → 안내 문구와 토스트 표시\n ↓\n열 고르기 (기본 8개. 객단가를 더 넣을 수 있다)\n ↓\n조회\n ↓\n[서버] 집계 조회\n ↓\n결과 있음?\n ├─ 아니오 → 결과 없음 화면 → 조건 초기화\n └─ 예 → 다음\n ↓\n요약과 목록 표시\n ├─ 요약 = 결제, 취소, 순매출, 주문\n ├─ 당일 구간 → 집계 열에 잠정. 집계 시점 함께 표시\n └─ 집계 전 구간 → 수치를 비우고 집계 중으로 표시\n ↓\n다음 동작?\n ├─ 행 선택 → FL-134 매출 상세\n └─ 내려받기 → FL-150\n```\n\n### FL-134 매출 상세 (ADM-SALE-DETAIL)\n\n하루치를 채널과 결제수단으로 나눠 본다. 한 건씩 확인할 일은 주문 상세에서 한다.\n\n```text\n매출 상세 진입   ← 매출 조회의 행 선택\n ↓\n[서버] 그 매장 그날 자료 조회\n ↓\n요약 표시 (결제, 취소, 순매출, 주문)\n ↓\n채널별 집계 표시 (주문, 결제, 비중)\n ↓\n결제수단별 집계 표시 (주문, 결제, 비중)\n ↓\n주문 내역 표시 (시각 역순)\n ├─ 매입 후 취소 → 취소 일자에 별도 거래로 기록\n └─ 승인취소     → 목록에 넣지 않는다\n ↓\n좁혀 보기?\n ├─ 상태 드롭다운\n └─ 주문번호·휴대폰 뒤 4자리 검색\n ↓\n결과 있음?\n ├─ 아니오 → 결과 없음 화면 → 조건 초기화\n └─ 예 → 다음\n ↓\n다음 동작?\n ├─ 행 선택   → FL-149 주문 상세\n ├─ 앞날      → 같은 매장 하루 전\n ├─ 다음날    → 같은 매장 하루 뒤. 오늘보다 뒤면 누를 수 없다\n ├─ 목록으로  → FL-133. 조회 조건 유지\n └─ 내려받기  → FL-150\n```\n\n### FL-135 행사·상권 비교 (ADM-SALE-COMP)\n\n기간이 다른 행사를 견주려면 하루 기준으로 환산해야 한다. 순매출만으로는 기간이 긴 행사가 늘 앞선다.\n\n```text\n행사·상권 비교 진입\n ↓\n기간 지정\n ├─ 달력에서 직접 고른다\n └─ 최근 7일 / 최근 30일 / 행사 전체 기간 버튼\n ↓\n비교 기준 선택\n ├─ 상권 기준 → 첫 열 = 상권, 셋째 열 = 참여 행사\n └─ 행사 기준 → 첫 열 = 행사, 셋째 열 = 상권 수\n ↓\n기간 길이가 다른가?\n ├─ 예 → 일평균으로 보기 안내 → 켜면 순매출을 일수로 나눠 표시\n └─ 아니오 → 순매출 그대로\n ↓\n표시 개수 선택 (상위 10개 / 상위 20개 / 전체)\n ↓\n조회\n ↓\n[서버] 기간별 집계\n ├─ 순매출, 주문, 객단가\n ├─ 비중 = 그 항목 순매출 / 전체 순매출\n └─ 전기 대비 = 같은 길이의 직전 기간과 비교\n ↓\n결과 있음?\n ├─ 아니오 → 결과 없음 화면 → 조건 초기화\n └─ 예 → 다음\n ↓\n막대 그래프 + 목록 표시\n ├─ 그래프는 고른 개수만 그린다. 나머지는 기타로 묶는다\n ├─ 직전 기간 자료가 없으면 전기 대비를 신규로 표시\n └─ 당일이 포함되면 잠정치가 섞인다고 알린다\n ↓\n행 선택?\n ├─ 예 → 그 조건을 걸어 FL-133 매출 조회\n └─ 내려받기 → FL-150\n```\n\n### FL-136 계정 목록·등록 (ADM-USER-LIST / ADM-USER-FORM)\n\n```text\n계정 목록 진입\n ↓\n검색 조건 입력\n ├─ 이메일, 이름\n ├─ 권한 유형\n └─ 계정 상태\n ↓\n목록 표시\n ↓\n동작 선택?\n ├─ 신규 등록 → 계정 등록 화면\n ├─ 행 선택 → 계정 수정 화면\n ├─ 잠금 해제 → 사유 입력 후 해제\n ├─ 대행 접속 → FL-137\n └─ 없음 → 종료\n ↓\n계정 정보 입력\n ├─ 이메일, 이름, 연락처\n ├─ 권한 유형\n └─ 담당 매장 범위\n ↓\n이메일 중복?\n ├─ 예 → 중복 안내 표시 → 계정 정보 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n가맹 관리자인데 담당 매장 미지정?\n ├─ 예 → 매장 지정 안내 표시 → 계정 정보 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n저장\n ↓\n초기 비밀번호 발송\n ↓\n계정 목록으로 복귀\n```\n\n### FL-137 대행 접속 (ADM-USER-PROXY)\n\n```text\n대행 접속 팝업 표시\n ↓\n대상 계정 확인\n ↓\n접속 사유 입력\n ↓\n사유 입력함?\n ├─ 아니오 → 사유 입력 안내 표시 → 접속 사유 입력으로 복귀\n └─ 예 → 다음\n ↓\n대행 접속 기록\n ├─ 조작자 계정\n ├─ 대상 계정\n ├─ 접속 시각과 사유\n └─ 수행한 작업 내역\n ↓\n가맹 어드민으로 이동\n ↓\n대행 표시 유지\n ├─ 상단에 대행 접속 중 표시\n └─ 원 계정으로 복귀 버튼 제공\n ↓\n종료\n```\n\n### FL-138 접속기록 조회 (ADM-ALOG-LIST)\n\n```text\n접속기록 조회 진입\n ↓\n조회 조건 입력\n ├─ 기간\n ├─ 계정\n └─ 처리 유형\n ↓\n기록 목록 표시\n ├─ 계정, 시각, 접속 주소\n ├─ 처리 유형\n └─ 처리 결과\n ↓\n이상 징후 있음?\n ├─ 예 → 해당 행 표시 후 점검 대상으로 분류\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 내려받기 → 파일 생성 후 내려받기\n ├─ 점검 확인 → 점검자와 시각 기록\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-148 매장별 정산 (ADM-RECN-STOR)\n\n```text\n매장별 정산 진입\n ↓\n[운영자] 조회 조건 입력\n ├─ 기간\n ├─ 행사, 상권\n └─ 정산 상태\n ↓\n[서버] 결제대행사 지급 내역 조회\n ↓\n조회 성공?\n ├─ 아니오 → 실패 사유 표시 → 조회 조건 입력으로 복귀\n └─ 예 → 다음\n ↓\n매장별 집계\n ├─ 거래 금액\n ├─ 정산 금액\n ├─ 미정산 금액\n └─ 최종 지급일\n ↓\n심사 미완료 매장 있음?\n ├─ 예 → 정산 대상에서 빼고 사유를 표시\n └─ 아니오 → 다음\n ↓\n지급일 미도래 건 있음?\n ├─ 예 → 미정산이 아니라 대기로 표시\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 내려받기 → 파일 생성\n ├─ 매장 선택 → 해당 매장의 대사 내역으로 이동\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-150 주문 상세 (ADM-SALE-ORDR)\n\n본사는 주문을 조회만 한다. 고쳐야 하면 대행 접속으로 매장 화면에 들어간다.\n\n```text\n매출 상세에서 행 선택\n ↓\n주문 상세 팝업 표시\n ├─ 기본      매장, 소속 행사, 주문 시각, 채널, 주문자\n ├─ 주문 내역  메뉴, 옵션, 수량, 금액\n ├─ 결제      결제수단, 승인번호, 승인 시각, 결제 금액, 정산 상태\n ├─ 상태 이력  시각, 상태, 처리자\n └─ 알림 발송  시각, 종류, 결과\n ↓\n주문자 정보가 있는가?\n ├─ 예   → 휴대폰번호 가운데를 가려서 표시\n └─ 아니오 → 현장 주문으로 표시 (키오스크)\n ↓\n취소 주문인가?\n ├─ 예 → 취소 구분, 취소 시각, 취소 사유를 결제 묶음에 함께 표시\n └─ 아니오 → 다음\n ↓\n알림 발송이 실패한 건이 있는가?\n ├─ 예 → 결과에 실패와 사유 표시 → 오류 로그로 갈 수 있게 한다\n └─ 아니오 → 다음\n ↓\n다음 동작?\n ├─ 대행 접속 → FL-137. 사유를 받고 접속기록에 남긴다\n └─ 닫기      → 매출 상세로 복귀. 목록 위치와 조회 조건 유지\n```\n\n### FL-151 자료 내려받기 (ADM-COMN-DOWN)\n\n매출과 정산, 이력 화면이 같은 팝업을 쓴다.\n\n```text\n내려받기 선택\n ↓\n내려받기 팝업 표시   ← 조회 조건을 그대로 보여준다\n ↓\n범위 선택 (화면에 보이는 조건 그대로 / 기간 전체)\n ↓\n형식 선택 (엑셀 / CSV)\n ↓\n개인정보 항목을 포함하는가?\n ├─ 예   → 접속기록에 조작자와 조회 범위를 남긴다\n └─ 아니오 → 주문자 이름과 휴대폰번호를 빼고 만든다\n ↓\n내려받기\n ↓\n[서버] 파일 생성\n ├─ 10만 건 초과 → 파일을 나눠 만든다\n └─ 진행 막대와 건수 표시\n ↓\n창을 닫았는가?\n ├─ 예   → 만들기는 이어진다\n └─ 아니오 → 진행 상태를 계속 보여준다\n ↓\n성공?\n ├─ 아니오 → 오류 번호와 함께 실패 표시 → 다시 시도\n └─ 예 → 파일명과 함께 완료 토스트\n```\n\n### FL-149 오류 로그 (ADM-ERRL-LIST)\n\n```text\n오류 로그 진입\n ↓\n[운영자] 조회 조건 입력\n ├─ 기간\n ├─ 유형 (배치, 알림 발송, 외부 연동)\n └─ 확인 상태\n ↓\n오류 목록 표시\n ├─ 발생 시각, 유형, 대상\n ├─ 내용\n └─ 반복 발생 횟수\n ↓\n같은 원인 반복 건 있음?\n ├─ 예 → 묶어서 발생 횟수로 표시\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 확인 → 확인자와 시각을 기록하고 기본 조회에서 뺀다\n ├─ 배치 재실행 → FL-143\n ├─ 알림 재발송 → FL-231\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-147 이상 알림 발송 (배치)\n\n화면을 열지 않아도 단말 장애를 알 수 있게 한다. 조치할 수 있는 사람에게 먼저 보낸다.\n\n```text\n[서버] 5분 주기 점검\n ↓\n미연결 단말 조회\n └─ 마지막 통신 시각으로 경과를 계산한다\n ↓\n경과 시간?\n ├─ 30분 미만 → 발송하지 않는다\n ├─ 30분 이상 60분 미만 → 1단계 대상\n └─ 60분 이상 → 2단계 대상\n ↓\n이미 같은 단계로 보냈음?\n ├─ 예 → 건너뛴다\n └─ 아니오 → 다음\n ↓\n행사 영업시간 안인가?\n ├─ 아니오 → 다음 개시 30분 전으로 예약\n └─ 예 → 다음\n ↓\n같은 행사에서 5분 안에 3건 이상?\n ├─ 예 → 한 건으로 묶는다\n └─ 아니오 → 건별로 보낸다\n ↓\n발송 대상 판정\n ├─ 1단계 → 매장 계정 휴대폰번호\n └─ 2단계 → 알림 수신으로 지정된 본사 계정\n ↓\n알림톡 발송\n ├─ 매장명과 단말 종류\n ├─ 미연결 경과 시간\n └─ 조치 방법\n ↓\n발송 성공?\n ├─ 아니오 → 문자로 대체 발송\n └─ 예 → 다음\n ↓\n발송 기록 저장\n ├─ 단계, 대상, 시각\n └─ 발송 결과\n ↓\n단말이 다시 연결됨?\n ├─ 예 → 발송 단계를 초기화한다\n └─ 아니오 → 다음 주기에 다시 판정\n ↓\n종료\n```\n\n### FL-146 미수령 주문 마감 (배치)\n\n조리 완료 후 고객이 가져가지 않은 주문을 정리한다. 매장이 철수한 뒤 상태가 남아 있으면\n정산 대사에서 주문 수와 결제 건수가 맞지 않는다.\n\n```text\n[배치] 매장 영업 종료 한 시간 뒤 실행\n ↓\n그 매장의 조리 완료 주문 조회\n ↓\n대상 있음?\n ├─ 아니오 → 실행 기록 남기고 종료\n └─ 예 → 다음\n ↓\n주문마다 처리\n ├─ 주문 상태 = 수령 완료\n ├─ 수령 구분 = 미수령\n └─ 결제는 그대로 둔다   ← 환불하지 않는다. 매장이 만들어 둔 음식이다\n ↓\n매장에 정리 결과 알림\n ├─ 미수령 건수와 금액\n └─ 주문번호 목록\n ↓\n실행 기록 저장   ← 배치 실행 이력에서 본다\n```\n\n미수령은 취소가 아니다. 매출로 잡히고 정산 대상에 들어간다.\n고객이 나중에 찾아오면 매장이 현장에서 판단한다. 시스템은 되돌리지 않는다.\n\n### FL-140 연동 계정 (ADM-APIK-LIST / ADM-APIK-FORM)\n\n```text\n연동 계정 목록 진입\n ↓\n목록 표시\n ├─ 연동처명\n ├─ 허용 매장 범위\n └─ 마지막 사용 시각\n ↓\n동작 선택?\n ├─ 신규 등록 → 연동 계정 등록 화면\n ├─ 키 재발급 → 사유 입력 후 재발급\n ├─ 사용 중지 → 확인 후 중지\n └─ 없음 → 종료\n ↓\n연동처 정보 입력\n ├─ 연동처명, 담당자 연락처\n ├─ 허용 매장 범위\n └─ 허용 조회 항목\n ↓\n매장 범위 미지정?\n ├─ 예 → 매장 지정 안내 표시 → 연동처 정보 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n접근 키 발급\n ↓\n키 1회 표시\n ├─ 화면을 벗어나면 다시 볼 수 없음\n └─ 재확인은 재발급으로만 가능\n ↓\n연동 계정 목록으로 복귀\n```\n\n### FL-141 정산 대사 (ADM-RECN-LIST)\n\n```text\n정산 대사 진입\n ↓\n[운영자] 대사 조건 입력\n ├─ 대사 단계 (거래, 정산, 입금)\n ├─ 기준일\n └─ 결제대행사\n ↓\n대사 단계?\n ├─ 거래 → 승인일 기준. 승인과 취소를 개별로 조회\n ├─ 정산 → 정산 매출일 기준\n └─ 입금 → 정산 지급일 기준\n ↓\n[서버] 조회 건수 확인\n ↓\n1만 건 초과?\n ├─ 예 → 파일 수신 방식으로 전환 안내 표시 → 대사 조건 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n[서버] 외부 내역 조회\n ↓\n조회 성공?\n ├─ 아니오 → 실패 사유 표시 → 대사 조건 입력으로 복귀\n └─ 예 → 다음\n ↓\n[서버] 결제 원장과 대조\n ├─ 결제 키와 주문번호로 연결\n ├─ 매입 상태로 지연과 실패를 구분\n └─ 전체 금액과 잔액 차이로 부분취소 판정\n ↓\n결과 표시\n ├─ 일치 건수와 금액\n ├─ 불일치 건수와 금액\n └─ 미정산 건수\n ↓\n불일치 있음?\n ├─ 예 → FL-142\n └─ 아니오 → 대사 완료 처리\n ↓\n종료\n```\n\n### FL-142 대사 불일치 (ADM-RECN-DIFF)\n\n```text\n불일치 목록 표시\n ↓\n불일치 유형 구분\n ├─ 우리에만 있음\n ├─ 상대에만 있음\n ├─ 금액 불일치\n └─ 매입 지연\n ↓\n[운영자] 건 선택\n ↓\n양쪽 값 대조 표시\n ├─ 우리 결제 원장\n └─ 결제대행사 내역\n ↓\n처리 선택?\n ├─ 매입 지연 → 다음 대사로 이월\n ├─ 우리 오류 → 원장 정정 요청 등록\n ├─ 상대 오류 → 결제대행사 확인 요청 등록\n └─ 보류 → 사유 입력\n ↓\n[서버] 처리 기록\n ├─ 처리자, 시각, 사유\n └─ 처리 결과\n ↓\n불일치 목록 표시로 복귀\n```\n\n### FL-143 배치 실행 이력 (ADM-BATC-LIST)\n\n```text\n배치 실행 이력 진입\n ↓\n[운영자] 조회 조건 입력\n ├─ 기간\n └─ 배치 종류 (집계, 파기, 알림 재발송)\n ↓\n실행 목록 표시\n ├─ 배치명, 실행 시각\n ├─ 대상 건수, 처리 건수\n └─ 결과 (성공, 실패, 부분 실패)\n ↓\n실패 건 있음?\n ├─ 예 → 실패 사유 표시\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 다시 실행 → 대상 범위 확인 후 실행\n ├─ 처리 내역 보기 → 건별 결과 표시\n └─ 없음 → 종료\n ↓\n다시 실행함?\n ├─ 예 → 이미 처리한 건은 건너뛴다\n └─ 아니오 → 다음\n ↓\n종료\n```\n\n### FL-144 계정 변경 이력 (ADM-ULOG-LIST)\n\n```text\n계정 변경 이력 진입\n ↓\n[운영자] 조회 조건 입력\n ├─ 기간\n ├─ 대상 계정\n └─ 변경 항목\n ↓\n이력 목록 표시\n ├─ 처리자, 시각\n ├─ 대상 계정\n ├─ 변경 항목\n └─ 변경 전후 값\n ↓\n권한 상향 건 있음?\n ├─ 예 → 해당 행 표시 후 점검 대상으로 분류\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 내려받기 → 파일 생성 후 내려받기\n ├─ 점검 확인 → 점검자와 시각 기록\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-145 개인정보 파기 이력 (ADM-PRIV-LIST)\n\n```text\n파기 이력 진입\n ↓\n파기 대상 기준 표시\n ├─ 주문자명과 휴대폰번호\n ├─ 보유 기간 경과 판정일\n └─ 다음 실행 예정 시각\n ↓\n[서버] 일 배치로 대상 추출\n ↓\n파기 대상 있음?\n ├─ 아니오 → 실행 기록만 남긴다\n └─ 예 → 다음\n ↓\n[서버] 파기 실행\n ├─ 개인 식별 항목 삭제\n ├─ 주문번호와 금액은 유지\n └─ 복원 불가능한 방법으로 처리\n ↓\n파기 기록 저장\n ├─ 파기 시각, 대상 건수\n ├─ 파기 항목\n └─ 처리 결과\n ↓\n이력 목록 표시\n ↓\n종료\n```\n\n## 8. 가맹 어드민 화면별 Flow\n\n### FL-210 로그인 (STR-AUTH-LOGIN)\n\n```text\n로그인 화면 진입\n ↓\n계정·비밀번호 입력\n ↓\n계정 잠금 상태?\n ├─ 예 → 비밀번호 재설정 안내 표시 → FL-229\n └─ 아니오 → 다음\n ↓\n비밀번호 잊음 선택?\n ├─ 예 → FL-229\n └─ 아니오 → 다음\n ↓\n비밀번호 일치?\n ├─ 아니오 → FL-908\n └─ 예 → 다음\n ↓\n초기 비밀번호 사용 중?\n ├─ 예 → 비밀번호 변경 화면으로 이동 → 변경 후 다음\n └─ 아니오 → 다음\n ↓\n2차 인증 화면으로 이동\n```\n\n### FL-211 2차 인증·매장 선택 (STR-AUTH-OTP / STR-STOR-PICK)\n\n```text\n2차 인증 화면 진입\n ↓\n인증번호 발송\n ↓\n인증번호 입력\n ↓\n인증 성공?\n ├─ 아니오 → 실패 횟수 누적 → 인증번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n담당 매장 수 확인\n ↓\n담당 매장 둘 이상?\n ├─ 예 → 매장 선택 화면 표시 → 매장 선택\n └─ 아니오 → 담당 매장 자동 지정\n ↓\n선택 매장 영업 종료 상태?\n ├─ 예 → 종료 안내 표시 → 매장 선택으로 복귀\n └─ 아니오 → 다음\n ↓\n매장 홈으로 이동\n```\n\n### FL-212 매장 홈 (STR-HOME-MAIN)\n\n```text\n매장 홈 진입\n ↓\n매장 현황 조회\n ├─ 접수 대기 건수\n ├─ 조리 중 건수\n ├─ 당일 매출\n └─ 품절 메뉴 수\n ↓\n접수 대기 있음?\n ├─ 예 → 알림음 재생, 건수 강조 표시\n └─ 아니오 → 다음\n ↓\n단말 연결 상태 확인\n ↓\n프린터 오류 있음?\n ├─ 예 → 오류 표시 → FL-215\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 주문 접수 → FL-213\n ├─ 영업 상태 변경 → FL-218\n ├─ 품절 설정 → FL-220\n └─ 없음 → 매장 홈 유지\n ↓\n종료\n```\n\n### FL-213 주문 접수 목록 (STR-ORDR-LIST)\n\n```text\n주문 접수 목록 진입\n ↓\n상태별 목록 표시\n ├─ 접수 대기\n ├─ 접수 완료\n └─ 조리 완료\n ↓\n신규 주문 수신?\n ├─ 예 → 목록 상단에 추가, 알림음 재생\n └─ 아니오 → 다음\n ↓\n접수 대기 남은 시간 표시   ← 5분에서 줄어든다. 1분 남으면 색을 바꾼다\n ↓\n5분 경과 건 있음?\n ├─ 예 → FL-903 (사유 = 미응답)\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 주문 선택 → FL-214\n ├─ 접수 → 준비 시간 선택 → 접수 완료\n ├─ 거절 → 거절 사유 선택 → FL-903\n ├─ 일괄 접수 → 준비 시간 선택 → 선택 건 접수 처리\n └─ 없음 → 목록 유지\n ↓\n종료\n```\n\n### FL-214 주문 상세 (STR-ORDR-DETAIL)\n\n```text\n주문 상세 진입\n ↓\n주문 내용 표시\n ├─ 주문번호, 주문 시각\n ├─ 수령 방식, 호출 정보\n ├─ 메뉴와 옵션, 수량\n └─ 결제 금액, 결제수단\n ↓\n접수 처리 선택?\n ├─ 접수 → 주문 상태 = 접수 완료\n ├─ 거절 → 거절 사유 선택 → 결제 취소 요청\n └─ 보류 → 주문 접수 목록으로 복귀\n ↓\n접수함?\n ├─ 아니오 → 취소 처리 후 종료\n └─ 예 → 다음\n ↓\n주문서 출력\n ↓\n출력 성공?\n ├─ 아니오 → FL-215\n └─ 예 → 다음\n ↓\n조리 완료 처리\n ↓\n주문 상태 = 조리 완료\n ↓\n고객 호출\n ├─ 웹앱 주문 → 알림 발송\n └─ 키오스크 주문 → 번호 표시\n ↓\n수령 완료 처리\n ↓\n주문 접수 목록으로 복귀\n```\n\n### FL-215 주문서 재출력 (STR-ORDR-PRNT)\n\n```text\n재출력 팝업 표시\n ↓\n출력 실패 사유 표시\n ├─ 용지 없음\n ├─ 프린터 미연결\n └─ 응답 없음\n ↓\n조치 안내 표시\n ↓\n재시도 선택?\n ├─ 아니오 → 화면으로 내용 확인 → 팝업 닫기\n └─ 예 → 다음\n ↓\n재출력 실행\n ↓\n출력 성공?\n ├─ 아니오 → 출력 실패 사유 표시로 복귀\n └─ 예 → 다음\n ↓\n주문 상세로 복귀\n```\n\n### FL-216 매장 정보 (STR-INFO-DETAIL)\n\n```text\n매장 정보 진입\n ↓\n정보 표시\n ├─ 상호, 사업자번호, 주소\n ├─ 영업시간, 휴무일\n ├─ 소속 행사, 상권, 브랜드\n └─ 사용 채널\n ↓\n최근 변경 있음?\n ├─ 예 → 요청 항목과 처리 상태 표시\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 정보 변경 → FL-217\n ├─ 영업 상태 변경 → FL-218\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-217 매장 정보 변경 (STR-INFO-FORM)\n\n매장이 직접 바꾼다. 본사 확정을 두지 않는다. 바꾼 값은 즉시 반영되고 변경 이력에 남는다.\n\n```text\n매장 정보 변경 화면 진입\n ↓\n바꿀 항목 선택\n ├─ 영업시간\n ├─ 대표 연락처\n ├─ 기본 준비 시간\n └─ 정산계좌\n ↓\n바꿀 수 없는 항목 안내\n ├─ 상호, 사업자등록번호 → 본사에 요청\n └─ 소속 행사, 상권, 지점번호 → 매장 등록·수정에서 다룬다\n ↓\n바꿀 값 입력\n ↓\n변경 사유 입력   ← 이력에 남긴다\n ↓\n정산계좌를 바꾸는가?\n ├─ 예   → 통장 사본 첨부 → 예금주가 사업자 대표와 같은지 확인\n └─ 아니오 → 다음\n ↓\n검증 → FL-604\n ↓\n저장 → FL-605\n ├─ 즉시 반영한다\n └─ 항목마다 변경 전·후, 변경자, 사유를 이력에 남긴다\n ↓\n매장 정보로 복귀\n```\n\n정산계좌 변경은 예금주 확인을 거친다. 통장 사본 없이 저장할 수 없다.\n이력은 본사가 상권 등록·수정의 히스토리 탭에서 본다.\n\n### FL-218 영업 상태 변경 (STR-OPEN-STATE)\n\n```text\n영업 상태 팝업 표시\n ↓\n상태 선택\n ├─ 영업 중\n └─ 일시중지\n ↓\n일시중지 선택?\n ├─ 예 → 재개 예정 시각과 사유 입력\n └─ 아니오 → 다음\n ↓\n진행 중 주문 있음?\n ├─ 예 → 진행 건수 표시 → 신규 주문만 차단\n └─ 아니오 → 다음\n ↓\n확인 선택?\n ├─ 아니오 → 팝업 닫기 → 매장 홈으로 복귀\n └─ 예 → 다음\n ↓\n상태 저장\n ↓\n채널 반영\n ├─ 웹앱 주문 차단 안내 표시\n └─ 키오스크 대기화면 전환\n ↓\n매장 홈으로 복귀\n```\n\n### FL-219 메뉴 목록 (STR-MENU-LIST)\n\n```text\n메뉴 목록 진입\n ↓\n검색 조건 입력\n ├─ 카테고리\n ├─ 메뉴명\n └─ 판매 상태 (판매중, 품절, 미노출)\n ↓\n목록 표시\n ├─ 메뉴명, 판매가\n ├─ 알레르기 입력 여부\n └─ 판매 상태\n ↓\n표시 정보 미입력 메뉴 있음?\n ├─ 예 → 판매 불가 표시\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 신규 등록 → FL-223\n ├─ 행 선택 → FL-223\n ├─ 카테고리 관리 → FL-222\n ├─ 옵션 그룹 관리 → FL-227\n ├─ 판매가 설정 → FL-228\n ├─ 품절 설정 → FL-220\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-220 품절 설정 (STR-SOUT-FORM)\n\n```text\n품절 설정 팝업 표시\n ↓\n대상 메뉴 확인\n ↓\n설정 선택\n ├─ 품절 처리\n └─ 판매 재개\n ↓\n품절 처리?\n ├─ 예 → 재개 예정 시각 선택\n └─ 아니오 → 다음\n ↓\n본사에서 이미 변경함?\n ├─ 예 → 처리자와 시각을 기록하고 마지막 값을 적용\n └─ 아니오 → 다음\n ↓\n저장\n ↓\n채널 즉시 반영\n ├─ 웹앱 목록에서 제외\n └─ 키오스크 목록에서 제외\n ↓\n메뉴 목록으로 복귀\n```\n\n### FL-221 매출 조회 (STR-SALE-LIST)\n\n```text\n매출 조회 진입\n ↓\n조회 조건 입력\n ├─ 기간\n └─ 채널, 결제수단\n ↓\n담당 매장 범위로 제한\n ↓\n집계 결과 표시\n ├─ 주문 건수, 매출액\n ├─ 취소 건수\n └─ 메뉴별 판매 수량\n ↓\n당일 구간 포함?\n ├─ 예 → 집계 시점과 잠정치 안내 표시\n └─ 아니오 → 확정치 표시\n ↓\n동작 선택?\n ├─ 일자별 보기 → 일 단위 내역 표시\n ├─ 내려받기 → 파일 생성 후 내려받기\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-222 카테고리 목록·등록 (STR-CATG-LIST / STR-CATG-FORM)\n\n```text\n카테고리 목록 진입\n ↓\n브랜드 선택\n ↓\n브랜드 선택함?\n ├─ 아니오 → 브랜드 선택 안내 표시 → 브랜드 선택으로 복귀\n └─ 예 → 다음\n ↓\n목록 표시\n ↓\n동작 선택?\n ├─ 신규 등록 → 카테고리 등록 팝업\n ├─ 행 선택 → 카테고리 수정 팝업\n ├─ 순서 변경 → 끌어 놓기로 정렬 후 저장\n └─ 없음 → 종료\n ↓\n카테고리 정보 입력\n ├─ 카테고리명\n ├─ 노출 여부\n └─ 정렬 순서\n ↓\n소속 메뉴 있는데 미노출로 변경?\n ├─ 예 → 함께 숨겨지는 메뉴 수 표시 → 확인 후 다음\n └─ 아니오 → 다음\n ↓\n저장\n ↓\n카테고리 목록으로 복귀\n```\n\n### FL-223 메뉴 등록·수정 (STR-MENU-FORM)\n\n```text\n메뉴 등록 화면 진입\n ↓\n기본 정보 입력\n ├─ 브랜드, 카테고리 선택\n ├─ 메뉴명, 기준 가격\n ├─ 대표 이미지, 설명\n └─ 판매 시간\n ↓\n옵션 그룹 연결\n ├─ 그룹 선택\n ├─ 필수 여부\n └─ 최소·최대 선택 수\n ↓\nFL-224\n ↓\nFL-225\n ↓\n알레르기 입력 완료?\n ├─ 아니오 → 입력 요청 표시 → FL-224\n └─ 예 → 다음\n ↓\n원산지 입력 완료?\n ├─ 아니오 → 입력 요청 표시 → FL-225\n └─ 예 → 다음\n ↓\n옵션이 유발물질을 바꿈?\n ├─ 예 → FL-226\n └─ 아니오 → 다음\n ↓\n저장\n ↓\n메뉴 목록으로 복귀\n```\n\n### FL-224 알레르기·영양성분 입력 (STR-MENU-ALGN)\n\n```text\n알레르기 입력 팝업 표시\n ↓\n알레르기 유발물질 선택\n ├─ 법정 18종 목록에서 선택\n └─ 해당 없음 선택 가능\n ↓\n해당 없음 선택?\n ├─ 예 → 사유 입력 → 다음\n └─ 아니오 → 다음\n ↓\n영양성분 입력\n ├─ 열량, 나트륨, 탄수화물, 당류\n ├─ 지방, 트랜스지방, 포화지방\n └─ 콜레스테롤, 단백질\n ↓\n숫자 형식 오류?\n ├─ 예 → 해당 항목 표시 → 영양성분 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n1회 제공량 입력\n ↓\n저장\n ↓\n메뉴 등록 화면으로 복귀\n```\n\n### FL-225 원산지 입력 (STR-MENU-ORIG)\n\n```text\n원산지 입력 팝업 표시\n ↓\n표시 대상 품목 조회\n ↓\n표시 대상 있음?\n ├─ 아니오 → 대상 없음 표시 → 메뉴 등록 화면으로 복귀\n └─ 예 → 다음\n ↓\n품목별 원산지 입력\n ├─ 품목명\n ├─ 원산지 국가·지역\n └─ 혼합 비율\n ↓\n미입력 품목 있음?\n ├─ 예 → 해당 품목 표시 → 품목별 원산지 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n저장\n ↓\n메뉴 등록 화면으로 복귀\n```\n\n### FL-226 상품 복제 (STR-MENU-COPY)\n\n```text\n상품 복제 팝업 표시\n ↓\n복제 사유 확인\n ├─ 옵션 선택에 따라 유발물질이 달라짐\n └─ 하나의 메뉴로는 정확한 표시가 불가능함\n ↓\n복제 대상 옵션 선택\n ↓\n선택한 옵션 있음?\n ├─ 아니오 → 선택 요청 표시 → 복제 대상 옵션 선택으로 복귀\n └─ 예 → 다음\n ↓\n복제 메뉴명 입력\n ↓\n복제 실행\n ├─ 기본 정보 복사\n ├─ 선택 옵션을 고정 값으로 설정\n └─ 알레르기 정보는 미입력 상태로 생성\n ↓\nFL-224\n ↓\n메뉴 목록으로 복귀\n```\n\n### FL-227 옵션 그룹 (STR-OPTG-LIST / STR-OPTG-FORM)\n\n```text\n옵션 그룹 목록 진입\n ↓\n브랜드 선택\n ↓\n목록 표시\n ├─ 그룹명\n ├─ 옵션 항목 수\n └─ 연결된 메뉴 수\n ↓\n동작 선택?\n ├─ 신규 등록 → 옵션 그룹 등록 화면\n ├─ 행 선택 → 옵션 그룹 수정 화면\n └─ 없음 → 종료\n ↓\n그룹 정보 입력\n ├─ 그룹명\n ├─ 필수 여부\n └─ 최소·최대 선택 수\n ↓\n옵션 항목 입력\n ├─ 항목명\n ├─ 추가 금액\n └─ 유발물질 변경 여부\n ↓\n최소 선택 수가 항목 수보다 큼?\n ├─ 예 → 선택 수 확인 안내 표시 → 그룹 정보 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n연결된 메뉴 있는데 항목 삭제?\n ├─ 예 → 영향 메뉴 수 표시 → 확인 후 다음\n └─ 아니오 → 다음\n ↓\n저장\n ↓\n옵션 그룹 목록으로 복귀\n```\n\n### FL-228 판매가 설정 (STR-PRIC-FORM)\n\n```text\n판매가 진입\n ↓\n대상 선택\n ├─ 행사, 상권, 매장\n └─ 브랜드, 카테고리\n ↓\n메뉴별 가격 표시\n ├─ 기준 가격\n └─ 매장 지정 가격\n ↓\n가격 수정\n ↓\n기준 가격과 동일?\n ├─ 예 → 지정 값 제거 후 기준 가격 적용\n └─ 아니오 → 지정 값 유지\n ↓\n0원 이하 입력?\n ├─ 예 → 가격 확인 안내 표시 → 가격 수정으로 복귀\n └─ 아니오 → 다음\n ↓\n저장\n ↓\n종료\n```\n\n### FL-229 비밀번호 재설정 (STR-AUTH-RESET)\n\n```text\n[매장] 비밀번호 찾기 선택\n ↓\n[매장] 이메일과 휴대폰번호 입력\n ↓\n[서버] 등록 정보와 대조\n ↓\n일치함?\n ├─ 아니오 → 확인 안내 표시. 어느 항목이 틀렸는지 밝히지 않는다 → 이메일과 휴대폰번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n[서버] 인증번호 발송\n ↓\n[매장] 인증번호 입력\n ↓\n유효시간 내 입력?\n ├─ 아니오 → 시간 초과 안내 표시 → 인증번호 발송으로 복귀\n └─ 예 → 다음\n ↓\n인증번호 일치?\n ├─ 아니오 → 실패 횟수 누적 → 인증번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n실패 횟수 초과?\n ├─ 예 → 일정 시간 차단. 본사 문의 안내 → 종료\n └─ 아니오 → 다음\n ↓\n[매장] 새 비밀번호 입력\n ↓\n작성 규칙 충족?\n ├─ 아니오 → 규칙 안내 표시 → 새 비밀번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n이전 비밀번호와 같음?\n ├─ 예 → 다른 값 입력 안내 표시 → 새 비밀번호 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n[서버] 비밀번호 변경\n ↓\n변경 기록 저장\n ├─ 계정, 시각, 접속 주소\n └─ 처리 방식\n ↓\n로그인 화면으로 이동\n```\n\n### FL-230 메뉴 가져오기 (STR-MENU-IMPT)\n\n```text\n메뉴 가져오기 진입\n ↓\n[매장] 가져올 대상 선택\n ├─ 같은 사업자의 이전 매장\n └─ 같은 브랜드의 다른 매장\n ↓\n대상 매장 있음?\n ├─ 아니오 → 대상 없음 표시 → 종료\n └─ 예 → 다음\n ↓\n[매장] 가져올 범위 선택\n ├─ 카테고리\n ├─ 메뉴와 옵션\n └─ 표시 정보\n ↓\n[서버] 중복 검사\n ↓\n같은 이름의 메뉴 있음?\n ├─ 예 → 덮어쓰기와 건너뛰기 중 선택\n └─ 아니오 → 다음\n ↓\n가져오기 실행\n ├─ 카테고리와 정렬 순서 복사\n ├─ 메뉴와 옵션 구성 복사\n ├─ 알레르기와 원산지 복사\n └─ 판매가는 복사하지 않는다\n ↓\n[매장] 판매가 입력\n ↓\n판매가 미입력 메뉴 있음?\n ├─ 예 → 판매 불가 상태로 저장\n └─ 아니오 → 다음\n ↓\n가져오기 기록 저장\n ├─ 원본 매장, 대상 건수\n └─ 처리자와 시각\n ↓\n메뉴 목록으로 복귀\n```\n\n### FL-231 알림 발송 이력 (STR-NOTI-LIST)\n\n```text\n알림 발송 이력 진입\n ↓\n[매장] 조회 조건 입력\n ├─ 기간\n ├─ 주문번호\n └─ 발송 결과\n ↓\n발송 목록 표시\n ├─ 주문번호, 발송 시각\n ├─ 발송 경로 (알림톡, 문자)\n ├─ 수신 번호\n └─ 결과 (성공, 실패, 대체 발송)\n ↓\n실패 건 있음?\n ├─ 예 → 실패 사유 표시\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 다시 보내기 → 경로 선택 후 발송\n ├─ 주문 상세 보기 → FL-214\n └─ 없음 → 종료\n ↓\n다시 보냄?\n ├─ 예 → 발송 기록에 재발송으로 남긴다\n └─ 아니오 → 다음\n ↓\n종료\n```\n\n### FL-232 단말 목록 (STR-DEVC-LIST)\n\n매장과 본사가 같은 화면을 쓴다. 매장은 담당 매장, 본사는 전체를 본다.\n\n```text\n단말 목록 진입\n ↓\n접속 주체?\n ├─ 매장  → 담당 매장 단말만 조회한다\n └─ 본사  → 전체 매장 단말을 조회한다. 행사와 상권으로 좁힌다\n ↓\n[사용자] 조회 조건 선택\n ├─ 단말 종류 (키오스크, 카드 단말, 주문서 프린터)\n └─ 연결 상태\n ↓\n단말 목록 표시\n ├─ 단말명, 종류, 설치 위치\n ├─ 연결 상태 (연결, 연결 끊김, 사용 중지)\n └─ 마지막 통신 시각\n ↓\n연결 끊김 단말 있음?\n ├─ 예 → 해당 행 표시. 마지막 통신 시각과 함께 안내. 알림 발송은 FL-147\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 등록 → 매장만 가능 → FL-233\n ├─ 수정 → 매장만 가능. 단말명과 설치 위치 변경\n ├─ 사용 중지 → 사유 입력 후 처리\n ├─ 사용 재개 → 자기가 중지한 단말만 선택 가능\n └─ 없음 → 종료\n ↓\n사용 중지함?\n ├─ 예 → 해당 단말의 주문 수신을 멈춘다\n └─ 아니오 → 다음\n ↓\n본사가 중지함?\n ├─ 예 → 매장에 통지한다. 매장은 재개할 수 없다\n └─ 아니오 → 다음\n ↓\n조작 기록 저장\n ├─ 조작자와 대상 매장\n └─ 시각과 사유\n ↓\n종료\n```\n\n### FL-233 단말 연결 (STR-DEVC-FORM / STR-DEVC-PAIR)\n\n```text\n단말 등록 진입\n ↓\n[매장] 단말 정보 입력\n ├─ 단말 종류\n ├─ 단말명\n └─ 설치 위치\n ↓\n[서버] 연결 코드 발급\n ↓\n연결 코드 표시\n └─ 유효시간 10분\n ↓\n[매장] 단말에 연결 코드 입력\n ↓\n[서버] 코드 확인\n ↓\n유효시간 내인가?\n ├─ 아니오 → 코드 만료 안내 표시 → 연결 코드 발급으로 복귀\n └─ 예 → 다음\n ↓\n코드 일치?\n ├─ 아니오 → 확인 안내 표시 → 단말에 연결 코드 입력으로 복귀\n └─ 예 → 다음\n ↓\n[서버] 단말과 매장 연결\n ├─ 단말 식별자 저장\n └─ 담당 매장 지정\n ↓\n단말 종류?\n ├─ 키오스크 → 매장 메뉴를 내려받는다\n ├─ 카드 단말 → 결제 승인 경로를 연결한다\n └─ 주문서 프린터 → 시험 출력을 실행한다\n ↓\n시험 동작 성공?\n ├─ 아니오 → 실패 사유 표시. 연결 상태는 연결 끊김으로 둔다\n └─ 예 → 연결 상태를 연결로 바꾼다\n ↓\n연결 기록 저장\n ├─ 처리자, 시각\n └─ 단말 식별자\n ↓\n단말 목록으로 복귀\n```\n\n### FL-234 매장 등록·관리 (STR-STOR-LIST / STR-STOR-FORM / ADM-HOME-EXAM)\n\n가맹 관리자가 담당 상권에 매장을 만든다. 본사는 만들지 않고 개시만 확정한다.\n매장은 상권 하나와 행사 하나에 속한다. 소속 행사는 상권의 참여 행사 중에서 고른다.\n\n```text\n매장 목록 진입   ← 담당 상권의 매장만 보인다\n ↓\n동작 선택?\n ├─ 매장 등록 → 등록 화면\n ├─ 수정 → 수정 화면\n ├─ 폐점 → 폐점 확인\n └─ 없음 → 종료\n ↓\n[등록] 입력\n ├─ 브랜드 (상권의 것으로 고정)\n ├─ 소속 행사 (상권의 참여 행사 중 진행 전·진행 중)\n ├─ 위치 → 주소 검색 (ADM-ADDR-FIND) → FL-603\n ├─ 영업시간, 대표 연락처, 기본 준비 시간\n └─ 주문 채널 (웹앱, 키오스크 중 하나 이상)\n ↓\n상권에 참여 행사가 있는가?\n ├─ 아니오 → 본사 요청 안내 → 저장하지 않는다\n └─ 예 → 다음\n ↓\n검증 → FL-604\n ↓\n저장\n ├─ 지점번호를 브랜드 안에서 자동으로 부여한다\n ├─ 매장명 = 브랜드명 + 지점번호\n ├─ 정산계좌와 사업자 정보는 상권의 것을 잇는다\n └─ 상태 = 개설 준비   ← 주문 채널에 나오지 않고 정산에 들어가지 않는다\n ↓\n[본사] 하위가맹점 심사 요청   ← 사업자 정보와 정산계좌를 결제대행사에 넘긴다\n ↓\n심사 결과 수신?\n ├─ 결제대행사가 보내옴 → 자동 반영\n └─ 보내오지 않음 → 본사가 대시보드 개시 준비에서 완료 처리 (ADM-HOME-EXAM)\n ↓\n개시 확정   → 상태 = 영업. 소속 행사를 잠근다. 주문 채널에 노출한다\n```\n\n개설 준비 동안 매장 홈은 주문 영역 대신 개시 전 준비 항목과 심사 상태를 보여준다. 영업 상태 변경은 개시 확정 뒤에 열린다.\n\n```text\n[폐점] 매장 목록에서 폐점을 선택\n ↓\n[폐점] 진행 중 주문 있는가?\n ├─ 예 → \"진행 중인 주문 N건을 먼저 처리해 주세요.\" → 종료\n └─ 아니오 → 확인 팝업 (되돌릴 수 없음, 단말 사용 중지 안내) → FL-605\n ↓\n폐점 처리\n ├─ 상태 = 폐점\n ├─ 연결 단말을 사용 중지로 바꾼다\n ├─ 주문 채널에서 뺀다\n └─ 지점번호는 다시 쓰지 않는다\n ↓\n변경 이력 기록   ← 본사의 상권 히스토리 탭에서 본다\n```\n\n개설 준비 동안은 소속 행사를 바꿀 수 있다. 개시를 확정하면 잠긴다.\n매장이 속한 행사는 상권에서 뗄 수 없다. 행사가 끝나 매장이 정리된 뒤에 뗀다.\n\n## 9. 하이브리드 웹앱 화면별 Flow\n\n### FL-310 매장 진입 (WEB-STOR-ENTRY / WEB-INFO-SELL / WEB-INFO-POLI)\n\n```text\n[고객] QR 스캔\n ↓\n[서버] 매장 식별자 확인\n ↓\n매장 식별자 있음?\n ├─ 아니오 → 잘못된 접근 안내 표시 → 종료\n └─ 예 → 다음\n ↓\n[서버] 매장 정보 조회\n ↓\n매장 존재함?\n ├─ 아니오 → 잘못된 접근 안내 표시 → 종료\n └─ 예 → 다음\n ↓\n[서버] 주문 가능 조건 확인\n ├─ 영업시간\n └─ 영업 상태\n ↓\n위치정보 이용 동의   ← 위치정보법 제18조. 권한을 요청하기 전에 안내한다\n ├─ 목적, 보유 기간(저장하지 않음), 제3자 제공 없음, 거부할 권리를 알린다\n ├─ 동의하지 않음 → 반경 확인을 건너뛰고 주문을 이어 간다\n └─ 동의 → 다음\n ↓\n[단말] 주문 가능 반경 판정   ← 좌표를 서버로 보내지 않는다. 판정 결과만 보낸다\n ├─ 위치 권한 거부 → 반경 확인을 건너뛰고 주문을 이어 간다\n └─ 권한 허용 → 매장 좌표와의 거리를 단말에서 계산한다\n ↓\n주문 가능?\n ├─ 아니오 → FL-312\n └─ 예 → 다음\n ↓\n매장 정보 표시\n ├─ 매장명, 참여 행사와 구역\n ├─ 영업 상태와 영업시간\n └─ 판매자 정보 → WEB-INFO-SELL   ← 전자상거래법 제13조 제1항 표시\n ↓\nFL-313\n```\n\n판매자는 매장이다. 본사는 주문을 잇는 역할만 하므로 판매자로 표시하지 않는다.\n\n위치기반서비스사업은 신고 대상으로 보고 갖춘다. 그래서 권한을 요청하기 전에 위치정보 이용 동의를 따로 받는다.\n개인정보 수집·이용 동의와 묶지 않는다. 위치정보 동의는 선택이므로 거부해도 주문할 수 있게 두고 반경 확인만 건너뛴다.\n\n반경 판정은 단말에서 한다. 신고를 하더라도 좌표를 서버로 보낼 이유가 없다.\n보관하는 위치정보가 없으면 유출 위험도 없고 이용·제공 사실 확인자료도 남지 않는다.\n근거는 `research/필수정책_조사.md`에 있다.\n\n### FL-312 주문 불가 안내 (WEB-STOR-BLOCK)\n\n```text\n주문 불가 화면 진입\n ↓\n불가 사유 확인?\n ├─ 영업시간 외 → 다음 영업 시작 시각 표시\n ├─ 일시중지 → 재개 예정 시각 표시\n ├─ 영업 종료 → 종료 안내 표시\n └─ 반경 밖 → 매장 방문 안내 표시\n ↓\n안내 표시\n ├─ 매장 위치\n └─ 문의 연락처\n ↓\n동작 선택?\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-313 수령 방식 선택 (WEB-ORDR-TYPE)\n\n```text\n수령 방식 화면 진입\n ↓\n매장 운영 방식 확인\n ↓\n운영 방식이 하나뿐?\n ├─ 예 → 자동 지정 후 다음\n └─ 아니오 → 다음\n ↓\n수령 방식 선택\n ├─ 매장 식사\n └─ 포장\n ↓\n선택함?\n ├─ 아니오 → 선택 요청 표시 → 수령 방식 선택으로 복귀\n └─ 예 → 다음\n ↓\nFL-314\n```\n\n### FL-314 메뉴 목록 (WEB-MENU-LIST)\n\n```text\n메뉴 목록 진입\n ↓\n매장 메뉴 조회\n ↓\n판매 가능 메뉴 있음?\n ├─ 아니오 → 판매 가능 메뉴 없음 표시 → 종료\n └─ 예 → 다음\n ↓\n카테고리별 목록 표시\n ├─ 품절 메뉴는 목록에서 제외\n ├─ 메뉴명, 가격, 이미지\n └─ 알레르기 표시 여부\n ↓\n판매 시간 밖 메뉴 있음?\n ├─ 예 → 판매 시간 표시 후 선택 차단\n └─ 아니오 → 다음\n ↓\n메뉴 선택?\n ├─ 판매중 메뉴 → FL-315\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-315 메뉴 상세·옵션 선택 (WEB-MENU-DETAIL)\n\n```text\n메뉴 상세 진입\n ↓\n메뉴 정보 표시\n ├─ 이미지, 설명, 가격\n ├─ 알레르기 유발물질\n ├─ 영양성분\n └─ 원산지\n ↓\n옵션 그룹 표시\n ├─ 필수 그룹\n └─ 선택 그룹\n ↓\n옵션 선택\n ↓\n필수 옵션 모두 선택?\n ├─ 아니오 → 미선택 그룹 표시 → 옵션 선택으로 복귀\n └─ 예 → 다음\n ↓\n최대 선택 수 초과?\n ├─ 예 → 초과 안내 표시 → 옵션 선택으로 복귀\n └─ 아니오 → 다음\n ↓\n수량 지정\n ↓\n합계 금액 표시\n ↓\n동작 선택?\n ├─ 장바구니 담기 → 담은 뒤 메뉴 목록으로 복귀. 하단 토스트로 담김을 알린다\n ├─ 바로 결제    → FL-317\n └─ 없음        → 메뉴 목록으로 복귀\n ↓\n장바구니 담기 선택함?\n ├─ 예   → FL-316\n └─ 아니오 → 종료\n```\n\n메뉴 하나만 사는 고객이 장바구니를 거치지 않게 한다. 바로 결제를 고르면 그 메뉴 하나로 결제 상세를 만든다. 이미 담긴 항목이 있으면 함께 결제할지 묻는다.\n\n### FL-316 장바구니 (WEB-CART-LIST)\n\n```text\n장바구니 진입\n ↓\n다른 매장 항목 있음?\n ├─ 예 → 초기화 확인 표시 → 확인 시 비우기, 취소 시 이전 화면 복귀\n └─ 아니오 → 다음\n ↓\n담긴 항목 표시\n ├─ 메뉴명, 선택 옵션\n ├─ 수량, 금액\n └─ 합계 금액\n ↓\n품절 전환 항목 있음?\n ├─ 예 → 해당 항목 표시 후 제거 안내\n └─ 아니오 → 다음\n ↓\n수량 변경 또는 삭제\n ↓\n장바구니 비었음?\n ├─ 예 → FL-314\n └─ 아니오 → 다음\n ↓\n최소 주문 금액 미달?\n ├─ 예 → 부족 금액 표시 → 장바구니 유지\n └─ 아니오 → 다음\n ↓\n주문하기 선택?\n ├─ 아니오 → 장바구니 유지\n └─ 예 → FL-317\n```\n\n### FL-317 결제 상세 (WEB-ORDR-FORM)\n\n```text\n결제 상세 진입\n ↓\n진입 경로?\n ├─ 장바구니 → 담긴 항목 전체를 대상으로 한다\n └─ 바로 결제 → 선택한 메뉴 하나를 대상으로 한다\n ↓\n주문 내역 표시\n ├─ 메뉴와 옵션, 수량\n ├─ 항목별 금액\n └─ 합계 금액\n ↓\n예상 준비 시간 안내   ← 매장이 정해 둔 기본 준비 시간을 쓴다\n ├─ 15분 이상이면 문구를 강조한다\n └─ 접수할 때 매장이 다시 정하며 그때 알린다\n ↓\n취소 가능 구간 안내   ← 전자상거래법 제17조 제3항. 알리지 않으면 제한이 인정되지 않는다\n └─ 접수 후 1분까지 취소할 수 있고 조리가 시작되면 취소할 수 없다\n ↓\n주문자 정보 입력\n ├─ 이름\n └─ 휴대폰번호\n ↓\n개인정보 수집·이용 동의\n ├─ 목적, 항목, 보유 기간, 거부권을 함께 보인다\n ├─ 보기 → 전문 표시 → 닫으면 결제 상세로 복귀\n └─ 동의하지 않으면 결제할 수 없다   ← 두 항목 모두 주문 처리에 필요한 필수 항목이다\n ↓\n휴대폰번호 형식 오류?\n ├─ 예 → 형식 안내 표시 → 주문자 정보 입력으로 복귀\n └─ 아니오 → 다음\n ↓\n요청사항 입력\n ↓\n개인정보 수집 동의\n ↓\n필수 동의함?\n ├─ 아니오 → 동의 요청 표시 → 개인정보 수집 동의로 복귀\n └─ 예 → 다음\n ↓\n결제 금액 확정\n ↓\n서버 금액 재계산 일치?\n ├─ 아니오 → FL-902\n └─ 예 → 다음\n ↓\nFL-318\n```\n\n### FL-318 결제 진행 (WEB-PAY-WAIT)\n\n```text\n[고객] 결제 진행 화면 진입\n ↓\n[서버] 결제 요청 생성\n ├─ 주문 식별자\n ├─ 결제 금액\n └─ 중복 방지 키\n ↓\n[고객] 결제창 호출\n ↓\n결제수단 선택 완료?\n ├─ 아니오 → 사용자 취소 → 주문서로 복귀\n └─ 예 → 다음\n ↓\n[카드사] 카드 소유자 인증\n ↓\n인증 성공?\n ├─ 아니오 → 실패 사유 표시 → 주문서로 복귀\n └─ 예 → 다음\n ↓\n[서버] 금액 검증\n ↓\n금액 일치?\n ├─ 아니오 → FL-902\n └─ 예 → 다음\n ↓\n[서버] 승인 요청\n ↓\n승인 응답 수신함?\n ├─ 아니오 → FL-901\n └─ 예 → 다음\n ↓\n승인 성공?\n ├─ 아니오 → 실패 사유 표시 → 주문서로 복귀\n └─ 예 → 다음\n ↓\n[서버] 주문 생성\n ↓\n[매장] 매장 알림 발송\n ↓\nFL-319\n```\n\n### FL-319 결제 완료 (WEB-ORDR-DONE)\n\n```text\n결제 완료 화면 진입\n ↓\n[서버] 호출 순번 부여\n └─ 매장별로 매일 1번부터 채번한다\n ↓\n호출 순번 표시\n └─ 화면에서 가장 크게 둔다. 현장에서 이 번호로 부른다\n ↓\n주문서 표시\n ├─ 주문번호, 주문 시각\n ├─ 매장명, 수령 방식\n ├─ 메뉴와 옵션, 수량\n ├─ 결제 금액, 결제수단\n └─ 예상 준비 시간   ← 매장이 접수할 때 고른 값. 접수 전에는 기본값을 표시한다\n ↓\n주문 조회 안내 표시\n ├─ 주문번호와 휴대폰번호로 조회 가능\n └─ 화면을 벗어나도 조회 가능\n ↓\n동작 선택?\n ├─ 주문 상태 보기 → FL-321\n ├─ 주문서 저장 → 화면 이미지로 저장\n ├─ 추가 주문 → FL-314\n └─ 없음 → 종료\n ↓\n종료\n```\n\n순번은 현장에서 부르는 번호다. 주문 조회와 정산 대사에는 주문번호를 쓴다. 두 값을 섞지 않는다.\n\n### FL-320 주문 조회 (WEB-ORDR-FIND)\n\n```text\n주문 조회 화면 진입\n ↓\n주문번호와 휴대폰번호 입력\n ↓\n입력값 형식 맞음?\n ├─ 아니오 → 형식 안내 표시 → 주문번호와 휴대폰번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n주문 조회\n ↓\n일치하는 주문 있음?\n ├─ 아니오 → 조회 실패 표시, 시도 횟수 누적 → 주문번호와 휴대폰번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n시도 횟수 초과?\n ├─ 예 → 일정 시간 조회 차단 → 종료\n └─ 아니오 → 다음\n ↓\nFL-321\n```\n\n### FL-321 주문 상태 (WEB-ORDR-STAT)\n\n```text\n주문 상태 화면 진입\n ↓\n현재 상태 표시\n ├─ 접수 대기 → 매장 확인 중. 남은 응답 시간을 함께 표시한다\n ├─ 접수 완료 → 매장이 고른 준비 시간과 예상 완료 시각을 표시한다\n ├─ 조리 중  → 취소할 수 없음을 표시한다\n ├─ 조리 완료 → 받아 갈 곳을 표시한다\n └─ 수령 완료 → 미수령으로 마감된 건은 그렇게 표시한다\n ↓\n상태 갱신 수신?\n ├─ 예 → 표시 갱신, 조리 완료 시 알림\n └─ 아니오 → 현재 상태 유지\n ↓\n취소된 주문?\n ├─ 예 → 취소 사유와 환불 안내 표시 → 종료\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 주문 취소 → FL-322\n ├─ 주문 내역 보기 → 메뉴와 금액 표시\n └─ 없음 → 종료\n ↓\n종료\n```\n\n### FL-322 주문 취소 (WEB-ORDR-CNCL)\n\n```text\n취소 요청 팝업 표시\n ↓\n현재 주문 상태 확인\n ↓\n주문 상태가 접수 대기 또는 접수 완료?\n ├─ 아니오 → 매장 문의 안내 표시 → 팝업 닫기\n └─ 예 → 다음\n ↓\n남은 취소 가능 시간 표시\n ↓\n취소 사유 선택\n ↓\n확인 선택?\n ├─ 아니오 → 팝업 닫기 → 주문 상태로 복귀\n └─ 예 → 다음\n ↓\n결제 취소 요청\n ↓\n취소 승인 성공?\n ├─ 아니오 → 취소 실패 표시, 매장 문의 안내 → 주문 상태로 복귀\n └─ 예 → 다음\n ↓\n주문 상태 = 취소\n ↓\n매장 알림 발송\n ↓\n환불 안내 표시\n ↓\n종료\n```\n\n## 10. 키오스크 화면별 Flow\n\n### FL-410 대기화면 (KSK-IDLE-MAIN / KSK-IDLE-ACCS)\n\n```text\n대기화면 표시\n ├─ 주문 시작 안내\n ├─ 접근성 안내 선택 → KSK-IDLE-ACCS\n │    ├─ 글자 크기, 화면 낮추기, 음성 속도를 바꾼다\n │    └─ 바꾼 설정은 그 주문이 끝날 때까지 유지한다\n ├─ 판매자 정보 선택 → KSK-INFO-SELL → 닫으면 대기화면으로 복귀\n └─ 관리자 진입 (화면 모서리 길게 누름) → FL-403\n ↓\n매장 영업 상태 확인\n ↓\n영업 중?\n ├─ 아니오 → 주문 불가 안내 표시 → 대기화면 유지\n └─ 예 → 다음\n ↓\n네트워크 연결 상태 확인\n ↓\n연결 정상?\n ├─ 아니오 → FL-905\n └─ 예 → 다음\n ↓\n메뉴 마스터 갱신 대기 있음?\n ├─ 예 → FL-402\n └─ 아니오 → 다음\n ↓\n화면 터치 감지?\n ├─ 아니오 → 대기화면 유지\n └─ 예 → FL-411\n```\n\n### FL-411 취식유형 선택 (KSK-ORDR-TYPE)\n\n```text\n취식유형 화면 표시\n ↓\n매장 운영 방식 확인\n ↓\n운영 방식이 하나뿐?\n ├─ 예 → 자동 지정 후 다음\n └─ 아니오 → 다음\n ↓\n취식유형 선택\n ├─ 매장 식사\n └─ 포장\n ↓\n일정 시간 무입력?\n ├─ 예 → 대기화면으로 복귀\n └─ 아니오 → 다음\n ↓\nFL-412\n```\n\n### FL-412 메뉴 선택 (KSK-MENU-LIST)\n\n```text\n메뉴 선택 화면 표시\n ↓\n카테고리별 메뉴 표시\n ├─ 품절 메뉴는 목록에서 제외\n ├─ 메뉴명, 가격, 이미지\n └─ 알레르기 표시 여부\n ↓\n메뉴 선택?\n ├─ 판매중 메뉴 → FL-413\n └─ 없음 → 다음\n ↓\n일정 시간 무입력?\n ├─ 예 → 대기화면으로 복귀\n └─ 아니오 → 메뉴 선택 화면 유지\n ↓\n종료\n```\n\n### FL-413 옵션 선택 (KSK-MENU-OPTN)\n\n```text\n옵션 선택 팝업 표시\n ↓\n메뉴 정보 표시\n ├─ 이미지, 가격\n └─ 알레르기 유발물질\n ↓\n옵션 그룹 표시\n ↓\n옵션 선택\n ↓\n필수 옵션 모두 선택?\n ├─ 아니오 → 미선택 그룹 표시 → 옵션 선택으로 복귀\n └─ 예 → 다음\n ↓\n수량 지정\n ↓\n합계 금액 표시\n ↓\n담기 선택?\n ├─ 아니오 → 팝업 닫기 → 메뉴 선택 화면으로 복귀\n └─ 예 → FL-414\n```\n\n### FL-414 주문 내역 확인 (KSK-CART-LIST)\n\n```text\n주문 내역 화면 표시\n ↓\n담긴 항목 표시\n ├─ 메뉴명, 옵션\n ├─ 수량, 금액\n └─ 합계 금액\n ↓\n수량 변경 또는 삭제\n ↓\n내역 비었음?\n ├─ 예 → 메뉴 선택 화면으로 복귀\n └─ 아니오 → 다음\n ↓\n동작 선택?\n ├─ 메뉴 추가 → FL-412\n ├─ 결제하기 → FL-415\n └─ 없음 → 다음\n ↓\n일정 시간 무입력?\n ├─ 예 → 주문 취소 안내 후 대기화면으로 복귀\n └─ 아니오 → 주문 내역 화면 유지\n ↓\n종료\n```\n\n### FL-415 결제수단 선택 (KSK-PAY-TYPE)\n\n```text\n결제수단 화면 표시\n ↓\n매장 허용 수단 조회\n ↓\n사용 가능 수단 표시\n ├─ 카드\n └─ 간편결제\n ↓\n단말 상태 정상?\n ├─ 아니오 → 사용 불가 수단 비활성 표시\n └─ 예 → 다음\n ↓\n수단 선택?\n ├─ 카드 또는 간편결제 → FL-417\n └─ 없음 → 다음\n ↓\n뒤로 선택?\n ├─ 예 → FL-414\n └─ 아니오 → 결제수단 화면 유지\n ↓\n종료\n```\n\n### FL-417 결제 진행 (KSK-PAY-PROC)\n\n```text\n결제 진행 화면 표시\n ↓\n결제 금액 표시\n ↓\n카드 투입 또는 접촉 안내\n ↓\n단말 승인 요청\n ↓\n5만원 이상?\n ├─ 예 → 서명 입력 요청\n └─ 아니오 → 다음\n ↓\n서명 완료?\n ├─ 아니오 → 서명 입력 요청으로 복귀\n └─ 예 → 다음\n ↓\n승인 응답 수신함?\n ├─ 아니오 → FL-904\n └─ 예 → 다음\n ↓\n승인 성공?\n ├─ 아니오 → 실패 사유 표시 → FL-415\n └─ 예 → 다음\n ↓\n주문 생성\n ↓\n매장 알림 발송\n ↓\n호출 방식 확인\n ↓\n휴대폰번호 방식?\n ├─ 예 → FL-418\n └─ 아니오 → FL-419\n```\n\n### FL-418 고객 호출 정보 입력 (KSK-CALL-FORM)\n\n```text\n호출 정보 화면 표시\n ↓\n휴대폰번호 입력\n ↓\n입력 생략 선택?\n ├─ 예 → 번호표 호출로 전환 → FL-419\n └─ 아니오 → 다음\n ↓\n번호 형식 맞음?\n ├─ 아니오 → 형식 안내 표시 → 휴대폰번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n개인정보 수집 동의\n ↓\n동의함?\n ├─ 아니오 → 번호표 호출로 전환 → FL-419\n └─ 예 → 다음\n ↓\n호출 정보 저장\n ↓\nFL-419\n```\n\n### FL-419 주문 완료 (KSK-ORDR-DONE)\n\n```text\n주문 완료 화면 표시\n ↓\n주문번호 표시\n ↓\n주문서 출력\n ↓\n출력 성공?\n ├─ 아니오 → 화면 주문번호 안내 표시\n └─ 예 → 다음\n ↓\n주문서 매장 전달\n ↓\n전달 성공?\n ├─ 아니오 → 매장 단말에 재전송 요청\n └─ 예 → 다음\n ↓\n일정 시간 경과?\n ├─ 예 → 대기화면으로 복귀\n └─ 아니오 → 주문 완료 화면 유지\n ↓\n종료\n```\n\n### FL-420 관리자 인증 (KSK-ADMN-AUTH)\n\n```text\n관리자 진입 동작 감지\n ↓\n관리자 인증 화면 표시\n ↓\n관리자 번호 입력\n ↓\n번호 일치?\n ├─ 아니오 → 실패 횟수 누적 → 관리자 번호 입력으로 복귀\n └─ 예 → 다음\n ↓\n실패 횟수 초과?\n ├─ 예 → 일정 시간 진입 차단 → 대기화면으로 복귀\n └─ 아니오 → 다음\n ↓\n진입 기록 저장\n ├─ 단말 식별자\n ├─ 진입 시각\n └─ 수행 작업\n ↓\nFL-421\n```\n\n### FL-421 관리자 메뉴 (KSK-ADMN-MAIN)\n\n```text\n관리자 메뉴 표시\n ↓\n단말 상태 요약 표시\n ├─ 프린터\n ├─ 결제 단말\n └─ 네트워크\n ↓\n동작 선택?\n ├─ 메뉴 갱신 → FL-425\n ├─ 판매 메뉴 설정 → FL-426\n ├─ 품절 설정 → FL-423\n ├─ 단말 상태 → FL-424\n └─ 나가기 → 대기화면으로 복귀\n ↓\n종료\n```\n\n### FL-423 품절 설정 (KSK-ADMN-SOUT)\n\n현장에서 재료가 떨어졌을 때 단말에서 바로 처리한다. 단말에만 반영하지 않고 ERP로 올려 다른 채널에도 함께 적용한다.\n\n```text\n품절 설정 화면 표시\n ↓\n메뉴 목록과 판매 상태 표시\n ↓\n상태 변경\n ├─ 품절 처리 (재개 시각 지정 가능)\n └─ 판매 재개\n ↓\n네트워크 연결 정상?\n ├─ 아니오 → 단말에만 반영하고 복구 시 전송 예약 → 화면에 미전송 표시\n └─ 예 → 다음\n ↓\n[서버] ERP 반영\n ├─ 매장별 메뉴 설정의 품절 상태를 바꾼다\n ├─ 하이브리드 웹앱 목록에서 제외한다\n └─ 외부 POS에 항목 단위로 통지한다\n ↓\n가맹 어드민에서 이미 변경함?\n ├─ 예 → 처리자와 시각을 기록하고 마지막 값을 적용\n └─ 아니오 → 다음\n ↓\n화면 표시 갱신\n ↓\n관리자 메뉴로 복귀\n```\n\n### FL-425 메뉴 갱신 (KSK-ADMN-SYNC)\n\n단말은 유휴 시점과 결제 완료 시점에 메뉴를 확인한다. 매장이 메뉴를 고치고 바로 반영하고 싶을 때 이 화면에서 직접 받아온다.\n\n```text\n메뉴 갱신 화면 표시\n ↓\n현재 단말 메뉴 정보 표시\n ├─ 마지막 갱신 시각\n └─ 메뉴 수, 카테고리 수\n ↓\n[매장] 갱신 선택\n ↓\n주문 진행 중인가?\n ├─ 예 → 진행 중 안내 표시. 주문이 끝난 뒤 갱신한다 → 종료\n └─ 아니오 → 다음\n ↓\n[서버] 변경분 조회\n └─ 마지막 갱신 시각 이후 변경만 받는다\n ↓\n변경 있음?\n ├─ 아니오 → 최신 상태 안내 표시 → 관리자 메뉴로 복귀\n └─ 예 → 다음\n ↓\n변경 내용 표시\n ├─ 추가된 메뉴\n ├─ 수정된 메뉴와 가격\n └─ 삭제된 메뉴\n ↓\n[매장] 적용 선택\n ↓\n[단말] 메뉴 반영\n ↓\n반영 성공?\n ├─ 아니오 → 실패 사유 표시. 기존 메뉴를 유지한다 → 관리자 메뉴로 복귀\n └─ 예 → 갱신 시각 기록\n ↓\n관리자 메뉴로 복귀\n```\n\n### FL-426 판매 메뉴 설정 (KSK-ADMN-OPEN)\n\n그날 준비된 메뉴만 화면에 연다. 매장별 메뉴 설정의 노출 여부를 바꾸는 것이므로 단말에만 적용되지 않는다.\n\n```text\n판매 메뉴 설정 화면 표시\n ↓\n카테고리별 메뉴 목록 표시\n ├─ 메뉴명, 판매가\n ├─ 노출 여부\n └─ 품절 상태\n ↓\n[매장] 노출 여부 변경\n ├─ 개별 선택\n └─ 카테고리 단위 일괄 선택\n ↓\n노출 메뉴가 하나도 없음?\n ├─ 예 → 최소 한 개 필요 안내 표시 → 노출 여부 변경으로 복귀\n └─ 아니오 → 다음\n ↓\n확인 팝업 표시\n └─ 여는 메뉴 수와 닫는 메뉴 수를 함께 표시\n ↓\n확인 선택?\n ├─ 아니오 → 판매 메뉴 설정 화면 유지\n └─ 예 → 다음\n ↓\n[서버] ERP 반영\n ├─ 매장별 메뉴 설정의 노출 여부를 바꾼다\n ├─ 하이브리드 웹앱에 함께 적용한다\n └─ 외부 POS에 변경을 통지한다\n ↓\n반영 성공?\n ├─ 아니오 → 실패 사유 표시. 이전 상태를 유지한다\n └─ 예 → 처리자와 시각을 기록\n ↓\n관리자 메뉴로 복귀\n```\n\n### FL-424 단말 상태 확인 (KSK-ADMN-DEVC)\n\n```text\n단말 상태 화면 표시\n ↓\n연결 점검 실행\n ├─ 프린터 응답\n ├─ 결제 단말 응답\n └─ 서버 통신\n ↓\n오류 항목 있음?\n ├─ 예 → 항목별 조치 안내 표시\n └─ 아니오 → 정상 표시\n ↓\n재점검 선택?\n ├─ 예 → 연결 점검 실행으로 복귀\n └─ 아니오 → 다음\n ↓\n점검 결과 전송\n ↓\n전송 성공?\n ├─ 아니오 → 복구 시 재전송 예약\n └─ 예 → 다음\n ↓\n관리자 메뉴로 복귀\n```\n\n## 11. 예외 Flow\n\n\n### FL-901 결제 결과 유실\n\n발생 조건: 결제 앱에서 복귀하지 못했거나, 승인 요청에 응답이 없다.\n\n```text\n결과 미수신 감지\n ↓\n서버가 결제 상태 조회\n ↓\n결제 상태?\n ├─ 승인됨   → 주문 확정 → 완료 화면\n ├─ 미승인   → 주문 미확정 → 재시도 안내\n └─ 판단 불가 → 대기 상태 유지\n ↓\n웹훅 수신 대기\n ↓\n일정 시간 내 승인 통지 수신?\n ├─ 예   → 주문 확정\n └─ 아니오 → 결제 취소 요청 → 주문 실패 처리\n```\n\n같은 주문에 대한 재시도는 동일 멱등키를 쓴다. 중복 승인이 발생하지 않는다.\n\n### FL-902 금액 검증 실패\n\n발생 조건: 저장된 금액과 결제창에서 돌아온 금액이 다르다.\n\n```text\n불일치 감지\n ↓\n승인 요청 중단   ← 승인 API를 호출하지 않는다\n ↓\n주문 실패 처리\n ↓\n\"결제 정보가 올바르지 않습니다. 다시 시도해 주세요.\" 표시\n ↓\n기록 남김\n```\n\n### FL-903 매장 미접수\n\n발생 조건: 매장이 주문을 거절했거나 5분 안에 응답하지 않았다.\n\n```text\n거절 또는 시간 초과\n ↓\n취소 사유 확정\n ├─ 매장 거절 → 매장이 고른 사유 (품절, 재료 소진, 마감, 기타)\n └─ 시간 초과 → 미응답\n ↓\n사유가 품절이나 재료 소진인가?\n ├─ 예   → 해당 메뉴를 품절로 바꾼다   ← 같은 거절이 되풀이되지 않게 한다\n └─ 아니오 → 다음\n ↓\n주문 취소 처리\n ↓\n결제 전액 취소 요청 (멱등키 부여)\n ↓\n취소 성공?\n ├─ 아니오 → 취소 대기로 기록 → 재시도 → 미해결 시 운영 확인 대상\n └─ 예 → 다음\n ↓\n고객 알림 발송   ← 사유를 문구로 바꿔 보낸다. 매장 사정을 그대로 노출하지 않는다\n ↓\n주문 상태 취소로 변경\n ↓\n거절 사유 기록   ← 매장별 거절 사유는 본사 통계에서 본다\n```\n\n거절 사유는 매장이 고르고 고객에게는 문구로 바꿔 보낸다.\n품절과 재료 소진은 \"재료가 떨어져 준비할 수 없습니다\", 마감은 \"영업이 끝나 준비할 수 없습니다\",\n기타와 미응답은 \"매장 사정으로 준비할 수 없습니다\"로 보낸다.\n\n### FL-904 VAN 망취소\n\n발생 조건: 승인 응답 타임아웃, 승인 중 통신 단절, 응답을 받았으나 성공 여부를 판단할 수 없음.\n\n```text\n이상 감지\n ↓\n망취소 요청   ← 원 승인 요청과 동일한 데이터를 재사용한다\n ↓\n망취소 성공?\n ├─ 아니오 → 재시도 → 미해결 시 관리자 확인 대상으로 기록\n └─ 예 → 결제 미완료 처리\n ↓\n\"결제를 처리하지 못했습니다. 다시 시도해 주세요.\" 표시\n ↓\n결제수단 선택으로 복귀\n```\n\n승인은 성공했으나 금액이 불일치하거나 주문 저장에 실패한 경우에도 망취소를 호출한다.\n\n### FL-905 키오스크 네트워크 단절\n\n발생 조건: 단말이 서버에 연결하지 못한다.\n\n```text\n연결 실패 감지\n ↓\n결제 이전 단계인가?\n ├─ 예 → 주문 불가 안내 → 대기화면 복귀\n └─ 아니오 → 다음\n ↓\n승인 결과를 단말에 보관\n ↓\n주문번호 발행과 주문서 출력은 정상 진행\n ↓\n연결 복구 대기\n ↓\n일정 시간 내 복구?\n ├─ 아니오 → 관리자 확인 대상으로 표시\n └─ 예 → 서버로 재전송\n ↓\n전송 성공?\n ├─ 아니오 → 재시도\n └─ 예 → 보관분 삭제\n```\n\n카드 승인은 온라인 실시간이 전제이므로 오프라인 결제를 시도하지 않는다.\n\n### FL-908 로그인 실패\n\n발생 조건: 인증에 실패했다.\n\n```text\n인증 실패\n ↓\n실패 횟수 누적\n ↓\n제한 횟수 도달?\n ├─ 아니오 → \"이메일 또는 비밀번호가 일치하지 않습니다.\" 표시 → 로그인 화면 복귀\n └─ 예 → 계정 잠금 → 관리자 해제 안내\n ↓\n기록 남김\n```\n\n## 12. 주문 상태\n\n전 채널에 같은 상태값을 쓴다.\n\n```text\n접수 대기\n ↓\n매장 수락?\n ├─ 거절 또는 미응답 5분 → 취소\n └─ 수락 → 다음\n ↓\n접수 완료\n ↓\n1분 안에 취소 요청 있음?\n ├─ 예 → 취소\n └─ 아니오 → 다음\n ↓\n조리 중 (자동 전환)\n ↓\n조리 완료\n ↓\n수령 완료\n```\n\n| 상태 | 전환 조건 | 취소 |\n| --- | --- | --- |\n| 접수 대기 | 결제 승인 완료. 매장 수락 전 | 고객 취소, 매장 거절, 5분 미응답 자동 취소 |\n| 접수 완료 | 매장이 수락하고 준비 시간을 골랐다. 키오스크 주문은 결제 완료 시 바로 이 상태로 들어간다 | 고객 취소, 매장 취소 |\n| 조리 중 | 접수 완료 후 1분 경과. 자동 전환한다 | 불가 |\n| 조리 완료 | 매장이 완료 처리. 고객 호출을 발송한다 | 불가 |\n| 수령 완료 | 고객이 수령. 영업 종료 한 시간 뒤까지 오지 않으면 배치가 미수령으로 표시하고 이 상태로 바꾼다 | 불가 |\n| 취소 | 취소 확정. 결제 취소를 함께 처리한다 | |\n\n조리 중 전환은 매장이 조작하지 않는다. 접수 완료 후 1분이 지나면 시스템이 자동으로 바꾼다. 매장마다 취소 가능 구간이 달라지지 않게 한다.\n\n취소는 접수 대기와 접수 완료 상태에서만 할 수 있다. 취소 가능 시간은 접수 완료 후 1분이다.\n\n조리 시작 이후에는 주문 취소 기능을 제공하지 않는다. 고객이 환불을 요구하면 매장이 현장에서 판단한다. 플랫폼은 환불 요청 화면이나 승인 절차를 두지 않는다. 매장이 환불하기로 정한 경우 카드 단말 자체의 취소 기능으로 처리한다. 키오스크 관리자 모드에는 환불 화면을 두지 않는다.\n\n시간 기준이 세 곳에 있다. 접수 대기에서 5분은 매장이 응답하지 않아 자동 취소하는 시간이고,\n접수 완료에서 1분은 고객이 취소할 수 있는 시간이며, 매장이 접수할 때 고르는 준비 시간은 조리에 걸리는 시간이다.\n준비 시간은 상태를 바꾸지 않는다. 고객에게 언제 오면 되는지 알리는 값이다.\n\n조리 완료 뒤 고객이 오지 않으면 영업 종료 한 시간 뒤 배치가 수령 완료로 바꾸고 수령 구분을 미수령으로 남긴다 (FL-146).\n미수령은 취소가 아니므로 매출과 정산에 그대로 들어간다.\n\n서빙 완료는 후불 홀 매장에서만 필요하므로 현재 범위에서 제외한다.\n\n## 13. 화면 조작 Flow\n\n드롭다운, 달력, 겹친 팝업, 확인 팝업, 토스트처럼 화면 위에 겹쳐 뜨는 요소의 동작을 정의한다.\n전 화면에 같게 적용하므로 화면별 Flow에는 다시 그리지 않는다. 화면마다 어느 요소를 쓰는지는 05 문서 8절에 있다.\n\n### FL-601 드롭다운 선택\n\n```text\n드롭다운 칸 선택\n ↓\n칸 아래에 목록 표시   ← 아래 내용을 밀어내지 않는다\n ↓\n선택 방법?\n ├─ 항목 선택 → 칸에 값 표시 → 목록 닫힘\n ├─ 바깥 선택 → 목록 닫힘 → 값 유지\n └─ Esc      → 목록 닫힘 → 값 유지\n ↓\n조회 조건인가?\n ├─ 예   → 초기화 버튼 표시\n └─ 아니오 → 입력값으로 보관\n```\n\n값이 셋 이상인 조건에만 드롭다운을 쓴다. 둘이면 라디오 버튼으로 둔다.\n조회는 값을 고른 시점이 아니라 조회 버튼을 누른 시점에 한다.\n\n### FL-602 달력 선택\n\n```text\n날짜 칸 또는 달력 아이콘 선택\n ↓\n칸 아래에 달력 표시\n ↓\n선택 방법?\n ├─ 날짜 선택 → 칸에 값 표시 → 달력 닫힘\n ├─ 이전·다음 달 → 달력 유지\n └─ 바깥 선택 또는 Esc → 달력 닫힘 → 값 유지\n ↓\n기간 조건인가?\n ├─ 아니오 → 종료\n └─ 예 → 다음\n ↓\n시작일이 종료일보다 늦은가?\n ├─ 예   → 칸 아래 \"종료일은 시작일 이후여야 합니다.\" 표시\n └─ 아니오 → 조건 확정\n```\n\n### FL-603 주소 검색\n\n```text\n주소 칸 선택\n ↓\n주소 검색 팝업 표시   ← 등록 모달 위에 겹쳐 띄운다\n ↓\n검색어 입력 후 검색\n ↓\n결과가 있는가?\n ├─ 아니오 → \"검색 결과가 없습니다.\" 표시 → 검색어 다시 입력\n └─ 예 → 다음\n ↓\n주소 선택\n ↓\n주소 검색 팝업 닫힘 → 등록 모달로 복귀\n ↓\n주소 칸에 값 표시   ← 직접 입력은 막는다\n```\n\n취소하면 주소 검색 팝업만 닫히고 등록 모달의 입력값은 그대로 남는다.\n\n### FL-604 입력 검증\n\n```text\n저장 선택\n ↓\n전체 항목 검증   ← 입력 도중에는 검증하지 않는다\n ↓\n어긋난 항목이 있는가?\n ├─ 아니오 → FL-605\n └─ 예 → 다음\n ↓\n확인 팝업을 띄우지 않는다\n ↓\n항목마다 칸 아래에 문구 표시\n ↓\n어긋난 항목이 둘 이상인가?\n ├─ 예   → 화면 위에 건수 표시 → 첫 항목으로 이동\n └─ 아니오 → 해당 항목으로 이동\n ↓\n탭이 있는 화면인가?\n ├─ 예   → 해당 탭에 표시를 남기고 안내에 탭 이름을 적는다\n └─ 아니오 → 다음\n ↓\n항목 수정\n ↓\n그 항목의 오류만 지운다   ← 다른 항목의 오류는 남긴다\n```\n\n### FL-605 처리 확인과 결과 안내 (ADM-COMN-CONF)\n\n```text\n저장·삭제·상태 변경 선택\n ↓\n확인 팝업 표시   ← 취소를 기본 선택으로 둔다\n ↓\n선택?\n ├─ 취소 → 하단 토스트 \"취소되었습니다.\" → 화면 유지\n └─ 확인 → 다음\n ↓\n버튼 잠금   ← 처리가 끝날 때까지 다시 누를 수 없다\n ↓\n서버 처리 요청\n ↓\n처리 결과?\n ├─ 성공 → 하단 토스트 \"저장되었습니다.\" → 모달 닫힘 → 목록 갱신\n └─ 실패 → 하단 토스트에 사유와 할 일 표시 → 모달 유지 → 입력값 유지\n ↓\n실패 토스트인가?\n ├─ 예   → 닫기를 누를 때까지 남긴다\n └─ 아니오 → 3초 뒤 사라진다\n```\n\n되돌릴 수 없는 처리는 대상 건수와 결과를 확인 팝업에 함께 적는다.\n매장 폐점, 계정 삭제, 연동 계정 삭제, 개인정보 파기가 여기에 해당한다.\n\n### FL-606 목록 일괄 처리\n\n```text\n목록에서 행 선택\n ↓\n표 위에 선택 건수와 처리 버튼 표시   ← 고르기 전에는 두지 않는다\n ↓\n처리 선택\n ↓\n확인 팝업에 대상 건수 표시\n ↓\n확인?\n ├─ 취소 → 선택 상태 유지\n └─ 확인 → 다음\n ↓\n서버 처리 요청\n ↓\n결과?\n ├─ 전부 성공 → 토스트 \"3건을 처리했습니다.\"\n ├─ 일부 실패 → 토스트에 성공과 실패 건수를 함께 표시\n └─ 전부 실패 → 실패 토스트에 사유 표시 → 선택 상태 유지\n ↓\n목록 갱신 → 선택 해제\n```\n\n### FL-607 고객 화면 안내\n\n고객 화면은 되돌릴 수 없는 동작에만 확인을 받는다. 확인이 늘면 주문 단계가 길어진다.\n\n```text\n동작 선택\n ↓\n되돌릴 수 있는가?\n ├─ 예   → 바로 처리 → 하단 토스트 \"장바구니에 담았습니다.\"\n └─ 아니오 → 확인 팝업 → 확인 → 처리 → 하단 토스트 \"삭제되었습니다.\"\n ↓\n결제인가?\n ├─ 예   → 확인 팝업을 두지 않는다   ← 결제 상세 화면이 확인 단계다\n └─ 아니오 → 종료\n```\n\n키오스크는 토스트를 쓰지 않는다. 결과는 화면 자체가 바뀌어 보여준다.\n삭제와 전체 취소에만 확인 팝업을 둔다.\n"}, {"no": 5, "id": "DOC-05", "title": "IA", "file": "docs/05_IA.md", "category": "설계", "status": "확정", "progress": 100, "eta": "", "version": "2.10", "updated": "2026-09-08", "inherits_titles": ["서비스 구조", "Flow Chart"], "content": "# 05. IA\n\n## 1. 화면ID 부여 규칙\n\n```text\n{채널}-{업무}-{유형}\n```\n\n| 구분 | 값 |\n| --- | --- |\n| 채널 | ADM 내부 어드민, STR 가맹 어드민, WEB 하이브리드 웹앱, KSK 키오스크 |\n| 업무 | 3~4자리 영문 약어. 업무 영역을 가리킨다 |\n| 유형 | LIST 목록, DETAIL 상세, FORM 등록·수정, MAIN 메인, POPUP 팝업, 그 밖의 화면은 성격을 나타내는 약어 |\n\n한 번 부여한 화면ID는 바꾸지 않는다. 화면이 삭제되어도 재사용하지 않는다.\n\n## 2. 화면 유형\n\n| 유형 | 정의 |\n| --- | --- |\n| 페이지 | 독립된 주소를 갖는 화면 |\n| 레이어팝업 | 현재 화면 위에 겹쳐 뜨는 화면 |\n| 전체화면 | 키오스크처럼 주소 없이 전환되는 화면 |\n\n경고와 확인 대화상자는 IA에 넣지 않는다. 화면설계서의 디스크립션에서 다룬다.\n\n## 3. 메뉴 구조\n\n### 내부 어드민\n\n기준정보 등록과 계정 발급이 축이다. 매출과 정산은 확인만 하고 시스템은 운영 기록을 본다.\n\n```map\n내부 어드민\n  대시보드\n  행사\n    운영\n      행사 목록·등록\n  상권\n    등록\n      상권 목록·등록\n      상권 상세\n      매장\n  매출\n    행사별\n      행사·상권 비교\n    매장별\n      매출 조회\n      매출 상세\n  정산\n    일자별\n      정산 대사\n      대사 불일치\n    매장별\n      매장별 정산\n  시스템\n    관리자\n      계정\n      연동 계정\n    오류 로그\n      오류 로그\n      배치 실행 이력\n    감사 로그\n      접속기록 조회\n      계정 변경 이력\n      개인정보 파기 이력\n```\n\n### 가맹 어드민\n\n```map\n가맹 어드민\n  매장 홈\n  주문\n    주문 접수\n    주문 상세\n  매장 정보\n    정보 조회\n    정보 변경\n    영업 상태\n  메뉴 관리\n    메뉴 목록\n    메뉴 가져오기\n    카테고리\n    옵션 그룹\n    판매가\n    품절 설정\n  알림\n    발송 이력\n  설정\n    매장\n    단말\n  매출\n```\n\n### 하이브리드 웹앱\n\n```map\n하이브리드 웹앱\n  매장 진입\n  주문\n    메뉴 목록\n    메뉴 상세\n    장바구니\n    결제 상세\n    결제 진행\n    결제 완료\n  주문 조회\n    조회 입력\n    주문 상태\n```\n\n### 키오스크\n\n```map\n키오스크\n  대기화면\n  주문\n    취식유형\n    메뉴 선택\n    장바구니\n    결제\n    주문 완료\n  관리자\n    관리자 메뉴\n    메뉴 갱신\n    판매 메뉴 설정\n    품절 설정\n    단말 상태\n```\n\n## 4. 화면 목록\n\n화면마다 무엇을 하는 화면인지와 어떤 규칙으로 판정하는지를 함께 적는다. 처리 순서와 예외 경로는 04 문서 Flow에 있다.\n\n### 4.1 내부 어드민\n\n내부 어드민은 두 가지를 한다. 행사와 브랜드 같은 기준정보를 등록하고, 가맹 어드민에 로그인할 계정을 발급한다.\n매장 운영에는 관여하지 않는다. 매장 등록, 메뉴 관리, 영업 상태 변경, 주문 접수는 모두 가맹 어드민에서 한다.\n매출과 정산은 등록한 기준정보로 집계된 결과를 확인하는 것이며 값을 만들지 않는다.\n\n\n| Depth1 | Depth2 | Depth3 | 화면ID | 화면명 | 유형 | 권한 | 상태·조건 | 기능 명세 | 정책 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 인증 |  |  | ADM-AUTH-LOGIN | 로그인 | 페이지 | 전체 | - | 이메일과 비밀번호로 인증한다 | 연속 5회 실패 시 계정을 잠근다. 남은 횟수를 함께 표시하고 어느 항목이 틀렸는지 밝히지 않는다 |\n| 대시보드 | 개시 확정 |  | ADM-HOME-EXAM | 개시 확정 | 레이어팝업 | 본사 운영자 | 심사 대기, 심사 완료 | 하위가맹점 심사가 끝난 매장의 개시를 확정한다 | 대시보드 개시 준비의 심사 열에서 연다. 결제대행사 결과가 자동으로 온 매장은 이미 완료로 나온다. 확정하면 매장이 영업으로 바뀌고 주문 채널에 노출된다. 되돌릴 수 없다 |\n| 인증 |  |  | ADM-AUTH-OTP | 2차 인증 | 페이지 | 전체 | - | 등록 단말로 인증번호를 확인한다 | 외부 접속은 2차 인증을 건너뛸 수 없다. 인증번호 유효시간 3분 |\n| 대시보드 |  |  | ADM-HOME-MAIN | 대시보드 | 페이지 | 본사 운영자 | - | 조치가 필요한 항목과 오늘 실적, 정산 상태, 행사 개시 준비를 표시한다 | 추세와 비교는 두지 않는다. 매출 화면에서 본다. 모든 항목에 이동 경로를 붙인다. 매장 화면에서 처리해야 하는 항목은 대행 접속으로 보낸다. 본사가 매장 화면을 직접 고치지 않는다. 당일 실적은 집계 시점을 함께 표시한다 |\n| 행사 | 운영 | 행사 | ADM-EVNT-LIST | 행사 목록 | 페이지 | 본사 운영자 | 진행 전, 진행 중, 종료 | 기간과 상태로 행사를 조회하고 상권 등록 현황을 확인한다 | 목록에서 등록과 수정을 모달로 연다. 목록을 벗어나지 않는다 |\n| 행사 | 운영 | 행사 | ADM-EVNT-FORM | 행사 등록·수정 | 레이어팝업 | 본사 운영자 | - | 행사명, 기간, 장소를 등록한다 | 필수는 행사명, 시작일, 종료일, 장소. 행사명은 50자 이내이고 기간이 겹치는 행사와 중복할 수 없다. 종료일은 시작일 이후여야 한다. 종료된 행사는 수정할 수 없다 |\n| 행사 | 등록 | 상권 | ADM-EVNT-ZONE | 상권 붙이기 | 레이어팝업 | 본사 운영자 | - | 이미 만든 상권을 이 행사에 붙인다 | 행사 등록·수정의 상권 탭 위에 겹쳐 띄운다. 여러 건을 한 번에 붙인다. 목록에 없으면 상권 메뉴에서 새로 만든다 |\n| 공통 |  |  | ADM-ADDR-FIND | 주소 검색 | 레이어팝업 | 본사 운영자, 가맹 관리자 | - | 도로명, 건물명, 지번으로 주소를 찾아 입력 칸에 넣는다 | 주소 입력 칸을 누르면 연다. 직접 입력을 막고 검색 결과에서만 고른다. 상세주소는 선택 후 입력한다 |\n| 공통 |  |  | ADM-COMN-CONF | 확인 팝업 | 레이어팝업 | 본사 운영자, 가맹 관리자 | - | 저장, 삭제, 상태 변경, 작업 취소를 실행하기 전에 확인을 받는다 | 되돌릴 수 없는 처리는 영향 범위를 함께 적는다. 확인과 취소 모두 하단 토스트로 결과를 알린다 |\n| 상권 | 등록 |  | ADM-ZONE-LIST | 상권 목록 | 페이지 | 본사 운영자 | - | 브랜드 단위로 상권을 조회한다 | 상권 화면에서는 행사를 다루지 않는다. 어느 행사에 참여하는지는 행사 등록·수정의 상권 탭에서 정한다 |\n| 상권 | 등록 |  | ADM-ZONE-FORM | 상권 등록·수정 | 레이어팝업 | 본사 운영자 | - | 상권 정보와 담당 계정, 그 상권에서 영업할 매장을 한 화면에서 등록하고 관리한다 | 정보, 계정, 히스토리를 탭으로 나눈다. 상권 하나에 브랜드 하나를 둔다. 상권명이 곧 브랜드명이다. 매장은 지점번호로 구분한다. 필수는 브랜드명과 위치다. 참여 행사는 이 화면에서 다루지 않는다. 행사 등록·수정의 상권 탭에서 붙인다. 브랜드명은 30자 이내이고 전체에서 중복할 수 없다. 담당 계정 발급은 필수이며 역할은 가맹 관리자, 담당 범위는 이 상권으로 고정한다. 수정 시 계정 탭은 읽기 전용으로 둔다. 정보 탭에 본사 사업자 정보와 정산계좌를 함께 둔다. 본사는 매장을 등록하거나 상태를 바꾸지 않는다. 매장 목록은 매출 조회에서 본다. 히스토리 탭에 이 브랜드와 소속 매장의 변경 내역을 표시한다 |\n| 매출 | 행사별 |  | ADM-SALE-COMP | 행사·상권 비교 | 페이지 | 본사 운영자 | - | 행사와 상권을 축으로 매출을 비교한다 | 비교 기준을 상권과 행사 중에서 고른다. 기간이 다르면 일평균으로 보기를 켜서 하루 기준으로 환산한다. 그래프는 상위 10개만 그리고 나머지는 기타로 묶는다. 행을 선택하면 그 조건으로 매출 조회를 연다 |\n| 매출 | 매장별 |  | ADM-SALE-LIST | 매출 조회 | 페이지 | 본사 운영자 | 잠정, 확정 | 기간과 소속 기
