 번만 센다.\n\n| 채널 | 페이지 | 레이어팝업 | 전체화면 | 합계 |\n| --- | --- | --- | --- | --- |\n| 내부 어드민 | 18 | 11 | 0 | 29 |\n| 가맹 어드민 | 15 | 17 | 0 | 32 |\n| 하이브리드 웹앱 | 13 | 1 | 0 | 14 |\n| 키오스크 | 0 | 2 | 15 | 17 |\n| 합계 | 46 | 31 | 15 | 92 |\n\n## 6. 공통 화면 규칙\n\n| 항목 | 규칙 |\n| --- | --- |\n| 목록 화면 | 검색 조건, 목록, 페이지네이션을 둔다. 결과가 없으면 \"조회 결과가 없습니다.\"를 표시한다 |\n| 등록·수정 화면 | 필수와 선택 중 수가 적은 쪽만 표시한다. 검증에 실패하면 해당 항목에 오류를 표시하고 저장을 막는다 |\n| 검증 시점 | 저장을 누를 때 전체 항목을 한 번에 검증한다. 입력 도중에는 오류를 띄우지 않는다 |\n| 오류 표시 | 오류가 있는 항목마다 칸 아래에 문구를 둔다. 오류가 둘 이상이면 화면 위에 건수를 함께 표시하고 첫 오류 항목으로 이동한다 |\n| 오류 해제 | 해당 항목을 고치면 그 항목의 오류만 지운다. 다른 항목의 오류는 남긴다 |\n| 오류 문구 | 무엇을 해야 하는지 적는다. \"필수 항목입니다\"가 아니라 \"행사명을 입력해 주세요.\"로 쓴다 |\n| 조회 조건 | 값이 셋 이상인 조건은 드롭다운으로 둔다 |\n| 선택 요소 | 켜고 끄는 값 하나는 토글로 둔다. 값이 둘이나 셋인 배타 선택은 세그먼트로 둔다. 값이 넷 이상이거나 항목마다 설명이 붙으면 라디오 버튼을 쓴다 |\n| 조회 조건 배치 | 첫 줄에 기간과 상태 같은 조건을 두고, 둘째 줄 왼쪽에 검색어를 둔다 |\n| 동작 버튼 위치 | 조회는 검색어 칸 오른쪽에 붙인다. 등록은 첫 줄 오른쪽 끝에 둔다 |\n| 초기화 버튼 | 기간, 상태, 검색어 중 하나라도 설정된 상태에서만 조회 버튼 오른쪽에 표시한다 |\n| 조회 건수 | 조회 조건 줄 오른쪽 끝에 조건에 맞는 전체 건수를 \"총 24건\"으로 표시한다. 결과가 없으면 \"0건\"으로 표시한다 |\n| 조회 조건 크기 | 입력 칸과 버튼의 높이를 같게 한다. 날짜와 상태는 200px, 검색어는 320px, 버튼은 120px을 넘기지 않고 왼쪽부터 붙여 둔다 |\n| 등록·수정 | 모달로 연다. 목록을 벗어나지 않아 조회 조건과 스크롤 위치가 유지된다 |\n| 모달 뒤 화면 | 목록을 그대로 두고 덮개만 덮는다. 어느 목록에서 열었는지 보이게 한다 |\n| 권한 표기 | 여러 유형이 함께 쓰는 화면은 본사 운영자, 가맹 관리자, 고객 순으로 적는다 |\n| 입력 항목 | 등록·수정과 인증 화면은 라벨을 칸 위에 두고 칸 안에는 안내 문구나 입력값만 넣는다 |\n| 조회 조건 표기 | 조회 조건 칸은 조건명을 칸 안에 둔다. 라벨을 위에 두면 조건 줄 높이가 두 배가 된다. 값을 고르면 조건명 오른쪽에 값을 표시한다 |\n| 필수·선택 표기 | 한 화면에서 수가 적은 쪽만 표시한다. 대부분 필수면 선택 항목에만 라벨 뒤에 '(선택)'을 붙이고, 대부분 선택이면 필수 항목에만 별표를 붙인다. 한 화면에 두 표기를 섞지 않는다 |\n| 계정 식별자 | 로그인 아이디는 이메일을 쓴다. 별도 아이디를 두지 않는다. 한 번 등록한 이메일은 바꿀 수 없다 |\n| 모달 머리말 | 화면 이름만 둔다. 저장과 취소는 아래 버튼으로만 둔다 |\n| 모달 고정 영역 | 머리말과 아래 버튼 줄을 고정하고 가운데만 스크롤한다. 내용이 길어도 저장과 취소가 늘 보인다 |\n| 화면 머리말 | 제목 아래 한 줄로 무엇을 하는 화면인지 적는다. 오른쪽 끝에 그 화면의 주 동작을 둔다 |\n| 모달 닫기 | 머리말 오른쪽 끝에 닫기를 둔다. 아래 취소 버튼과 같은 동작이다 |\n| 탭 형태 | 밑줄형으로 둔다. 선택한 탭에만 강조색 밑줄을 둔다. 버튼처럼 보이게 하지 않는다 |\n| 구역 제목 | 배경을 채우지 않는다. 굵은 소제목과 아래 얇은 선으로 구분한다 |\n| 상태 표시 | 목록의 상태값은 배지로 둔다. 글자만 두면 다른 열과 섞여 한눈에 구분되지 않는다 |\n| 정렬 | 목록의 기본 정렬 열에 방향 표시를 둔다. 기본은 최근 항목이 위로 온다 |\n| 페이지네이션 | 쪽수는 가운데, 페이지당 건수는 왼쪽에 둔다. 전체 건수는 조회 조건 줄 오른쪽에 있다 |\n| 현재 위치 | 상단 바 왼쪽에 메뉴와 화면명을 적는다. 어디에 있는지 화면 이름만으로 판단하게 두지 않는다 |\n| 목록 선택 처리 | 행을 고르면 표 위에 선택 건수와 처리 버튼을 띄운다. 고르기 전에는 두지 않는다 |\n| 여백 | 4px 배수로 맞춘다. 라벨과 칸 6px, 칸 사이 가로 12px, 줄 사이 16px, 구역 사이 28px, 화면 안쪽 24px을 쓴다. 묶음 안을 좁게, 묶음 사이를 넓게 두어 어디까지가 한 항목인지 보이게 한다 |\n| 딸린 버튼 | 조회나 중복 확인처럼 칸에 딸린 버튼은 그 칸 바로 오른쪽에 붙인다. 글자 길이에 맞춰 두고 줄 오른쪽 끝으로 밀지 않는다 |\n| 색 사용 | 강조색은 기본 버튼, 선택한 탭, 입력 중인 칸에만 쓴다. 오류는 별도 색으로 구분한다. 그 밖에는 무채색을 쓴다 |\n| 주요 버튼 | 한 화면에 강조 버튼을 하나만 둔다. 그 화면에서 하려는 일을 마무리하는 버튼에 쓴다. 목록 화면은 등록, 등록·수정 모달은 저장이다. 조회는 보조 버튼으로 둔다 |\n| 입력 칸 상태 | 기본, 입력 중, 입력됨, 읽기 전용, 오류 다섯 가지를 구분한다. 읽기 전용은 배경을 채우고 오류는 테두리와 문구를 함께 바꾼다 |\n| 칸 종류 유지 | 상태가 바뀌어도 칸의 종류는 그대로 둔다. 드롭다운은 화살표, 날짜는 달력, 검색 입력은 돋보기를 오류 상태에서도 유지한다 |\n| 펼친 상태 | 드롭다운, 달력, 검색은 펼친 화면을 함께 정의한다. 드롭다운과 달력은 그 칸의 왼쪽 끝에 맞춰 바로 아래에 겹쳐 띄운다. 드롭다운의 폭은 칸과 같게 한다. 아래 내용을 밀어내지 않는다. 주소 검색은 팝업으로 연다 |\n| 모달 입력 배치 | 한 줄에 입력 칸 하나만 둔다. 기간의 시작·종료, 같은 단위의 짧은 수치 항목, 그 칸에 딸린 조회·중복 확인 버튼만 같은 줄에 둔다. 조회 조건 줄에는 적용하지 않는다 |\n| 모달 폭 | 내용에 맞춘다. 입력 칸만 있으면 560px, 표가 들어가면 880px를 쓴다. 겹쳐 띄우는 모달도 같은 기준으로 정한다. 입력 칸은 모달 폭을 채우고 빈 여백을 남기지 않는다 |\n| 구역 제목 | 화면 제목과 같은 내용을 되풀이하는 구역 제목은 두지 않는다. 구분이 필요한 구역에만 붙인다 |\n| 표 정렬 | 수량과 금액 열만 오른쪽으로 맞춘다. 주문번호, 사업자등록번호, 지점번호, 날짜, 시각은 숫자로 보여도 왼쪽에 둔다. 비교하는 값이 아니라 찾는 값이다. 머리글과 본문의 열 너비를 같게 한다 |\n| 표 빈 값 | 값이 없는 칸은 비워 두지 않고 대시(-)를 넣는다. 값이 없는 것인지 빠진 것인지 구분되게 한다 |\n| 표 형태 | 표는 테두리와 둥근 모서리를 가진 한 덩어리로 둔다. 머리글은 옅게, 행 사이는 얇은 선으로 나눈다. 숫자는 자릿수를 맞춰 정렬하고 동작 열만 강조색으로 둔다 |\n| 조회 조건 유지 | 목록에서 상세로 갔다 돌아오면 조건과 페이지와 스크롤 위치를 되살린다. 뒤로 가기와 목록 버튼이 같게 동작한다 |\n| 빈 상태 | 목록 영역 전체를 쓰고 아이콘과 문구를 가운데 정렬한다. 문구 아래에 다음 행동을 안내하고 그 행동을 버튼으로 둔다 |\n| 폼 칸 폭 | 좁은 모달에서는 칸이 폭을 채운다. 표가 있는 넓은 모달에서만 520px 상한을 둔다. 칸이 너무 길면 라벨과 값이 멀어져 읽기 어렵다 |\n| 탭 상태 표시 | 검증에 걸린 탭은 표시를 남기고 안내 문구에 탭 이름을 적는다. 등록 시점에 쓸 수 없는 탭은 비활성으로 둔다 |\n| 실패 안내 | 성공과 취소 토스트는 3초 뒤 사라진다. 실패 토스트는 사라지지 않고 닫기를 둔다. 놓치면 다시 볼 방법이 없다 |\n| 잠금 해제 | 계정이 잠기면 잠금 화면에서 바로 비밀번호 재설정으로 갈 수 있게 한다. 관리자 문의만 남기지 않는다 |\n| 주소 입력 | 주소 칸을 누르면 주소 검색(ADM-ADDR-FIND)을 연다. 직접 입력을 막고 검색 결과에서만 고른다 |\n| 겹친 팝업 | 팝업 안에서 연 팝업은 앞 팝업을 닫지 않고 위에 띄운다. 닫으면 앞 팝업으로 돌아간다 |\n| 일괄 처리 | 목록에서 여러 건을 골라 한 번에 처리한다. 확인 팝업에 대상 건수를 적는다 |\n| 상위 항목 추가 | 선택 칸에 원하는 값이 없으면 그 자리에서 만든다. 화면을 벗어나지 않는다 |\n| 양쪽에서 잇기 | 행사와 상권처럼 여러 대 여러로 이어지는 관계는 양쪽 화면에서 모두 이을 수 있게 둔다. 어느 쪽에서 이어도 결과가 같다 |\n| 목록 구성 | 첫 열에 선택 체크박스, 둘째 열에 순번을 둔다. 두 열은 모든 목록에 둔다. 마지막 열에 행 단위 동작을 둔다. 요약표와 상세 화면의 항목 표에는 두지 않는다 |\n| 순번 표기 | 최근 항목이 위로 오는 목록은 순번이 큰 값부터 내려간다. 순번은 화면에서 세는 번호이고 업무 번호가 따로 있으면 그 값을 쓴다 |\n| 선택 후 동작 | 체크박스로 고른 뒤 할 일은 화면마다 다르다. 처리가 있는 목록은 처리 버튼을, 조회만 하는 목록은 내려받기를 둔다 |\n| 날짜 입력 | 달력 아이콘을 붙인다. 기간은 시작일과 종료일을 나란히 둔다 |\n| 검색 입력 | 돋보기 아이콘을 앞에 붙여 다른 입력칸과 구분한다 |\n| 권한 없는 화면 | 진입을 차단하고 \"권한이 없습니다.\"를 표시한다 |\n| 로딩 | 조회 중에는 진행 상태를 표시한다 |\n| 화면 주소 | 화면마다 주소를 따로 둔다. 새로 고치거나 주소를 공유해도 같은 화면과 같은 탭이 열린다 |\n| 오류 | 처리하지 못한 경우 무엇이 잘못되었고 무엇을 하면 되는지 표시한다 |\n| 판매자 표시 | 고객이 보는 채널마다 판매자 신원정보를 볼 수 있는 경로를 둔다. 판매자는 매장이다. 상호, 대표자, 사업자등록번호, 통신판매업 신고번호, 주소, 연락처를 적는다 |\n| 중개자 고지 | 아이오더가 거래 당사자가 아니라는 사실을 판매자 정보와 같은 자리에 적는다. 전자상거래법 제20조 제1항 |\n| 개인정보 동의 | 목적, 항목, 보유 기간, 거부권을 함께 보인다. 체크박스만 두지 않는다. 필수가 아닌 항목은 받지 않는다 |\n| 취소 안내 | 결제하기 전에 언제까지 취소할 수 있는지 적는다. 조리가 시작되면 취소할 수 없다는 것을 함께 적는다 |\n| 원산지·알레르기 표시 | 고객이 보는 메뉴 화면에 표시한다. 원산지 글자 크기는 메뉴 이름과 같거나 커야 한다. 열량은 식품명 또는 가격 활자 크기의 80퍼센트 이상으로 표시한다 |\n| 키오스크 접근성 | 검증기준 준수 단말과 음성안내장치를 전제로 화면을 설계한다 |\n\n## 7. 처리 확인과 결과 안내\n\n### 7.1 어드민\n\n내부 어드민과 가맹 어드민에서 데이터를 저장, 수정, 삭제, 상태 변경할 때 같은 방식으로 처리한다.\n\n#### 처리 순서\n\n```text\n[사용자] 저장·삭제·변경 선택\n ↓\n확인 팝업 표시\n ↓\n확인 또는 취소?\n ├─ 취소 → 하단 토스트 \"취소되었습니다.\" → 원래 화면 유지\n └─ 확인 → 다음\n ↓\n[서버] 처리 요청\n ↓\n처리 성공?\n ├─ 아니오 → 하단 토스트에 실패 사유 표시 → 원래 화면 유지\n └─ 예 → 하단 토스트 \"저장되었습니다.\" → 화면 갱신\n```\n\n#### 확인 팝업\n\n| 항목 | 규칙 |\n| --- | --- |\n| 표시 대상 | 저장, 수정, 삭제, 상태 변경. 조회와 검색은 제외한다 |\n| 구성 | 제목, 처리 내용, 확인 버튼, 취소 버튼 |\n| 처리 내용 | 무엇이 어떻게 바뀌는지 적는다. \"저장하시겠습니까?\"만 적지 않는다 |\n| 되돌릴 수 없는 처리 | 대상 건수와 결과를 함께 적는다. 확인 버튼을 기본 선택으로 두지 않는다 |\n| 기본 선택 | 취소를 기본으로 둔다 |\n\n되돌릴 수 없는 처리는 매장 폐점, 계정 삭제, 연동 계정 삭제, 개인정보 파기다.\n\n#### 결과 토스트\n\n| 항목 | 규칙 |\n| --- | --- |\n| 위치 | 화면 하단 |\n| 표시 시간 | 3초. 사용자가 닫을 수 있다 |\n| 성공 문구 | \"저장되었습니다.\" \"삭제되었습니다.\" \"변경되었습니다.\" |\n| 취소 문구 | \"취소되었습니다.\" |\n| 실패 문구 | 무엇이 잘못되었고 무엇을 하면 되는지 적는다 |\n| 화면 이동 | 토스트가 사라지기를 기다리지 않는다. 처리 직후 갱신하거나 이동한다 |\n| 중복 | 같은 처리를 연속으로 하면 마지막 하나만 남긴다 |\n\n문구는 처리한 동작을 그대로 쓴다. \"작업이 완료되었습니다.\"처럼 무엇을 했는지 알 수 없는 문구는 쓰지 않는다.\n\n#### 예외\n\n| 상황 | 처리 |\n| --- | --- |\n| 목록에서 여러 건 처리 | 확인 팝업에 대상 건수를 적는다. 일부만 실패하면 성공과 실패 건수를 함께 표시한다 |\n| 입력 검증 실패 | 확인 팝업을 띄우지 않는다. 해당 입력 항목에 바로 표시한다 |\n| 자동 저장 | 두지 않는다. 저장은 사용자가 선택한 시점에만 한다 |\n| 처리 중 재선택 | 처리가 끝날 때까지 버튼을 다시 누를 수 없게 한다 |\n\n이 규칙은 어드민 전 화면에 적용한다. 순서는 04 문서 FL-605에 한 번만 그리고 화면별 Flow에는 다시 그리지 않는다. 처리 결과에 따라 흐름이 갈리는 경우에만 화면별 Flow에 표시한다.\n\n### 7.2 하이브리드 웹앱\n\n고객 화면은 어드민과 다르게 다룬다. 모든 동작에 팝업을 띄우면 주문 단계가 늘어난다. 되돌릴 수 없는 동작에만 확인을 받는다.\n\n| 동작 | 확인 팝업 | 결과 안내 |\n| --- | --- | --- |\n| 장바구니 담기 | 없음 | 하단 토스트 \"장바구니에 담았습니다.\" |\n| 수량 변경 | 없음 | 화면에서 금액이 바로 바뀐다 |\n| 항목 삭제 | 있음 | 하단 토스트 \"삭제되었습니다.\" |\n| 장바구니 비우기 | 있음 | 하단 토스트 \"장바구니를 비웠습니다.\" |\n| 다른 매장 항목 초기화 | 있음 | 하단 토스트 \"장바구니를 비웠습니다.\" |\n| 결제 | 없음. 결제 상세 화면이 확인 단계다 | 결제 완료 화면으로 이동 |\n| 주문 취소 | 있음 | 하단 토스트 \"취소되었습니다.\" |\n\n결제는 별도 확인 팝업을 두지 않는다. 결제 상세 화면 자체가 확인 단계이고, 그 뒤에 결제대행사 결제창이 한 번 더 확인을 받는다. 팝업을 끼워 넣으면 확인이 세 번이 된다.\n\n토스트 규칙은 위치, 표시 시간, 중복 처리 모두 어드민과 같다.\n\n### 7.3 키오스크\n\n현장에서 서서 쓰는 화면이므로 토스트를 쓰지 않는다. 결과는 화면 자체가 바뀌어 보여준다. 삭제와 전체 취소에만 확인 팝업을 둔다.\n\n무입력 대기가 걸려 있으므로 팝업을 띄운 동안에도 남은 시간을 함께 표시한다.\n\n## 8. 화면별 겹쳐 뜨는 요소\n\n화면 위에 겹쳐 뜨는 요소를 화면마다 정리한다. 동작 순서는 04 문서 13절에 있다.\n\n### 8.1 요소와 기본 규칙\n\n| 요소 | 여는 방법 | 자리 | 닫는 방법 | 뒤 화면 | 동작 |\n| --- | --- | --- | --- | --- | --- |\n| 드롭다운 | 칸을 선택한다 | 칸 왼쪽 끝에 맞춰 바로 아래. 폭은 칸과 같다 | 항목 선택, 바깥 선택, Esc | 그대로 둔다 | FL-601 |\n| 토글 | 칸 자리에서 바로 켜고 끈다 | 라벨 오른쪽 | 겹쳐 뜨지 않는다 | 상태 문구가 함께 바뀐다 | - |\n| 세그먼트 | 칸 자리에서 바로 고른다 | 라벨 아래 | 겹쳐 뜨지 않는다 | 고른 값에 따라 아래 입력 칸이 바뀐다 | - |\n| 달력 | 칸이나 달력 아이콘을 선택한다 | 칸 바로 아래 | 날짜 선택, 바깥 선택, Esc | 그대로 둔다 | FL-602 |\n| 주소 검색 | 주소 칸을 선택한다 | 화면 가운데 팝업. 등록 모달 위에 겹친다 | 주소 선택, 취소 | 앞 모달로 돌아간다 | FL-603 |\n| 등록·수정 모달 | 등록 버튼이나 행을 선택한다 | 화면 가운데. 폭 560px, 표가 있으면 880px | 저장, 취소, 닫기 | 목록을 그대로 두고 덮는다 | FL-605 |\n| 확인 팝업 | 저장, 삭제, 상태 변경을 선택한다 | 화면 가운데 | 확인, 취소 | 앞 화면으로 돌아간다 | FL-605 |\n| 결과 토스트 | 처리가 끝나면 자동으로 뜬다 | 화면 아래 가운데 | 3초 뒤 사라진다. 실패는 닫기를 누를 때까지 남는다 | 갱신하거나 이동한다 | FL-605 |\n| 검증 오류 | 저장을 누른 뒤 검증에 걸리면 뜬다 | 어긋난 칸 아래 | 그 항목을 고치면 지워진다 | 그대로 둔다 | FL-604 |\n| 목록 선택 처리 | 행을 고르면 표 위에 뜬다 | 표 바로 위 | 처리하거나 선택을 푼다 | 목록을 갱신한다 | FL-606 |\n| 빈 상태 | 조회 결과가 없으면 뜬다 | 목록 영역 전체 | 조건을 바꿔 다시 조회한다 | 조건은 남긴다 | - |\n\n고객 화면은 되돌릴 수 없는 동작에만 확인을 받는다. 순서는 FL-607에 있다.\n\n키오스크는 토스트를 쓰지 않는다. 결과는 화면 자체가 바뀌어 보여준다.\n\n### 8.2 내부 어드민\n\n| 화면ID | 화면명 | 드롭다운 | 달력·검색 | 확인 팝업 | 결과 안내 |\n| --- | --- | --- | --- | --- | --- |\n| ADM-AUTH-LOGIN | 로그인 | - | - | - | 오류는 칸 아래 문구로 표시. 남은 횟수를 함께 적는다 |\n| ADM-AUTH-OTP | 2차 인증 | - | - | - | 재발송하면 \"인증번호를 다시 보냈습니다.\" |\n| ADM-HOME-MAIN | 대시보드 | - | 개시 확정 팝업(ADM-HOME-EXAM) | - | - |\n| ADM-HOME-EXAM | 개시 확정 | 행사, 심사 | - | 개시 확정 | 확인 팝업에 건수와 메뉴 없는 매장 수를 적는다. 확정 결과 토스트. 확정할 매장이 없으면 결과 없음 화면 |\n| ADM-EVNT-LIST | 행사 목록 | 상태 | 시작일·종료일 달력, 확인 팝업(ADM-COMN-CONF) | 삭제 | 저장·삭제·취소·처리 실패 토스트 |\n| ADM-EVNT-FORM | 행사 등록·수정 | - | 시작일·종료일 달력, 장소 주소 검색 | 저장, 작업 취소 | 검증 오류는 칸 아래. 저장 결과는 토스트 |\n| ADM-EVNT-ZONE | 상권 붙이기 | 행사 | - | 붙이기 | 이미 붙은 상권은 고를 수 없다. 결과 없음 화면 |\n| ADM-ADDR-FIND | 주소 검색 | - | - | - | 결과 없음 화면 |\n| ADM-ZONE-LIST | 상권 목록 | 상태 | 확인 팝업(ADM-COMN-CONF) | 삭제 | 저장·삭제 토스트 |\n| ADM-ZONE-FORM | 상권 등록·수정 | 은행, 역할, 상태 | 위치 주소 검색, 히스토리 기간 달력 | 저장, 작업 취소 | 정보·계정·히스토리 세 탭. 탭별 검증 오류. 저장 실패는 남는 토스트 |\n| ADM-SALE-COMP | 행사·상권 비교 | 행사, 표시 개수 | 기간 달력, 비교 기준 세그먼트, 일평균 토글, 내려받기 팝업(ADM-COMN-DOWN) | 내려받기 | 내려받기 완료 토스트. 결과 없음 화면 |\n| ADM-SALE-LIST | 매출 조회 | 행사, 상권, 브랜드, 열 고르기 | 기간 달력, 집계 단위·소속 기준 세그먼트, 내려받기 팝업(ADM-COMN-DOWN) | 내려받기 | 소속 기준 변경 토스트, 내려받기 완료 토스트. 결과 없음 화면 |\n| ADM-SALE-DETAIL | 매출 상세 | 상태 | 주문 상세 팝업(ADM-SALE-ORDR), 내려받기 팝업(ADM-COMN-DOWN) | 내려받기 | 내려받기 완료 토스트. 결과 없음 화면 |\n| ADM-SALE-ORDR | 주문 상세 | - | - | 대행 접속 | 대행 접속은 사유를 받고 접속기록에 남긴다 |\n| ADM-C
